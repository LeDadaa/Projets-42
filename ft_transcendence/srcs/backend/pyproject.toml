[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.0",
    "asyncpg>=0.31.0",
    "cryptography>=50.0.0",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pillow>=12.3.0",
    "pwdlib[argon2]>=0.3.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "pyotp>=2.10.0",
    "python-multipart>=0.0.32",
    "qrcode[pil]>=8.2",
    "sqlalchemy>=2.0.51",
    "starlette>=1.6.0",
    "uvicorn>=0.52.1",
    "websockets>=17.0.1",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "types-qrcode>=8.2.0.20260518",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# One event loop for the whole session. `app/db.py` builds the engine once, at
# import, and its pool keeps connections open for reuse, while an asyncpg
# connection belongs to the loop that opened it. With pytest-asyncio's default of
# one loop per test, a test is handed a pooled connection from a closed loop and
# fails during setup — every other test, since the pool then discards it
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
# Puts the backend root on sys.path so tests can `import app` without an
# editable install or a conftest.py shim.
pythonpath = ["."]
