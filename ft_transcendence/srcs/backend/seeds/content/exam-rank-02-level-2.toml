[questions.translations.en]
title = "Printing in hexadecimal"
stem = "How do you print a non-negative integer in base 16 with lowercase letters, using only `write`? How do you get each digit and its character, how do you print them in the right order, and which value is easy to forget?"
explanation = "The last digit in base 16 is `n % 16`, and `n / 16` removes it. Indexing the string `\"0123456789abcdef\"` with that digit gives its character directly, letters included. Digits come out least significant first, so they are printed in reverse: either by recursing on `n / 16` before printing `n % 16`, or by filling a buffer from the end. The value that is easy to forget is 0: a loop written `while (n != 0)` prints nothing at all for it, whereas the recursive version prints `0`. 255 prints as `ff`."

[questions.translations.fr]
title = "Afficher en hexadécimal"
stem = "Comment afficher un entier positif ou nul en base 16, avec des lettres minuscules, en n'utilisant que `write` ? Comment obtenir chaque chiffre et son caractère, comment les afficher dans le bon ordre, et quelle valeur est facile à oublier ?"
explanation = "Le dernier chiffre en base 16 est `n % 16`, et `n / 16` le retire. Indexer la chaîne `\"0123456789abcdef\"` avec ce chiffre donne directement son caractère, lettres comprises. Les chiffres sortent du moins significatif au plus significatif, donc on les affiche à l'envers : soit par récursion sur `n / 16` avant d'afficher `n % 16`, soit en remplissant un tampon par la fin. La valeur facile à oublier est 0 : une boucle écrite `while (n != 0)` n'affiche rien du tout, alors que la version récursive affiche `0`. 255 s'affiche `ff`."

[questions.translations.es]
title = "Mostrar en hexadecimal"
stem = "¿Cómo muestras un entero no negativo en base 16, con letras minúsculas, usando solo `write`? ¿Cómo obtienes cada cifra y su carácter, cómo las muestras en el orden correcto y qué valor es fácil de olvidar?"
explanation = "La última cifra en base 16 es `n % 16`, y `n / 16` la quita. Indexar la cadena `\"0123456789abcdef\"` con esa cifra da directamente su carácter, letras incluidas. Las cifras salen de la menos significativa a la más significativa, así que se muestran al revés: con una recursión sobre `n / 16` antes de mostrar `n % 16`, o llenando un búfer desde el final. El valor fácil de olvidar es 0: un bucle escrito `while (n != 0)` no muestra nada, mientras que la versión recursiva muestra `0`. 255 se muestra como `ff`."

[[questions.choices]]
correct = true
text = { en = "`n % 16` gives the last digit and `n / 16` removes it, so recurse on `n / 16` before printing; 0 must still print one digit", fr = "`n % 16` donne le dernier chiffre et `n / 16` l'enlève, donc on récursive sur `n / 16` avant d'afficher ; 0 doit quand même afficher un chiffre", es = "`n % 16` da la última cifra y `n / 16` la quita, así que se recursiona sobre `n / 16` antes de mostrar; 0 debe mostrar aun así una cifra" }

[[questions.choices]]
text = { en = "A `while (n != 0)` loop covers every case, 0 included", fr = "Une boucle `while (n != 0)` couvre tous les cas, 0 compris", es = "Un bucle `while (n != 0)` cubre todos los casos, 0 incluido" }

[[questions.choices]]
text = { en = "Print `n % 16` first, then recurse on `n / 16`: the digits already come out in the right order", fr = "Afficher `n % 16` d'abord, puis récursiver sur `n / 16` : les chiffres sortent déjà dans le bon ordre", es = "Mostrar `n % 16` primero y luego recursionar sobre `n / 16`: las cifras ya salen en el orden correcto" }

[[questions.choices]]
