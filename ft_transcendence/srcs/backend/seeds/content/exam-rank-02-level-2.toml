[[questions]]
slug = "rank02-l2-prime-sieve"
topic = "exam-rank-02-level-2"
kind = "free_text"
difficulty = 1200
tags = ["number-theory", "algorithms"]
key_points = [
  "The sieve of Eratosthenes keeps one flag per number up to n, all marked as possibly prime at first.",
  "Take the smallest number still marked, which is prime, and cross out all its multiples; repeat with the next marked number.",
  "Crossing out can start at p × p, because smaller multiples of p have a smaller prime factor and are already crossed out.",
  "It finds every prime up to n in about O(n log log n), far less than testing each number by trial division.",
]

[questions.translations.en]
title = "Finding every prime up to n"
stem = "When you need every prime number up to `n`, for instance to count them, testing each number separately repeats a lot of work. How does the sieve of Eratosthenes proceed, why can each crossing-out start at `p × p`, and what does it cost?"
explanation = "The sieve keeps one flag per number from 2 to `n`, all marked as possibly prime. The smallest number still marked is prime; you then cross out all its multiples, and move on to the next number still marked. Crossing out can start at `p × p`, because every smaller multiple of `p` also has a smaller prime factor and was crossed out already. The whole sieve costs about `O(n log log n)`, against roughly `O(n√n)` for trial division of every number; for `n = 10`, it leaves 2, 3, 5 and 7."

[questions.translations.fr]
title = "Trouver tous les nombres premiers jusqu'à n"
stem = "Quand on a besoin de tous les nombres premiers jusqu'à `n`, par exemple pour les compter, tester chaque nombre séparément refait beaucoup de travail. Comment procède le crible d'Ératosthène, pourquoi chaque élimination peut-elle commencer à `p × p`, et que coûte-t-il ?"
explanation = "Le crible garde un indicateur par nombre de 2 à `n`, tous marqués comme possiblement premiers. Le plus petit nombre encore marqué est premier ; on raye alors tous ses multiples, puis on passe au nombre suivant encore marqué. L'élimination peut commencer à `p × p`, parce que chaque multiple plus petit de `p` a aussi un facteur premier plus petit et a déjà été rayé. Tout le crible coûte environ `O(n log log n)`, contre à peu près `O(n√n)` en testant chaque nombre par divisions ; pour `n = 10`, il reste 2, 3, 5 et 7."

[questions.translations.es]
title = "Encontrar todos los primos hasta n"
stem = "Cuando necesitas todos los números primos hasta `n`, por ejemplo para contarlos, comprobar cada número por separado repite mucho trabajo. ¿Cómo procede la criba de Eratóstenes, por qué cada tachado puede empezar en `p × p` y cuánto cuesta?"
explanation = "La criba guarda un indicador por cada número de 2 a `n`, todos marcados como posiblemente primos. El menor número que sigue marcado es primo; se tachan entonces todos sus múltiplos y se pasa al siguiente número marcado. El tachado puede empezar en `p × p`, porque cada múltiplo menor de `p` tiene también un factor primo menor y ya está tachado. Toda la criba cuesta unos `O(n log log n)`, frente a aproximadamente `O(n√n)` probando divisores para cada número; para `n = 10`, quedan 2, 3, 5 y 7."

[[questions.choices]]
correct = true
text = { en = "Cross out the multiples of each number still marked, starting at `p × p`: about O(n log log n) for every prime up to `n`", fr = "Rayer les multiples de chaque nombre encore marqué, à partir de `p × p` : environ O(n log log n) pour tous les premiers jusqu'à `n`", es = "Tachar los múltiplos de cada número aún marcado, empezando en `p × p`: unos O(n log log n) para todos los primos hasta `n`" }

[[questions.choices]]
text = { en = "Crossing out must begin at `2p`, otherwise `2p` and `3p` are never crossed out", fr = "Le rayage doit commencer à `2p`, sinon `2p` et `3p` ne sont jamais rayés", es = "El tachado debe empezar en `2p`, si no `2p` y `3p` nunca se tachan" }

[[questions.choices]]
text = { en = "The sieve tests each number by trial division and stores the answers so as not to repeat them", fr = "Le crible teste chaque nombre par divisions successives et range les réponses pour ne pas les refaire", es = "La criba prueba cada número por divisiones sucesivas y guarda las respuestas para no repetirlas" }

[[questions.choices]]
text = { en = "It costs O(n²), since every number has to be compared with every other one", fr = "Il coûte O(n²), puisque chaque nombre doit être comparé à tous les autres", es = "Cuesta O(n²), ya que cada número debe compararse con todos los demás" }

