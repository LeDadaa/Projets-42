]

[questions.translations.en]
title = "The first and last letter of each word"
stem = "Some string transformations treat the first or the last character of each word differently from the others, for instance to change its case. While walking the string once, how do you know that a character starts a word, or ends one? What about a word of a single letter?"
explanation = "A character starts a word when it is not a separator and it is either at index 0 or preceded by a space or a tab. It ends a word when it is not a separator and the next character is a separator or the final `'\\0'`: looking one character ahead is enough, and the terminator makes the last word end naturally. A one-letter word is both the first and the last character of its word, so both rules apply to it. Only letters change case: a digit or a punctuation mark at the start of a word stays as it is."

[questions.translations.fr]
title = "La première et la dernière lettre de chaque mot"
stem = "Certaines transformations de chaînes traitent le premier ou le dernier caractère de chaque mot autrement que les autres, par exemple pour changer sa casse. En parcourant la chaîne une seule fois, comment savoir qu'un caractère commence un mot, ou en termine un ? Et pour un mot d'une seule lettre ?"
explanation = "Un caractère commence un mot quand il n'est pas un séparateur et qu'il est soit à l'indice 0, soit précédé d'un espace ou d'une tabulation. Il termine un mot quand il n'est pas un séparateur et que le caractère suivant est un séparateur ou le `'\\0'` final : regarder un caractère plus loin suffit, et le terminateur fait se terminer naturellement le dernier mot. Un mot d'une seule lettre est à la fois le premier et le dernier caractère de son mot, donc les deux règles s'appliquent. Seules les lettres changent de casse : un chiffre ou une ponctuation en début de mot reste tel quel."

[questions.translations.es]
title = "La primera y la última letra de cada palabra"
stem = "Algunas transformaciones de cadenas tratan el primer o el último carácter de cada palabra de forma distinta a los demás, por ejemplo para cambiar su caja. Recorriendo la cadena una sola vez, ¿cómo sabes que un carácter empieza una palabra, o que la termina? ¿Y con una palabra de una sola letra?"
explanation = "Un carácter empieza una palabra cuando no es un separador y está en el índice 0 o va precedido de un espacio o una tabulación. Termina una palabra cuando no es un separador y el carácter siguiente es un separador o el `'\\0'` final: basta con mirar un carácter más allá, y el terminador hace que la última palabra termine de forma natural. Una palabra de una sola letra es a la vez el primer y el último carácter de su palabra, así que se le aplican las dos reglas. Solo las letras cambian de caja: una cifra o un signo de puntuación al principio de una palabra se queda como está."

[[questions.choices]]
correct = true
text = { en = "It starts a word if it is not a separator and sits at index 0 or after a separator; it ends one if the next character is a separator or the terminator, and a one-letter word is both", fr = "Il commence un mot s'il n'est pas un séparateur et se trouve à l'indice 0 ou après un séparateur ; il en finit un si le caractère suivant est un séparateur ou le terminateur, et un mot d'une lettre est les deux", es = "Empieza una palabra si no es separador y está en el índice 0 o tras un separador; termina una si el siguiente carácter es un separador o el terminador, y una palabra de una letra es ambas" }

[[questions.choices]]
text = { en = "A one-letter word is neither the first nor the last character of a word, so neither rule applies to it", fr = "Un mot d'une seule lettre n'est ni le premier ni le dernier caractère d'un mot, donc aucune des deux règles ne s'y applique", es = "Una palabra de una sola letra no es ni el primer ni el último carácter de una palabra, así que no se le aplica ninguna regla" }

[[questions.choices]]
text = { en = "Only the character before can be looked at: the end of a word cannot be known while walking forward", fr = "On ne peut regarder que le caractère précédent : la fin d'un mot est impossible à connaître en avançant", es = "Solo se puede mirar el carácter anterior: el final de una palabra no se puede saber avanzando" }

[[questions.choices]]
text = { en = "The last character of the string always ends a word, whatever it is", fr = "Le dernier caractère de la chaîne termine toujours un mot, quel qu'il soit", es = "El último carácter de la cadena siempre termina una palabra, sea cual sea" }

[[questions]]
slug = "rank02-l2-length-of-a-linked-list"
topic = "exam-rank-02-level-2"
kind = "free_text"
difficulty = 1000
tags = ["linked-lists"]
key_points = [
  "A singly linked list is a chain of nodes where each node holds a pointer to the next one, and the last node points to NULL.",
  "Its length is found by following the next pointers from the head and counting nodes until NULL is reached.",
  "An empty list is a NULL head, whose length is 0, and the loop must handle it without dereferencing NULL.",
  "Unlike an array, a list stores no size, so counting costs O(n).",
]

[questions.translations.en]
title = "The length of a linked list"
stem = "A singly linked list is given by a pointer to its first node. How do you count its elements, how does the loop know when to stop, what is the length of an empty list, and why is this more costly than getting the size of an array?"
explanation = "Each node holds a pointer to the next one, and the last node's pointer is `NULL`. Counting means starting from the head and following `next` while the current pointer is not `NULL`, adding one per node. An empty list is simply a `NULL` head: the loop does not run, the length is 0, and nothing is dereferenced. A list stores no size anywhere, so its length can only be found by walking it, in `O(n)`, whereas an array's length is known in advance."

[questions.translations.fr]
title = "La longueur d'une liste chaînée"
stem = "Une liste simplement chaînée est donnée par un pointeur vers son premier maillon. Comment compter ses éléments, comment la boucle sait-elle quand s'arrêter, quelle est la longueur d'une liste vide, et pourquoi est-ce plus coûteux qu'obtenir la taille d'un tableau ?"
explanation = "Chaque maillon contient un pointeur vers le suivant, et celui du dernier maillon vaut `NULL`. Compter, c'est partir de la tête et suivre `next` tant que le pointeur courant n'est pas `NULL`, en ajoutant un par maillon. Une liste vide est simplement une tête `NULL` : la boucle ne tourne pas, la longueur vaut 0, et rien n'est déréférencé. Une liste ne stocke sa taille nulle part, donc on ne peut la connaître qu'en la parcourant, en `O(n)`, alors que la longueur d'un tableau est connue d'avance."

[questions.translations.es]
title = "La longitud de una lista enlazada"
stem = "Una lista simplemente enlazada se da mediante un puntero a su primer nodo. ¿Cómo cuentas sus elementos, cómo sabe el bucle cuándo parar, cuál es la longitud de una lista vacía y por qué es más costoso que obtener el tamaño de un array?"
explanation = "Cada nodo contiene un puntero al siguiente, y el del último nodo vale `NULL`. Contar consiste en partir de la cabeza y seguir `next` mientras el puntero actual no sea `NULL`, sumando uno por nodo. Una lista vacía es simplemente una cabeza `NULL`: el bucle no se ejecuta, la longitud es 0 y no se desreferencia nada. Una lista no guarda su tamaño en ninguna parte, así que solo se puede conocer recorriéndola, en `O(n)`, mientras que la longitud de un array se conoce de antemano."

[[questions.choices]]
correct = true
text = { en = "Follow the `next` pointers from the head until `NULL`, counting as you go; an empty list is a `NULL` head of length 0, and the count costs O(n)", fr = "Suivre les pointeurs `next` depuis la tête jusqu'à `NULL` en comptant ; une liste vide est une tête `NULL` de longueur 0, et le comptage coûte O(n)", es = "Seguir los punteros `next` desde la cabeza hasta `NULL` contando; una lista vacía es una cabeza `NULL` de longitud 0, y contar cuesta O(n)" }

[[questions.choices]]
text = { en = "Stop when `node->next` is `NULL`, which also covers the empty list", fr = "S'arrêter quand `node->next` vaut `NULL`, ce qui couvre aussi la liste vide", es = "Parar cuando `node->next` vale `NULL`, lo que también cubre la lista vacía" }

[[questions.choices]]
text = { en = "An empty list has length 1: the head node is always there", fr = "Une liste vide a une longueur de 1 : le nœud de tête est toujours présent", es = "Una lista vacía tiene longitud 1: el nodo de cabeza siempre está" }

[[questions.choices]]
text = { en = "The length is stored in the list and kept up to date, so reading it costs O(1)", fr = "La longueur est rangée dans la liste et tenue à jour, donc la lire coûte O(1)", es = "La longitud se guarda en la lista y se mantiene al día, así que leerla cuesta O(1)" }

[[questions]]
slug = "rank02-l2-allocating-a-range"
topic = "exam-rank-02-level-2"
kind = "free_text"
difficulty = 1200
tags = ["memory"]
key_points = [
  "The number of values in a range from start to end, both included, is |end - start| + 1, whatever the direction.",
  "The step is +1 or -1 depending on whether end is above or below start.",
  "The difference end - start can overflow an int for extreme bounds (from INT_MIN to INT_MAX it is 4 294 967 296 values), so it must be computed in a wider type.",
  "malloc's result must be checked for NULL before the array is filled.",
]

[questions.translations.en]
title = "Allocating an array holding a range"
stem = "A function allocates an array holding every integer from `start` to `end`, both included, in either direction. How many elements must it allocate, how does it fill them, and which bounds make the size computation itself dangerous?"
explanation = "The range holds `|end - start| + 1` values whatever the direction: 3 for 1 to 3, and 4 for 0 to -3. The array is filled from `start` with a step of `+1` or `-1` depending on whether `end` is above or below `start`. The dangerous case is the size itself: with extreme bounds, `end - start` does not fit in an `int`, and the range from `INT_MIN` to `INT_MAX` holds 4 294 967 296 values. The difference must be computed in a wider type, and `malloc`'s result checked against `NULL` before anything is written."

[questions.translations.fr]
title = "Allouer un tableau contenant une plage"
stem = "Une fonction alloue un tableau contenant tous les entiers de `start` à `end`, bornes comprises, dans un sens comme dans l'autre. Combien d'éléments doit-elle allouer, comment les remplit-elle, et quelles bornes rendent dangereux le calcul de la taille lui-même ?"
explanation = "La plage contient `|end - start| + 1` valeurs quel que soit le sens : 3 de 1 à 3, et 4 de 0 à -3. Le tableau se remplit à partir de `start` avec un pas de `+1` ou de `-1`, selon que `end` est au-dessus ou au-dessous de `start`. Le cas dangereux est la taille elle-même : avec des bornes extrêmes, `end - start` ne tient pas dans un `int`, et la plage de `INT_MIN` à `INT_MAX` contient 4 294 967 296 valeurs. La différence doit se calculer dans un type plus large, et le résultat de `malloc` être comparé à `NULL` avant toute écriture."

[questions.translations.es]
title = "Reservar un array que contiene un rango"
stem = "Una función reserva un array con todos los enteros de `start` a `end`, ambos incluidos, en un sentido o en el otro. ¿Cuántos elementos debe reservar, cómo los rellena y qué límites hacen peligroso el propio cálculo del tamaño?"
explanation = "El rango contiene `|end - start| + 1` valores sea cual sea el sentido: 3 de 1 a 3, y 4 de 0 a -3. El array se rellena a partir de `start` con un paso de `+1` o `-1`, según `end` esté por encima o por debajo de `start`. El caso peligroso es el propio tamaño: con límites extremos, `end - start` no cabe en un `int`, y el rango de `INT_MIN` a `INT_MAX` contiene 4 294 967 296 valores. La diferencia debe calcularse en un tipo más ancho, y el resultado de `malloc` compararse con `NULL` antes de escribir nada."

[[questions.choices]]
correct = true
text = { en = "`|end - start| + 1` elements, a step of +1 or -1, the difference computed in a wider type, and `malloc` checked", fr = "`|fin - début| + 1` éléments, un pas de +1 ou -1, la différence calculée dans un type plus large, et `malloc` vérifié", es = "`|fin - inicio| + 1` elementos, un paso de +1 o -1, la diferencia calculada en un tipo más ancho y `malloc` comprobado" }

[[questions.choices]]
