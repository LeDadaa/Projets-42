[[questions.choices]]
text = { en = "Up to the square root, written `i * i <= n`, which is safe whatever the value of `n`", fr = "Jusqu'à la racine, écrit `i * i <= n`, ce qui est sûr quelle que soit la valeur de `n`", es = "Hasta la raíz, escrito `i * i <= n`, lo que es seguro sea cual sea el valor de `n`" }

