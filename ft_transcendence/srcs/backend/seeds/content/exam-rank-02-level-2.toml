[questions.translations.en]
title = "The least common multiple"
stem = "How can the least common multiple of two positive integers be computed from their greatest common divisor? In what order must the operations be done so that no intermediate result overflows, and what about 0?"
explanation = "For two positive integers, the product equals the greatest common divisor times the least common multiple, so the latter is `a × b / gcd(a, b)`. Written in that order, `a × b` may overflow although the result fits: with `int`, the least common multiple of 100 000 and 100 000 comes out as 14 100 instead of 100 000. Dividing first, `a / gcd(a, b) × b`, is exact, since `gcd(a, b)` divides `a`, and keeps the numbers small. When one of the numbers is 0, the least common multiple is taken as 0 by convention, and the computation is not attempted."

[questions.translations.fr]
title = "Le plus petit multiple commun"
stem = "Comment calculer le plus petit multiple commun de deux entiers positifs à partir de leur plus grand diviseur commun ? Dans quel ordre faire les opérations pour qu'aucun résultat intermédiaire ne déborde, et que faire de 0 ?"
explanation = "Pour deux entiers positifs, le produit vaut le plus grand diviseur commun multiplié par le plus petit multiple commun, donc ce dernier vaut `a × b / gcd(a, b)`. Écrit dans cet ordre, `a × b` peut déborder alors que le résultat tient : en `int`, le plus petit multiple commun de 100 000 et 100 000 sort à 14 100 au lieu de 100 000. Diviser d'abord, `a / gcd(a, b) × b`, est exact, puisque `gcd(a, b)` divise `a`, et garde des nombres petits. Quand l'un des nombres vaut 0, le plus petit multiple commun vaut 0 par convention, et on ne tente pas le calcul."

[questions.translations.es]
title = "El mínimo común múltiplo"
stem = "Dados dos enteros positivos, ¿cómo se obtiene su mínimo común múltiplo a partir de su máximo común divisor? ¿En qué orden deben hacerse las operaciones para que ningún resultado intermedio desborde, y qué pasa con el 0?"
explanation = "Para dos enteros positivos, el producto es igual al máximo común divisor por el mínimo común múltiplo, así que este último vale `a × b / gcd(a, b)`. Escrito en ese orden, `a × b` puede desbordar aunque el resultado quepa: con `int`, el mínimo común múltiplo de 100 000 y 100 000 sale 14 100 en lugar de 100 000. Dividir primero, `a / gcd(a, b) × b`, es exacto, ya que `gcd(a, b)` divide a `a`, y mantiene los números pequeños. Cuando uno de los números es 0, el mínimo común múltiplo vale 0 por convención y no se intenta el cálculo."

[[questions.choices]]
correct = true
text = { en = "`a / gcd(a, b) × b`: dividing first is exact and keeps the intermediate result small; 0 is handled apart", fr = "`a / pgcd(a, b) × b` : diviser d'abord est exact et garde le résultat intermédiaire petit ; 0 se traite à part", es = "`a / mcd(a, b) × b`: dividir primero es exacto y mantiene pequeño el resultado intermedio; 0 se trata aparte" }

[[questions.choices]]
