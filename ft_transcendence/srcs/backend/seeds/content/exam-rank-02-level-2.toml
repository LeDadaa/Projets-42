[questions.translations.en]
title = "The greatest common divisor"
stem = "How does Euclid's algorithm compute the greatest common divisor of two positive integers? On what equality does it rely, when does it stop, what happens when the first number is the smaller one, and why is it fast?"
explanation = "The algorithm relies on `gcd(a, b) = gcd(b, a % b)`: any number dividing `a` and `b` also divides the remainder `a % b`, and conversely. You replace the pair `(a, b)` with `(b, a % b)` until the second number is 0; the first is then the answer: `gcd(42, 10)` goes through `(10, 2)` then `(2, 0)` and gives 2. If `a < b`, the first step just swaps them, since `a % b` is `a`. The remainders shrink fast, so the number of steps grows only logarithmically, far fewer than trying every possible divisor."

[questions.translations.fr]
title = "Le plus grand diviseur commun"
stem = "Comment l'algorithme d'Euclide calcule-t-il le plus grand diviseur commun de deux entiers positifs ? Sur quelle égalité repose-t-il, quand s'arrête-t-il, que se passe-t-il quand le premier nombre est le plus petit, et pourquoi est-il rapide ?"
explanation = "L'algorithme repose sur `gcd(a, b) = gcd(b, a % b)`, `gcd` désignant le plus grand diviseur commun : tout nombre qui divise `a` et `b` divise aussi le reste `a % b`, et réciproquement. On remplace la paire `(a, b)` par `(b, a % b)` jusqu'à ce que le second nombre vaille 0 ; le premier est alors la réponse : `gcd(42, 10)` passe par `(10, 2)` puis `(2, 0)` et donne 2. Si `a < b`, le premier pas les échange simplement, puisque `a % b` vaut `a`. Les restes diminuent vite, donc le nombre d'étapes ne croît que de façon logarithmique, bien moins qu'en essayant tous les diviseurs possibles."

[questions.translations.es]
title = "El máximo común divisor"
stem = "¿Cómo calcula el algoritmo de Euclides el máximo común divisor de dos enteros positivos? ¿En qué igualdad se basa, cuándo se detiene, qué pasa cuando el primer número es el menor y por qué es rápido?"
explanation = "El algoritmo se basa en `mcd(a, b) = mcd(b, a % b)`: cualquier número que divide a `a` y a `b` divide también el resto `a % b`, y a la inversa. Se sustituye el par `(a, b)` por `(b, a % b)` hasta que el segundo número vale 0; el primero es entonces la respuesta: `mcd(42, 10)` pasa por `(10, 2)` y luego `(2, 0)`, y da 2. Si `a < b`, el primer paso simplemente los intercambia, ya que `a % b` vale `a`. Los restos disminuyen deprisa, así que el número de pasos solo crece de forma logarítmica, muchos menos que probando todos los divisores posibles."

[[questions.choices]]
correct = true
text = { en = "`gcd(a, b) = gcd(b, a % b)`, repeated until the second is 0; the order does not matter, since the first step swaps them", fr = "`pgcd(a, b) = pgcd(b, a % b)`, répété jusqu'à ce que le second soit 0 ; l'ordre importe peu, le premier pas les échange", es = "`mcd(a, b) = mcd(b, a % b)`, repetido hasta que el segundo sea 0; el orden da igual, el primer paso los intercambia" }

[[questions.choices]]
text = { en = "`a` has to be the larger of the two, otherwise the algorithm never stops", fr = "`a` doit être le plus grand des deux, sinon l'algorithme ne s'arrête jamais", es = "`a` debe ser el mayor de los dos, si no el algoritmo no termina nunca" }

[[questions.choices]]
text = { en = "It stops when the second number reaches 1, since 1 divides everything", fr = "Il s'arrête quand le second nombre atteint 1, puisque 1 divise tout", es = "Se detiene cuando el segundo número llega a 1, ya que 1 divide todo" }

[[questions.choices]]
text = { en = "`gcd(a, b) = gcd(b, a / b)`, the quotient taking the place of the remainder", fr = "`pgcd(a, b) = pgcd(b, a / b)`, le quotient prenant la place du reste", es = "`mcd(a, b) = mcd(b, a / b)`, el cociente en lugar del resto" }

