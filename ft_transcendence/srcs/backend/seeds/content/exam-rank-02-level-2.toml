[questions.translations.en]
title = "Testing whether a number is prime"
stem = "To decide whether an integer `n` is prime by trying divisors, where do you start, where can you stop, and why is that bound enough? How should the loop condition be written so that it works up to `INT_MAX`, and what does the test cost?"
explanation = "Numbers below 2 are not prime. For `n >= 2`, try the divisors from 2 upward, and stop at the square root of `n`: if `n = a × b` with `a <= b`, then `a <= √n`, so any divisor larger than `√n` pairs with a smaller one that was already tried. Written `i * i <= n`, the condition can overflow when `n` is close to `INT_MAX`; `i <= n / i` expresses the same bound without the product. The test then costs `O(√n)` divisions instead of `O(n)`: about 46 000 for `INT_MAX` instead of two billion."

[questions.translations.fr]
title = "Tester si un nombre est premier"
stem = "Pour décider si un entier `n` est premier en essayant des diviseurs, où commencer, où peut-on s'arrêter, et pourquoi cette borne suffit-elle ? Comment écrire la condition de la boucle pour qu'elle fonctionne jusqu'à `INT_MAX`, et que coûte le test ?"
explanation = "Les nombres inférieurs à 2 ne sont pas premiers. Pour `n >= 2`, on essaie les diviseurs à partir de 2, et on s'arrête à la racine carrée de `n` : si `n = a × b` avec `a <= b`, alors `a <= √n`, donc tout diviseur plus grand que `√n` va de pair avec un plus petit, déjà essayé. Écrite `i * i <= n`, la condition peut déborder quand `n` est proche de `INT_MAX` ; `i <= n / i` exprime la même borne sans produit. Le test coûte alors `O(√n)` divisions au lieu de `O(n)` : environ 46 000 pour `INT_MAX` au lieu de deux milliards."

[questions.translations.es]
title = "Comprobar si un número es primo"
stem = "Para decidir si un entero `n` es primo probando divisores, ¿dónde empiezas, dónde puedes parar y por qué basta ese límite? ¿Cómo debe escribirse la condición del bucle para que funcione hasta `INT_MAX`, y cuánto cuesta la comprobación?"
explanation = "Los números menores que 2 no son primos. Para `n >= 2`, se prueban los divisores desde 2 hacia arriba y se para en la raíz cuadrada de `n`: si `n = a × b` con `a <= b`, entonces `a <= √n`, así que cualquier divisor mayor que `√n` va emparejado con uno menor que ya se probó. Escrita `i * i <= n`, la condición puede desbordar cuando `n` está cerca de `INT_MAX`; `i <= n / i` expresa el mismo límite sin el producto. La comprobación cuesta entonces `O(√n)` divisiones en lugar de `O(n)`: unas 46 000 para `INT_MAX` en lugar de dos mil millones."

[[questions.choices]]
correct = true
text = { en = "From 2 up to the square root of `n`, written `i <= n / i` so that nothing overflows: O(√n) divisions", fr = "De 2 jusqu'à la racine carrée de `n`, écrit `i <= n / i` pour que rien ne déborde : O(√n) divisions", es = "De 2 hasta la raíz cuadrada de `n`, escrito `i <= n / i` para que nada desborde: O(√n) divisiones" }

[[questions.choices]]
