[[questions.choices]]
text = { en = "Replace every space or tab of the input by the separator, one for one", fr = "Remplacer chaque espace ou tabulation de l'entrée par le séparateur, un pour un", es = "Sustituir cada espacio o tabulación de la entrada por el separador, uno por uno" }

[[questions.choices]]
