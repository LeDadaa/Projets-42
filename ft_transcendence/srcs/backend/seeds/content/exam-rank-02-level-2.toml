slug = "rank02-l2-primality-test"
topic = "exam-rank-02-level-2"
kind = "free_text"
difficulty = 1200
tags = ["number-theory", "complexity"]
key_points = [
  "Numbers below 2 are not prime; for n >= 2, try the divisors from 2 upward.",
  "It is enough to try divisors up to the square root of n: if n = a × b with a <= b, then a <= √n, so a divisor above √n would pair with one already tried.",
  "The bound is best written i <= n / i rather than i * i <= n, which can overflow for n close to INT_MAX.",
  "The test costs O(√n) divisions instead of O(n).",
