]

[questions.translations.en]
title = "Separators between words, never around them"
stem = "A program rewrites a string so that its words are separated by exactly one chosen separator, with none at the start or at the end, whatever the spaces and tabs of the input. What is the simplest way to be sure that no separator ever appears before the first word or after the last one?"
explanation = "The trick is to see the separator as something that goes between two words, and therefore to write it before each word except the first, never after a word. A flag, or a count of the words already written, says whether the word about to be printed is the first one. The input's spaces and tabs are all skipped; only the words themselves are copied. Leading, trailing and repeated separators then disappear on their own, with no special case to handle at the end of the string."

[questions.translations.fr]
title = "Des séparateurs entre les mots, jamais autour"
stem = "Un programme réécrit une chaîne pour que ses mots soient séparés par exactement un séparateur choisi, sans aucun au début ni à la fin, quels que soient les espaces et tabulations de l'entrée. Quelle est la façon la plus simple d'être sûr qu'aucun séparateur n'apparaît avant le premier mot ni après le dernier ?"
explanation = "L'astuce consiste à voir le séparateur comme quelque chose qui se place entre deux mots, et donc à l'écrire avant chaque mot sauf le premier, jamais après un mot. Un indicateur, ou le nombre de mots déjà écrits, dit si le mot sur le point d'être affiché est le premier. Les espaces et tabulations de l'entrée sont tous sautés ; seuls les mots eux-mêmes sont recopiés. Les séparateurs du début, de la fin et les répétitions disparaissent alors d'eux-mêmes, sans cas particulier à gérer en fin de chaîne."

[questions.translations.es]
title = "Separadores entre las palabras, nunca alrededor"
stem = "Un programa reescribe una cadena para que sus palabras queden separadas por exactamente un separador elegido, sin ninguno al principio ni al final, sean cuales sean los espacios y tabulaciones de la entrada. ¿Cuál es la forma más sencilla de asegurarse de que nunca aparece un separador antes de la primera palabra ni después de la última?"
explanation = "El truco es ver el separador como algo que va entre dos palabras y, por tanto, escribirlo antes de cada palabra salvo la primera, nunca después de una palabra. Un indicador, o el número de palabras ya escritas, dice si la palabra que se va a mostrar es la primera. Todos los espacios y tabulaciones de la entrada se saltan; solo se copian las palabras. Los separadores del principio, del final y las repeticiones desaparecen solos, sin ningún caso especial al final de la cadena."

[[questions.choices]]
correct = true
text = { en = "Write the separator before each word except the first, and skip runs of spaces and tabs entirely", fr = "Écrire le séparateur avant chaque mot sauf le premier, et sauter entièrement les suites d'espaces et de tabulations", es = "Escribir el separador antes de cada palabra salvo la primera, y saltar por completo las series de espacios y tabulaciones" }

[[questions.choices]]
