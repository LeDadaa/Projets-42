[[questions]]
slug = "rank02-l2-detecting-overflow-while-parsing"
topic = "exam-rank-02-level-2"
kind = "free_text"
difficulty = 1400
tags = ["input-parsing", "conversions"]
key_points = [
  "A program that must accept only positive numbers checks that the argument is made only of digits, with no sign or other character, and is not empty.",
  "The overflow must be detected before it happens, because signed overflow is undefined behaviour: checking the result afterwards is too late.",
  "Before value = value * 10 + d, check value > (INT_MAX - d) / 10; if true, the number does not fit in an int.",
  "Alternatively, accumulate in a wider type such as long and compare with INT_MAX at every step.",
]

[questions.translations.en]
title = "Detecting overflow while parsing"
stem = "A program must accept its argument only if it is a positive number within the range of an `int`, such as `\"2147483647\"`, and reject `\"2147483648\"`. What must be checked about the characters, and how do you detect that the value no longer fits without ever letting the computation overflow?"
explanation = "The argument must be non-empty and made only of digits: no sign, no space, no other character. The value is then built with `value = value * 10 + d`, but checking the result afterwards is too late, because signed overflow is undefined behaviour: the compiler may assume it never happens. The test must come before the step: if `value > (INT_MAX - d) / 10`, the new value would exceed `INT_MAX`, so the input is rejected. Another way is to accumulate in a `long` and compare with `INT_MAX` at every step, which works as long as the wider type has room."

[questions.translations.fr]
title = "Détecter un dépassement pendant la lecture"
stem = "Un programme ne doit accepter son argument que s'il s'agit d'un nombre positif compris dans l'intervalle d'un `int`, comme `\"2147483647\"`, et refuser `\"2147483648\"`. Que faut-il vérifier sur les caractères, et comment détecter que la valeur ne tient plus sans jamais laisser le calcul déborder ?"
explanation = "L'argument doit être non vide et formé uniquement de chiffres : pas de signe, pas d'espace, aucun autre caractère. La valeur se construit ensuite avec `valeur = valeur * 10 + d`, mais vérifier le résultat après coup est trop tard, parce que le dépassement d'un entier signé est un comportement indéfini : le compilateur peut supposer qu'il n'arrive jamais. Le test doit venir avant le pas : si `valeur > (INT_MAX - d) / 10`, la nouvelle valeur dépasserait `INT_MAX`, et l'entrée est refusée. Une autre façon consiste à accumuler dans un `long` et à comparer avec `INT_MAX` à chaque pas, ce qui marche tant que le type plus large a de la marge."

[questions.translations.es]
title = "Detectar un desbordamiento al leer"
stem = "Un programa solo debe aceptar su argumento si es un número positivo que cabe en un `int`, como `\"2147483647\"`, y rechazar `\"2147483648\"`. ¿Qué hay que comprobar sobre los caracteres, y cómo detectas que el valor ya no cabe sin dejar nunca que el cálculo desborde?"
explanation = "El argumento debe ser no vacío y estar formado solo por cifras: sin signo, sin espacios, sin ningún otro carácter. El valor se construye después con `valor = valor * 10 + d`, pero comprobar el resultado a posteriori es demasiado tarde, porque el desbordamiento de un entero con signo es comportamiento indefinido: el compilador puede suponer que nunca ocurre. La comprobación debe ir antes del paso: si `valor > (INT_MAX - d) / 10`, el nuevo valor superaría `INT_MAX` y la entrada se rechaza. Otra forma es acumular en un `long` y comparar con `INT_MAX` en cada paso, lo que funciona mientras el tipo más ancho tenga margen."

[[questions.choices]]
correct = true
text = { en = "Digits only, and `value > (INT_MAX - d) / 10` tested before the multiplication: signed overflow is undefined, so checking afterwards is too late", fr = "Uniquement des chiffres, et `valeur > (INT_MAX - d) / 10` testé avant la multiplication : le débordement signé est indéfini, donc vérifier après est trop tard", es = "Solo cifras, y `valor > (INT_MAX - d) / 10` probado antes de la multiplicación: el desbordamiento con signo es indefinido, así que comprobar después es tarde" }

[[questions.choices]]
text = { en = "Compute the value, then check that it is still positive: an overflow makes it negative", fr = "Calculer la valeur, puis vérifier qu'elle est encore positive : un débordement la rend négative", es = "Calcular el valor y luego comprobar que sigue siendo positivo: un desbordamiento lo vuelve negativo" }

[[questions.choices]]
text = { en = "Signed overflow wraps around in a defined way, so the result can be compared with `INT_MAX` at the end", fr = "Le débordement signé boucle de façon définie, donc le résultat peut être comparé à `INT_MAX` à la fin", es = "El desbordamiento con signo da la vuelta de forma definida, así que el resultado puede compararse con `INT_MAX` al final" }

[[questions.choices]]
text = { en = "Counting the characters is enough: ten digits always fit in an `int`", fr = "Compter les caractères suffit : dix chiffres tiennent toujours dans un `int`", es = "Contar los caracteres basta: diez cifras siempre caben en un `int`" }

