[questions.translations.en]
title = "Reading a number in any base"
stem = "How do you turn a string such as `\"12fdb3\"` into an integer when the base can be anything from 2 to 16? How does a character become a digit, how is the value built, and what happens with a character that is not valid in the chosen base, as in `\"19\"` in base 8?"
explanation = "Each character is first turned into a digit value: `'0'` to `'9'` give 0 to 9, and `'a'` to `'f'`, like `'A'` to `'F'`, give 10 to 15. The value is then built from left to right with `value = value * base + digit`, the same rule as in base 10: `\"1A\"` in base 16 is 26, and `\"12fdb3\"` is 1 244 595 whatever the case of its letters. A digit must be smaller than the base, so the first character that is not, or that is no digit at all, ends the number: `\"19\"` in base 8 reads as 1. A leading `'-'` makes the result negative."

[questions.translations.fr]
title = "Lire un nombre dans n'importe quelle base"
stem = "Comment transformer une chaîne comme `\"12fdb3\"` en entier quand la base peut aller de 2 à 16 ? Comment un caractère devient-il un chiffre, comment construit-on la valeur, et que se passe-t-il avec un caractère qui n'est pas valide dans la base choisie, comme dans `\"19\"` en base 8 ?"
explanation = "Chaque caractère est d'abord transformé en valeur de chiffre : `'0'` à `'9'` donnent 0 à 9, et `'a'` à `'f'`, comme `'A'` à `'F'`, donnent 10 à 15. La valeur se construit ensuite de gauche à droite avec `valeur = valeur * base + chiffre`, la même règle qu'en base 10 : `\"1A\"` en base 16 vaut 26, et `\"12fdb3\"` vaut 1 244 595, quelle que soit la casse de ses lettres. Un chiffre doit être inférieur à la base, donc le premier caractère qui ne l'est pas, ou qui n'est pas un chiffre du tout, termine le nombre : `\"19\"` en base 8 se lit 1. Un `'-'` en tête rend le résultat négatif."

[questions.translations.es]
title = "Leer un número en cualquier base"
stem = "¿Cómo conviertes una cadena como `\"12fdb3\"` en un entero cuando la base puede ir de 2 a 16? ¿Cómo se convierte un carácter en cifra, cómo se construye el valor y qué pasa con un carácter que no es válido en la base elegida, como en `\"19\"` en base 8?"
explanation = "Cada carácter se convierte primero en un valor de cifra: `'0'` a `'9'` dan 0 a 9, y `'a'` a `'f'`, igual que `'A'` a `'F'`, dan 10 a 15. El valor se construye después de izquierda a derecha con `valor = valor * base + cifra`, la misma regla que en base 10: `\"1A\"` en base 16 vale 26, y `\"12fdb3\"` vale 1 244 595, sea cual sea la caja de sus letras. Una cifra debe ser menor que la base, así que el primer carácter que no lo es, o que no es una cifra, termina el número: `\"19\"` en base 8 se lee 1. Un `'-'` inicial hace negativo el resultado."

[[questions.choices]]
correct = true
text = { en = "`value = value * base + digit`, left to right; a character outside the base ends the number, so `\"19\"` in base 8 reads 1", fr = "`valeur = valeur * base + chiffre`, de gauche à droite ; un caractère hors de la base termine le nombre, donc `\"19\"` en base 8 vaut 1", es = "`valor = valor * base + cifra`, de izquierda a derecha; un carácter fuera de la base termina el número, así que `\"19\"` en base 8 vale 1" }

