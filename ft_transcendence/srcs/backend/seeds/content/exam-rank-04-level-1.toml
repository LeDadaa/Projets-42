[questions.translations.en]
title = "Printing a parsed value back"
stem = "After parsing, a program prints the value back in the same format. How is an object printed, what must be done with the characters of a string, and why is parsing followed by printing a useful test?"
explanation = "Printing walks the value recursively, following the same shape as the parser: a number becomes its digits, an object becomes a `{`, then its pairs separated by commas, each written as a key, a `:` and the value, then a `}`. A string goes between quotes, and the characters that needed an escape on input, the quote and the backslash, must get their backslash back on output; otherwise the printed text is no longer valid. Parsing then printing should give back an equivalent text, and comparing the two is a simple way to test the parser on many inputs."

[questions.translations.fr]
title = "Réécrire une valeur analysée"
stem = "Après l'analyse, un programme réécrit la valeur dans le même format. Comment un objet est-il écrit, que faut-il faire des caractères d'une chaîne, et pourquoi analyser puis réécrire est-il un test utile ?"
explanation = "L'écriture parcourt la valeur récursivement, en suivant la même forme que l'analyseur : un nombre devient ses chiffres, un objet devient une `{`, puis ses paires séparées par des virgules, chacune écrite comme une clé, un `:` et la valeur, puis une `}`. Une chaîne se place entre guillemets, et les caractères qui demandaient un échappement en entrée, le guillemet et la barre oblique inverse, doivent retrouver leur barre oblique inverse en sortie ; sinon le texte écrit n'est plus valide. Analyser puis réécrire doit redonner un texte équivalent, et comparer les deux est un moyen simple de tester l'analyseur sur beaucoup d'entrées."

[questions.translations.es]
title = "Volver a escribir un valor analizado"
stem = "Después del análisis, un programa vuelve a escribir el valor en el mismo formato. ¿Cómo se escribe un objeto, qué hay que hacer con los caracteres de una cadena, y por qué analizar y luego escribir es una prueba útil?"
explanation = "La escritura recorre el valor de forma recursiva, siguiendo la misma forma que el analizador: un número se convierte en sus cifras, un objeto en una `{`, después sus pares separados por comas, cada uno escrito como una clave, un `:` y el valor, y después una `}`. Una cadena va entre comillas, y los caracteres que necesitaban un escape en la entrada, la comilla y la barra invertida, deben recuperar su barra invertida en la salida; si no, el texto escrito deja de ser válido. Analizar y después escribir debe devolver un texto equivalente, y comparar ambos es una forma sencilla de probar el analizador con muchas entradas."

[[questions.choices]]
