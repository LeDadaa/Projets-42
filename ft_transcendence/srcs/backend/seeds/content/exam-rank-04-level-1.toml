key_points = [
  "A JSON value is recognised by its first character: a digit or '-' starts a number, '\"' starts a string, '{' starts an object.",
  "An object is '{', then zero or more pairs separated by ',', each pair being a string key, ':', and a value, then '}'.",
  "Because a value inside an object can itself be an object, the value and object functions call each other recursively, to any depth.",
  "Any character that does not fit where it appears (a missing ':', a trailing ',', end of input inside an object) is an error.",
]

[questions.translations.en]
title = "The grammar of a JSON value"
stem = "A parser handles a subset of JSON made of integers, strings and objects. How does it know which kind of value comes next, what is the structure of an object, and why is the parser naturally recursive?"
explanation = "The first character of a value is enough to know its kind: a digit or a `-` starts a number, a `\"` starts a string, a `{` starts an object; anything else is an error. An object is a `{`, then zero or more pairs separated by commas, each made of a string key, a `:` and a value, then a `}`. Since the value of a pair can itself be an object, the function that parses a value and the one that parses an object call each other, as deep as the nesting goes. Everything is checked on the way: a missing `:`, a comma just before `}`, or the input ending inside an object are errors."

[questions.translations.fr]
title = "La grammaire d'une valeur JSON"
stem = "Un analyseur traite un sous-ensemble de JSON fait d'entiers, de chaînes et d'objets. Comment sait-il quel genre de valeur arrive, quelle est la structure d'un objet, et pourquoi l'analyseur est-il naturellement récursif ?"
explanation = "Le premier caractère d'une valeur suffit à en connaître le genre : un chiffre ou un `-` commence un nombre, un `\"` commence une chaîne, une `{` commence un objet ; tout autre caractère est une erreur. Un objet est une `{`, puis zéro, une ou plusieurs paires séparées par des virgules, chacune formée d'une clé qui est une chaîne, d'un `:` et d'une valeur, puis une `}`. Comme la valeur d'une paire peut elle-même être un objet, la fonction qui analyse une valeur et celle qui analyse un objet s'appellent l'une l'autre, aussi profondément que va l'imbrication. Tout est vérifié au passage : un `:` manquant, une virgule juste avant `}`, ou une entrée qui se termine à l'intérieur d'un objet sont des erreurs."

[questions.translations.es]
title = "La gramática de un valor JSON"
stem = "Un analizador trata un subconjunto de JSON formado por enteros, cadenas y objetos. ¿Cómo sabe qué tipo de valor viene, cuál es la estructura de un objeto y por qué el analizador es recursivo de forma natural?"
explanation = "El primer carácter de un valor basta para saber su tipo: una cifra o un `-` empiezan un número, una `\"` empieza una cadena, una `{` empieza un objeto; cualquier otro carácter es un error. Un objeto es una `{`, después cero o más pares separados por comas, cada uno formado por una clave que es una cadena, un `:` y un valor, y después una `}`. Como el valor de un par puede ser a su vez un objeto, la función que analiza un valor y la que analiza un objeto se llaman una a otra, tan hondo como llegue el anidamiento. Todo se comprueba por el camino: un `:` que falta, una coma justo antes de `}` o una entrada que termina dentro de un objeto son errores."

[[questions.choices]]
correct = true
text = { en = "The first character decides: a digit or `-` a number, `\"` a string, `{` an object; an object holds pairs `key : value` separated by `,`, and a value may itself be an object, hence the recursion", fr = "Le premier caractère décide : un chiffre ou `-` un nombre, `\"` une chaîne, `{` un objet ; un objet contient des paires `clé : valeur` séparées par `,`, et une valeur peut elle-même être un objet, d'où la récursion", es = "El primer carácter decide: una cifra o `-` un número, `\"` una cadena, `{` un objeto; un objeto tiene pares `clave : valor` separados por `,`, y un valor puede ser a su vez un objeto, de ahí la recursión" }

[[questions.choices]]
text = { en = "The whole text must be read first to know the kind of each value", fr = "Tout le texte doit être lu d'abord pour connaître le type de chaque valeur", es = "Hay que leer todo el texto primero para saber el tipo de cada valor" }

[[questions.choices]]
text = { en = "An object's keys can be of any kind, which is what makes the parser recursive", fr = "Les clés d'un objet peuvent être de n'importe quel type, c'est ce qui rend l'analyseur récursif", es = "Las claves de un objeto pueden ser de cualquier tipo, eso es lo que hace recursivo al analizador" }

[[questions.choices]]
text = { en = "A comma after the last pair is harmless and must be accepted", fr = "Une virgule après la dernière paire est sans conséquence et doit être acceptée", es = "Una coma tras el último par no molesta y debe aceptarse" }

[[questions]]
slug = "rank04-l1-strings-with-escapes"
topic = "exam-rank-04-level-1"
kind = "free_text"
difficulty = 1200
tags = ["input-parsing", "strings"]
key_points = [
  "A string runs from its opening quote to the next quote that is not escaped.",
  "A backslash means the next character is taken literally: \\\" stores a quote and \\\\ stores a backslash; any other escape the format does not support is an error.",
  "Reaching the end of the input before the closing quote is an error (unterminated string).",
  "Since the stored text is shorter than its written form, the characters are copied one by one, skipping the backslashes, into a buffer that grows as needed.",
]

[questions.translations.en]
title = "Reading a quoted string with escapes"
stem = "In a quoted string, a quote can appear inside the text if it is escaped, as in `\"say \\\"hi\\\"\"`. How does a parser find the end of the string, what does a backslash do, and which situations are errors?"
explanation = "The string starts at its opening quote and ends at the next quote that is not escaped. A backslash means the character after it is taken literally: `\\\"` puts a quote into the text instead of ending the string, and `\\\\` puts a single backslash; so `\"say \\\"hi\\\"\"` holds the text `say \"hi\"`. An escape the format does not support, or the input ending before the closing quote, are errors. Since the stored text is shorter than what was written, the characters are copied one at a time without their backslashes, into a buffer that grows as needed."

[questions.translations.fr]
title = "Lire une chaîne entre guillemets avec échappements"
stem = "Dans une chaîne entre guillemets, un guillemet peut apparaître dans le texte s'il est échappé, comme dans `\"say \\\"hi\\\"\"`. Comment un analyseur trouve-t-il la fin de la chaîne, que fait une barre oblique inverse, et quelles situations sont des erreurs ?"
explanation = "La chaîne commence à son guillemet ouvrant et se termine au guillemet suivant qui n'est pas échappé. Une barre oblique inverse signifie que le caractère qui la suit est pris tel quel : `\\\"` met un guillemet dans le texte au lieu de terminer la chaîne, et `\\\\` met une seule barre oblique inverse ; `\"say \\\"hi\\\"\"` contient ainsi le texte `say \"hi\"`. Un échappement que le format ne prévoit pas, ou une entrée qui se termine avant le guillemet fermant, sont des erreurs. Comme le texte rangé est plus court que ce qui était écrit, les caractères sont copiés un à un sans leurs barres obliques inverses, dans un tampon qui grandit au besoin."

[questions.translations.es]
title = "Leer una cadena entre comillas con escapes"
stem = "En una cadena entre comillas, una comilla puede aparecer dentro del texto si está escapada, como en `\"say \\\"hi\\\"\"`. ¿Cómo encuentra un analizador el final de la cadena, qué hace una barra invertida y qué situaciones son errores?"
explanation = "La cadena empieza en su comilla de apertura y termina en la siguiente comilla que no esté escapada. Una barra invertida significa que el carácter que la sigue se toma literalmente: `\\\"` pone una comilla en el texto en lugar de terminar la cadena, y `\\\\` pone una sola barra invertida; así, `\"say \\\"hi\\\"\"` contiene el texto `say \"hi\"`. Un escape que el formato no contempla, o una entrada que termina antes de la comilla de cierre, son errores. Como el texto guardado es más corto que lo escrito, los caracteres se copian uno a uno sin sus barras invertidas, en un búfer que crece según haga falta."

[[questions.choices]]
correct = true
text = { en = "The string ends at the first quote that is not escaped; a backslash takes the next character literally, and an input ending before the closing quote is an error", fr = "La chaîne se termine à la première guillemet non échappée ; une barre oblique inverse prend le caractère suivant au pied de la lettre, et une entrée qui s'arrête avant la guillemet fermante est une erreur", es = "La cadena termina en la primera comilla no escapada; una barra invertida toma el siguiente carácter tal cual, y una entrada que acaba antes de la comilla de cierre es un error" }

[[questions.choices]]
text = { en = "The string ends at the next quote, whatever comes before it", fr = "La chaîne se termine à la guillemet suivante, quoi qu'il y ait avant elle", es = "La cadena termina en la siguiente comilla, haya lo que haya antes" }

[[questions.choices]]
text = { en = "A backslash is always kept in the stored text, which therefore has the same length as what was written", fr = "Une barre oblique inverse est toujours conservée dans le texte rangé, qui a donc la même longueur que ce qui a été écrit", es = "La barra invertida siempre se conserva en el texto guardado, que por tanto tiene la misma longitud que lo escrito" }

[[questions.choices]]
text = { en = "Any character after a backslash is valid, whatever the format supports", fr = "N'importe quel caractère après une barre oblique inverse est valide, quel que soit ce que le format accepte", es = "Cualquier carácter tras una barra invertida es válido, admítalo o no el formato" }

[[questions]]
slug = "rank04-l1-representing-parsed-values"
topic = "exam-rank-04-level-1"
kind = "free_text"
difficulty = 1400
tags = ["data-structures", "memory"]
key_points = [
  "A value that can be of several kinds is stored as a structure with an enum field saying which kind it is (a tag), plus the data for that kind; since only one kind is used at a time, that data can share the same memory.",
  "An object holds a dynamic array of key/value pairs, grown with realloc as pairs are parsed, together with its size.",
  "The code reads the tag before touching the data, since reading the member of another kind is meaningless.",
  "Freeing is recursive: free a string's text, or each key and each value of an object, then the array of pairs.",
]

[questions.translations.en]
title = "Storing a parsed value in C"
stem = "A parser returns values that can be an integer, a string or an object made of key/value pairs, where values can nest. How can one C type represent all of them, how is an object's content stored, and how is such a value freed?"
explanation = "The usual answer is a tagged structure: it holds an `enum` that says which kind of value it is, and the data of that kind, an `int`, a `char *`, or the description of an object; since only one kind is used at a time, these members can share the same memory. An object keeps a dynamic array of key/value pairs and its size, the array growing with `realloc` as the pairs are parsed; each pair holds a key and a nested value of the same type. The code must always read the tag before touching the data, since reading the member of another kind makes no sense. Freeing follows the same structure, recursively: the text of a string, or each key and each value of an object, then the array of pairs itself."

[questions.translations.fr]
title = "Ranger une valeur analysée en C"
stem = "Un analyseur renvoie des valeurs qui peuvent être un entier, une chaîne ou un objet fait de paires clé/valeur, les valeurs pouvant s'imbriquer. Comment un seul type C peut-il toutes les représenter, comment ranger le contenu d'un objet, et comment libérer une telle valeur ?"
explanation = "La réponse habituelle est une structure étiquetée : elle contient un `enum` indiquant le genre de la valeur, et les données de ce genre, un `int`, un `char *` ou la description d'un objet ; comme un seul genre sert à la fois, ces membres peuvent partager la même mémoire. Un objet garde un tableau dynamique de paires clé/valeur et sa taille, le tableau grandissant avec `realloc` à mesure que les paires sont analysées ; chaque paire contient une clé et une valeur imbriquée du même type. Le code doit toujours lire l'étiquette avant de toucher aux données, car lire le membre d'un autre genre n'a pas de sens. La libération suit la même structure, récursivement : le texte d'une chaîne, ou chaque clé et chaque valeur d'un objet, puis le tableau de paires lui-même."

[questions.translations.es]
title = "Guardar un valor analizado en C"
stem = "Un analizador devuelve valores que pueden ser un entero, una cadena o un objeto formado por pares clave/valor, y los valores pueden anidarse. ¿Cómo puede un solo tipo de C representarlos todos, cómo se guarda el contenido de un objeto y cómo se libera un valor así?"
explanation = "La respuesta habitual es una estructura etiquetada: contiene un `enum` que indica el tipo de valor, y los datos de ese tipo, un `int`, un `char *` o la descripción de un objeto; como solo se usa un tipo a la vez, esos miembros pueden compartir la misma memoria. Un objeto guarda un array dinámico de pares clave/valor y su tamaño, y el array crece con `realloc` a medida que se analizan los pares; cada par contiene una clave y un valor anidado del mismo tipo. El código debe leer siempre la etiqueta antes de tocar los datos, porque leer el miembro de otro tipo no tiene sentido. La liberación sigue la misma estructura, de forma recursiva: el texto de una cadena, o cada clave y cada valor de un objeto, y después el propio array de pares."

[[questions.choices]]
correct = true
text = { en = "A structure with a tag saying the kind, plus data that can share the same memory since only one kind is used at a time; an object keeps a growing array of pairs, and freeing is recursive", fr = "Une structure avec une étiquette disant le type, plus des données qui peuvent partager la même mémoire puisqu'un seul type sert à la fois ; un objet garde un tableau extensible de paires, et la libération est récursive", es = "Una estructura con una etiqueta que dice el tipo, más datos que pueden compartir la misma memoria ya que solo se usa un tipo a la vez; un objeto guarda un array ampliable de pares, y liberar es recursivo" }

[[questions.choices]]
text = { en = "One structure per kind, the parser returning a `void *` the caller converts by guessing", fr = "Une structure par type, l'analyseur renvoyant un `void *` que l'appelant convertit en devinant", es = "Una estructura por tipo, con el analizador devolviendo un `void *` que quien llama convierte adivinando" }

[[questions.choices]]
