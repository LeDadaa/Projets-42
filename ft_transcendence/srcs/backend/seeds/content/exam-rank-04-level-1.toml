title = "Computing directly or building a tree"
stem = "A parser can return the value of an expression directly, or build a syntax tree that another function then evaluates or prints. How does each approach work, what does the tree bring, and what memory work does it require, including when an error occurs?"
explanation = "Computing directly is the simplest: each parsing function returns a number, and the value comes out as the input is recognised. Building a tree means each function returns a node instead, for instance an operator whose children are the two sub-expressions; a separate function then walks the tree to evaluate it, print it or transform it. The tree separates recognising the input from using it, which pays off as soon as the result is used several times or in several ways. In return, every node is allocated, and the whole tree must be freed recursively, children before their parent, including the partial tree left behind when an error stops the parsing."

[questions.translations.fr]
title = "Calculer directement ou construire un arbre"
stem = "Un analyseur peut renvoyer directement la valeur d'une expression, ou construire un arbre syntaxique qu'une autre fonction évalue ou affiche ensuite. Comment fonctionne chaque approche, qu'apporte l'arbre, et quel travail mémoire demande-t-il, y compris quand une erreur survient ?"
explanation = "Calculer directement est le plus simple : chaque fonction d'analyse renvoie un nombre, et la valeur sort au fur et à mesure que l'entrée est reconnue. Construire un arbre signifie que chaque fonction renvoie plutôt un nœud, par exemple un opérateur dont les enfants sont les deux sous-expressions ; une fonction séparée parcourt ensuite l'arbre pour l'évaluer, l'afficher ou le transformer. L'arbre sépare la reconnaissance de l'entrée de son utilisation, ce qui paie dès que le résultat sert plusieurs fois ou de plusieurs façons. En échange, chaque nœud est alloué, et tout l'arbre doit être libéré récursivement, les enfants avant leur parent, y compris l'arbre partiel laissé par une erreur qui interrompt l'analyse."

[questions.translations.es]
title = "Calcular directamente o construir un árbol"
stem = "Un analizador puede devolver directamente el valor de una expresión, o construir un árbol sintáctico que otra función evalúa o muestra después. ¿Cómo funciona cada enfoque, qué aporta el árbol y qué trabajo de memoria exige, también cuando se produce un error?"
explanation = "Calcular directamente es lo más sencillo: cada función de análisis devuelve un número, y el valor sale a medida que se reconoce la entrada. Construir un árbol significa que cada función devuelve en cambio un nodo, por ejemplo un operador cuyos hijos son las dos subexpresiones; una función aparte recorre después el árbol para evaluarlo, mostrarlo o transformarlo. El árbol separa el reconocimiento de la entrada de su uso, lo que compensa en cuanto el resultado sirve varias veces o de varias formas. A cambio, cada nodo se reserva, y todo el árbol debe liberarse recursivamente, los hijos antes que su padre, incluido el árbol parcial que deja un error que interrumpe el análisis."

[[questions.choices]]
correct = true
text = { en = "Either each function returns a number, or it returns a node whose children are the sub-expressions; the tree separates parsing from use, and must be freed children first, partial tree included on an error", fr = "Soit chaque fonction renvoie un nombre, soit elle renvoie un nœud dont les enfants sont les sous-expressions ; l'arbre sépare l'analyse de l'usage, et se libère enfants d'abord, arbre partiel compris en cas d'erreur", es = "O cada función devuelve un número, o devuelve un nodo cuyos hijos son las subexpresiones; el árbol separa el análisis del uso y se libera hijos primero, árbol parcial incluido si hay error" }

[[questions.choices]]
text = { en = "The tree is freed from the root down, the node before its children", fr = "L'arbre se libère depuis la racine, le nœud avant ses enfants", es = "El árbol se libera desde la raíz, el nodo antes que sus hijos" }

[[questions.choices]]
text = { en = "On an error the partial tree can be left as it is: it is unreachable, so it costs nothing", fr = "En cas d'erreur l'arbre partiel peut être laissé tel quel : il est inaccessible, donc sans coût", es = "Si hay error el árbol parcial puede dejarse tal cual: es inalcanzable, así que no cuesta nada" }

[[questions.choices]]
text = { en = "A tree is required to respect precedence; computing directly can only apply the operators left to right", fr = "Un arbre est nécessaire pour respecter les priorités ; calculer directement ne peut qu'appliquer les opérateurs de gauche à droite", es = "Hace falta un árbol para respetar las prioridades; calcular directamente solo puede aplicar los operadores de izquierda a derecha" }

[[questions]]
slug = "rank04-l1-json-value-grammar"
topic = "exam-rank-04-level-1"
kind = "free_text"
