[[questions]]
slug = "rank04-l1-recursive-descent"
topic = "exam-rank-04-level-1"
kind = "free_text"
difficulty = 1200
tags = ["input-parsing", "recursion"]
key_points = [
  "The grammar is written as a set of rules, and each rule becomes one function that recognises its part of the input.",
  "Each function looks at the current character to decide which alternative applies, consumes what it recognises and advances a shared position.",
  "A rule that refers to another rule calls the corresponding function, and a rule that refers to itself, directly or not, makes the functions recursive.",
  "Each function returns what it recognised: a value to compute with, or a node of a tree.",
]

[questions.translations.en]
title = "Parsing by recursive descent"
stem = "What is a recursive descent parser? How does a grammar turn into functions, how does each function decide what to do, and where does the recursion come from?"
explanation = "The language to recognise is first written as a grammar, a set of rules such as \"an expression is a sum of terms\". Each rule becomes one function, which recognises its part of the input. That function looks at the current character to choose among the alternatives of its rule, consumes what it recognises and advances a position shared by all the functions. When a rule mentions another rule, the function calls the corresponding function; when a rule contains itself, directly or through other rules, as an expression between parentheses does, the functions become recursive. Each function returns what it has recognised: a value, or a node of a tree."

[questions.translations.fr]
title = "L'analyse par descente récursive"
stem = "Qu'est-ce qu'un analyseur par descente récursive ? Comment une grammaire se transforme-t-elle en fonctions, comment chaque fonction décide-t-elle quoi faire, et d'où vient la récursion ?"
explanation = "Le langage à reconnaître est d'abord écrit sous forme de grammaire, un ensemble de règles comme « une expression est une somme de termes ». Chaque règle devient une fonction, qui reconnaît sa partie de l'entrée. Cette fonction regarde le caractère courant pour choisir parmi les alternatives de sa règle, consomme ce qu'elle reconnaît et fait avancer une position partagée par toutes les fonctions. Quand une règle en mentionne une autre, la fonction appelle la fonction correspondante ; quand une règle se contient elle-même, directement ou à travers d'autres règles, comme une expression entre parenthèses, les fonctions deviennent récursives. Chaque fonction renvoie ce qu'elle a reconnu : une valeur, ou un nœud d'arbre."

[questions.translations.es]
title = "El análisis por descenso recursivo"
stem = "¿Qué es un analizador por descenso recursivo? ¿Cómo se convierte una gramática en funciones, cómo decide cada función qué hacer y de dónde viene la recursión?"
explanation = "El lenguaje que se quiere reconocer se escribe primero como una gramática, un conjunto de reglas como «una expresión es una suma de términos». Cada regla se convierte en una función, que reconoce su parte de la entrada. Esa función mira el carácter actual para elegir entre las alternativas de su regla, consume lo que reconoce y hace avanzar una posición compartida por todas las funciones. Cuando una regla menciona otra, la función llama a la función correspondiente; cuando una regla se contiene a sí misma, directamente o a través de otras reglas, como una expresión entre paréntesis, las funciones se vuelven recursivas. Cada función devuelve lo que ha reconocido: un valor o un nodo de un árbol."

[[questions.choices]]
correct = true
text = { en = "Each grammar rule becomes a function that looks at the current character, consumes what it recognises and advances a shared position; a rule referring to itself makes the functions recursive", fr = "Chaque règle de grammaire devient une fonction qui regarde le caractère courant, consomme ce qu'elle reconnaît et avance une position partagée ; une règle qui se réfère à elle-même rend les fonctions récursives", es = "Cada regla de la gramática se vuelve una función que mira el carácter actual, consume lo que reconoce y avanza una posición compartida; una regla que se refiere a sí misma hace recursivas las funciones" }

[[questions.choices]]
text = { en = "The whole input is first cut into tokens, then a table says which rule applies to each one", fr = "L'entrée est d'abord découpée en jetons, puis une table dit quelle règle s'applique à chacun", es = "La entrada se corta primero en fichas y después una tabla dice qué regla se aplica a cada una" }

[[questions.choices]]
text = { en = "Each function works on its own copy of the input, which is why they never interfere", fr = "Chaque fonction travaille sur sa propre copie de l'entrée, c'est pourquoi elles n'interfèrent jamais", es = "Cada función trabaja sobre su propia copia de la entrada, por eso nunca interfieren" }

[[questions.choices]]
text = { en = "The recursion comes from the length of the input: one call per character read", fr = "La récursion vient de la longueur de l'entrée : un appel par caractère lu", es = "La recursión viene de la longitud de la entrada: una llamada por carácter leído" }

[[questions]]
slug = "rank04-l1-operator-precedence"
topic = "exam-rank-04-level-1"
kind = "free_text"
difficulty = 1400
tags = ["input-parsing", "algorithms"]
key_points = [
  "Precedence is encoded by layering the grammar: expr = term { '+' term }, term = factor { '*' factor }, factor = digit | '(' expr ')'.",
  "The operator of lowest precedence sits in the top rule, so the operands of + are whole products, which are computed first.",
  "With this grammar 2+3*4 is 14, not 20, because the term 3*4 is computed before being added.",
  "A new level of precedence is a new rule between existing ones.",
]

[questions.translations.en]
title = "Operator precedence in a grammar"
stem = "An expression parser must compute `2+3*4` as 14 and `(2+3)*4` as 20. How do you write the grammar so that multiplication binds tighter than addition, without any precedence table? Give the rules."
explanation = "Precedence comes from the way the rules are layered: `expr = term { '+' term }`, `term = factor { '*' factor }`, `factor = digit | '(' expr ')'`. The lowest-priority operator lives in the top rule, so the operands of `+` are whole terms, and a term is a complete product, computed before the addition sees it: in `2+3*4`, the term `3*4` gives 12 and the result is 14. Parentheses go back to the top rule from inside `factor`, which is why `(2+3)*4` gives 20. Adding another level of priority means adding one more rule between the existing ones."

[questions.translations.fr]
title = "La priorité des opérateurs dans une grammaire"
stem = "Un analyseur d'expressions doit calculer `2+3*4` comme 14 et `(2+3)*4` comme 20. Comment écrire la grammaire pour que la multiplication soit prioritaire sur l'addition, sans aucune table de priorités ? Donnez les règles."
explanation = "La priorité vient de l'étagement des règles : `expr = term { '+' term }`, `term = factor { '*' factor }`, `factor = chiffre | '(' expr ')'`. L'opérateur le moins prioritaire se trouve dans la règle du haut : les opérandes de `+` sont donc des termes entiers, et un terme est un produit complet, calculé avant que l'addition ne le voie. Dans `2+3*4`, le terme `3*4` donne 12 et le résultat vaut 14. Les parenthèses remontent à la règle du haut depuis `factor`, c'est pourquoi `(2+3)*4` donne 20. Ajouter un niveau de priorité revient à ajouter une règle entre celles qui existent."

[questions.translations.es]
title = "La prioridad de los operadores en una gramática"
stem = "Un analizador de expresiones debe calcular `2+3*4` como 14 y `(2+3)*4` como 20. ¿Cómo escribes la gramática para que la multiplicación tenga prioridad sobre la suma, sin ninguna tabla de prioridades? Da las reglas."
explanation = "La prioridad sale de cómo se escalonan las reglas: `expr = term { '+' term }`, `term = factor { '*' factor }`, `factor = cifra | '(' expr ')'`. El operador de menor prioridad está en la regla superior, así que los operandos de `+` son términos enteros, y un término es un producto completo, calculado antes de que la suma lo vea: en `2+3*4`, el término `3*4` da 12 y el resultado es 14. Los paréntesis vuelven a la regla superior desde `factor`, por eso `(2+3)*4` da 20. Añadir un nivel de prioridad consiste en añadir una regla entre las que ya existen."

[[questions.choices]]
correct = true
text = { en = "Layer the grammar: `expr = term { '+' term }`, `term = factor { '*' factor }`, `factor = digit | '(' expr ')'` — the lowest precedence sits in the top rule", fr = "Étager la grammaire : `expr = terme { '+' terme }`, `terme = facteur { '*' facteur }`, `facteur = chiffre | '(' expr ')'` — la priorité la plus faible est dans la règle du haut", es = "Estratificar la gramática: `expr = term { '+' term }`, `term = factor { '*' factor }`, `factor = cifra | '(' expr ')'` — la prioridad más baja va en la regla de arriba" }

[[questions.choices]]
text = { en = "Put the highest precedence in the top rule: `expr = term { '*' term }` and `term = factor { '+' factor }`", fr = "Mettre la priorité la plus forte dans la règle du haut : `expr = terme { '*' terme }` et `terme = facteur { '+' facteur }`", es = "Poner la prioridad más alta en la regla de arriba: `expr = term { '*' term }` y `term = factor { '+' factor }`" }

[[questions.choices]]
text = { en = "A single rule `expr = expr op expr` is enough, with a table giving each operator's precedence", fr = "Une seule règle `expr = expr op expr` suffit, avec une table donnant la priorité de chaque opérateur", es = "Basta una sola regla `expr = expr op expr`, con una tabla que dé la prioridad de cada operador" }

[[questions.choices]]
text = { en = "With that layered grammar `2+3*4` gives 20, since `2+3` is recognised first", fr = "Avec cette grammaire étagée, `2+3*4` donne 20, puisque `2+3` est reconnu en premier", es = "Con esa gramática estratificada, `2+3*4` da 20, ya que `2+3` se reconoce primero" }

[[questions]]
slug = "rank04-l1-parentheses-and-recursion"
topic = "exam-rank-04-level-1"
kind = "free_text"
difficulty = 1000
tags = ["recursion", "input-parsing"]
key_points = [
  "When the factor rule meets '(', it consumes it, calls the top rule to parse the whole inner expression, then requires a ')'.",
  "The inner expression is therefore computed completely before the operator outside the parentheses uses its value.",
  "Each level of nesting adds one level of recursion, so the recursion depth follows the nesting depth.",
  "A missing ')' is detected when the inner call returns and the current character is not ')'.",
]

[questions.translations.en]
title = "Parentheses and recursion"
stem = "In a recursive descent parser for arithmetic, how are parentheses handled? Why does this make the inside of the parentheses be computed first, how deep does the recursion go, and how is a missing `)` detected?"
explanation = "When the rule for a factor meets `(`, it consumes it and calls the top rule, the one for a whole expression, which parses everything inside; when that call returns, the current character must be `)`, which is then consumed. The value of the parenthesised expression is therefore complete before the operator outside uses it. Each level of nesting adds a level of recursion: in `2*(3+(4*(1+1)))` the calls go three levels deep. If the inner call returns on any character other than `)`, a closing parenthesis is missing, and that is where the error is reported."

[questions.translations.fr]
title = "Les parenthèses et la récursion"
stem = "Dans un analyseur arithmétique par descente récursive, comment traite-t-on les parenthèses ? Pourquoi cela fait-il calculer l'intérieur des parenthèses en premier, jusqu'à quelle profondeur va la récursion, et comment détecte-t-on une `)` manquante ?"
explanation = "Quand la règle d'un facteur rencontre `(`, elle la consomme et appelle la règle du haut, celle d'une expression entière, qui analyse tout l'intérieur ; au retour de cet appel, le caractère courant doit être `)`, qui est alors consommée. La valeur de l'expression entre parenthèses est donc complète avant que l'opérateur extérieur ne s'en serve. Chaque niveau d'imbrication ajoute un niveau de récursion : dans `2*(3+(4*(1+1)))`, les appels descendent de trois niveaux. Si l'appel intérieur revient sur un autre caractère que `)`, une parenthèse fermante manque, et c'est là que l'erreur est signalée."

[questions.translations.es]
title = "Los paréntesis y la recursión"
stem = "En un analizador aritmético por descenso recursivo, ¿cómo se tratan los paréntesis? ¿Por qué hace esto que el interior de los paréntesis se calcule primero, hasta qué profundidad llega la recursión y cómo se detecta un `)` que falta?"
explanation = "Cuando la regla de un factor encuentra `(`, lo consume y llama a la regla superior, la de una expresión completa, que analiza todo el interior; al volver de esa llamada, el carácter actual debe ser `)`, que entonces se consume. El valor de la expresión entre paréntesis está, por tanto, completo antes de que el operador exterior lo use. Cada nivel de anidamiento añade un nivel de recursión: en `2*(3+(4*(1+1)))`, las llamadas bajan tres niveles. Si la llamada interior vuelve sobre un carácter distinto de `)`, falta un paréntesis de cierre, y es ahí donde se informa del error."

[[questions.choices]]
correct = true
text = { en = "The `factor` rule consumes `(`, calls the top rule for the whole inner expression, then requires `)`; the depth follows the nesting, and a missing `)` is caught on return", fr = "La règle `facteur` consomme `(`, appelle la règle du haut pour toute l'expression intérieure, puis exige `)` ; la profondeur suit l'imbrication, et un `)` manquant est détecté au retour", es = "La regla `factor` consume `(`, llama a la regla de arriba para toda la expresión interior y después exige `)`; la profundidad sigue al anidamiento, y un `)` que falta se detecta al volver" }

[[questions.choices]]
text = { en = "The parser first counts the parentheses to find the matching one, then parses what is between them", fr = "L'analyseur compte d'abord les parenthèses pour trouver la correspondante, puis analyse ce qu'il y a entre elles", es = "El analizador cuenta primero los paréntesis para hallar el correspondiente y después analiza lo que hay entre ellos" }

[[questions.choices]]
text = { en = "Parentheses are handled by the `term` rule, since they change the precedence of the operators", fr = "Les parenthèses sont traitées par la règle `terme`, puisqu'elles changent la priorité des opérateurs", es = "Los paréntesis los trata la regla `term`, ya que cambian la prioridad de los operadores" }

[[questions.choices]]
text = { en = "The recursion depth stays constant, whatever the nesting of the parentheses", fr = "La profondeur de récursion reste constante, quelle que soit l'imbrication des parenthèses", es = "La profundidad de recursión sigue constante, sea cual sea el anidamiento de los paréntesis" }

[[questions]]
slug = "rank04-l1-reporting-parse-errors"
topic = "exam-rank-04-level-1"
kind = "free_text"
difficulty = 1200
tags = ["input-parsing", "error-handling"]
key_points = [
  "An error is detected where the grammar expects something specific (a digit, an operand, a closing parenthesis) and the current character does not fit.",
  "Two cases are told apart: an unexpected character, reported with that character, and the input ending too early, reported as such.",
  "After a complete expression, any remaining character is also an error (for example the ')' in 2)).",
  "Once an error is found, parsing stops, and the first error is the one reported, with a failure exit status.",
]

[questions.translations.en]
title = "Reporting parse errors"
stem = "A parser must reject malformed expressions such as `2+`, `(2`, `2)` or `2+*3`, and say what went wrong. Where exactly is each error detected, which two kinds of error must be told apart, and what happens after the first one?"
explanation = "An error shows up where the grammar expects something precise, a digit, an operand or a closing parenthesis, and the current character does not fit. Two kinds must be told apart. Either a character is there but is not acceptable, and it is named in the message: `*` in `2+*3`, where an operand was expected. Or the input ends while something is still expected: after the `+` of `2+`, or before the `)` of `(2`. A complete expression followed by more characters is also an error: the `)` of `2)`. Parsing stops at the first error, which is the one reported, and the program exits with a failure status."

[questions.translations.fr]
title = "Signaler les erreurs d'analyse"
stem = "Un analyseur doit refuser des expressions mal formées comme `2+`, `(2`, `2)` ou `2+*3`, et dire ce qui ne va pas. Où chaque erreur est-elle détectée exactement, quelles deux sortes d'erreurs faut-il distinguer, et que se passe-t-il après la première ?"
explanation = "Une erreur apparaît là où la grammaire attend quelque chose de précis, un chiffre, un opérande ou une parenthèse fermante, et où le caractère courant ne convient pas. Il faut distinguer deux sortes d'erreurs. Soit un caractère est présent mais pas acceptable, et on le nomme dans le message : le `*` de `2+*3`, là où un opérande était attendu. Soit l'entrée se termine alors que quelque chose est encore attendu : après le `+` de `2+`, ou avant la `)` de `(2`. Une expression complète suivie d'autres caractères est aussi une erreur : la `)` de `2)`. L'analyse s'arrête à la première erreur, qui est celle qu'on signale, et le programme se termine avec un code d'échec."

[questions.translations.es]
title = "Informar de errores de análisis"
stem = "Un analizador debe rechazar expresiones mal formadas como `2+`, `(2`, `2)` o `2+*3`, y decir qué falla. ¿Dónde se detecta exactamente cada error, qué dos tipos de error hay que distinguir y qué pasa después del primero?"
explanation = "Un error aparece donde la gramática espera algo concreto, una cifra, un operando o un paréntesis de cierre, y el carácter actual no encaja. Hay que distinguir dos tipos. O bien hay un carácter pero no es aceptable, y se nombra en el mensaje: el `*` de `2+*3`, donde se esperaba un operando. O bien la entrada termina cuando todavía se espera algo: después del `+` de `2+`, o antes del `)` de `(2`. Una expresión completa seguida de más caracteres también es un error: el `)` de `2)`. El análisis se detiene en el primer error, que es el que se comunica, y el programa termina con un código de fallo."

[[questions.choices]]
correct = true
text = { en = "Where a rule expects something precise; an unexpected character and an input ending too early are told apart, a leftover character after a complete expression is an error too, and the first error stops the parse", fr = "Là où une règle attend quelque chose de précis ; un caractère inattendu et une entrée qui s'arrête trop tôt sont distingués, un caractère restant après une expression complète est aussi une erreur, et la première erreur arrête l'analyse", es = "Donde una regla espera algo concreto; se distinguen un carácter inesperado y una entrada que acaba pronto, un carácter sobrante tras una expresión completa también es error, y el primer error para el análisis" }

[[questions.choices]]
text = { en = "Errors are collected to the end and reported together, which is more helpful", fr = "Les erreurs sont collectées jusqu'au bout et signalées ensemble, ce qui aide davantage", es = "Los errores se recogen hasta el final y se informan juntos, lo que ayuda más" }

[[questions.choices]]
text = { en = "`2)` is valid: the parser stops on a complete expression and ignores what follows", fr = "`2)` est valide : l'analyseur s'arrête sur une expression complète et ignore ce qui suit", es = "`2)` es válido: el analizador para en una expresión completa e ignora lo que sigue" }

[[questions.choices]]
text = { en = "An input ending too early and an unexpected character are the same case, since neither matches the grammar", fr = "Une entrée qui s'arrête trop tôt et un caractère inattendu sont le même cas, puisque ni l'un ni l'autre ne colle à la grammaire", es = "Una entrada que acaba pronto y un carácter inesperado son el mismo caso, ya que ninguno encaja con la gramática" }

[[questions]]
slug = "rank04-l1-associativity"
topic = "exam-rank-04-level-1"
kind = "free_text"
difficulty = 1400
tags = ["input-parsing", "algorithms"]
key_points = [
  "Operators of equal precedence are usually left-associative: 8-3-2 means (8-3)-2, which is 3.",
  "A rule written with a loop (term { '-' term }) accumulates from left to right and gives left associativity.",
  "A rule written with right recursion (expr = term '-' expr) groups from the right and computes 8-(3-2), which is 7.",
  "For + and *, which are associative, both give the same value; for - and / the choice changes the result.",
]

[questions.translations.en]
title = "Associativity: left or right"
stem = "`8-3-2` should equal 3. A parser written with the rule `expr = term '-' expr` returns 7. Why? How must the rule be written to get the usual behaviour, and why does the problem not show with `+` and `*`?"
explanation = "Operators of equal precedence are normally grouped from the left: `8-3-2` means `(8-3)-2`, which is 3. The rule `expr = term '-' expr` is right-recursive: it takes 8, then parses everything after the minus as a whole expression, which computes `8-(3-2)`, that is 7. Written with a loop, `expr = term { '-' term }`, the value is accumulated from left to right, each new term being subtracted from the running result, which gives left associativity. With `+` and `*`, which are associative, both groupings give the same value, which is why the mistake only shows with `-` and `/`."

[questions.translations.fr]
title = "L'associativité : à gauche ou à droite"
stem = "`8-3-2` devrait valoir 3. Un analyseur écrit avec la règle `expr = term '-' expr` renvoie 7. Pourquoi ? Comment écrire la règle pour obtenir le comportement habituel, et pourquoi le problème ne se voit-il pas avec `+` et `*` ?"
explanation = "Les opérateurs de même priorité se regroupent normalement à partir de la gauche : `8-3-2` signifie `(8-3)-2`, soit 3. La règle `expr = term '-' expr` est récursive à droite : elle prend 8, puis analyse tout ce qui suit le moins comme une expression entière, ce qui calcule `8-(3-2)`, soit 7. Écrite avec une boucle, `expr = term { '-' term }`, la valeur s'accumule de gauche à droite, chaque nouveau terme étant retranché du résultat courant, ce qui donne l'associativité à gauche. Avec `+` et `*`, qui sont associatifs, les deux regroupements donnent la même valeur : c'est pourquoi l'erreur ne se voit qu'avec `-` et `/`."

[questions.translations.es]
title = "La asociatividad: por la izquierda o por la derecha"
stem = "`8-3-2` debería valer 3. Un analizador escrito con la regla `expr = term '-' expr` devuelve 7. ¿Por qué? ¿Cómo hay que escribir la regla para obtener el comportamiento habitual, y por qué el problema no se nota con `+` y `*`?"
explanation = "Los operadores de igual prioridad se agrupan normalmente desde la izquierda: `8-3-2` significa `(8-3)-2`, es decir, 3. La regla `expr = term '-' expr` es recursiva por la derecha: toma el 8 y después analiza todo lo que sigue al menos como una expresión completa, lo que calcula `8-(3-2)`, es decir, 7. Escrita con un bucle, `expr = term { '-' term }`, el valor se acumula de izquierda a derecha, restando cada término nuevo del resultado actual, lo que da asociatividad por la izquierda. Con `+` y `*`, que son asociativos, las dos agrupaciones dan el mismo valor: por eso el error solo se nota con `-` y `/`."

[[questions.choices]]
correct = true
text = { en = "Right recursion groups from the right and computes `8-(3-2)`; a loop `term { '-' term }` accumulates left to right, and for `+` and `*` both give the same value", fr = "La récursion à droite groupe par la droite et calcule `8-(3-2)` ; une boucle `terme { '-' terme }` accumule de gauche à droite, et pour `+` et `*` les deux donnent la même valeur", es = "La recursión por la derecha agrupa desde la derecha y calcula `8-(3-2)`; un bucle `term { '-' term }` acumula de izquierda a derecha, y para `+` y `*` ambas dan lo mismo" }

[[questions.choices]]
text = { en = "The rule is right: `8-3-2` really is 7, and the expected 3 comes from a wrong reading", fr = "La règle est juste : `8-3-2` vaut bien 7, et le 3 attendu vient d'une lecture erronée", es = "La regla es correcta: `8-3-2` vale 7, y el 3 esperado viene de una lectura equivocada" }

[[questions.choices]]
text = { en = "Associativity is a matter of precedence: giving `-` a higher precedence than `+` fixes it", fr = "L'associativité est une affaire de priorité : donner à `-` une priorité plus forte qu'à `+` corrige le problème", es = "La asociatividad es cuestión de prioridad: dar a `-` más prioridad que a `+` lo arregla" }

[[questions.choices]]
text = { en = "The same problem shows with `+` and `*`, whose results also change with the grouping", fr = "Le même problème apparaît avec `+` et `*`, dont les résultats changent aussi avec le groupement", es = "El mismo problema aparece con `+` y `*`, cuyos resultados también cambian con la agrupación" }

