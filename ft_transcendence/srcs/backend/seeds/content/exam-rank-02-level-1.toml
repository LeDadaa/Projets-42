  "Integer division truncates toward zero: -7 / 2 is -3.",
  "The remainder has the sign of the dividend, so that (a / b) * b + a % b == a: -7 % 2 is -1 and 7 % -2 is 1.",
  "Dividing by zero, with / or %, is undefined behaviour and usually kills the program (SIGFPE), so the divisor must be checked first.",
