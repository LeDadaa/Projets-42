[questions.translations.en]
title = "Finding a string as a subsequence"
stem = "How do you check whether the characters of a string `a` appear, in the same order but not necessarily side by side, inside a string `b`? For example `\"fya\"` in `\"faaaya\"`. What does your method cost, and why is taking the first match that comes always right?"
explanation = "Keep one position in each string. Move forward in `b` at every step, and in `a` only when the two current characters are equal. `a` is found when its position reaches its `'\\0'`; if `b` ends first, it is not. Using the earliest possible match is always safe: it leaves the largest part of `b` for the characters still to find, so no other choice could succeed where this one fails. Each string is read once, with no going back: `O(n + m)`."

[questions.translations.fr]
title = "Retrouver une chaîne comme sous-suite"
stem = "Comment vérifier que les caractères d'une chaîne `a` apparaissent, dans le même ordre mais pas forcément côte à côte, dans une chaîne `b` ? Par exemple `\"fya\"` dans `\"faaaya\"`. Que coûte votre méthode, et pourquoi prendre la première correspondance qui se présente est-il toujours juste ?"
explanation = "On garde une position dans chaque chaîne. On avance dans `b` à chaque pas, et dans `a` seulement quand les deux caractères courants sont égaux. `a` est trouvée quand sa position atteint son `'\\0'` ; si `b` se termine avant, elle ne l'est pas. Utiliser la correspondance la plus précoce est toujours sûr : elle laisse la plus grande partie de `b` pour les caractères qui restent à trouver, donc aucun autre choix ne pourrait réussir là où celui-ci échoue. Chaque chaîne est lue une seule fois, sans retour en arrière : `O(n + m)`."

[questions.translations.es]
title = "Encontrar una cadena como subsecuencia"
stem = "¿Cómo compruebas que los caracteres de una cadena `a` aparecen, en el mismo orden pero no necesariamente juntos, dentro de una cadena `b`? Por ejemplo `\"fya\"` en `\"faaaya\"`. ¿Cuánto cuesta tu método y por qué tomar la primera coincidencia que aparece es siempre correcto?"
explanation = "Se mantiene una posición en cada cadena. Se avanza en `b` en cada paso, y en `a` solo cuando los dos caracteres actuales son iguales. `a` se encuentra cuando su posición llega a su `'\\0'`; si `b` termina antes, no. Usar la coincidencia más temprana siempre es seguro: deja la mayor parte de `b` para los caracteres que faltan, así que ninguna otra elección podría tener éxito donde esta falla. Cada cadena se lee una sola vez, sin volver atrás: `O(n + m)`."

