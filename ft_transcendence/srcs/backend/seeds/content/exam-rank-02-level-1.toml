[[questions]]
slug = "rank02-l1-mirror-letter"
topic = "exam-rank-02-level-1"
kind = "free_text"
difficulty = 1000
tags = ["characters"]
key_points = [
  "A letter and its mirror are at the same distance from the two ends of the alphabet, so their codes always add up to 'a' + 'z'.",
  "The mirror of a lowercase letter c is therefore 'a' + 'z' - c, and that of a capital is 'A' + 'Z' - c.",
  "Each case uses its own range, which keeps the case, and characters that are not letters are left unchanged.",
]

[questions.translations.en]
title = "The mirror of a letter"
stem = "You want to replace each letter by its mirror in the alphabet: `a` by `z`, `b` by `y`, and so on, keeping the case. What single computation gives the mirror of a lowercase letter `c`, and why does it work?"
explanation = "A letter and its mirror are at the same distance from the two ends of the alphabet: `c` is `c - 'a'` places after `'a'`, and its mirror is as many places before `'z'`. Their codes therefore always add up to `'a' + 'z'`, and the mirror is `'a' + 'z' - c`: `'a'` gives `'z'`, `'d'` gives `'w'`. Capitals use their own range, `'A' + 'Z' - c`, which keeps the case, and characters that are not letters are copied unchanged."

[questions.translations.fr]
title = "La lettre miroir"
stem = "On veut remplacer chaque lettre par son miroir dans l'alphabet : `a` par `z`, `b` par `y`, et ainsi de suite, en gardant la casse. Quel calcul unique donne le miroir d'une minuscule `c`, et pourquoi fonctionne-t-il ?"
explanation = "Une lettre et son miroir sont à la même distance des deux bouts de l'alphabet : `c` est `c - 'a'` rangs après `'a'`, et son miroir autant de rangs avant `'z'`. Leurs codes ont donc toujours pour somme `'a' + 'z'`, et le miroir vaut `'a' + 'z' - c` : `'a'` donne `'z'`, `'d'` donne `'w'`. Les majuscules utilisent leur propre plage, `'A' + 'Z' - c`, ce qui conserve la casse, et les caractères qui ne sont pas des lettres sont recopiés tels quels."

[questions.translations.es]
title = "La letra espejo"
stem = "Quieres sustituir cada letra por su espejo en el alfabeto: `a` por `z`, `b` por `y`, y así sucesivamente, conservando la caja. ¿Qué cálculo único da el espejo de una minúscula `c`, y por qué funciona?"
explanation = "Una letra y su espejo están a la misma distancia de los dos extremos del alfabeto: `c` está `c - 'a'` posiciones después de `'a'`, y su espejo otras tantas antes de `'z'`. Sus códigos suman por tanto siempre `'a' + 'z'`, y el espejo es `'a' + 'z' - c`: `'a'` da `'z'`, `'d'` da `'w'`. Las mayúsculas usan su propio rango, `'A' + 'Z' - c`, lo que conserva la caja, y los caracteres que no son letras se copian sin cambios."

[[questions.choices]]
correct = true
text = { en = "`'a' + 'z' - c`: a letter and its mirror are the same distance from the two ends, so their codes always add up to `'a' + 'z'`", fr = "`'a' + 'z' - c` : une lettre et son miroir sont à la même distance des deux bouts, donc leurs codes s'additionnent toujours en `'a' + 'z'`", es = "`'a' + 'z' - c`: una letra y su reflejo están a la misma distancia de los dos extremos, así que sus códigos siempre suman `'a' + 'z'`" }

[[questions.choices]]
text = { en = "`'z' - c`, since the mirror is the distance that separates the letter from the end of the alphabet", fr = "`'z' - c`, puisque le miroir est la distance qui sépare la lettre de la fin de l'alphabet", es = "`'z' - c`, ya que el reflejo es la distancia que separa la letra del final del alfabeto" }

[[questions.choices]]
text = { en = "`26 - c`, because the alphabet holds 26 letters", fr = "`26 - c`, parce que l'alphabet compte 26 lettres", es = "`26 - c`, porque el alfabeto tiene 26 letras" }

[[questions.choices]]
text = { en = "`c + 13`, wrapping around at the end of the alphabet", fr = "`c + 13`, en repassant au début à la fin de l'alphabet", es = "`c + 13`, volviendo al principio al final del alfabeto" }

[[questions]]
slug = "rank02-l1-parsing-an-integer"
topic = "exam-rank-02-level-1"
kind = "free_text"
difficulty = 1200
tags = ["conversions", "input-parsing"]
key_points = [
  "Skip the leading whitespace (spaces, tabs, newlines and the other isspace characters).",
  "Read at most one sign, '+' or '-'; a second sign or a sign followed by a space ends the number, giving 0.",
  "Accumulate the digits with result = result * 10 + (c - '0') and stop at the first non-digit character.",
  "atoi cannot report an error, and a value that does not fit in an int is undefined behaviour.",
]

[questions.translations.en]
title = "How atoi reads a number"
stem = "Describe the rules `atoi` follows to turn a string into an `int`: what it skips, how it handles signs, how it builds the value and when it stops. What do `atoi(\"  -42abc\")`, `atoi(\"+-5\")` and `atoi(\"- 3\")` return?"
explanation = "`atoi` first skips leading whitespace: spaces, tabs, newlines and the other `isspace` characters. It then accepts at most one sign, then builds the value digit by digit with `result = result * 10 + (c - '0')`, stopping at the first character that is not a digit. So `atoi(\"  -42abc\")` is -42, while `atoi(\"+-5\")` and `atoi(\"- 3\")` are 0: after the sign comes no digit. `atoi` has no way to report an error, and a value that does not fit in an `int` is undefined behaviour; `strtol` exists for input that must be checked."

[questions.translations.fr]
title = "Comment atoi lit un nombre"
stem = "Décrivez les règles que suit `atoi` pour transformer une chaîne en `int` : ce qu'elle saute, comment elle traite les signes, comment elle construit la valeur et quand elle s'arrête. Que renvoient `atoi(\"  -42abc\")`, `atoi(\"+-5\")` et `atoi(\"- 3\")` ?"
explanation = "`atoi` saute d'abord les blancs du début : espaces, tabulations, retours à la ligne et les autres caractères de `isspace`. Elle accepte ensuite au plus un signe, puis construit la valeur chiffre par chiffre avec `result = result * 10 + (c - '0')`, et s'arrête au premier caractère qui n'est pas un chiffre. Ainsi `atoi(\"  -42abc\")` vaut -42, tandis que `atoi(\"+-5\")` et `atoi(\"- 3\")` valent 0 : après le signe ne vient aucun chiffre. `atoi` n'a aucun moyen de signaler une erreur, et une valeur qui ne tient pas dans un `int` est un comportement indéfini ; `strtol` existe pour les entrées qu'il faut vérifier."

[questions.translations.es]
title = "Cómo lee atoi un número"
stem = "Describe las reglas que sigue `atoi` para convertir una cadena en un `int`: qué se salta, cómo trata los signos, cómo construye el valor y cuándo se detiene. ¿Qué devuelven `atoi(\"  -42abc\")`, `atoi(\"+-5\")` y `atoi(\"- 3\")`?"
explanation = "`atoi` se salta primero los espacios en blanco iniciales: espacios, tabulaciones, saltos de línea y los demás caracteres de `isspace`. Después acepta como mucho un signo y construye el valor cifra a cifra con `result = result * 10 + (c - '0')`, deteniéndose en el primer carácter que no es una cifra. Así, `atoi(\"  -42abc\")` vale -42, mientras que `atoi(\"+-5\")` y `atoi(\"- 3\")` valen 0: después del signo no viene ninguna cifra. `atoi` no puede informar de un error, y un valor que no cabe en un `int` es comportamiento indefinido; `strtol` existe para las entradas que hay que comprobar."

[[questions.choices]]
correct = true
text = { en = "`-42`, `0` and `0`: one sign at most, and a second sign or a space after it ends the number before any digit", fr = "`-42`, `0` et `0` : un seul signe au plus, et un second signe ou une espace après lui termine le nombre avant tout chiffre", es = "`-42`, `0` y `0`: un signo como mucho, y un segundo signo o un espacio tras él termina el número antes de cualquier cifra" }

[[questions.choices]]
text = { en = "`-42`, `-5` and `-3`: the extra sign and the space are skipped like the leading whitespace", fr = "`-42`, `-5` et `-3` : le signe en trop et l'espace sont sautés comme les blancs du début", es = "`-42`, `-5` y `-3`: el signo de más y el espacio se saltan como los blancos iniciales" }

[[questions.choices]]
text = { en = "`-42`, `0` and `-3`: a space is always ignored, wherever it sits", fr = "`-42`, `0` et `-3` : une espace est toujours ignorée, où qu'elle se trouve", es = "`-42`, `0` y `-3`: un espacio siempre se ignora, esté donde esté" }

[[questions.choices]]
text = { en = "`0`, `0` and `0`: any character that is not a digit makes the whole conversion fail", fr = "`0`, `0` et `0` : tout caractère qui n'est pas un chiffre fait échouer toute la conversion", es = "`0`, `0` y `0`: cualquier carácter que no sea una cifra hace fallar toda la conversión" }

[[questions]]
slug = "rank02-l1-comparing-strings"
topic = "exam-rank-02-level-1"
kind = "free_text"
difficulty = 1000
tags = ["strings"]
key_points = [
  "strcmp walks both strings while the characters are equal and neither has ended.",
  "It returns a negative value, zero or a positive value depending on how the first differing characters compare; only the sign is guaranteed, not the magnitude.",
  "When one string is a prefix of the other, its '\\0' is what differs, so the shorter string compares as smaller.",
  "Characters are compared as unsigned char, so a byte above 127 is larger than any ASCII letter.",
]

[questions.translations.en]
title = "Comparing two strings"
stem = "How does `strcmp(s1, s2)` decide its result? What does it return, what may you rely on in that value, and what happens when one string is a prefix of the other, as with `\"abc\"` and `\"abcd\"`?"
explanation = "`strcmp` advances in both strings while the characters are equal and neither has reached its end, then compares the first pair that differs. It returns a negative value if `s1` comes first, zero if the strings are equal, and a positive value otherwise; only the sign is guaranteed, so the result is compared with 0, never with -1 or 1. When one string is a prefix of the other, the difference is its `'\\0'`, the smallest character, so `\"abc\"` comes before `\"abcd\"`. The comparison is made on `unsigned char` values: a byte above 127 comes after every ASCII letter."

[questions.translations.fr]
title = "Comparer deux chaînes"
stem = "Comment `strcmp(s1, s2)` décide-t-il de son résultat ? Que renvoie-t-il, sur quoi peut-on compter dans cette valeur, et que se passe-t-il quand une chaîne est le début de l'autre, comme `\"abc\"` et `\"abcd\"` ?"
explanation = "`strcmp` avance dans les deux chaînes tant que les caractères sont égaux et qu'aucune n'est terminée, puis compare la première paire qui diffère. Il renvoie une valeur négative si `s1` vient avant, zéro si les chaînes sont égales, et une valeur positive sinon ; seul le signe est garanti, donc on compare le résultat à 0, jamais à -1 ou à 1. Quand une chaîne est le début de l'autre, la différence est son `'\\0'`, le plus petit caractère : `\"abc\"` vient donc avant `\"abcd\"`. La comparaison se fait sur des valeurs `unsigned char` : un octet au-dessus de 127 vient après toutes les lettres ASCII."

[questions.translations.es]
title = "Comparar dos cadenas"
stem = "¿Cómo decide `strcmp(s1, s2)` su resultado? ¿Qué devuelve, en qué se puede confiar de ese valor y qué pasa cuando una cadena es el principio de la otra, como `\"abc\"` y `\"abcd\"`?"
explanation = "`strcmp` avanza en las dos cadenas mientras los caracteres son iguales y ninguna ha terminado, y después compara el primer par que difiere. Devuelve un valor negativo si `s1` va antes, cero si las cadenas son iguales y un valor positivo en caso contrario; solo el signo está garantizado, así que el resultado se compara con 0, nunca con -1 o 1. Cuando una cadena es el principio de la otra, la diferencia es su `'\\0'`, el carácter más pequeño, así que `\"abc\"` va antes que `\"abcd\"`. La comparación se hace con valores `unsigned char`: un byte por encima de 127 va después de todas las letras ASCII."

[[questions.choices]]
correct = true
text = { en = "The sign of the comparison at the first differing character; only that sign is guaranteed, and a string that is a prefix of the other compares as smaller", fr = "Le signe de la comparaison au premier caractère qui diffère ; seul ce signe est garanti, et une chaîne préfixe de l'autre est la plus petite", es = "El signo de la comparación en el primer carácter que difiere; solo ese signo está garantizado, y una cadena que es prefijo de la otra es la menor" }

[[questions.choices]]
text = { en = "Exactly `-1`, `0` or `1`, so the three values can be tested one by one", fr = "Exactement `-1`, `0` ou `1`, donc on peut tester les trois valeurs une à une", es = "Exactamente `-1`, `0` o `1`, así que se pueden probar los tres valores uno a uno" }

[[questions.choices]]
text = { en = "`1` when the strings are equal and `0` otherwise", fr = "`1` quand les chaînes sont égales et `0` sinon", es = "`1` cuando las cadenas son iguales y `0` si no" }

[[questions.choices]]
text = { en = "The difference between the two lengths, so the longer string is always the greater one", fr = "La différence des deux longueurs, donc la plus longue est toujours la plus grande", es = "La diferencia de las dos longitudes, así que la más larga siempre es la mayor" }

