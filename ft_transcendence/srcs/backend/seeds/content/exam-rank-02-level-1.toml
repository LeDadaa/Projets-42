[[questions]]
slug = "rank02-l1-reversing-in-place"
topic = "exam-rank-02-level-1"
kind = "free_text"
difficulty = 1000
tags = ["strings", "algorithms"]
key_points = [
  "Use two indices, one at the first character and one at the last (length - 1), and swap the characters they point to.",
  "Move them towards each other and stop when they meet or cross, that is after length / 2 swaps.",
  "Swapping index i with length - 1 - i for every i up to length - 1 is wrong: past the middle each pair is swapped back and the original string is restored.",
  "The terminator stays in place, and no extra buffer is needed.",
]

[questions.translations.en]
title = "Reversing a string in place"
stem = "How do you reverse a string in its own memory, without a second buffer? Where do you start, when do you stop, and why does going past the middle give back the original string?"
explanation = "Take two indices, one on the first character and one on the last, at `length - 1`, and swap the two characters. Then move them one step towards each other and repeat until they meet or cross, which makes `length / 2` swaps; a middle character in an odd-length string stays where it is. Going past the middle would swap every pair a second time and restore the original. The `'\\0'` never moves, and no other memory is needed."

[questions.translations.fr]
title = "Inverser une chaîne sur place"
stem = "Comment inverser une chaîne dans sa propre mémoire, sans second tampon ? Où commencer, quand s'arrêter, et pourquoi dépasser le milieu redonne-t-il la chaîne d'origine ?"
explanation = "On prend deux indices, l'un sur le premier caractère et l'autre sur le dernier, en `longueur - 1`, et on échange les deux caractères. On les rapproche ensuite d'un pas et on recommence jusqu'à ce qu'ils se rejoignent ou se croisent, ce qui fait `longueur / 2` échanges ; le caractère du milieu d'une chaîne de longueur impaire reste en place. Dépasser le milieu échangerait chaque paire une seconde fois et rétablirait l'original. Le `'\\0'` ne bouge jamais, et aucune autre mémoire n'est nécessaire."

[questions.translations.es]
title = "Invertir una cadena en el sitio"
stem = "¿Cómo inviertes una cadena en su propia memoria, sin un segundo búfer? ¿Dónde empiezas, cuándo te detienes y por qué pasar del centro devuelve la cadena original?"
explanation = "Se toman dos índices, uno en el primer carácter y otro en el último, en `longitud - 1`, y se intercambian los dos caracteres. Después se acercan un paso y se repite hasta que se encuentran o se cruzan, lo que hace `longitud / 2` intercambios; el carácter central de una cadena de longitud impar se queda donde está. Pasar del centro volvería a intercambiar cada par y restauraría el original. El `'\\0'` nunca se mueve y no hace falta ninguna otra memoria."

