explanation = "Se recorren las posiciones de 7 a 0, para que el bit más significativo salga primero. El bit de la posición `i` es `(octet >> i) & 1`: el desplazamiento lo lleva al extremo derecho y la máscara `& 1` conserva solo ese bit. Después se convierte en carácter con `'0' + bit`. Para el byte 5, el resultado es `00000101`: se muestran las ocho posiciones, ceros iniciales incluidos."

