[questions.translations.en]
title = "A presence table indexed by character"
stem = "A program must print the characters of one or two strings, each character only once, in the order they first appear. How can an array indexed by character do that in linear time? Why must the index be converted to `unsigned char`?"
explanation = "Keep an array of 256 flags, one per possible byte value, all set to zero at the start. For each character, look at its flag: if it is clear, print the character and set the flag; if it is set, the character has already been printed and is skipped. Each character costs one read and one write, so the whole pass is linear, instead of searching what has already been printed at every step. The index must be `(unsigned char)c`: where `char` is signed, a byte such as 0xE9 is -23, and would index before the start of the array."

