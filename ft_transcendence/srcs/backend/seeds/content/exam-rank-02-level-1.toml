[questions.translations.en]
title = "Integer division and remainder"
stem = "A small calculator reads two `int` values and an operator among `+ - * / %`. What do `-7 / 2`, `-7 % 2` and `7 % -2` give in C, and why? Which operations must be checked before being computed?"
explanation = "Integer division truncates toward zero, so `-7 / 2` is -3. The remainder is defined so that `(a / b) * b + a % b == a`, which gives it the sign of the dividend: `-7 % 2` is -1 and `7 % -2` is 1. Dividing by zero, with `/` as well as `%`, is undefined behaviour and in practice kills the program with `SIGFPE`, so the divisor is checked first. One more case overflows: `INT_MIN / -1` would be 2147483648, which does not fit in an `int`, and it usually raises `SIGFPE` too."

[questions.translations.fr]
title = "Division entière et reste"
stem = "Une petite calculatrice lit deux `int` et un opérateur parmi `+ - * / %`. Que donnent `-7 / 2`, `-7 % 2` et `7 % -2` en C, et pourquoi ? Quelles opérations faut-il vérifier avant de les calculer ?"
explanation = "La division entière tronque vers zéro : `-7 / 2` vaut -3. Le reste est défini pour que `(a / b) * b + a % b == a`, ce qui lui donne le signe du dividende : `-7 % 2` vaut -1 et `7 % -2` vaut 1. Diviser par zéro, avec `/` comme avec `%`, est un comportement indéfini qui, en pratique, tue le programme par `SIGFPE` : on vérifie donc le diviseur d'abord. Un autre cas déborde : `INT_MIN / -1` vaudrait 2147483648, qui ne tient pas dans un `int`, et déclenche lui aussi, en général, `SIGFPE`."

[questions.translations.es]
title = "División entera y resto"
stem = "Una pequeña calculadora lee dos `int` y un operador entre `+ - * / %`. ¿Qué dan `-7 / 2`, `-7 % 2` y `7 % -2` en C, y por qué? ¿Qué operaciones hay que comprobar antes de calcularlas?"
explanation = "La división entera trunca hacia cero: `-7 / 2` vale -3. El resto se define para que `(a / b) * b + a % b == a`, lo que le da el signo del dividendo: `-7 % 2` vale -1 y `7 % -2` vale 1. Dividir entre cero, tanto con `/` como con `%`, es comportamiento indefinido y en la práctica mata el programa con `SIGFPE`, así que primero se comprueba el divisor. Otro caso desborda: `INT_MIN / -1` valdría 2147483648, que no cabe en un `int`, y normalmente también provoca `SIGFPE`."

