[questions.translations.en]
title = "Moving bits inside a byte"
stem = "For an `unsigned char b`, how do you exchange its two halves of four bits? Why can `b << 4 | b >> 4` give a value larger than a byte? And how do you reverse the order of its eight bits?"
explanation = "Exchanging the halves is `(b << 4) | (b >> 4)`: the low half moves up four places and the high half moves down four. But C promotes `b` to `int` before shifting, so the bits pushed out of the byte are not lost: with `b = 0x41`, the expression is `0x414`, not `0x14`. The result must be brought back to eight bits, with a cast to `unsigned char` or a mask `& 0xFF`. To reverse the eight bits, loop eight times: shift the result left by one, add the lowest bit of the input with `b & 1`, then shift the input right; `0x26` becomes `0x64`."

[questions.translations.fr]
title = "Déplacer les bits d'un octet"
stem = "Pour un `unsigned char b`, comment échanger ses deux moitiés de quatre bits ? Pourquoi `b << 4 | b >> 4` peut-il donner une valeur plus grande qu'un octet ? Et comment inverser l'ordre de ses huit bits ?"
explanation = "Échanger les moitiés s'écrit `(b << 4) | (b >> 4)` : la moitié basse monte de quatre rangs et la moitié haute descend de quatre. Mais le C promeut `b` en `int` avant le décalage, donc les bits qui sortent de l'octet ne sont pas perdus : avec `b = 0x41`, l'expression vaut `0x414`, et non `0x14`. Il faut ramener le résultat sur huit bits, par une conversion en `unsigned char` ou un masque `& 0xFF`. Pour inverser les huit bits, on boucle huit fois : on décale le résultat d'un rang vers la gauche, on y ajoute le bit le plus bas de l'entrée avec `b & 1`, puis on décale l'entrée vers la droite ; `0x26` devient `0x64`."

[questions.translations.es]
title = "Mover los bits de un byte"
stem = "Para un `unsigned char b`, ¿cómo intercambias sus dos mitades de cuatro bits? ¿Por qué `b << 4 | b >> 4` puede dar un valor mayor que un byte? ¿Y cómo inviertes el orden de sus ocho bits?"
explanation = "Intercambiar las mitades se escribe `(b << 4) | (b >> 4)`: la mitad baja sube cuatro posiciones y la alta baja cuatro. Pero C promueve `b` a `int` antes del desplazamiento, así que los bits que salen del byte no se pierden: con `b = 0x41`, la expresión vale `0x414`, no `0x14`. Hay que volver a ocho bits con una conversión a `unsigned char` o una máscara `& 0xFF`. Para invertir los ocho bits se repite ocho veces: se desplaza el resultado una posición a la izquierda, se le añade el bit más bajo de la entrada con `b & 1` y se desplaza la entrada a la derecha; `0x26` se convierte en `0x64`."

