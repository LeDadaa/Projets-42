[questions.translations.en]
title = "Printing the bits of a byte"
stem = "How do you print the eight bits of an `unsigned char` as `0` and `1` characters, most significant bit first? How do you isolate one bit, and what does the byte 5 print?"
explanation = "Walk the positions from 7 down to 0, so that the most significant bit comes out first. The bit at position `i` is `(octet >> i) & 1`: the shift brings it to the rightmost place, and the mask `& 1` keeps only that bit. It then becomes a character with `'0' + bit`. For the byte 5, the result is `00000101`: all eight positions are printed, leading zeros included."

[questions.translations.fr]
title = "Afficher les bits d'un octet"
stem = "Comment afficher les huit bits d'un `unsigned char` sous forme de caractères `0` et `1`, bit de poids fort en premier ? Comment isoler un bit, et qu'affiche l'octet 5 ?"
explanation = "On parcourt les positions de 7 à 0, pour que le bit de poids fort sorte en premier. Le bit en position `i` vaut `(octet >> i) & 1` : le décalage l'amène tout à droite, et le masque `& 1` ne garde que ce bit. Il devient ensuite un caractère avec `'0' + bit`. Pour l'octet 5, le résultat est `00000101` : les huit positions sont affichées, zéros de tête compris."

[questions.translations.es]
title = "Mostrar los bits de un byte"
