explanation = "On garde un tableau de 256 indicateurs, un par valeur d'octet possible, tous à zéro au départ. Pour chaque caractère, on regarde son indicateur : s'il est à zéro, on affiche le caractère et on le met à un ; s'il est déjà à un, le caractère a déjà été affiché et on le saute. Chaque caractère coûte une lecture et une écriture, donc tout le parcours est linéaire, au lieu de rechercher à chaque pas dans ce qui a déjà été affiché. L'indice doit être `(unsigned char)c` : là où `char` est signé, un octet comme 0xE9 vaut -23, et indexerait avant le début du tableau."

