key_points = [
  "Measure the source, then allocate length + 1 bytes with malloc, the extra byte being for the terminator.",
  "If malloc returns NULL, the function returns NULL without copying.",
  "Copy every character and then the '\\0'.",
  "The copy lives on the heap: the caller owns it and must free it.",
]

[questions.translations.en]
title = "Duplicating a string"
stem = "A function returns a new copy of a string, allocated with `malloc`, like `strdup`. What size must it allocate, what must it check, what exactly must it copy, and who frees the copy?"
explanation = "The function measures the source and allocates `length + 1` bytes: the extra byte holds the terminator. If `malloc` returns `NULL`, it returns `NULL` straight away, without writing anything. It then copies every character followed by the `'\\0'`, and returns the new address. The copy lives on the heap and outlives the function: from then on it belongs to the caller, who must release it with `free` once done, otherwise it leaks."

[questions.translations.fr]
title = "Dupliquer une chaîne"
stem = "Une fonction renvoie une nouvelle copie d'une chaîne, allouée avec `malloc`, comme `strdup`. Quelle taille doit-elle allouer, que doit-elle vérifier, que doit-elle copier exactement, et qui libère la copie ?"
explanation = "La fonction mesure la source et alloue `longueur + 1` octets : l'octet en plus accueille le terminateur. Si `malloc` renvoie `NULL`, elle renvoie `NULL` aussitôt, sans rien écrire. Elle copie ensuite tous les caractères suivis du `'\\0'`, et renvoie la nouvelle adresse. La copie vit sur le tas et survit à la fonction : elle appartient désormais à l'appelant, qui doit la rendre avec `free` une fois qu'il n'en a plus besoin, sans quoi elle fuit."

[questions.translations.es]
title = "Duplicar una cadena"
stem = "Una función devuelve una copia nueva de una cadena, reservada con `malloc`, como `strdup`. ¿Qué tamaño debe reservar, qué debe comprobar, qué debe copiar exactamente y quién libera la copia?"
explanation = "La función mide el origen y reserva `longitud + 1` bytes: el byte de más aloja el terminador. Si `malloc` devuelve `NULL`, devuelve `NULL` en el acto, sin escribir nada. Después copia todos los caracteres seguidos del `'\\0'` y devuelve la nueva dirección. La copia vive en el montón y sobrevive a la función: a partir de ahí pertenece a quien llama, que debe liberarla con `free` cuando ya no la necesite, o se perderá esa memoria."

[[questions.choices]]
correct = true
text = { en = "`length + 1` bytes, `NULL` returned if the allocation fails, the terminator copied too, and the caller frees the copy", fr = "`longueur + 1` octets, `NULL` renvoyé si l'allocation échoue, le terminateur copié aussi, et l'appelant libère la copie", es = "`longitud + 1` bytes, `NULL` si la reserva falla, el terminador copiado también, y quien llama libera la copia" }

[[questions.choices]]
text = { en = "`length` bytes are enough: the terminator is added by the allocation", fr = "`longueur` octets suffisent : le terminateur est ajouté par l'allocation", es = "`longitud` bytes bastan: el terminador lo añade la reserva" }

[[questions.choices]]
