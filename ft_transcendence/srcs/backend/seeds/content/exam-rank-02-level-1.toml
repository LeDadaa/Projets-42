[questions.translations.en]
title = "Recognising a power of two"
stem = "Without a loop, how can you tell whether an unsigned integer `n` is a power of two? Explain why the expression works, and which value needs special care."
explanation = "In binary, a power of two has exactly one bit set: 8 is `1000`. Subtracting 1 clears that bit and sets every bit below it: 7 is `0111`. For a power of two, `n & (n - 1)` is therefore 0; for any other number, the highest set bit survives the subtraction and the result is not 0. The exception is 0, which has no bit set and still gives 0, so the complete test is `n != 0 && (n & (n - 1)) == 0`."

[questions.translations.fr]
title = "Reconnaître une puissance de deux"
stem = "Sans boucle, comment savoir si un entier non signé `n` est une puissance de deux ? Expliquez pourquoi l'expression fonctionne, et quelle valeur demande une attention particulière."
explanation = "En binaire, une puissance de deux a exactement un bit à un : 8 s'écrit `1000`. Retrancher 1 éteint ce bit et allume tous ceux qui sont en dessous : 7 s'écrit `0111`. Pour une puissance de deux, `n & (n - 1)` vaut donc 0 ; pour tout autre nombre, le bit à un le plus haut survit à la soustraction et le résultat n'est pas nul. L'exception est 0, qui n'a aucun bit à un et donne pourtant 0 : le test complet est `n != 0 && (n & (n - 1)) == 0`."

[questions.translations.es]
title = "Reconocer una potencia de dos"
stem = "Sin bucles, ¿cómo sabes si un entero sin signo `n` es una potencia de dos? Explica por qué funciona la expresión y qué valor requiere un cuidado especial."
explanation = "En binario, una potencia de dos tiene exactamente un bit a uno: 8 es `1000`. Restar 1 apaga ese bit y enciende todos los que están por debajo: 7 es `0111`. Para una potencia de dos, `n & (n - 1)` vale por tanto 0; para cualquier otro número, el bit a uno más alto sobrevive a la resta y el resultado no es 0. La excepción es 0, que no tiene ningún bit a uno y aun así da 0, así que la comprobación completa es `n != 0 && (n & (n - 1)) == 0`."

