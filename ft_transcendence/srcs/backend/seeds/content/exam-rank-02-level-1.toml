[questions.translations.en]
title = "The largest value of an array"
stem = "A function returns the largest value of an array of `int` given with its length. What should the running result start at, why is 0 a bad choice, and what must happen when the length is 0?"
explanation = "The running result starts at the first element, then each following element replaces it when it is larger. Starting at 0 looks harmless but is wrong as soon as every value is negative: for `{-5, -2, -9}` it returns 0, a value that is not even in the array, instead of -2. An empty array has no largest value, and reading its first element would read memory that does not belong to it: the length must be checked first, and the function returns whatever its contract specifies for that case."

[questions.translations.fr]
title = "La plus grande valeur d'un tableau"
stem = "Une fonction renvoie la plus grande valeur d'un tableau d'`int` donné avec sa longueur. Par quoi faut-il initialiser le résultat en cours, pourquoi 0 est-il un mauvais choix, et que doit-il se passer quand la longueur vaut 0 ?"
explanation = "Le résultat en cours part du premier élément, puis chaque élément suivant le remplace s'il est plus grand. Partir de 0 semble anodin mais devient faux dès que toutes les valeurs sont négatives : pour `{-5, -2, -9}`, on renvoie 0, une valeur qui n'est même pas dans le tableau, au lieu de -2. Un tableau vide n'a pas de plus grande valeur, et lire son premier élément lirait une mémoire qui ne lui appartient pas : il faut d'abord vérifier la longueur, et la fonction renvoie ce que son contrat prévoit pour ce cas."

