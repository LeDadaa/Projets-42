  "strspn(s, accept) returns the length of the initial part of s made only of characters from accept.",
  "strcspn(s, reject) returns the length of the initial part of s containing no character from reject, which is the index of the first such character or the length of s.",
  "Checking each character of s against every character of the set costs O(n·m).",
  "A table of 256 flags indexed by unsigned char, filled once from the set, answers each membership test in constant time: O(n + m).",
]

[questions.translations.en]
title = "Measuring a prefix with strspn and strcspn"
stem = "What do `strspn(s, accept)` and `strcspn(s, reject)` return? What are `strcspn(\"hello\", \"lo\")` and `strspn(\"aab c\", \"ab\")`? A simple version compares every character of `s` with every character of the set: what does it cost, and how do you do better?"
explanation = "`strspn` returns the length of the initial part of `s` made only of characters from `accept`: `strspn(\"aab c\", \"ab\")` is 3. `strcspn` does the opposite: the length of the initial part that contains no character from `reject`, that is the index of the first such character, or the length of `s` if there is none; `strcspn(\"hello\", \"lo\")` is 2. Comparing each character of `s` with the whole set costs `O(n·m)`. A table of 256 flags indexed by `unsigned char`, filled once from the set, turns every test into a single read: `O(n + m)`."

[questions.translations.fr]
title = "Mesurer un début de chaîne avec strspn et strcspn"
stem = "Que renvoient `strspn(s, accept)` et `strcspn(s, reject)` ? Que valent `strcspn(\"hello\", \"lo\")` et `strspn(\"aab c\", \"ab\")` ? Une version simple compare chaque caractère de `s` à chaque caractère de l'ensemble : que coûte-t-elle, et comment faire mieux ?"
explanation = "`strspn` renvoie la longueur du début de `s` formé uniquement de caractères de `accept` : `strspn(\"aab c\", \"ab\")` vaut 3. `strcspn` fait l'inverse : la longueur du début qui ne contient aucun caractère de `reject`, c'est-à-dire l'indice du premier tel caractère, ou la longueur de `s` s'il n'y en a pas ; `strcspn(\"hello\", \"lo\")` vaut 2. Comparer chaque caractère de `s` à tout l'ensemble coûte `O(n·m)`. Un tableau de 256 indicateurs indexé par `unsigned char`, rempli une fois à partir de l'ensemble, transforme chaque test en une seule lecture : `O(n + m)`."

[questions.translations.es]
title = "Medir el principio de una cadena con strspn y strcspn"
stem = "¿Qué devuelven `strspn(s, accept)` y `strcspn(s, reject)`? ¿Cuánto valen `strcspn(\"hello\", \"lo\")` y `strspn(\"aab c\", \"ab\")`? Una versión sencilla compara cada carácter de `s` con cada carácter del conjunto: ¿cuánto cuesta y cómo se puede mejorar?"
explanation = "`strspn` devuelve la longitud del principio de `s` formado solo por caracteres de `accept`: `strspn(\"aab c\", \"ab\")` vale 3. `strcspn` hace lo contrario: la longitud del principio que no contiene ningún carácter de `reject`, es decir, el índice del primero de ellos, o la longitud de `s` si no hay ninguno; `strcspn(\"hello\", \"lo\")` vale 2. Comparar cada carácter de `s` con todo el conjunto cuesta `O(n·m)`. Una tabla de 256 indicadores indexada por `unsigned char`, rellenada una vez a partir del conjunto, convierte cada comprobación en una sola lectura: `O(n + m)`."

[[questions.choices]]
correct = true
text = { en = "`2` and `3`, and a table of 256 flags filled once from the set brings the cost down to O(n + m)", fr = "`2` et `3`, et une table de 256 drapeaux remplie une fois depuis l'ensemble ramène le coût à O(n + m)", es = "`2` y `3`, y una tabla de 256 marcas rellenada una vez desde el conjunto baja el coste a O(n + m)" }

[[questions.choices]]
text = { en = "`3` and `2`: the first counts the characters of the set, the second those outside it", fr = "`3` et `2` : la première compte les caractères de l'ensemble, la seconde ceux qui n'y sont pas", es = "`3` y `2`: la primera cuenta los caracteres del conjunto, la segunda los que no están" }

[[questions.choices]]
text = { en = "`2` and `3`, but nothing can beat comparing every character with every character: O(n·m)", fr = "`2` et `3`, mais rien ne fait mieux que comparer chaque caractère à chaque caractère : O(n·m)", es = "`2` y `3`, pero nada supera comparar cada carácter con cada carácter: O(n·m)" }

[[questions.choices]]
text = { en = "`2` and `5`: the characters outside the set are skipped and counting goes on", fr = "`2` et `5` : les caractères hors de l'ensemble sont sautés et le comptage continue", es = "`2` y `5`: los caracteres fuera del conjunto se saltan y el conteo sigue" }

