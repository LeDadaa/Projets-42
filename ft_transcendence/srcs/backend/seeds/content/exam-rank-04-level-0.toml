  "Each process closes the end it does not use.",
]

[questions.translations.en]
title = "The two ends of a pipe"
stem = "What does `pipe(fd)` create, which of `fd[0]` and `fd[1]` is used for what, and how do two processes end up sharing the same pipe?"
explanation = "`pipe(fd)` creates a one-way channel managed by the kernel: `fd[0]` is the read end and `fd[1]` the write end, which is easy to remember since 0 is also standard input and 1 standard output. Bytes written into `fd[1]` come out of `fd[0]`, in the same order. The two descriptors are inherited across `fork`, which is how a parent and its child share the pipe: one writes, the other reads, and each closes the end it does not use."

[questions.translations.fr]
title = "Les deux extrémités d'un tube"
stem = "Que crée `pipe(fd)`, à quoi servent respectivement `fd[0]` et `fd[1]`, et comment deux processus finissent-ils par partager le même tube ?"
explanation = "`pipe(fd)` crée un canal à sens unique géré par le noyau : `fd[0]` est l'extrémité de lecture et `fd[1]` celle d'écriture, ce qui se retient facilement puisque 0 est aussi l'entrée standard et 1 la sortie standard. Les octets écrits dans `fd[1]` ressortent par `fd[0]`, dans le même ordre. Les deux descripteurs sont hérités à travers `fork` : c'est ainsi qu'un père et son fils partagent le tube, l'un écrit, l'autre lit, et chacun ferme l'extrémité qu'il n'utilise pas."

[questions.translations.es]
title = "Los dos extremos de una tubería"
stem = "¿Qué crea `pipe(fd)`, para qué sirve cada uno de `fd[0]` y `fd[1]`, y cómo acaban dos procesos compartiendo la misma tubería?"
explanation = "`pipe(fd)` crea un canal de un solo sentido gestionado por el núcleo: `fd[0]` es el extremo de lectura y `fd[1]` el de escritura, fácil de recordar porque 0 es también la entrada estándar y 1 la salida estándar. Los bytes escritos en `fd[1]` salen por `fd[0]` en el mismo orden. Los dos descriptores se heredan con `fork`: así es como un padre y su hijo comparten la tubería, uno escribe, el otro lee, y cada uno cierra el extremo que no usa."

[[questions.choices]]
correct = true
text = { en = "A one-way channel: `fd[0]` is read, `fd[1]` is written; `fork` passes the descriptors on, and each process closes the end it does not use", fr = "Un canal à sens unique : `fd[0]` se lit, `fd[1]` s'écrit ; `fork` transmet les descripteurs, et chaque processus ferme le bout qu'il n'utilise pas", es = "Un canal de un solo sentido: `fd[0]` se lee, `fd[1]` se escribe; `fork` transmite los descriptores y cada proceso cierra el extremo que no usa" }

[[questions.choices]]
text = { en = "`fd[0]` is the write end and `fd[1]` the read end, in the order of the arguments of `write`", fr = "`fd[0]` est le bout d'écriture et `fd[1]` celui de lecture, dans l'ordre des arguments de `write`", es = "`fd[0]` es el extremo de escritura y `fd[1]` el de lectura, en el orden de los argumentos de `write`" }

[[questions.choices]]
text = { en = "A pipe works both ways: each side may read and write through either descriptor", fr = "Un tube fonctionne dans les deux sens : chaque côté peut lire et écrire par l'un ou l'autre descripteur", es = "Una tubería funciona en los dos sentidos: cada lado puede leer y escribir por cualquiera de los descriptores" }

[[questions.choices]]
text = { en = "Two unrelated processes can share a pipe, since its descriptors are global to the system", fr = "Deux processus sans lien peuvent partager un tube, puisque ses descripteurs sont globaux au système", es = "Dos procesos sin relación pueden compartir una tubería, ya que sus descriptores son globales al sistema" }

[[questions]]
slug = "rank04-l0-redirecting-with-dup2"
topic = "exam-rank-04-level-0"
