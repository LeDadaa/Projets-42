[questions.translations.en]
title = "Writing into a pipe nobody reads"
stem = "What happens to a process that writes into a pipe whose read end has been closed by every process? What changes if that process ignores `SIGPIPE`, and why is this behaviour useful in a chain of commands?"
explanation = "When no process holds the read end any more, a `write` into the pipe makes the kernel send `SIGPIPE` to the writer, and the default action of that signal kills it: its status then says `Broken pipe`. If the process ignores or handles `SIGPIPE`, the write fails instead, returning -1 with `errno` set to `EPIPE`. This is what stops a producer as soon as its consumer is gone: when the next command of a chain stops reading early, the one before it is stopped at its next write instead of producing output for nobody."

[questions.translations.fr]
title = "Écrire dans un tube que personne ne lit"
stem = "Que devient un processus qui écrit dans un tube dont l'extrémité de lecture a été fermée par tous les processus ? Qu'est-ce qui change si ce processus ignore `SIGPIPE`, et pourquoi ce comportement est-il utile dans une chaîne de commandes ?"
explanation = "Quand plus aucun processus ne tient l'extrémité de lecture, un `write` dans le tube fait envoyer par le noyau le signal `SIGPIPE` à l'écrivain, et l'action par défaut de ce signal le tue : son statut indique alors `Broken pipe`. Si le processus ignore ou intercepte `SIGPIPE`, l'écriture échoue à la place, en renvoyant -1 avec `errno` à `EPIPE`. C'est ce qui arrête un producteur dès que son consommateur a disparu : quand la commande suivante d'une chaîne cesse de lire avant la fin, celle qui la précède est arrêtée à sa prochaine écriture au lieu de produire pour personne."

[questions.translations.es]
title = "Escribir en una tubería que nadie lee"
stem = "¿Qué le pasa a un proceso que escribe en una tubería cuyo extremo de lectura han cerrado todos los procesos? ¿Qué cambia si ese proceso ignora `SIGPIPE`, y por qué es útil este comportamiento en una cadena de comandos?"
explanation = "Cuando ningún proceso conserva ya el extremo de lectura, un `write` en la tubería hace que el núcleo envíe `SIGPIPE` al escritor, y la acción por defecto de esa señal lo mata: su estado indica entonces `Broken pipe`. Si el proceso ignora o captura `SIGPIPE`, la escritura falla en su lugar, devolviendo -1 con `errno` a `EPIPE`. Esto es lo que detiene a un productor en cuanto desaparece su consumidor: cuando el comando siguiente de una cadena deja de leer antes de tiempo, el anterior se detiene en su próxima escritura en lugar de producir para nadie."

[[questions.choices]]
