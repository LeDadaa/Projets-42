stem = "Un padre ejecuta una función en un proceso hijo y debe rendirse si el hijo tarda más de unos segundos. ¿Cómo pueden `alarm` y un manejador de señal interrumpir la espera del padre? ¿Qué debe hacer el padre cuando se acaba el tiempo?"
explanation = "`alarm(n)` pide al núcleo que envíe `SIGALRM` al proceso que llama al cabo de `n` segundos. Su acción por defecto terminaría el propio padre, así que el padre instala antes un manejador con `sigaction`, sin la opción `SA_RESTART`; el manejador puede incluso estar vacío. Cuando llega la señal, interrumpe el `waitpid` bloqueado, que devuelve -1 con `errno` a `EINTR`: el tiempo del hijo se ha agotado. El padre lo mata entonces, por ejemplo con `kill(pid, SIGKILL)`, y vuelve a llamar a `waitpid` para recogerlo; si no, quedaría como zombi."

