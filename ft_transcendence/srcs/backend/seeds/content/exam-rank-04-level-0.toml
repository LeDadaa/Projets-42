[questions.translations.en]
title = "Decoding how a child ended"
stem = "After `waitpid(pid, &status, 0)`, how do you tell whether the child ended normally or was killed by a signal, and get the exit code or the signal? What exit code does the parent see after `exit(256)` or `exit(-1)`?"
explanation = "`status` packs several pieces of information, read with macros. `WIFEXITED(status)` is true when the child called `exit` or returned from `main`, and `WEXITSTATUS(status)` then gives its code. `WIFSIGNALED(status)` is true when a signal killed it, `WTERMSIG(status)` gives which one, and `strsignal` turns it into a description: `Segmentation fault` for `SIGSEGV`, `Aborted` for `abort`. Only the low 8 bits of the exit code survive: `exit(256)` is seen as 0, a success, and `exit(-1)` as 255."

[questions.translations.fr]
title = "Décoder la façon dont un fils s'est terminé"
stem = "Après `waitpid(pid, &status, 0)`, comment savoir si le fils s'est terminé normalement ou a été tué par un signal, et obtenir le code de sortie ou le signal ? Quel code de sortie le père voit-il après `exit(256)` ou `exit(-1)` ?"
explanation = "`status` regroupe plusieurs informations, qu'on lit avec des macros. `WIFEXITED(status)` est vrai quand le fils a appelé `exit` ou est sorti de `main`, et `WEXITSTATUS(status)` donne alors son code. `WIFSIGNALED(status)` est vrai quand un signal l'a tué, `WTERMSIG(status)` dit lequel, et `strsignal` en donne une description : `Segmentation fault` pour `SIGSEGV`, `Aborted` pour `abort`. Seuls les 8 bits de poids faible du code de sortie survivent : `exit(256)` est vu comme 0, un succès, et `exit(-1)` comme 255."

[questions.translations.es]
