[questions.translations.en]
title = "Zombies and waiting for children"
stem = "What is a zombie process, how does one appear, and how does a program avoid leaving any behind? What is the difference between `wait` and `waitpid`?"
explanation = "When a child ends, the system cannot forget it at once: its entry stays in the process table, holding its exit status, until the parent collects it. In that state the child is a zombie, shown with the state `Z`. The parent collects it with `wait`, which blocks until any child ends, or with `waitpid`, which waits for a given child and can also be made non-blocking. After that call, the entry disappears. A program must therefore wait for every child it creates, otherwise zombies pile up for as long as it runs; the status these calls fill in then tells how each child ended."

[questions.translations.fr]
title = "Les zombies et l'attente des fils"
stem = "Qu'est-ce qu'un processus zombie, comment apparaît-il, et comment un programme évite-t-il d'en laisser derrière lui ? Quelle différence y a-t-il entre `wait` et `waitpid` ?"
explanation = "Quand un fils se termine, le système ne peut pas l'oublier aussitôt : son entrée reste dans la table des processus, avec son code de fin, jusqu'à ce que le père la récupère. Dans cet état, le fils est un zombie, affiché avec l'état `Z`. Le père le récupère avec `wait`, qui bloque jusqu'à la fin d'un fils quelconque, ou avec `waitpid`, qui attend un fils donné et peut aussi ne pas bloquer. Après cet appel, l'entrée disparaît. Un programme doit donc attendre chaque fils qu'il crée, sans quoi les zombies s'accumulent tant qu'il tourne ; le statut que remplissent ces appels dit ensuite comment chaque fils s'est terminé."

[questions.translations.es]
title = "Los zombis y la espera de los hijos"
stem = "¿Qué es un proceso zombi, cómo aparece y cómo evita un programa dejar alguno tras de sí? ¿Qué diferencia hay entre `wait` y `waitpid`?"
explanation = "Cuando un hijo termina, el sistema no puede olvidarlo en el acto: su entrada sigue en la tabla de procesos, con su código de salida, hasta que el padre la recoge. En ese estado el hijo es un zombi, que aparece con el estado `Z`. El padre lo recoge con `wait`, que se bloquea hasta que termina un hijo cualquiera, o con `waitpid`, que espera a un hijo concreto y también puede no bloquear. Tras esa llamada, la entrada desaparece. Un programa debe, por tanto, esperar a cada hijo que crea, o los zombis se acumulan mientras siga en marcha; el estado que rellenan esas llamadas indica después cómo terminó cada hijo."

[[questions.choices]]
correct = true
text = { en = "A child that has ended but whose status no one has collected; `wait` waits for any child, `waitpid` for a given one and can be non-blocking", fr = "Un enfant terminé dont personne n'a récupéré le statut ; `wait` attend n'importe quel enfant, `waitpid` un enfant précis et peut être non bloquant", es = "Un hijo terminado cuyo estado nadie ha recogido; `wait` espera a cualquier hijo, `waitpid` a uno concreto y puede ser no bloqueante" }

[[questions.choices]]
