[questions.translations.en]
title = "Chaining commands with pipes"
stem = "A function must run several commands connected like `cmd1 | cmd2 | cmd3` in a shell. How many pipes are needed, what does each child redirect, which descriptors must the parent close and when, and what must it do at the end?"
explanation = "Between each pair of consecutive commands there is one pipe, so `n` commands need `n - 1` pipes. Each child redirects its standard input from the read end of the previous pipe, except the first command, and its standard output to the write end of the next pipe, except the last, with `dup2`, then closes its pipe descriptors and calls `execvp`. The parent closes each pipe end as soon as the children that use it are started: an end left open in the parent keeps the next command from ever seeing end of file, and leaks descriptors. Once every command is started, the parent waits for all the children; on an error, it closes every descriptor it opened before returning."

[questions.translations.fr]
title = "Enchaîner des commandes avec des tubes"
stem = "Une fonction doit exécuter plusieurs commandes reliées comme `cmd1 | cmd2 | cmd3` dans un shell. Combien de tubes faut-il, que redirige chaque fils, quels descripteurs le père doit-il fermer et quand, et que doit-il faire à la fin ?"
explanation = "Entre chaque paire de commandes consécutives, il y a un tube : `n` commandes demandent donc `n - 1` tubes. Chaque fils redirige son entrée standard depuis l'extrémité de lecture du tube précédent, sauf la première commande, et sa sortie standard vers l'extrémité d'écriture du tube suivant, sauf la dernière, avec `dup2`, puis ferme ses descripteurs de tube et appelle `execvp`. Le père ferme chaque extrémité de tube dès que les fils qui l'utilisent sont lancés : une extrémité laissée ouverte chez le père empêche la commande suivante de voir un jour la fin de fichier, et fait fuir des descripteurs. Une fois toutes les commandes lancées, le père attend tous les fils ; en cas d'erreur, il ferme chaque descripteur qu'il a ouvert avant de rendre la main."

[questions.translations.es]
title = "Encadenar comandos con tuberías"
stem = "Una función debe ejecutar varios comandos conectados como `cmd1 | cmd2 | cmd3` en una shell. ¿Cuántas tuberías hacen falta, qué redirige cada hijo, qué descriptores debe cerrar el padre y cuándo, y qué debe hacer al final?"
explanation = "Entre cada par de comandos consecutivos hay una tubería, así que `n` comandos necesitan `n - 1` tuberías. Cada hijo redirige su entrada estándar desde el extremo de lectura de la tubería anterior, salvo el primer comando, y su salida estándar hacia el extremo de escritura de la tubería siguiente, salvo el último, con `dup2`, y después cierra sus descriptores de tubería y llama a `execvp`. El padre cierra cada extremo de tubería en cuanto se han lanzado los hijos que lo usan: un extremo que queda abierto en el padre impide que el comando siguiente vea algún día el final del fichero, y pierde descriptores. Una vez lanzados todos los comandos, el padre espera a todos los hijos; si hay un error, cierra cada descriptor que abrió antes de devolver el control."

