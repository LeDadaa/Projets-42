[[questions]]
slug = "rank04-l0-output-duplicated-by-fork"
topic = "exam-rank-04-level-0"
kind = "free_text"
difficulty = 1400
tags = ["processes", "file-io"]
key_points = [
  "printf writes into a buffer of the process; when stdout is redirected to a file or a pipe the buffer is only flushed when full or at exit.",
  "fork copies the whole memory, including that buffer and the text still waiting in it.",
  "Each process then flushes its own copy, usually when it calls exit, so the pending text appears once per process.",
  "Calling fflush(stdout) before fork, and ending children with _exit (which does not flush stdio buffers), avoids the duplicates.",
]

[questions.translations.en]
title = "Lines printed twice after fork"
stem = "A program prints a line with `printf` and then creates children with `fork`. On the terminal the line appears once, but when the output is redirected to a file or a pipe it appears several times. Why? How do you prevent it?"
explanation = "`printf` does not write straight away: it fills a buffer inside the process. On a terminal that buffer is flushed at each newline, but once the output is redirected to a file or a pipe it is only flushed when full or when the process exits. `fork` copies the whole memory of the process, that buffer and the text still waiting in it included; each child then flushes its copy when it calls `exit`, and the text appears once per process. Calling `fflush(stdout)` before `fork` empties the buffer while only one copy exists, and ending children with `_exit`, which does not flush `stdio` buffers, avoids the problem altogether."

[questions.translations.fr]
title = "Des lignes affichées deux fois après fork"
stem = "Un programme affiche une ligne avec `printf`, puis crée des fils avec `fork`. Dans le terminal la ligne apparaît une fois, mais quand la sortie est redirigée vers un fichier ou un tube, elle apparaît plusieurs fois. Pourquoi ? Comment l'éviter ?"
explanation = "`printf` n'écrit pas tout de suite : il remplit un tampon à l'intérieur du processus. Dans un terminal, ce tampon est vidé à chaque retour à la ligne, mais dès que la sortie est redirigée vers un fichier ou un tube, il ne l'est plus que lorsqu'il est plein ou que le processus se termine. `fork` copie toute la mémoire du processus, ce tampon et le texte qui y attend compris ; chaque fils vide ensuite sa copie en appelant `exit`, et le texte apparaît une fois par processus. Appeler `fflush(stdout)` avant `fork` vide le tampon tant qu'il n'en existe qu'une copie, et terminer les fils avec `_exit`, qui ne vide pas les tampons de `stdio`, évite complètement le problème."

[questions.translations.es]
title = "Líneas mostradas dos veces después de fork"
stem = "Un programa muestra una línea con `printf` y después crea hijos con `fork`. En la terminal la línea aparece una vez, pero cuando la salida se redirige a un fichero o a una tubería aparece varias veces. ¿Por qué? ¿Cómo se evita?"
explanation = "`printf` no escribe en el acto: llena un búfer dentro del proceso. En una terminal, ese búfer se vacía en cada salto de línea, pero en cuanto la salida se redirige a un fichero o a una tubería, solo se vacía cuando está lleno o cuando el proceso termina. `fork` copia toda la memoria del proceso, incluido ese búfer y el texto que espera en él; después, cada hijo vacía su copia al llamar a `exit`, y el texto aparece una vez por proceso. Llamar a `fflush(stdout)` antes de `fork` vacía el búfer mientras solo existe una copia, y terminar los hijos con `_exit`, que no vacía los búferes de `stdio`, evita del todo el problema."

[[questions.choices]]
