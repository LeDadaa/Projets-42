explanation = "`status` agrupa varios datos, que se leen con macros. `WIFEXITED(status)` es verdadero cuando el hijo llamó a `exit` o salió de `main`, y `WEXITSTATUS(status)` da entonces su código. `WIFSIGNALED(status)` es verdadero cuando lo mató una señal, `WTERMSIG(status)` dice cuál, y `strsignal` da una descripción: `Segmentation fault` para `SIGSEGV`, `Aborted` para `abort`. Solo sobreviven los 8 bits bajos del código de salida: `exit(256)` se ve como 0, un éxito, y `exit(-1)` como 255."

