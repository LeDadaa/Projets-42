# they name the topic of a question, never its answer.

[[questions]]
slug = "rank04-l0-fork-return-values"
topic = "exam-rank-04-level-0"
kind = "free_text"
difficulty = 1000
tags = ["processes"]
key_points = [
  "fork creates a copy of the calling process; both processes continue from the instruction after fork.",
  "It returns the child's pid in the parent, 0 in the child, and -1 in the parent if no child could be created.",
  "The two processes have separate memory: a variable changed in one is not changed in the other.",
  "The return value is what lets the code run different branches in the parent and in the child.",
]

[questions.translations.en]
title = "What fork returns"
stem = "After a call to `fork`, how many processes are running the code that follows, and how does each of them know whether it is the parent or the child? What does `fork` return on failure, and do the two processes share their variables?"
explanation = "`fork` duplicates the calling process, and both copies continue from the instruction right after the call. The return value tells them apart: the parent receives the pid of the new child, the child receives 0, and on failure the parent receives -1 and no child exists. That value is what code tests to send each process down its own branch. The child starts with a copy of the parent's memory, not a shared one: a variable changed in one process keeps its old value in the other."

[questions.translations.fr]
title = "Ce que renvoie fork"
stem = "Après un appel à `fork`, combien de processus exécutent le code qui suit, et comment chacun sait-il s'il est le père ou le fils ? Que renvoie `fork` en cas d'échec, et les deux processus partagent-ils leurs variables ?"
explanation = "`fork` duplique le processus appelant, et les deux copies reprennent juste après l'appel. La valeur de retour les distingue : le père reçoit le pid du nouveau fils, le fils reçoit 0, et en cas d'échec le père reçoit -1 et aucun fils n'existe. C'est cette valeur que le code teste pour envoyer chaque processus dans sa propre branche. Le fils démarre avec une copie de la mémoire du père, pas une mémoire partagée : une variable modifiée dans un processus garde son ancienne valeur dans l'autre."

[questions.translations.es]
title = "Lo que devuelve fork"
stem = "Después de una llamada a `fork`, ¿cuántos procesos ejecutan el código que sigue, y cómo sabe cada uno si es el padre o el hijo? ¿Qué devuelve `fork` si falla, y comparten los dos procesos sus variables?"
explanation = "`fork` duplica el proceso que llama, y las dos copias continúan justo después de la llamada. El valor devuelto las distingue: el padre recibe el pid del nuevo hijo, el hijo recibe 0 y, si falla, el padre recibe -1 y no existe ningún hijo. Ese valor es lo que el código comprueba para enviar cada proceso por su propia rama. El hijo empieza con una copia de la memoria del padre, no con una memoria compartida: una variable modificada en un proceso conserva su valor anterior en el otro."

[[questions.choices]]
correct = true
text = { en = "Two processes carry on; `fork` returns the child's pid to the parent, 0 to the child, -1 on failure, and their memory is separate", fr = "Deux processus continuent ; `fork` renvoie le pid de l'enfant au parent, 0 à l'enfant, -1 en cas d'échec, et leurs mémoires sont séparées", es = "Siguen dos procesos; `fork` devuelve el pid del hijo al padre, 0 al hijo, -1 si falla, y sus memorias están separadas" }

[[questions.choices]]
text = { en = "Two processes carry on, and they share their variables: a change in one is seen by the other", fr = "Deux processus continuent, et ils partagent leurs variables : un changement dans l'un est vu par l'autre", es = "Siguen dos procesos y comparten sus variables: un cambio en uno lo ve el otro" }

[[questions.choices]]
text = { en = "`fork` returns 0 to the parent and the child's pid to the child, which is how each one knows itself", fr = "`fork` renvoie 0 au parent et le pid de l'enfant à l'enfant, c'est ainsi que chacun se reconnaît", es = "`fork` devuelve 0 al padre y el pid del hijo al hijo, así es como cada uno se reconoce" }

[[questions.choices]]
text = { en = "Only the child runs what follows; the parent waits at the call until the child has ended", fr = "Seul l'enfant exécute la suite ; le parent attend à l'appel que l'enfant se soit terminé", es = "Solo el hijo ejecuta lo que sigue; el padre espera en la llamada a que el hijo termine" }

[[questions]]
slug = "rank04-l0-replacing-a-process-with-exec"
topic = "exam-rank-04-level-0"
kind = "free_text"
difficulty = 1200
tags = ["processes"]
key_points = [
  "execvp replaces the program of the current process with a new one; on success it never returns.",
  "It searches the command in the directories of PATH, takes a NULL-terminated argv, and argv[0] is by convention the command name.",
  "If execvp returns, it failed (for instance command not found), so the child must end itself with exit or _exit, typically with a non-zero code.",
  "Without that exit, the failed child would go on running the parent's code after the call.",
]

[questions.translations.en]
title = "Replacing a process with execvp"
stem = "What does `execvp(file, argv)` do to the process that calls it, how does it find the program, and what must `argv` look like? What does it mean when `execvp` returns, and what must the child do then?"
explanation = "`execvp` replaces the program running in the current process with a new one: the pid stays, but code and memory are those of the new program, so on success the call never returns. It looks the name up in the directories of `PATH`, and takes an `argv` ending with `NULL`, whose first element is by convention the command name. Code placed after `execvp` therefore only runs if it failed, for instance because the command does not exist. The child must then end itself with `exit` or `_exit` and a non-zero code; otherwise it goes on running the parent's code, and two processes do the parent's work."

[questions.translations.fr]
title = "Remplacer un processus avec execvp"
stem = "Que fait `execvp(file, argv)` au processus qui l'appelle, comment trouve-t-il le programme, et à quoi doit ressembler `argv` ? Que signifie un retour de `execvp`, et que doit alors faire le fils ?"
explanation = "`execvp` remplace le programme exécuté par le processus courant par un nouveau : le pid reste le même, mais le code et la mémoire sont ceux du nouveau programme, donc en cas de succès l'appel ne revient jamais. Il cherche le nom dans les répertoires de `PATH`, et prend un `argv` terminé par `NULL`, dont le premier élément est par convention le nom de la commande. Le code placé après `execvp` ne s'exécute donc que s'il a échoué, par exemple parce que la commande n'existe pas. Le fils doit alors se terminer lui-même avec `exit` ou `_exit` et un code non nul ; sinon il continue d'exécuter le code du père, et deux processus font le travail du père."

[questions.translations.es]
title = "Sustituir un proceso con execvp"
stem = "¿Qué hace `execvp(file, argv)` al proceso que la llama, cómo encuentra el programa y cómo debe ser `argv`? ¿Qué significa que `execvp` devuelva el control, y qué debe hacer entonces el hijo?"
explanation = "`execvp` sustituye el programa que ejecuta el proceso actual por uno nuevo: el pid se mantiene, pero el código y la memoria son los del nuevo programa, así que si tiene éxito la llamada nunca vuelve. Busca el nombre en los directorios de `PATH` y recibe un `argv` terminado en `NULL`, cuyo primer elemento es por convención el nombre del comando. El código escrito después de `execvp` solo se ejecuta, por tanto, si falló, por ejemplo porque el comando no existe. El hijo debe entonces terminar por sí mismo con `exit` o `_exit` y un código distinto de cero; si no, sigue ejecutando el código del padre, y dos procesos hacen el trabajo del padre."

[[questions.choices]]
correct = true
text = { en = "It replaces the program and never returns on success; if it returns it failed, and the child must end itself with `exit`", fr = "Il remplace le programme et ne revient jamais en cas de succès ; s'il revient c'est qu'il a échoué, et l'enfant doit se terminer par `exit`", es = "Sustituye el programa y no vuelve nunca si tiene éxito; si vuelve es que falló, y el hijo debe terminarse con `exit`" }

[[questions.choices]]
text = { en = "It returns 0 on success and -1 on failure, like most system calls", fr = "Il renvoie 0 en cas de succès et -1 en cas d'échec, comme la plupart des appels système", es = "Devuelve 0 si tiene éxito y -1 si falla, como la mayoría de llamadas al sistema" }

[[questions.choices]]
text = { en = "It starts the program in a new process and returns its pid to the caller", fr = "Il lance le programme dans un nouveau processus et renvoie son pid à l'appelant", es = "Lanza el programa en un proceso nuevo y devuelve su pid a quien llama" }

[[questions.choices]]
text = { en = "`argv` is passed without `argv[0]`, since the command name is already given by the first parameter", fr = "`argv` est passé sans `argv[0]`, puisque le nom de la commande est déjà donné par le premier paramètre", es = "`argv` se pasa sin `argv[0]`, ya que el nombre de la orden ya lo da el primer parámetro" }

