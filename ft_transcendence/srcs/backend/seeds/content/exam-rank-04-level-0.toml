[questions.translations.en]
title = "Putting a time limit on a child"
stem = "A parent runs a function in a child process and must give up if the child takes longer than a few seconds. How can `alarm` and a signal handler interrupt the parent's wait? What must the parent do once the time is up?"
explanation = "`alarm(n)` asks the kernel to send `SIGALRM` to the calling process after `n` seconds. Its default action would terminate the parent itself, so the parent first installs a handler with `sigaction`, without the `SA_RESTART` flag; the handler can even be empty. When the signal arrives, it interrupts the blocked `waitpid`, which returns -1 with `errno` set to `EINTR`: the child has run out of time. The parent then kills it, for instance with `kill(pid, SIGKILL)`, and calls `waitpid` again to collect it, otherwise it stays a zombie."

[questions.translations.fr]
title = "Imposer une limite de temps à un fils"
stem = "Un père exécute une fonction dans un processus fils et doit abandonner si le fils prend plus de quelques secondes. Comment `alarm` et un gestionnaire de signal peuvent-ils interrompre l'attente du père ? Que doit faire le père une fois le temps écoulé ?"
explanation = "`alarm(n)` demande au noyau d'envoyer `SIGALRM` au processus appelant au bout de `n` secondes. Son action par défaut terminerait le père lui-même : le père installe donc d'abord un gestionnaire avec `sigaction`, sans l'option `SA_RESTART` ; le gestionnaire peut même être vide. Quand le signal arrive, il interrompt le `waitpid` bloqué, qui renvoie -1 avec `errno` à `EINTR` : le temps du fils est écoulé. Le père le tue alors, par exemple avec `kill(pid, SIGKILL)`, puis rappelle `waitpid` pour le récupérer, sans quoi il resterait un zombie."

[questions.translations.es]
