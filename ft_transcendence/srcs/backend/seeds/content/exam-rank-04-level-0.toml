difficulty = 1200
tags = ["file-descriptors", "processes"]
key_points = [
  "dup2(oldfd, newfd) makes newfd refer to the same open file as oldfd, closing newfd first if it was open.",
  "To send a child's output into a pipe, the child calls dup2(fd[1], 1) before exec; the new program writes to its standard output as usual and the bytes go into the pipe.",
  "Descriptors survive exec, which is why the redirection set up before it applies to the new program.",
  "After dup2, the original descriptor is closed, so no extra copy of the pipe end stays open.",
]

[questions.translations.en]
title = "Redirecting with dup2"
stem = "A child process must run a command whose standard output goes into a pipe instead of the terminal. What does `dup2` do, which call makes the redirection, why does it still hold after `execvp`, and what must be closed afterwards?"
explanation = "`dup2(oldfd, newfd)` makes `newfd` point to the same open file as `oldfd`, closing `newfd` first if needed. In the child, `dup2(fd[1], 1)` makes descriptor 1, the standard output, point to the write end of the pipe. Open descriptors survive `execvp`, so the new program writes to its standard output as it always does, and the bytes land in the pipe without it knowing. The original `fd[1]` is then closed, along with the read end the child does not use, so that no extra copy of the pipe stays open."

[questions.translations.fr]
title = "Rediriger avec dup2"
stem = "Un processus fils doit exécuter une commande dont la sortie standard part dans un tube plutôt que dans le terminal. Que fait `dup2`, quel appel réalise la redirection, pourquoi tient-elle encore après `execvp`, et que faut-il fermer ensuite ?"
explanation = "`dup2(oldfd, newfd)` fait pointer `newfd` vers le même fichier ouvert que `oldfd`, en fermant d'abord `newfd` si besoin. Dans le fils, `dup2(fd[1], 1)` fait pointer le descripteur 1, la sortie standard, vers l'extrémité d'écriture du tube. Les descripteurs ouverts survivent à `execvp` : le nouveau programme écrit sur sa sortie standard comme d'habitude, et les octets arrivent dans le tube sans qu'il le sache. On ferme ensuite le `fd[1]` d'origine, ainsi que l'extrémité de lecture dont le fils ne se sert pas, pour qu'aucune copie en trop du tube ne reste ouverte."

[questions.translations.es]
title = "Redirigir con dup2"
stem = "Un proceso hijo debe ejecutar un comando cuya salida estándar vaya a una tubería en lugar de a la terminal. ¿Qué hace `dup2`, qué llamada hace la redirección, por qué sigue vigente después de `execvp` y qué hay que cerrar después?"
explanation = "`dup2(oldfd, newfd)` hace que `newfd` apunte al mismo fichero abierto que `oldfd`, cerrando antes `newfd` si hace falta. En el hijo, `dup2(fd[1], 1)` hace que el descriptor 1, la salida estándar, apunte al extremo de escritura de la tubería. Los descriptores abiertos sobreviven a `execvp`, así que el nuevo programa escribe en su salida estándar como siempre, y los bytes llegan a la tubería sin que lo sepa. Después se cierra el `fd[1]` original, junto con el extremo de lectura que el hijo no usa, para que no quede abierta ninguna copia de más de la tubería."

[[questions.choices]]
correct = true
text = { en = "`dup2(fd[1], 1)` in the child before `exec`: descriptors survive `exec`, so the new program writes into the pipe, and the original descriptor is then closed", fr = "`dup2(fd[1], 1)` dans l'enfant avant `exec` : les descripteurs survivent à `exec`, donc le nouveau programme écrit dans le tube, et le descripteur d'origine est ensuite fermé", es = "`dup2(fd[1], 1)` en el hijo antes de `exec`: los descriptores sobreviven a `exec`, así que el nuevo programa escribe en la tubería, y el descriptor original se cierra después" }

[[questions.choices]]
text = { en = "`dup2(1, fd[1])`, which points the pipe end at the standard output", fr = "`dup2(1, fd[1])`, qui fait pointer le bout du tube sur la sortie standard", es = "`dup2(1, fd[1])`, que apunta el extremo de la tubería a la salida estándar" }

[[questions.choices]]
text = { en = "The redirection has to be redone after `exec`, since the new program starts with fresh descriptors", fr = "La redirection doit être refaite après `exec`, puisque le nouveau programme démarre avec des descripteurs neufs", es = "La redirección hay que rehacerla tras `exec`, ya que el nuevo programa arranca con descriptores nuevos" }

[[questions.choices]]
text = { en = "`newfd` must be closed by hand before `dup2`, which fails otherwise", fr = "`newfd` doit être fermé à la main avant `dup2`, qui échoue sinon", es = "`newfd` hay que cerrarlo a mano antes de `dup2`, que si no falla" }

[[questions]]
slug = "rank04-l0-reader-that-never-sees-eof"
topic = "exam-rank-04-level-0"
kind = "free_text"
difficulty = 1400
tags = ["pipes", "file-descriptors"]
key_points = [
  "A reader sees end of file (read returns 0) only once every descriptor referring to the write end is closed, in every process.",
  "If any process keeps a copy of the write end open, even one that never writes, the reader waits forever.",
  "fork duplicates every open descriptor, so each process must close the ends it does not use, the parent included.",
  "Leaked descriptors also accumulate in long pipelines until the process runs out of descriptors.",
]

[questions.translations.en]
title = "A reader that never sees end of file"
stem = "A child reads from a pipe until end of file, and the parent writes a few bytes into it and then waits for the child. The program hangs forever. Why? What rule about pipe ends does this illustrate?"
explanation = "A reader only gets end of file, `read` returning 0, once every descriptor that refers to the write end is closed, in every process. Here the parent wrote its bytes but kept `fd[1]` open: the child reads the bytes, then waits for more that could still come, while the parent waits for the child; neither can move. Since `fork` duplicates every open descriptor, each process must close the pipe ends it does not use, the parent as much as the children. In a long pipeline, forgotten descriptors cause exactly this kind of hang, and pile up until the process runs out of them."

[questions.translations.fr]
title = "Un lecteur qui ne voit jamais la fin du fichier"
stem = "Un fils lit dans un tube jusqu'à la fin de fichier, et le père y écrit quelques octets puis attend le fils. Le programme reste bloqué pour toujours. Pourquoi ? Quelle règle sur les extrémités de tube cela illustre-t-il ?"
explanation = "Un lecteur n'obtient la fin de fichier, `read` renvoyant 0, qu'une fois fermés tous les descripteurs qui désignent l'extrémité d'écriture, dans tous les processus. Ici, le père a écrit ses octets mais a gardé `fd[1]` ouvert : le fils lit les octets, puis attend la suite qui pourrait encore venir, pendant que le père attend le fils ; aucun des deux ne peut avancer. Comme `fork` duplique tous les descripteurs ouverts, chaque processus doit fermer les extrémités de tube qu'il n'utilise pas, le père autant que les fils. Dans une longue chaîne de commandes, les descripteurs oubliés provoquent exactement ce genre de blocage, et s'accumulent jusqu'à épuiser ceux du processus."

[questions.translations.es]
title = "Un lector que nunca ve el final del fichero"
stem = "Un hijo lee de una tubería hasta el final del fichero, y el padre escribe en ella unos bytes y después espera al hijo. El programa se queda bloqueado para siempre. ¿Por qué? ¿Qué regla sobre los extremos de una tubería ilustra?"
explanation = "Un lector solo recibe el final del fichero, `read` devolviendo 0, cuando están cerrados todos los descriptores que se refieren al extremo de escritura, en todos los procesos. Aquí el padre escribió sus bytes pero dejó `fd[1]` abierto: el hijo lee los bytes y después espera más, que aún podrían llegar, mientras el padre espera al hijo; ninguno de los dos puede avanzar. Como `fork` duplica todos los descriptores abiertos, cada proceso debe cerrar los extremos de tubería que no usa, el padre igual que los hijos. En una cadena larga de comandos, los descriptores olvidados provocan exactamente este tipo de bloqueo, y se acumulan hasta agotar los del proceso."

[[questions.choices]]
correct = true
text = { en = "The parent still holds a copy of the write end: end of file only comes once **every** descriptor on that end is closed, in every process", fr = "Le parent garde une copie du bout d'écriture : la fin de fichier n'arrive qu'une fois **tous** les descripteurs de ce bout fermés, dans tous les processus", es = "El padre aún tiene una copia del extremo de escritura: el fin de fichero solo llega cuando **todos** los descriptores de ese extremo están cerrados, en todos los procesos" }

[[questions.choices]]
text = { en = "The reader is waiting for the child to end; adding a `wait` before reading fixes it", fr = "Le lecteur attend la fin de l'enfant ; ajouter un `wait` avant de lire règle le problème", es = "El lector espera a que termine el hijo; añadir un `wait` antes de leer lo arregla" }

[[questions.choices]]
text = { en = "A pipe has a limited buffer, so the parent must write less for the reader to see the end", fr = "Un tube a un tampon limité, donc le parent doit écrire moins pour que le lecteur voie la fin", es = "Una tubería tiene un búfer limitado, así que el padre debe escribir menos para que el lector vea el final" }

[[questions.choices]]
text = { en = "Only the process that wrote last needs to close the write end; the copies of the others do not count", fr = "Seul le processus qui a écrit en dernier doit fermer le bout d'écriture ; les copies des autres ne comptent pas", es = "Solo el proceso que escribió el último debe cerrar el extremo de escritura; las copias de los demás no cuentan" }

[[questions]]
slug = "rank04-l0-reading-a-command-output"
topic = "exam-rank-04-level-0"
kind = "free_text"
difficulty = 1200
tags = ["pipes", "processes"]
key_points = [
  "Create a pipe, then fork; the child will run the command with exec.",
  "To read the command's output, the child redirects its standard output to the write end (dup2(fd[1], 1)), and the parent keeps and returns the read end.",
  "To write to the command's input instead, the child redirects its standard input to the read end (dup2(fd[0], 0)), and the parent keeps the write end.",
  "Each side closes the end it does not use, and any failure (pipe, fork, bad parameter) is reported to the caller, for instance with -1.",
]

[questions.translations.en]
title = "Connecting a command to the caller"
stem = "A function starts a command and returns a file descriptor from which the caller can read the command's output, or into which it can write the command's input, depending on a parameter. Describe the steps: which system calls, which redirection in the child, which end the parent keeps."
explanation = "The function creates a pipe, then forks; the child will replace itself with the command using `execvp`. To read the command's output, the child redirects its standard output to the write end with `dup2(fd[1], 1)`, and the parent keeps the read end, `fd[0]`, which it returns. To feed the command's input instead, everything is mirrored: the child redirects its standard input from the read end with `dup2(fd[0], 0)`, and the parent keeps the write end. In both cases each side closes the end it does not use, otherwise end of file never arrives, and any failure, `pipe`, `fork` or an invalid parameter, is reported to the caller, for instance by returning -1."

[questions.translations.fr]
title = "Brancher une commande sur l'appelant"
stem = "Une fonction lance une commande et renvoie un descripteur de fichier dans lequel l'appelant peut lire la sortie de la commande, ou écrire son entrée, selon un paramètre. Décrivez les étapes : quels appels système, quelle redirection dans le fils, quelle extrémité le père garde-t-il."
explanation = "La fonction crée un tube, puis fait un `fork` ; le fils se remplacera par la commande avec `execvp`. Pour lire la sortie de la commande, le fils redirige sa sortie standard vers l'extrémité d'écriture avec `dup2(fd[1], 1)`, et le père garde l'extrémité de lecture, `fd[0]`, qu'il renvoie. Pour alimenter plutôt l'entrée de la commande, tout s'inverse : le fils redirige son entrée standard depuis l'extrémité de lecture avec `dup2(fd[0], 0)`, et le père garde l'extrémité d'écriture. Dans les deux cas, chaque côté ferme l'extrémité qu'il n'utilise pas, sans quoi la fin de fichier n'arrive jamais, et tout échec, de `pipe`, de `fork` ou un paramètre invalide, est signalé à l'appelant, par exemple en renvoyant -1."

[questions.translations.es]
title = "Conectar un comando con quien llama"
stem = "Una función lanza un comando y devuelve un descriptor de fichero en el que quien llama puede leer la salida del comando, o escribir su entrada, según un parámetro. Describe los pasos: qué llamadas al sistema, qué redirección en el hijo y qué extremo conserva el padre."
explanation = "La función crea una tubería y después hace un `fork`; el hijo se sustituirá por el comando con `execvp`. Para leer la salida del comando, el hijo redirige su salida estándar al extremo de escritura con `dup2(fd[1], 1)`, y el padre conserva el extremo de lectura, `fd[0]`, que devuelve. Para alimentar en cambio la entrada del comando, todo se invierte: el hijo redirige su entrada estándar desde el extremo de lectura con `dup2(fd[0], 0)`, y el padre conserva el extremo de escritura. En ambos casos, cada lado cierra el extremo que no usa, o el final del fichero no llega nunca, y cualquier fallo, de `pipe`, de `fork` o un parámetro inválido, se comunica a quien llama, por ejemplo devolviendo -1."

