[[questions]]
slug = "rank06-l0-saving-on-a-signal"
topic = "exam-rank-06-level-0"
kind = "free_text"
difficulty = 1400
tags = ["signals", "file-io"]
key_points = [
  "A signal handler may only call async-signal-safe functions, and writing a file through streams or allocating memory is not safe there.",
  "The handler only sets a flag of type volatile sig_atomic_t, and the main loop checks it, then saves the data, releases everything and exits.",
  "A signal arriving while the server waits in select makes select return -1 with errno set to EINTR, even with SA_RESTART, so the loop wakes up and sees the flag.",
  "An EINTR from select is therefore expected and must not be treated as a fatal error.",
]

[questions.translations.en]
title = "Saving the data on a signal"
stem = "A server must save its data to a file when it receives `SIGINT`, then exit. Why not write the file directly inside the signal handler, and how does the main loop, blocked in `select`, find out that the signal arrived?"
explanation = "A handler can run at any moment, in the middle of a `malloc` or of a stream operation, so it may only call async-signal-safe functions; writing a file through streams or allocating memory is not among them. The handler therefore only sets a flag of type `volatile sig_atomic_t`. The main loop reads that flag and does the real work: saving the data, releasing its resources and exiting. The loop does wake up, because a signal arriving during `select` makes it return -1 with `errno` set to `EINTR`, and `select` is not restarted even with `SA_RESTART`. That `EINTR` is expected: treating it as a fatal error would make the server exit without saving."

[questions.translations.fr]
title = "Sauvegarder les données sur un signal"
stem = "Un serveur doit sauvegarder ses données dans un fichier quand il reçoit `SIGINT`, puis se terminer. Pourquoi ne pas écrire le fichier directement dans le gestionnaire de signal, et comment la boucle principale, bloquée dans `select`, apprend-elle que le signal est arrivé ?"
explanation = "Un gestionnaire peut s'exécuter à n'importe quel moment, au milieu d'un `malloc` ou d'une opération sur un flux : il ne doit donc appeler que des fonctions sûres pour les signaux (async-signal-safe), et écrire un fichier par des flux ou allouer de la mémoire n'en font pas partie. Le gestionnaire se contente de lever un drapeau de type `volatile sig_atomic_t`. La boucle principale lit ce drapeau et fait le vrai travail : sauvegarder les données, libérer ses ressources et se terminer. La boucle se réveille bien, car un signal qui arrive pendant `select` le fait revenir avec -1 et `errno` égal à `EINTR`, et `select` n'est pas relancé, même avec `SA_RESTART`. Ce `EINTR` est attendu : le traiter comme une erreur fatale ferait quitter le serveur sans sauvegarder."

[questions.translations.es]
title = "Guardar los datos al recibir una señal"
stem = "Un servidor debe guardar sus datos en un fichero cuando recibe `SIGINT`, y después terminar. ¿Por qué no escribir el fichero directamente en el manejador de la señal, y cómo se entera el bucle principal, bloqueado en `select`, de que ha llegado la señal?"
explanation = "Un manejador puede ejecutarse en cualquier momento, en medio de un `malloc` o de una operación sobre un flujo, así que solo debe llamar a funciones seguras para señales (async-signal-safe), y escribir un fichero mediante flujos o reservar memoria no lo son. El manejador se limita a activar una bandera de tipo `volatile sig_atomic_t`. El bucle principal lee esa bandera y hace el trabajo real: guardar los datos, liberar sus recursos y terminar. El bucle sí se despierta, porque una señal que llega durante `select` hace que devuelva -1 con `errno` igual a `EINTR`, y `select` no se reanuda ni siquiera con `SA_RESTART`. Ese `EINTR` es esperado: tratarlo como un error fatal haría que el servidor saliera sin guardar."

[[questions.choices]]
correct = true
text = { en = "A handler may only call async-signal-safe functions; it sets a `volatile sig_atomic_t` flag, and the signal makes `select` return -1 with `EINTR`, which the loop must not treat as fatal", fr = "Un gestionnaire ne peut appeler que des fonctions sûres vis-à-vis des signaux ; il positionne un drapeau `volatile sig_atomic_t`, et le signal fait revenir `select` avec -1 et `EINTR`, que la boucle ne doit pas prendre pour une erreur fatale", es = "Un manejador solo puede llamar a funciones seguras ante señales; pone una marca `volatile sig_atomic_t`, y la señal hace que `select` vuelva con -1 y `EINTR`, que el bucle no debe tomar por un error fatal" }

[[questions.choices]]
text = { en = "Writing the file in the handler is fine: it runs while the program is stopped anyway", fr = "Écrire le fichier dans le gestionnaire convient : il s'exécute pendant que le programme est de toute façon arrêté", es = "Escribir el fichero en el manejador vale: se ejecuta mientras el programa está parado de todos modos" }

[[questions.choices]]
text = { en = "`select` carries on waiting through the signal, so the loop only sees the flag at the next event", fr = "`select` continue d'attendre malgré le signal, donc la boucle ne voit le drapeau qu'au prochain événement", es = "`select` sigue esperando pese a la señal, así que el bucle solo ve la marca en el siguiente evento" }

[[questions.choices]]
text = { en = "An `EINTR` from `select` is an error like any other and must end the server", fr = "Un `EINTR` de `select` est une erreur comme une autre et doit terminer le serveur", es = "Un `EINTR` de `select` es un error como otro y debe terminar el servidor" }

[[questions]]
slug = "rank06-l0-reloading-saved-data"
