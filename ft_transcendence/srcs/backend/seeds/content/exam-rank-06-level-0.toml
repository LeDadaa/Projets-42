[questions.translations.en]
title = "Storing key/value pairs in C++"
stem = "A server keeps key/value pairs in memory and must answer lookups quickly. Compare `std::map` and `std::unordered_map`, then explain why a lookup should use `find` rather than `operator[]`, and what `erase(key)` returns."
explanation = "`std::map` keeps its keys sorted in a balanced tree, so looking up, inserting and removing take logarithmic time, and the pairs come out in key order. `std::unordered_map`, available since C++11, uses a hash table: constant time on average, but no order between the keys. For a lookup, `find` returns an iterator, equal to `end()` when the key is absent, without changing anything; `operator[]` on a missing key inserts it with an empty value, so a simple read would make the key exist. `erase(key)` returns the number of elements removed, 0 or 1 for these containers, which tells directly whether the key was there."

[questions.translations.fr]
title = "Ranger des paires clé/valeur en C++"
stem = "Un serveur garde des paires clé/valeur en mémoire et doit répondre vite aux recherches. Comparez `std::map` et `std::unordered_map`, puis expliquez pourquoi une recherche doit utiliser `find` plutôt que `operator[]`, et ce que renvoie `erase(key)`."
explanation = "`std::map` garde ses clés triées dans un arbre équilibré : rechercher, insérer et supprimer prennent un temps logarithmique, et les paires sortent dans l'ordre des clés. `std::unordered_map`, disponible depuis C++11, utilise une table de hachage : temps constant en moyenne, mais aucun ordre entre les clés. Pour une recherche, `find` renvoie un itérateur, égal à `end()` quand la clé est absente, sans rien modifier ; `operator[]` sur une clé absente l'insère avec une valeur vide, si bien qu'une simple lecture ferait exister la clé. `erase(key)` renvoie le nombre d'éléments supprimés, 0 ou 1 pour ces conteneurs, ce qui dit directement si la clé était là."

[questions.translations.es]
title = "Guardar pares clave/valor en C++"
stem = "Un servidor guarda pares clave/valor en memoria y debe responder rápido a las búsquedas. Compara `std::map` y `std::unordered_map`, y después explica por qué una búsqueda debe usar `find` en lugar de `operator[]`, y qué devuelve `erase(key)`."
explanation = "`std::map` mantiene sus claves ordenadas en un árbol equilibrado: buscar, insertar y eliminar llevan un tiempo logarítmico, y los pares salen en el orden de las claves. `std::unordered_map`, disponible desde C++11, usa una tabla hash: tiempo constante de media, pero sin orden entre las claves. Para buscar, `find` devuelve un iterador, igual a `end()` cuando la clave no está, sin modificar nada; `operator[]` sobre una clave ausente la inserta con un valor vacío, así que una simple lectura haría existir la clave. `erase(key)` devuelve el número de elementos eliminados, 0 o 1 en estos contenedores, lo que indica directamente si la clave estaba."

[[questions.choices]]
correct = true
text = { en = "`std::map` is a sorted tree with logarithmic operations, `std::unordered_map` a hash table with constant time on average; `find` does not insert whereas `operator[]` does, and `erase(key)` returns 0 or 1", fr = "`std::map` est un arbre trié aux opérations logarithmiques, `std::unordered_map` une table de hachage en temps constant en moyenne ; `find` n'insère pas alors que `operator[]` le fait, et `erase(cle)` renvoie 0 ou 1", es = "`std::map` es un árbol ordenado con operaciones logarítmicas, `std::unordered_map` una tabla hash de tiempo constante en media; `find` no inserta mientras que `operator[]` sí, y `erase(clave)` devuelve 0 o 1" }

[[questions.choices]]
text = { en = "`operator[]` is the right one for a lookup: it returns a default value when the key is absent and changes nothing", fr = "`operator[]` est le bon choix pour une recherche : il renvoie une valeur par défaut si la clé manque et ne change rien", es = "`operator[]` es el adecuado para buscar: devuelve un valor por defecto si la clave falta y no cambia nada" }

