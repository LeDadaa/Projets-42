  "Relaying means sending to every connected client except the sender and the listening socket, walking the descriptors up to the highest one.",
  "The label naming the sender goes in front of each line, not once per recv, since one recv can hold several lines.",
]

[questions.translations.en]
title = "Client numbers and relaying messages"
stem = "In a chat server, each client gets a number, and every line a client sends is relayed to all the others with that number in front. Why not use the descriptor as the number, how is the relaying done, and where does the label go when one `recv` contains several lines?"
explanation = "The number comes from a counter that only goes up, and a table indexed by descriptor gives, for each descriptor, the number of its client. The descriptor itself would not work: once closed, its number is handed out again by the next `accept`, and the newcomer would take the identity of the client who left. Relaying means walking the descriptors up to the highest one and sending to each connected client, except the sender and the listening socket. Since a single `recv` can hold several lines, the label naming the sender goes in front of each line, not once per chunk received."

[questions.translations.fr]
title = "Numéros de clients et relais des messages"
stem = "Dans un serveur de discussion, chaque client reçoit un numéro, et chaque ligne envoyée par un client est relayée à tous les autres précédée de ce numéro. Pourquoi ne pas utiliser le descripteur comme numéro, comment se fait le relais, et où va l'étiquette quand un seul `recv` contient plusieurs lignes ?"
explanation = "Le numéro vient d'un compteur qui ne fait qu'augmenter, et une table indexée par descripteur donne, pour chaque descripteur, le numéro de son client. Le descripteur lui-même ne conviendrait pas : une fois fermé, son numéro est redistribué par le prochain `accept`, et le nouveau venu prendrait l'identité du client parti. Relayer consiste à parcourir les descripteurs jusqu'au plus grand et à envoyer à chaque client connecté, sauf l'expéditeur et la socket d'écoute. Comme un seul `recv` peut contenir plusieurs lignes, l'étiquette qui nomme l'expéditeur se place devant chaque ligne, et non une fois par morceau reçu."

[questions.translations.es]
title = "Números de clientes y reenvío de mensajes"
stem = "En un servidor de chat, cada cliente recibe un número, y cada línea que envía un cliente se reenvía a todos los demás precedida de ese número. ¿Por qué no usar el descriptor como número, cómo se hace el reenvío y dónde va la etiqueta cuando un solo `recv` contiene varias líneas?"
explanation = "El número sale de un contador que solo aumenta, y una tabla indexada por descriptor da, para cada descriptor, el número de su cliente. El propio descriptor no serviría: una vez cerrado, el siguiente `accept` vuelve a repartir su número, y el recién llegado tomaría la identidad del cliente que se fue. Reenviar consiste en recorrer los descriptores hasta el más alto y enviar a cada cliente conectado, salvo al remitente y al socket de escucha. Como un solo `recv` puede contener varias líneas, la etiqueta que nombra al remitente va delante de cada línea, y no una vez por trozo recibido."

[[questions.choices]]
correct = true
text = { en = "An ever-increasing counter, mapped by a table indexed by descriptor: a closed descriptor number is reused by the next `accept`, and the label goes in front of **each** line, not each `recv`", fr = "Un compteur toujours croissant, relié par une table indexée par descripteur : un numéro de descripteur fermé est réutilisé par le prochain `accept`, et l'étiquette précède **chaque** ligne, pas chaque `recv`", es = "Un contador siempre creciente, ligado por una tabla indexada por descriptor: un número de descriptor cerrado lo reutiliza el siguiente `accept`, y la etiqueta va delante de **cada** línea, no de cada `recv`" }

[[questions.choices]]
text = { en = "The descriptor makes a fine identifier: it is unique for the whole life of the server", fr = "Le descripteur fait un bon identifiant : il est unique pour toute la vie du serveur", es = "El descriptor sirve de identificador: es único durante toda la vida del servidor" }

[[questions.choices]]
text = { en = "The label is written once per `recv`, in front of everything it contained", fr = "L'étiquette est écrite une fois par `recv`, devant tout ce qu'il contenait", es = "La etiqueta se escribe una vez por `recv`, delante de todo lo que contenía" }

[[questions.choices]]
text = { en = "Relaying sends to every descriptor, the sender and the listening socket included", fr = "Le relais envoie à tous les descripteurs, l'émetteur et la socket d'écoute compris", es = "El relevo envía a todos los descriptores, incluidos el emisor y el socket de escucha" }

[[questions]]
slug = "rank06-l0-sending-to-a-closed-connection"
topic = "exam-rank-06-level-0"
