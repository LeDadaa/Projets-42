[[questions]]
slug = "rank06-l0-listening-and-accepting"
topic = "exam-rank-06-level-0"
kind = "free_text"
difficulty = 1000
tags = ["sockets", "file-descriptors"]
key_points = [
  "socket creates a communication endpoint, bind attaches it to an address and a port, and listen turns it into a listening socket that queues incoming connections.",
  "accept takes one waiting connection and returns a new descriptor dedicated to that client, while the listening socket keeps waiting for others.",
  "A server therefore holds one listening descriptor plus one descriptor per connected client, read and written like files.",
  "If one of these calls fails before the server starts serving, the error is fatal: report it and exit with a failure status.",
]

[questions.translations.en]
title = "Listening and accepting connections"
stem = "A TCP server calls `socket`, `bind` and `listen`, then `accept`. What does each call do, what happens when one of them fails at startup, and how many descriptors does the server hold once three clients are connected?"
explanation = "`socket` creates a communication endpoint, `bind` attaches it to an address and a port, and `listen` turns it into a listening socket, which queues the connections that arrive. `accept` takes one waiting connection and returns a brand new descriptor, dedicated to that client; the listening socket stays as it was and keeps waiting for other clients. With three clients connected, the server holds four descriptors: the listening one and one per client, all read and written like files. If one of these calls fails before the server starts serving, nothing useful can be done: the error is reported and the program exits with a failure status."

[questions.translations.fr]
title = "Écouter et accepter des connexions"
stem = "Un serveur TCP appelle `socket`, `bind` et `listen`, puis `accept`. Que fait chaque appel, que se passe-t-il quand l'un d'eux échoue au démarrage, et combien de descripteurs le serveur détient-il une fois trois clients connectés ?"
explanation = "`socket` crée un point de communication, `bind` l'attache à une adresse et à un port, et `listen` en fait une socket d'écoute, qui met en file les connexions qui arrivent. `accept` prend une connexion en attente et renvoie un tout nouveau descripteur, dédié à ce client ; la socket d'écoute reste telle quelle et continue d'attendre d'autres clients. Avec trois clients connectés, le serveur détient quatre descripteurs : celui d'écoute et un par client, tous lus et écrits comme des fichiers. Si l'un de ces appels échoue avant que le serveur ne commence à servir, rien d'utile n'est possible : l'erreur est signalée et le programme se termine avec un code d'échec."

[questions.translations.es]
title = "Escuchar y aceptar conexiones"
stem = "Un servidor TCP llama a `socket`, `bind` y `listen`, y después a `accept`. ¿Qué hace cada llamada, qué pasa cuando una de ellas falla al arrancar y cuántos descriptores tiene el servidor cuando hay tres clientes conectados?"
explanation = "`socket` crea un punto de comunicación, `bind` lo asocia a una dirección y un puerto, y `listen` lo convierte en un socket de escucha, que pone en cola las conexiones que llegan. `accept` toma una conexión en espera y devuelve un descriptor completamente nuevo, dedicado a ese cliente; el socket de escucha sigue igual y continúa esperando a otros clientes. Con tres clientes conectados, el servidor tiene cuatro descriptores: el de escucha y uno por cliente, todos leídos y escritos como ficheros. Si una de estas llamadas falla antes de que el servidor empiece a atender, no se puede hacer nada útil: se informa del error y el programa termina con un código de fallo."

[[questions.choices]]
correct = true
text = { en = "`accept` returns a new descriptor per client while the listening one keeps waiting: with three clients the server holds four descriptors, and a failure at startup is fatal", fr = "`accept` renvoie un nouveau descripteur par client pendant que celui d'écoute continue d'attendre : avec trois clients le serveur en détient quatre, et un échec au démarrage est fatal", es = "`accept` devuelve un descriptor nuevo por cliente mientras el de escucha sigue esperando: con tres clientes el servidor tiene cuatro, y un fallo al arrancar es fatal" }

[[questions.choices]]
text = { en = "`accept` reuses the listening descriptor, so the server always holds just one", fr = "`accept` réutilise le descripteur d'écoute, donc le serveur n'en détient jamais qu'un", es = "`accept` reutiliza el descriptor de escucha, así que el servidor solo tiene uno" }

[[questions.choices]]
text = { en = "With three clients the server holds three descriptors: the listening one is closed after the first `accept`", fr = "Avec trois clients le serveur détient trois descripteurs : celui d'écoute est fermé après le premier `accept`", es = "Con tres clientes el servidor tiene tres descriptores: el de escucha se cierra tras el primer `accept`" }

[[questions.choices]]
text = { en = "`listen` is what takes the connections, `accept` only reading the data that follows", fr = "`listen` est ce qui prend les connexions, `accept` ne faisant que lire les données ensuite", es = "`listen` es lo que acepta las conexiones, y `accept` solo lee los datos que siguen" }

[[questions]]
slug = "rank06-l0-loopback-and-byte-order"
topic = "exam-rank-06-level-0"
kind = "free_text"
difficulty = 1200
tags = ["sockets", "bitwise"]
key_points = [
  "127.0.0.1 is the loopback address: only programs on the same machine can reach it, whereas INADDR_ANY accepts connections on every network interface.",
  "Addresses and ports are stored in network byte order, most significant byte first, whatever the byte order of the machine.",
  "htonl converts a 32-bit address and htons a 16-bit port from the host order to the network order; 127.0.0.1 is the integer 2130706433 (0x7F000001) before conversion.",
  "Forgetting the conversion on a little-endian machine silently binds to another port: 8080 stored as is becomes 36895.",
]

[questions.translations.en]
title = "The loopback address and byte order"
stem = "A server must accept connections only from the machine it runs on. Which address does it bind to, how does that differ from `INADDR_ANY`, and why must the address and the port go through `htonl` and `htons`?"
explanation = "The loopback address, 127.0.0.1, can only be reached from the machine itself, whereas `INADDR_ANY` accepts connections arriving on every network interface, including from other machines. Addresses and ports are stored in network byte order, most significant byte first, whatever the machine. `htonl` converts a 32-bit address and `htons` a 16-bit port from the host order: 127.0.0.1 is the integer 2130706433, that is 0x7F000001, passed through `htonl`. On a little-endian machine, forgetting the conversion does not fail, it binds elsewhere: port 8080, 0x1F90, stored without `htons` is read as 0x901F, and the server listens on port 36895."

[questions.translations.fr]
title = "L'adresse de bouclage et l'ordre des octets"
stem = "Un serveur ne doit accepter que des connexions venant de la machine où il tourne. À quelle adresse se lie-t-il, en quoi est-ce différent de `INADDR_ANY`, et pourquoi l'adresse et le port doivent-ils passer par `htonl` et `htons` ?"
explanation = "L'adresse de bouclage, 127.0.0.1, n'est joignable que depuis la machine elle-même, alors que `INADDR_ANY` accepte les connexions arrivant sur toutes les interfaces réseau, y compris depuis d'autres machines. Les adresses et les ports sont rangés dans l'ordre réseau, octet de poids fort en premier, quelle que soit la machine. `htonl` convertit une adresse de 32 bits et `htons` un port de 16 bits depuis l'ordre de la machine : 127.0.0.1 est l'entier 2130706433, soit 0x7F000001, passé par `htonl`. Sur une machine petit-boutiste, oublier la conversion n'échoue pas, cela lie ailleurs : le port 8080, 0x1F90, rangé sans `htons`, est lu comme 0x901F, et le serveur écoute sur le port 36895."

[questions.translations.es]
title = "La dirección de bucle local y el orden de bytes"
stem = "Un servidor solo debe aceptar conexiones de la máquina en la que se ejecuta. ¿A qué dirección se asocia, en qué se diferencia de `INADDR_ANY` y por qué la dirección y el puerto deben pasar por `htonl` y `htons`?"
explanation = "La dirección de bucle local, 127.0.0.1, solo es accesible desde la propia máquina, mientras que `INADDR_ANY` acepta las conexiones que llegan por todas las interfaces de red, también desde otras máquinas. Las direcciones y los puertos se guardan en el orden de red, con el byte más significativo primero, sea cual sea la máquina. `htonl` convierte una dirección de 32 bits y `htons` un puerto de 16 bits desde el orden de la máquina: 127.0.0.1 es el entero 2130706433, es decir, 0x7F000001, pasado por `htonl`. En una máquina little-endian, olvidar la conversión no falla, sino que asocia a otro sitio: el puerto 8080, 0x1F90, guardado sin `htons`, se lee como 0x901F, y el servidor escucha en el puerto 36895."

[[questions.choices]]
correct = true
text = { en = "127.0.0.1, the loopback, unlike `INADDR_ANY` which listens on every interface; `htonl` and `htons` put the address and the port in network order, and forgetting it turns 8080 into 36895", fr = "127.0.0.1, la boucle locale, contrairement à `INADDR_ANY` qui écoute sur toutes les interfaces ; `htonl` et `htons` mettent l'adresse et le port en ordre réseau, et l'oublier transforme 8080 en 36895", es = "127.0.0.1, el bucle local, al contrario que `INADDR_ANY` que escucha en todas las interfaces; `htonl` y `htons` ponen la dirección y el puerto en orden de red, y olvidarlo convierte 8080 en 36895" }

[[questions.choices]]
text = { en = "`INADDR_ANY` is the loopback address, and 127.0.0.1 opens the server to the network", fr = "`INADDR_ANY` est l'adresse de boucle locale, et 127.0.0.1 ouvre le serveur au réseau", es = "`INADDR_ANY` es la dirección de bucle local, y 127.0.0.1 abre el servidor a la red" }

[[questions.choices]]
text = { en = "The conversion is only useful on a big-endian machine; elsewhere it changes nothing", fr = "La conversion n'est utile que sur une machine gros-boutiste ; ailleurs elle ne change rien", es = "La conversión solo sirve en una máquina big-endian; en otras no cambia nada" }

[[questions.choices]]
text = { en = "Forgetting `htons` makes `bind` fail with an error, which catches the mistake at once", fr = "Oublier `htons` fait échouer `bind` avec une erreur, ce qui attrape la faute tout de suite", es = "Olvidar `htons` hace fallar `bind` con un error, lo que detecta el fallo en seguida" }

[[questions]]
slug = "rank06-l0-waiting-with-select"
topic = "exam-rank-06-level-0"
kind = "free_text"
difficulty = 1200
tags = ["io-multiplexing", "file-descriptors"]
key_points = [
  "select blocks until at least one descriptor of the given sets is ready, so a single thread can serve every client without blocking on any one of them.",
  "Its first argument is the highest descriptor number plus one, not the number of descriptors; a descriptor above that bound is never checked.",
  "select overwrites the sets with only the ready descriptors, so the program keeps a master set and copies it before every call.",
  "The listening socket is reported readable when a connection is waiting, so accept will not block; a client socket is readable when data, or the end of the connection, has arrived.",
]

[questions.translations.en]
title = "Waiting on many sockets with select"
stem = "A server with many clients waits for activity with `select`. What does `select` wait for, what is its first argument, why must the sets be rebuilt before each call, and what does being readable mean for the listening socket and for a client socket?"
explanation = "`select` blocks until at least one descriptor of the sets it receives is ready, which lets a single thread serve every client without ever waiting on one in particular. Its first argument is the highest descriptor number plus one, not a count: a descriptor at or above that bound is simply not checked, and forgetting the plus one makes the server deaf to its highest descriptor. On return, the sets only contain the descriptors that are ready, so the program keeps a master set of every descriptor it watches and copies it before each call. The listening socket is readable when a connection is waiting, so `accept` returns at once; a client socket is readable when data has arrived, or when the client has closed its side."

[questions.translations.fr]
title = "Attendre sur plusieurs sockets avec select"
stem = "Un serveur avec de nombreux clients attend l'activité avec `select`. Qu'attend `select`, quel est son premier argument, pourquoi faut-il reconstruire les ensembles avant chaque appel, et que signifie « prêt en lecture » pour la socket d'écoute et pour la socket d'un client ?"
explanation = "`select` bloque jusqu'à ce qu'au moins un descripteur des ensembles qu'il reçoit soit prêt, ce qui permet à un seul fil d'exécution de servir tous les clients sans jamais attendre l'un d'eux en particulier. Son premier argument est le plus grand numéro de descripteur plus un, pas un nombre de descripteurs : un descripteur égal ou supérieur à cette borne n'est tout simplement pas surveillé, et oublier le plus un rend le serveur sourd à son plus grand descripteur. Au retour, les ensembles ne contiennent plus que les descripteurs prêts : le programme garde donc un ensemble de référence de tout ce qu'il surveille et le copie avant chaque appel. La socket d'écoute est prête en lecture quand une connexion attend, et `accept` revient alors tout de suite ; la socket d'un client est prête quand des données sont arrivées, ou quand le client a fermé son côté."

[questions.translations.es]
title = "Esperar en varios sockets con select"
stem = "Un servidor con muchos clientes espera la actividad con `select`. ¿Qué espera `select`, cuál es su primer argumento, por qué hay que reconstruir los conjuntos antes de cada llamada y qué significa estar listo para lectura para el socket de escucha y para el socket de un cliente?"
explanation = "`select` se bloquea hasta que al menos un descriptor de los conjuntos que recibe está listo, lo que permite a un solo hilo atender a todos los clientes sin esperar nunca a uno en concreto. Su primer argumento es el número de descriptor más alto más uno, no una cantidad: un descriptor igual o superior a ese límite simplemente no se vigila, y olvidar el más uno deja al servidor sordo a su descriptor más alto. Al volver, los conjuntos solo contienen los descriptores listos, así que el programa guarda un conjunto de referencia con todo lo que vigila y lo copia antes de cada llamada. El socket de escucha está listo para lectura cuando hay una conexión esperando, y `accept` vuelve entonces enseguida; el socket de un cliente está listo cuando han llegado datos, o cuando el cliente ha cerrado su lado."

[[questions.choices]]
correct = true
text = { en = "Its first argument is the highest descriptor **plus one**; it overwrites the sets, so a master set is copied before each call; the listening socket readable means a connection waits", fr = "Son premier argument est le plus grand descripteur **plus un** ; il écrase les ensembles, donc on recopie un ensemble maître avant chaque appel ; la socket d'écoute lisible signifie qu'une connexion attend", es = "Su primer argumento es el mayor descriptor **más uno**; sobrescribe los conjuntos, así que se copia un conjunto maestro antes de cada llamada; el socket de escucha legible significa que espera una conexión" }

[[questions.choices]]
text = { en = "Its first argument is the number of descriptors being watched", fr = "Son premier argument est le nombre de descripteurs surveillés", es = "Su primer argumento es el número de descriptores vigilados" }

[[questions.choices]]
text = { en = "The sets are left untouched, so they can be reused from one call to the next", fr = "Les ensembles sont laissés intacts, on peut donc les réutiliser d'un appel à l'autre", es = "Los conjuntos quedan intactos, así que se pueden reutilizar de una llamada a otra" }

[[questions.choices]]
text = { en = "A readable listening socket means a client has sent data, which `recv` will read", fr = "Une socket d'écoute lisible signifie qu'un client a envoyé des données, que `recv` va lire", es = "Un socket de escucha legible significa que un cliente ha enviado datos, que `recv` leerá" }

[[questions]]
slug = "rank06-l0-clients-that-stop-reading"
topic = "exam-rank-06-level-0"
kind = "free_text"
difficulty = 1400
tags = ["io-multiplexing", "sockets"]
key_points = [
  "The kernel buffers what is sent, but the buffers are finite: once a client stops reading and they are full, a blocking send waits, and a single-threaded server stops serving everyone.",
  "The server also asks select for write readiness, and sends to a client only when its descriptor is in the ready write set.",
  "A client that reads slowly or not at all is not disconnected: the data for it is skipped or kept for later, while the other clients keep being served.",
  "recv and send are only called on descriptors that select reported ready, so neither call ever blocks.",
]

[questions.translations.en]
title = "Clients that stop reading"
stem = "A client connects to a chat server but never reads what it receives. Why can this eventually freeze a single-threaded server that uses a blocking `send`, and how does `select` avoid it without disconnecting that client?"
explanation = "What the server sends is first stored in kernel buffers, which are large but finite. When a client never reads, they fill up, and a blocking `send` then waits for room that never comes: the whole server, which has only one thread, stops serving everyone. The fix is to also watch write readiness with `select` and to send to a client only when its descriptor is in the ready write set. A slow client is not a reason to disconnect it: the data meant for it is skipped or kept to be sent later, and the others are served normally. More generally, `recv` and `send` are only called on descriptors that `select` has reported ready, so neither can block."

[questions.translations.fr]
title = "Les clients qui arrêtent de lire"
stem = "Un client se connecte à un serveur de discussion mais ne lit jamais ce qu'il reçoit. Pourquoi cela peut-il finir par figer un serveur à un seul fil d'exécution qui utilise un `send` bloquant, et comment `select` l'évite-t-il sans déconnecter ce client ?"
explanation = "Ce que le serveur envoie est d'abord rangé dans des tampons du noyau, grands mais finis. Quand un client ne lit jamais, ils se remplissent, et un `send` bloquant attend alors une place qui ne vient pas : tout le serveur, qui n'a qu'un fil d'exécution, cesse de servir tout le monde. La solution est de surveiller aussi la disponibilité en écriture avec `select` et de n'envoyer à un client que lorsque son descripteur figure dans l'ensemble des prêts en écriture. Un client lent n'est pas une raison de le déconnecter : les données qui lui sont destinées sont sautées ou gardées pour plus tard, et les autres sont servis normalement. Plus généralement, `recv` et `send` ne sont appelés que sur des descripteurs que `select` a signalés prêts, si bien qu'aucun des deux ne peut bloquer."

[questions.translations.es]
title = "Los clientes que dejan de leer"
stem = "Un cliente se conecta a un servidor de chat pero nunca lee lo que recibe. ¿Por qué puede esto acabar bloqueando un servidor de un solo hilo que usa un `send` bloqueante, y cómo lo evita `select` sin desconectar a ese cliente?"
explanation = "Lo que el servidor envía se guarda primero en búferes del núcleo, grandes pero finitos. Cuando un cliente no lee nunca, se llenan, y un `send` bloqueante espera entonces un hueco que no llega: todo el servidor, que solo tiene un hilo, deja de atender a todos. La solución es vigilar también la disponibilidad para escritura con `select` y enviar a un cliente solo cuando su descriptor está en el conjunto de listos para escritura. Un cliente lento no es motivo para desconectarlo: los datos que le corresponden se saltan o se guardan para después, y los demás se atienden con normalidad. En general, `recv` y `send` solo se llaman sobre descriptores que `select` ha señalado como listos, así que ninguno de los dos puede bloquearse."

[[questions.choices]]
correct = true
text = { en = "The kernel buffers are finite: once full, a blocking `send` waits and the single thread stops serving everyone. Asking `select` for write readiness sends only to clients that can take it", fr = "Les tampons du noyau sont finis : une fois pleins, un `send` bloquant attend et le fil unique cesse de servir tout le monde. Demander à `select` la disponibilité en écriture n'envoie qu'aux clients qui peuvent recevoir", es = "Los búferes del núcleo son finitos: una vez llenos, un `send` bloqueante espera y el hilo único deja de servir a todos. Pedir a `select` la disponibilidad de escritura envía solo a los clientes que pueden recibir" }

[[questions.choices]]
text = { en = "The kernel buffers are unbounded, so `send` never blocks on a socket", fr = "Les tampons du noyau sont sans limite, donc `send` ne bloque jamais sur une socket", es = "Los búferes del núcleo no tienen límite, así que `send` nunca bloquea en un socket" }

[[questions.choices]]
text = { en = "The only fix is to disconnect a client that does not read", fr = "La seule solution est de déconnecter un client qui ne lit pas", es = "La única solución es desconectar a un cliente que no lee" }

[[questions.choices]]
text = { en = "`select` only reports readability; write readiness is not something it can answer", fr = "`select` ne signale que la lisibilité ; la disponibilité en écriture n'est pas de son ressort", es = "`select` solo informa de la legibilidad; la disponibilidad de escritura no es cosa suya" }

[[questions]]
slug = "rank06-l0-detecting-a-disconnection"
topic = "exam-rank-06-level-0"
kind = "free_text"
difficulty = 1000
tags = ["sockets", "memory"]
key_points = [
  "When a client closes the connection, its socket becomes readable and recv returns 0 once any pending data has been read.",
  "recv can also return -1, for instance when the connection is reset because the client closed with data still unread; the client is treated as gone in that case too.",
  "The server then removes the descriptor from its master set, closes it, frees what it kept for that client, and informs the other clients if needed.",
  "The number must not be used after close, since the next accept can return the same number for a new client.",
]

[questions.translations.en]
title = "Detecting that a client has left"
stem = "How does a server notice that a client has disconnected? What do the return values 0 and -1 of `recv` mean here, and what must be cleaned up so that no descriptor or memory leaks?"
explanation = "When a client closes its connection, its socket becomes readable, and `recv` returns 0 once any data still pending has been read: that is the normal end of the connection. `recv` can also return -1, for instance when the connection is reset because the client closed while data sent to it was still unread; the client is gone in that case too. The server then removes the descriptor from its master set, closes it, frees everything it kept for that client, such as its input buffer, and tells the other clients if the program needs to. The number must not be used after `close`: the next `accept` can return the very same number for a new client."

[questions.translations.fr]
title = "Détecter le départ d'un client"
stem = "Comment un serveur remarque-t-il qu'un client s'est déconnecté ? Que signifient ici les valeurs de retour 0 et -1 de `recv`, et que faut-il nettoyer pour ne perdre ni descripteur ni mémoire ?"
explanation = "Quand un client ferme sa connexion, sa socket devient prête en lecture, et `recv` renvoie 0 une fois lues les données encore en attente : c'est la fin normale de la connexion. `recv` peut aussi renvoyer -1, par exemple quand la connexion est réinitialisée parce que le client a fermé alors que des données qui lui étaient envoyées n'avaient pas été lues ; le client est parti dans ce cas aussi. Le serveur retire alors le descripteur de son ensemble de référence, le ferme, libère tout ce qu'il gardait pour ce client, comme son tampon d'entrée, et prévient les autres clients si le programme le demande. Le numéro ne doit plus servir après `close` : le prochain `accept` peut renvoyer exactement le même numéro pour un nouveau client."

[questions.translations.es]
title = "Detectar que un cliente se ha ido"
stem = "¿Cómo se da cuenta un servidor de que un cliente se ha desconectado? ¿Qué significan aquí los valores de retorno 0 y -1 de `recv`, y qué hay que limpiar para no perder ni descriptores ni memoria?"
explanation = "Cuando un cliente cierra su conexión, su socket queda listo para lectura, y `recv` devuelve 0 una vez leídos los datos que aún estaban pendientes: es el final normal de la conexión. `recv` también puede devolver -1, por ejemplo cuando la conexión se reinicia porque el cliente cerró mientras había datos enviados a él sin leer; en ese caso el cliente también se ha ido. El servidor quita entonces el descriptor de su conjunto de referencia, lo cierra, libera todo lo que guardaba para ese cliente, como su búfer de entrada, y avisa a los demás clientes si el programa lo requiere. El número no debe usarse después de `close`: el siguiente `accept` puede devolver exactamente el mismo número para un cliente nuevo."

[[questions.choices]]
correct = true
text = { en = "`recv` returns 0 once pending data is read, and -1 when the connection was reset; the server removes the descriptor from its set, closes it, frees what it kept, and never reuses the number", fr = "`recv` renvoie 0 une fois les données en attente lues, et -1 quand la connexion a été réinitialisée ; le serveur retire le descripteur de son ensemble, le ferme, libère ce qu'il gardait, et ne réutilise jamais le numéro", es = "`recv` devuelve 0 una vez leídos los datos pendientes, y -1 cuando la conexión se reinició; el servidor quita el descriptor de su conjunto, lo cierra, libera lo que guardaba y nunca reutiliza el número" }

[[questions.choices]]
text = { en = "`recv` returns -1 on a clean disconnection and 0 on an error, the other way round", fr = "`recv` renvoie -1 sur une déconnexion propre et 0 sur une erreur, dans l'autre sens", es = "`recv` devuelve -1 en una desconexión limpia y 0 en un error, al revés" }

[[questions.choices]]
text = { en = "Closing the descriptor is enough: removing it from the set is only tidiness", fr = "Fermer le descripteur suffit : le retirer de l'ensemble n'est que de la propreté", es = "Cerrar el descriptor basta: quitarlo del conjunto es solo limpieza" }

[[questions.choices]]
text = { en = "A closed descriptor number is never given out again, so it can go on being used", fr = "Un numéro de descripteur fermé n'est jamais redistribué, on peut donc continuer à s'en servir", es = "Un número de descriptor cerrado nunca se vuelve a repartir, así que puede seguir usándose" }

[[questions]]
slug = "rank06-l0-two-sends-one-recv"
topic = "exam-rank-06-level-0"
kind = "free_text"
difficulty = 1400
tags = ["sockets", "strings"]
key_points = [
  "TCP delivers a stream of bytes and keeps no message boundaries: two sends can arrive in one recv, and one send can be split over several recv calls.",
  "A server that works line by line keeps a buffer per client, appends each received chunk to it, and extracts only the complete lines, those ending with '\\n'.",
  "The incomplete end stays in the buffer until the rest arrives; the buffer grows as needed and is freed when the client leaves.",
  "Treating each recv as exactly one message breaks as soon as the client sends quickly or the data is large.",
]

[questions.translations.en]
title = "Two sends, one recv"
stem = "A client sends `one\\n` then `two\\nthr` in two separate calls. The server receives `one\\ntwo\\nthr` in a single `recv`. Why, and how should a server that processes its input line by line handle it?"
explanation = "TCP carries a stream of bytes and keeps no trace of how they were sent: two sends can come out of a single `recv`, as here, and one send can just as well be split across several `recv` calls. The server therefore cannot treat each `recv` as one message. It keeps a buffer per client, appends every chunk it receives to it, and extracts only the complete lines, those that end with `\\n`: here `one` and `two`. The incomplete end, `thr`, stays in the buffer until the rest of its line arrives. The buffer grows as needed, and it is freed when the client leaves."

[questions.translations.fr]
title = "Deux envois, un seul recv"
stem = "Un client envoie `one\\n` puis `two\\nthr` en deux appels séparés. Le serveur reçoit `one\\ntwo\\nthr` en un seul `recv`. Pourquoi, et comment un serveur qui traite son entrée ligne par ligne doit-il s'y prendre ?"
explanation = "TCP transporte un flux d'octets et ne garde aucune trace de la façon dont ils ont été envoyés : deux envois peuvent ressortir d'un seul `recv`, comme ici, et un envoi peut tout aussi bien être découpé sur plusieurs appels à `recv`. Le serveur ne peut donc pas traiter chaque `recv` comme un message. Il garde un tampon par client, y ajoute chaque morceau reçu et n'en extrait que les lignes complètes, celles qui se terminent par `\\n` : ici `one` et `two`. La fin incomplète, `thr`, reste dans le tampon jusqu'à ce que la suite de sa ligne arrive. Le tampon grandit au besoin, et il est libéré quand le client part."

[questions.translations.es]
title = "Dos envíos, un solo recv"
stem = "Un cliente envía `one\\n` y después `two\\nthr` en dos llamadas separadas. El servidor recibe `one\\ntwo\\nthr` en un solo `recv`. ¿Por qué, y cómo debe tratarlo un servidor que procesa su entrada línea por línea?"
explanation = "TCP transporta un flujo de bytes y no guarda rastro de cómo se enviaron: dos envíos pueden salir de un solo `recv`, como aquí, y un envío puede igualmente repartirse entre varias llamadas a `recv`. Por eso el servidor no puede tratar cada `recv` como un mensaje. Guarda un búfer por cliente, le añade cada trozo recibido y solo extrae las líneas completas, las que terminan en `\\n`: aquí `one` y `two`. El final incompleto, `thr`, se queda en el búfer hasta que llega el resto de su línea. El búfer crece según haga falta y se libera cuando el cliente se va."

[[questions.choices]]
correct = true
text = { en = "TCP is a stream with no message boundaries: keep a buffer per client, append each chunk and take out only the lines ending with `\\n`, leaving the incomplete end for later", fr = "TCP est un flux sans frontières de messages : garder un tampon par client, y ajouter chaque morceau et n'en sortir que les lignes finies par `\\n`, en laissant la fin incomplète pour plus tard", es = "TCP es un flujo sin fronteras de mensajes: guardar un búfer por cliente, añadir cada trozo y sacar solo las líneas acabadas en `\\n`, dejando el final incompleto para luego" }

[[questions.choices]]
text = { en = "One `recv` always matches one `send`, so this can only come from a bug in the client", fr = "Un `recv` correspond toujours à un `send`, donc cela ne peut venir que d'un bug du client", es = "Un `recv` siempre corresponde a un `send`, así que esto solo puede venir de un fallo del cliente" }

[[questions.choices]]
text = { en = "Making the buffer as large as the longest line is enough to get one line per `recv`", fr = "Prendre un tampon aussi grand que la ligne la plus longue suffit à recevoir une ligne par `recv`", es = "Tomar un búfer tan grande como la línea más larga basta para recibir una línea por `recv`" }

[[questions.choices]]
text = { en = "The incomplete end must be dropped, since the rest will arrive in a complete chunk", fr = "La fin incomplète doit être jetée, puisque le reste arrivera dans un morceau complet", es = "El final incompleto debe tirarse, ya que el resto llegará en un trozo completo" }

[[questions]]
slug = "rank06-l0-client-ids-and-broadcast"
topic = "exam-rank-06-level-0"
