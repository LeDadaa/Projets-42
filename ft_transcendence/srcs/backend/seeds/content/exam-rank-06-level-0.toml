[[questions]]
slug = "rank06-l0-parsing-a-request-line"
topic = "exam-rank-06-level-0"
kind = "free_text"
difficulty = 1200
tags = ["input-parsing", "strings"]
key_points = [
  "std::istringstream with >> splits a line into words, skipping any amount of spaces, tabs and the final newline.",
  "Reading into command, key and value leaves the missing ones empty, so which strings are empty tells which form the request has.",
  "One more read attempt that succeeds reveals a request with too many words.",
  "A line that does not match a known command with the right number of words gets the error answer, and the server keeps running.",
]

[questions.translations.en]
title = "Parsing a request line"
stem = "A server receives text requests made of a command word, a key and sometimes a value, such as `SET color blue` or `GET color`. How can C++ split such a line into words, and how does the code recognise a request with a word missing or one too many?"
explanation = "A `std::istringstream` built from the line, read with `>>`, gives one word at a time, skipping any number of spaces, tabs and the final newline. Reading into three strings, command, key and value, leaves the missing ones empty: `GET color` fills the first two, and a bare `GET` only the first. One more read, into a fourth string, fails normally; if it succeeds, the request has too many words, as in `SET color blue green`. A line that does not match a known command with the right number of words gets the error answer, and the server goes on serving."

[questions.translations.fr]
title = "Analyser une ligne de requête"
stem = "Un serveur reçoit des requêtes textuelles faites d'un mot de commande, d'une clé et parfois d'une valeur, comme `SET color blue` ou `GET color`. Comment découper une telle ligne en mots en C++, et comment le code reconnaît-il une requête à laquelle il manque un mot, ou qui en a un de trop ?"
explanation = "Un `std::istringstream` construit à partir de la ligne et lu avec `>>` donne un mot à la fois, en sautant n'importe quel nombre d'espaces, de tabulations et le saut de ligne final. Lire dans trois chaînes, commande, clé et valeur, laisse vides celles qui manquent : `GET color` remplit les deux premières, et un `GET` seul uniquement la première. Une lecture de plus, dans une quatrième chaîne, échoue normalement ; si elle réussit, la requête a trop de mots, comme `SET color blue green`. Une ligne qui ne correspond à aucune commande connue avec le bon nombre de mots reçoit la réponse d'erreur, et le serveur continue de servir."

[questions.translations.es]
title = "Analizar una línea de petición"
stem = "Un servidor recibe peticiones de texto formadas por una palabra de comando, una clave y a veces un valor, como `SET color blue` o `GET color`. ¿Cómo se divide una línea así en palabras en C++, y cómo reconoce el código una petición a la que le falta una palabra o que tiene una de más?"
explanation = "Un `std::istringstream` construido a partir de la línea y leído con `>>` da una palabra cada vez, saltándose cualquier cantidad de espacios, tabulaciones y el salto de línea final. Leer en tres cadenas, comando, clave y valor, deja vacías las que faltan: `GET color` rellena las dos primeras, y un `GET` solo, únicamente la primera. Una lectura más, en una cuarta cadena, normalmente falla; si tiene éxito, la petición tiene demasiadas palabras, como `SET color blue green`. Una línea que no corresponde a ningún comando conocido con el número correcto de palabras recibe la respuesta de error, y el servidor sigue atendiendo."

[[questions.choices]]
correct = true
text = { en = "`std::istringstream` with `>>` splits on any amount of blanks; the strings left empty tell which form the request has, and one extra successful read reveals a word too many", fr = "`std::istringstream` avec `>>` découpe sur n'importe quelle quantité de blancs ; les chaînes restées vides disent quelle forme a la requête, et une lecture supplémentaire réussie révèle un mot en trop", es = "`std::istringstream` con `>>` corta con cualquier cantidad de blancos; las cadenas que quedan vacías dicen qué forma tiene la petición, y una lectura extra con éxito revela una palabra de más" }

[[questions.choices]]
text = { en = "`>>` stops at the first space only, so several spaces give empty words", fr = "`>>` s'arrête à la première espace seulement, donc plusieurs espaces donnent des mots vides", es = "`>>` se para solo en el primer espacio, así que varios espacios dan palabras vacías" }

[[questions.choices]]
text = { en = "A request with a word too many cannot be told apart, since the extra words are simply ignored", fr = "Une requête avec un mot en trop ne peut pas être distinguée, puisque les mots en trop sont simplement ignorés", es = "Una petición con una palabra de más no se puede distinguir, ya que las palabras extra se ignoran" }

[[questions.choices]]
