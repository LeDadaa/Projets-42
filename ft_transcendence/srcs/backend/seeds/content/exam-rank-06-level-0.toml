[questions.translations.en]
title = "Sending to a closed connection"
stem = "A server relays a message to a client that has just closed its connection, and the whole server stops, with no error message at all. What happened, and how can it be prevented?"
explanation = "Writing to a connection that the other side has closed raises the `SIGPIPE` signal, whose default action terminates the process: the server dies without printing anything. The first write after the close may still be accepted, the other side answers it with a reset, and the next one triggers the signal. A server that relays to many clients can easily do this, sending to a client that has just left before `select` and `recv` have told it so. Passing the `MSG_NOSIGNAL` flag to `send`, or ignoring `SIGPIPE`, replaces the signal with an error return, `errno` being set to `EPIPE`, which the server handles as a disconnection."

[questions.translations.fr]
title = "Envoyer sur une connexion fermée"
stem = "Un serveur relaie un message à un client qui vient de fermer sa connexion, et tout le serveur s'arrête, sans le moindre message d'erreur. Que s'est-il passé, et comment l'éviter ?"
explanation = "Écrire sur une connexion que l'autre côté a fermée déclenche le signal `SIGPIPE`, dont l'action par défaut termine le processus : le serveur meurt sans rien afficher. La première écriture après la fermeture peut encore être acceptée, l'autre côté y répond par une réinitialisation, et la suivante déclenche le signal. Un serveur qui relaie vers de nombreux clients peut facilement le faire, en envoyant à un client qui vient de partir avant que `select` et `recv` ne le lui aient signalé. Passer l'option `MSG_NOSIGNAL` à `send`, ou ignorer `SIGPIPE`, remplace le signal par un retour d'erreur, `errno` valant `EPIPE`, que le serveur traite comme une déconnexion."

[questions.translations.es]
title = "Enviar por una conexión cerrada"
stem = "Un servidor reenvía un mensaje a un cliente que acaba de cerrar su conexión, y todo el servidor se detiene, sin ningún mensaje de error. ¿Qué ha pasado y cómo se evita?"
explanation = "Escribir en una conexión que el otro lado ha cerrado provoca la señal `SIGPIPE`, cuya acción por defecto termina el proceso: el servidor muere sin mostrar nada. La primera escritura después del cierre todavía puede aceptarse, el otro lado responde con un reinicio, y la siguiente provoca la señal. Un servidor que reenvía a muchos clientes puede hacerlo con facilidad, enviando a un cliente que acaba de irse antes de que `select` y `recv` se lo hayan indicado. Pasar la opción `MSG_NOSIGNAL` a `send`, o ignorar `SIGPIPE`, sustituye la señal por un retorno de error, con `errno` igual a `EPIPE`, que el servidor trata como una desconexión."

[[questions.choices]]
correct = true
text = { en = "`SIGPIPE`, whose default action kills the whole server silently; `MSG_NOSIGNAL` on `send`, or ignoring the signal, turns it into a -1 with `EPIPE` the server treats as a disconnection", fr = "`SIGPIPE`, dont l'action par défaut tue tout le serveur en silence ; `MSG_NOSIGNAL` sur `send`, ou ignorer le signal, en fait un -1 avec `EPIPE` que le serveur traite comme une déconnexion", es = "`SIGPIPE`, cuya acción por defecto mata todo el servidor en silencio; `MSG_NOSIGNAL` en `send`, o ignorar la señal, lo convierte en un -1 con `EPIPE` que el servidor trata como desconexión" }

[[questions.choices]]
text = { en = "The server ran out of memory, which ends it without a message", fr = "Le serveur a manqué de mémoire, ce qui le termine sans message", es = "Al servidor le faltó memoria, lo que lo termina sin mensaje" }

[[questions.choices]]
text = { en = "`select` cannot report a client that has just left, so this case is unavoidable", fr = "`select` ne peut pas signaler un client qui vient de partir, ce cas est donc inévitable", es = "`select` no puede avisar de un cliente que acaba de irse, así que este caso es inevitable" }

[[questions.choices]]
