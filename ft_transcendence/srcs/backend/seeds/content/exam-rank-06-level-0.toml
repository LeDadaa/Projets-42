  "Reading in a loop such as while (in >> key >> value) stops cleanly at the end of the file.",
  "Saving then reloading must give back exactly the same pairs, which is easy to test.",
]

[questions.translations.en]
title = "Reloading saved data at startup"
stem = "A server saves its key/value pairs to a file and reloads them when it starts again. What file format is enough when keys and values never contain spaces, how is the file read back, and what should happen when it does not exist?"
explanation = "Since neither keys nor values contain spaces, one pair per line, the key, a space, then the value, is enough: nothing can be mistaken for a separator. At startup, the server tries to open the file; if it does not exist, as on the very first run, it simply starts with no data, which is not an error. Otherwise a loop such as `while (in >> key >> value)` reads the pairs one by one and stops cleanly at the end of the file. Saving then reloading must give back exactly the same pairs, which is an easy thing to test."

[questions.translations.fr]
title = "Recharger les données au démarrage"
stem = "Un serveur sauvegarde ses paires clé/valeur dans un fichier et les recharge quand il redémarre. Quel format de fichier suffit quand les clés et les valeurs ne contiennent jamais d'espace, comment relire le fichier, et que faire quand il n'existe pas ?"
explanation = "Comme ni les clés ni les valeurs ne contiennent d'espace, une paire par ligne, la clé, une espace, puis la valeur, suffit : rien ne peut être confondu avec un séparateur. Au démarrage, le serveur essaie d'ouvrir le fichier ; s'il n'existe pas, comme au tout premier lancement, il démarre simplement sans données, ce qui n'est pas une erreur. Sinon, une boucle comme `while (in >> key >> value)` lit les paires une à une et s'arrête proprement à la fin du fichier. Sauvegarder puis recharger doit redonner exactement les mêmes paires, ce qui se teste facilement."

[questions.translations.es]
title = "Recargar los datos al arrancar"
stem = "Un servidor guarda sus pares clave/valor en un fichero y los vuelve a cargar cuando arranca de nuevo. ¿Qué formato de fichero basta cuando las claves y los valores nunca contienen espacios, cómo se vuelve a leer el fichero y qué hacer cuando no existe?"
explanation = "Como ni las claves ni los valores contienen espacios, un par por línea, la clave, un espacio y después el valor, basta: nada puede confundirse con un separador. Al arrancar, el servidor intenta abrir el fichero; si no existe, como en el primerísimo arranque, simplemente empieza sin datos, lo que no es un error. Si existe, un bucle como `while (in >> key >> value)` lee los pares uno a uno y se detiene limpiamente al final del fichero. Guardar y después recargar debe devolver exactamente los mismos pares, algo fácil de probar."

[[questions.choices]]
correct = true
text = { en = "One pair per line, key then a space then the value, read back with `while (in >> key >> value)`; a missing file is normal on the first run and simply means starting empty", fr = "Une paire par ligne, la clé puis une espace puis la valeur, relue par `while (in >> cle >> valeur)` ; un fichier absent est normal au premier lancement et signifie simplement démarrer à vide", es = "Un par por línea, la clave, un espacio y el valor, releído con `while (in >> clave >> valor)`; un fichero que falta es normal en el primer arranque y solo significa empezar vacío" }

[[questions.choices]]
text = { en = "A missing file is an error that must stop the server at startup", fr = "Un fichier absent est une erreur qui doit arrêter le serveur au démarrage", es = "Un fichero que falta es un error que debe parar el servidor al arrancar" }

[[questions.choices]]
text = { en = "A separator other than a space is required, since `>>` cannot split a line", fr = "Un séparateur autre que l'espace est nécessaire, puisque `>>` ne sait pas découper une ligne", es = "Hace falta un separador distinto del espacio, ya que `>>` no sabe cortar una línea" }

[[questions.choices]]
text = { en = "The loop must count the lines beforehand, as `>>` gives no way of knowing the file has ended", fr = "La boucle doit compter les lignes au préalable, car `>>` ne permet pas de savoir que le fichier est fini", es = "El bucle debe contar las líneas de antemano, ya que `>>` no permite saber que el fichero terminó" }

[[questions]]
slug = "rank06-l0-restarting-on-the-same-port"
topic = "exam-rank-06-level-0"
kind = "free_text"
difficulty = 1400
tags = ["sockets", "error-handling"]
key_points = [
  "The side that closes a TCP connection first keeps it in the TIME_WAIT state for a while, about a minute on Linux; when a server with connected clients is stopped, that side is the server.",
  "During that time, bind on the same port fails with EADDRINUSE, even though no program is listening on it.",
  "Setting the SO_REUSEADDR option with setsockopt before bind allows binding again right away.",
]

[questions.translations.en]
title = "Restarting on the same port"
stem = "A server that had clients connected is stopped and restarted right away on the same port, and `bind` fails with `Address already in use`, although no other program is listening on it. Why, and how is it avoided?"
explanation = "The side that closes a TCP connection first keeps it in the `TIME_WAIT` state for a while, about a minute on Linux, so that late packets of the old connection cannot be mistaken for a new one. When a server with connected clients is stopped, the server is that side. As long as those connections remain, `bind` on the same port fails with `EADDRINUSE`, even though nothing is listening. Setting the `SO_REUSEADDR` option with `setsockopt`, before `bind`, allows the address to be bound again at once, and the restarted server starts normally."

[questions.translations.fr]
title = "Redémarrer sur le même port"
stem = "Un serveur qui avait des clients connectés est arrêté puis relancé aussitôt sur le même port, et `bind` échoue avec `Address already in use`, alors qu'aucun autre programme n'écoute sur ce port. Pourquoi, et comment l'éviter ?"
explanation = "Le côté qui ferme une connexion TCP en premier la garde dans l'état `TIME_WAIT` pendant un moment, environ une minute sous Linux, pour que des paquets en retard de l'ancienne connexion ne soient pas pris pour ceux d'une nouvelle. Quand on arrête un serveur qui a des clients connectés, ce côté-là, c'est le serveur. Tant que ces connexions subsistent, `bind` sur le même port échoue avec `EADDRINUSE`, alors que rien n'écoute. Activer l'option `SO_REUSEADDR` avec `setsockopt`, avant `bind`, permet de lier de nouveau l'adresse tout de suite, et le serveur relancé démarre normalement."

[questions.translations.es]
title = "Volver a arrancar en el mismo puerto"
stem = "Un servidor que tenía clientes conectados se detiene y se vuelve a lanzar enseguida en el mismo puerto, y `bind` falla con `Address already in use`, aunque ningún otro programa escucha en ese puerto. ¿Por qué, y cómo se evita?"
explanation = "El lado que cierra primero una conexión TCP la mantiene en el estado `TIME_WAIT` durante un tiempo, alrededor de un minuto en Linux, para que los paquetes retrasados de la conexión antigua no se confundan con los de una nueva. Cuando se detiene un servidor con clientes conectados, ese lado es el servidor. Mientras esas conexiones existen, `bind` en el mismo puerto falla con `EADDRINUSE`, aunque nada esté escuchando. Activar la opción `SO_REUSEADDR` con `setsockopt`, antes de `bind`, permite volver a asociar la dirección de inmediato, y el servidor relanzado arranca con normalidad."

[[questions.choices]]
correct = true
text = { en = "The side that closes first keeps the connection in `TIME_WAIT` for about a minute, and that side is the server; `SO_REUSEADDR` set with `setsockopt` before `bind` allows binding again at once", fr = "Le côté qui ferme en premier garde la connexion en `TIME_WAIT` une minute environ, et ce côté est le serveur ; `SO_REUSEADDR` posé par `setsockopt` avant `bind` permet de se lier à nouveau tout de suite", es = "El lado que cierra primero mantiene la conexión en `TIME_WAIT` cerca de un minuto, y ese lado es el servidor; `SO_REUSEADDR` puesto con `setsockopt` antes de `bind` permite ligarse de nuevo en seguida" }

[[questions.choices]]
text = { en = "Another program is still holding the port, and it has to be found and killed", fr = "Un autre programme tient encore le port, il faut le trouver et le tuer", es = "Otro programa sigue ocupando el puerto, hay que encontrarlo y matarlo" }

[[questions.choices]]
text = { en = "`SO_REUSEADDR` is set after `bind`, once the address is known", fr = "`SO_REUSEADDR` se pose après `bind`, une fois l'adresse connue", es = "`SO_REUSEADDR` se pone después de `bind`, una vez conocida la dirección" }

[[questions.choices]]
text = { en = "It is the client that stays in `TIME_WAIT`, which is why only the server side is affected", fr = "C'est le client qui reste en `TIME_WAIT`, c'est pourquoi seul le côté serveur est touché", es = "Es el cliente el que queda en `TIME_WAIT`, por eso solo el lado servidor se ve afectado" }
