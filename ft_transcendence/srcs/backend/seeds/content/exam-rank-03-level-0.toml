  "The function cannot know how many arguments were passed nor their types: something else must say so, such as a count or a format string.",
  "Arguments passing through ... are promoted: char and short become int, float becomes double, so va_arg must ask for int or double.",
]

[questions.translations.en]
title = "Functions with a variable number of arguments"
stem = "How does a C function declared with `...`, like `printf`, read the arguments it receives? Which macros does it use, how does it know how many arguments there are and of which types, and why is `va_arg(ap, char)` a bug?"
explanation = "The function names at least one parameter before `...`, and reads the others with `<stdarg.h>`: `va_start(ap, last_named)` starts the walk, each `va_arg(ap, type)` returns the next argument as the type requested, and `va_end(ap)` ends it. Nothing in the language says how many arguments were passed nor of which types: the function must be told, by a count or, for `printf`, by the format string. Arguments that go through `...` are also promoted: `char` and `short` become `int`, `float` becomes `double`. `va_arg(ap, char)` therefore reads the wrong type, and GCC warns that such code aborts if it is reached."

[questions.translations.fr]
title = "Des fonctions à nombre variable d'arguments"
stem = "Comment une fonction C déclarée avec `...`, comme `printf`, lit-elle les arguments qu'elle reçoit ? Quelles macros utilise-t-elle, comment sait-elle combien d'arguments il y a et de quels types, et pourquoi `va_arg(ap, char)` est-il un bogue ?"
explanation = "La fonction nomme au moins un paramètre avant `...`, et lit les autres avec `<stdarg.h>` : `va_start(ap, dernier_nommé)` commence le parcours, chaque `va_arg(ap, type)` renvoie l'argument suivant dans le type demandé, et `va_end(ap)` le termine. Rien dans le langage ne dit combien d'arguments ont été passés ni de quels types : il faut le dire à la fonction, par un nombre ou, pour `printf`, par la chaîne de format. Les arguments qui passent par `...` sont en outre promus : `char` et `short` deviennent `int`, `float` devient `double`. `va_arg(ap, char)` lit donc le mauvais type, et GCC prévient qu'un tel code s'arrête brutalement s'il est atteint."

[questions.translations.es]
title = "Funciones con un número variable de argumentos"
stem = "¿Cómo lee una función C declarada con `...`, como `printf`, los argumentos que recibe? ¿Qué macros usa, cómo sabe cuántos argumentos hay y de qué tipos, y por qué `va_arg(ap, char)` es un error?"
explanation = "La función nombra al menos un parámetro antes de `...` y lee los demás con `<stdarg.h>`: `va_start(ap, ultimo_nombrado)` empieza el recorrido, cada `va_arg(ap, tipo)` devuelve el argumento siguiente en el tipo pedido y `va_end(ap)` lo termina. Nada en el lenguaje dice cuántos argumentos se pasaron ni de qué tipos: hay que decírselo a la función, con un número o, en el caso de `printf`, con la cadena de formato. Además, los argumentos que pasan por `...` se promueven: `char` y `short` pasan a `int`, `float` pasa a `double`. `va_arg(ap, char)` lee por tanto el tipo equivocado, y GCC avisa de que ese código aborta si se llega a ejecutar."

[[questions.choices]]
correct = true
text = { en = "`va_start`, `va_arg`, `va_end`; the function cannot know the number or the types by itself, and `char` is promoted to `int`, which `va_arg` must therefore ask for", fr = "`va_start`, `va_arg`, `va_end` ; la fonction ne peut connaître seule ni le nombre ni les types, et un `char` est promu en `int`, ce que `va_arg` doit donc demander", es = "`va_start`, `va_arg`, `va_end`; la función no puede saber por sí sola ni el número ni los tipos, y un `char` se promueve a `int`, que es lo que `va_arg` debe pedir" }

[[questions.choices]]
text = { en = "`va_arg(ap, char)` is right: the argument was passed as a `char`, so it must be read as one", fr = "`va_arg(ap, char)` est correct : l'argument a été passé comme un `char`, donc il faut le lire ainsi", es = "`va_arg(ap, char)` es correcto: el argumento se pasó como `char`, así que hay que leerlo así" }

[[questions.choices]]
text = { en = "The number of extra arguments is available through a hidden counter the compiler adds", fr = "Le nombre d'arguments supplémentaires est disponible par un compteur caché ajouté par le compilateur", es = "El número de argumentos extra está disponible mediante un contador oculto que añade el compilador" }

[[questions.choices]]
text = { en = "A variadic function can be declared with `...` alone, without any named parameter", fr = "Une fonction variadique peut être déclarée avec `...` seul, sans aucun paramètre nommé", es = "Una función variádica puede declararse con `...` solo, sin ningún parámetro con nombre" }

