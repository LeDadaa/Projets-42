]

[questions.translations.en]
title = "Pushing a character back into a stream"
stem = "A parser reads the number `42` from a stream with `fgetc`, followed by `z`. How does it know the number is over, what happens to the `z` it has just consumed, and which function lets it give that character back?"
explanation = "Reading digit by digit, the parser only knows the number is over when it reads a character that is not a digit, here `z`: that character has been consumed although it belongs to whatever comes next. `ungetc(c, stream)` pushes it back into the stream, so the next `fgetc` returns `z` again; this is how a parser looks one character ahead without losing anything. The standard guarantees at least one character of push-back, which is all this needs, and pushing back `EOF` has no effect."

[questions.translations.fr]
title = "Remettre un caractère dans un flux"
stem = "Un analyseur lit le nombre `42` dans un flux avec `fgetc`, suivi de `z`. Comment sait-il que le nombre est terminé, que devient le `z` qu'il vient de consommer, et quelle fonction lui permet de rendre ce caractère ?"
explanation = "En lisant chiffre par chiffre, l'analyseur ne sait que le nombre est terminé qu'en lisant un caractère qui n'est pas un chiffre, ici `z` : ce caractère a été consommé alors qu'il appartient à ce qui suit. `ungetc(c, stream)` le remet dans le flux, et le prochain `fgetc` renvoie de nouveau `z` ; c'est ainsi qu'un analyseur regarde un caractère en avance sans rien perdre. La norme garantit la remise d'au moins un caractère, ce qui suffit ici, et remettre `EOF` est sans effet."

[questions.translations.es]
title = "Devolver un carácter a un flujo"
stem = "Un analizador lee el número `42` de un flujo con `fgetc`, seguido de `z`. ¿Cómo sabe que el número ha terminado, qué pasa con la `z` que acaba de consumir y qué función le permite devolver ese carácter?"
explanation = "Leyendo cifra a cifra, el analizador solo sabe que el número ha terminado al leer un carácter que no es una cifra, aquí `z`: ese carácter se ha consumido aunque pertenece a lo que viene después. `ungetc(c, stream)` lo devuelve al flujo, y el siguiente `fgetc` vuelve a devolver `z`; así es como un analizador mira un carácter por adelantado sin perder nada. El estándar garantiza que se puede devolver al menos un carácter, que es todo lo que hace falta aquí, y devolver `EOF` no tiene efecto."

[[questions.choices]]
correct = true
