]

[questions.translations.en]
title = "Reporting why a system call failed"
stem = "When `read`, `malloc` or `fopen` fails, how does a program find out why, and how does it report it? What do `errno`, `strerror` and `perror` do, when must `errno` be read, and how should the program end?"
explanation = "A failing call returns an error value, often `-1` or `NULL`, and sets `errno` to a code describing the cause. `strerror(errno)` turns that code into a message, and `perror(\"fopen\")` writes `fopen: No such file or directory` on the standard error in one step. `errno` must be read right after the failing call, since later calls may overwrite it, and it means nothing after a call that succeeded. The program then writes its message on `stderr` and ends with a non-zero exit status, 1 for instance, so that a script calling it can tell something went wrong."

[questions.translations.fr]
title = "Signaler pourquoi un appel système a échoué"
stem = "Quand `read`, `malloc` ou `fopen` échoue, comment un programme sait-il pourquoi, et comment le signale-t-il ? Que font `errno`, `strerror` et `perror`, quand faut-il lire `errno`, et comment le programme doit-il se terminer ?"
explanation = "Un appel qui échoue renvoie une valeur d'erreur, souvent `-1` ou `NULL`, et place dans `errno` un code qui décrit la cause. `strerror(errno)` transforme ce code en message, et `perror(\"fopen\")` écrit d'un coup `fopen: No such file or directory` sur la sortie d'erreur. `errno` doit être lu juste après l'appel qui a échoué, car les appels suivants peuvent l'écraser, et il ne signifie rien après un appel réussi. Le programme écrit ensuite son message sur `stderr` et se termine avec un code de sortie non nul, 1 par exemple, pour qu'un script qui l'appelle sache que quelque chose s'est mal passé."

[questions.translations.es]
title = "Informar de por qué falló una llamada al sistema"
stem = "Cuando `read`, `malloc` o `fopen` falla, ¿cómo averigua un programa el motivo y cómo lo comunica? ¿Qué hacen `errno`, `strerror` y `perror`, cuándo hay que leer `errno` y cómo debe terminar el programa?"
explanation = "Una llamada que falla devuelve un valor de error, a menudo `-1` o `NULL`, y pone en `errno` un código que describe la causa. `strerror(errno)` convierte ese código en un mensaje, y `perror(\"fopen\")` escribe de una vez `fopen: No such file or directory` en la salida de error. `errno` debe leerse justo después de la llamada que falló, porque las llamadas siguientes pueden sobrescribirlo, y no significa nada tras una llamada que tuvo éxito. Después, el programa escribe su mensaje en `stderr` y termina con un código de salida distinto de cero, 1 por ejemplo, para que un script que lo llame sepa que algo fue mal."

[[questions.choices]]
correct = true
text = { en = "The call returns an error value and sets `errno`, which must be read straight away; `perror(prefix)` writes `\"prefix: message\"` on `stderr`, and the program ends with a non-zero status", fr = "L'appel renvoie une valeur d'erreur et positionne `errno`, qu'il faut lire tout de suite ; `perror(prefixe)` écrit `\"prefixe : message\"` sur `stderr`, et le programme se termine avec un statut non nul", es = "La llamada devuelve un valor de error y fija `errno`, que hay que leer en seguida; `perror(prefijo)` escribe `\"prefijo: mensaje\"` en `stderr`, y el programa termina con un estado distinto de cero" }

[[questions.choices]]
text = { en = "`errno` keeps the cause until it is read, whatever the calls made in between", fr = "`errno` conserve la cause jusqu'à sa lecture, quels que soient les appels faits entre-temps", es = "`errno` conserva la causa hasta que se lee, sean cuales sean las llamadas hechas mientras" }

[[questions.choices]]
text = { en = "`perror` writes on the standard output and ends the program itself", fr = "`perror` écrit sur la sortie standard et termine le programme lui-même", es = "`perror` escribe en la salida estándar y termina el programa por sí misma" }

[[questions.choices]]
text = { en = "`errno` is set to 0 by a successful call, so it can be tested without looking at the return value", fr = "`errno` est remis à 0 par un appel réussi, donc on peut le tester sans regarder la valeur de retour", es = "`errno` se pone a 0 tras una llamada correcta, así que se puede probar sin mirar el valor devuelto" }

