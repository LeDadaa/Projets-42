key_points = [
  "scanf returns the number of values it stored, which can be fewer than the conversions asked for, or EOF if the input ended before the first conversion.",
  "%d and %s skip leading whitespace, but %c does not: it stores the next character, even a space; a space in the format skips any amount of whitespace, so \" %c\" reads the next non-blank character.",
