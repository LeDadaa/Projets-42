[questions.translations.en]
title = "Searching raw bytes rather than strings"
stem = "A program searches for a pattern in data it has read with `read`. Why is `strstr` a risky choice there, and what do `memmem` and the other `mem` functions do differently?"
explanation = "What `read` returns is a count of bytes, not a C string: the data may contain `'\\0'` bytes, and nothing puts a terminator after them. `strstr`, like every `str` function, stops at the first `'\\0'`: in bytes `a`, `\\0`, `b`, `c`, it never finds `bc`, and on a buffer without a terminator it reads past its end. `memmem`, `memchr` and `memcmp` take explicit lengths and treat every byte alike, so they give the right answer on any data read from a file or a pipe."

[questions.translations.fr]
title = "Chercher dans des octets bruts plutôt que dans des chaînes"
stem = "Un programme cherche un motif dans des données qu'il a lues avec `read`. Pourquoi `strstr` est-il un choix risqué ici, et que font différemment `memmem` et les autres fonctions `mem` ?"
explanation = "Ce que renvoie `read` est un nombre d'octets, pas une chaîne C : les données peuvent contenir des octets `'\\0'`, et rien ne place de terminateur après elles. `strstr`, comme toutes les fonctions `str`, s'arrête au premier `'\\0'` : dans les octets `a`, `\\0`, `b`, `c`, elle ne trouve jamais `bc`, et sur un tampon sans terminateur elle lit au-delà de sa fin. `memmem`, `memchr` et `memcmp` prennent des longueurs explicites et traitent tous les octets de la même façon : elles donnent la bonne réponse sur n'importe quelles données lues dans un fichier ou un tube."

[questions.translations.es]
title = "Buscar en bytes en bruto en lugar de en cadenas"
stem = "Un programa busca un patrón en datos que ha leído con `read`. ¿Por qué `strstr` es una elección arriesgada ahí, y qué hacen de forma distinta `memmem` y las demás funciones `mem`?"
explanation = "Lo que devuelve `read` es un número de bytes, no una cadena C: los datos pueden contener bytes `'\\0'` y nada pone un terminador después de ellos. `strstr`, como todas las funciones `str`, se detiene en el primer `'\\0'`: en los bytes `a`, `\\0`, `b`, `c` nunca encuentra `bc`, y en un búfer sin terminador lee más allá de su final. `memmem`, `memchr` y `memcmp` reciben longitudes explícitas y tratan todos los bytes por igual, así que dan la respuesta correcta con cualquier dato leído de un fichero o una tubería."

[[questions.choices]]
correct = true
text = { en = "Bytes read are not a C string: they may hold `\\0` and have no terminator, so the `mem` functions, which take explicit lengths, are the right ones", fr = "Les octets lus ne sont pas une chaîne C : ils peuvent contenir des `\\0` et n'ont pas de terminateur, donc les fonctions `mem`, qui prennent des longueurs explicites, sont les bonnes", es = "Los bytes leídos no son una cadena C: pueden contener `\\0` y no tienen terminador, así que las funciones `mem`, que toman longitudes explícitas, son las adecuadas" }

[[questions.choices]]
text = { en = "The `str` functions work just as well: they simply stop at the first `\\0` and carry on after it", fr = "Les fonctions `str` marchent aussi bien : elles s'arrêtent juste au premier `\\0` et reprennent après", es = "Las funciones `str` valen igual: solo se paran en el primer `\\0` y siguen después" }

[[questions.choices]]
text = { en = "Adding a `\\0` at the end of the buffer makes the `str` functions safe whatever the data holds", fr = "Ajouter un `\\0` à la fin du tampon rend les fonctions `str` sûres quoi que contiennent les données", es = "Añadir un `\\0` al final del búfer hace seguras las funciones `str` contenga lo que contenga el dato" }

[[questions.choices]]
