[[questions]]
slug = "rank03-l0-static-local-variables"
topic = "exam-rank-03-level-0"
kind = "free_text"
difficulty = 1000
tags = ["static-storage"]
key_points = [
  "A local variable declared static keeps its value between calls: it lives for the whole program, but stays visible only inside the function.",
  "It is initialised once, before the first call, and to zero when no initial value is given.",
  "It lets a function remember state across calls, such as data read but not yet returned.",
  "That state is shared by every caller, so the function is not reentrant, and one static state cannot serve several independent sources at once.",
]

[questions.translations.en]
title = "Local variables that survive between calls"
stem = "What changes when a local variable of a function is declared `static`? When is it initialised, what is it useful for when a function must remember something from one call to the next, and what are the drawbacks?"
explanation = "A `static` local variable is no longer created on each call: it lives as long as the program, while remaining visible only inside its function. It is initialised once, before the first call, and to zero when no value is given; a counter incremented on each call therefore reads 3 after three calls. That is how a function keeps state from one call to the next, for instance bytes it has read but not returned yet. The price is that the state is shared: the function is not reentrant, and a single static state cannot follow several independent sources at the same time."

[questions.translations.fr]
title = "Des variables locales qui survivent entre les appels"
stem = "Que change le fait de déclarer `static` une variable locale d'une fonction ? Quand est-elle initialisée, à quoi sert-elle quand une fonction doit se souvenir de quelque chose d'un appel à l'autre, et quels en sont les inconvénients ?"
explanation = "Une variable locale `static` n'est plus créée à chaque appel : elle vit aussi longtemps que le programme, tout en restant visible seulement dans sa fonction. Elle est initialisée une seule fois, avant le premier appel, et à zéro si aucune valeur n'est donnée ; un compteur incrémenté à chaque appel vaut donc 3 après trois appels. C'est ainsi qu'une fonction garde un état d'un appel à l'autre, par exemple des octets déjà lus mais pas encore rendus. Le prix est que cet état est partagé : la fonction n'est pas réentrante, et un seul état statique ne peut pas suivre plusieurs sources indépendantes en même temps."

[questions.translations.es]
title = "Variables locales que sobreviven entre llamadas"
stem = "¿Qué cambia al declarar `static` una variable local de una función? ¿Cuándo se inicializa, para qué sirve cuando una función debe recordar algo de una llamada a otra y qué inconvenientes tiene?"
explanation = "Una variable local `static` ya no se crea en cada llamada: vive tanto como el programa, aunque sigue siendo visible solo dentro de su función. Se inicializa una sola vez, antes de la primera llamada, y a cero si no se da ningún valor; un contador incrementado en cada llamada vale por tanto 3 tras tres llamadas. Así es como una función guarda un estado de una llamada a otra, por ejemplo bytes ya leídos pero todavía no devueltos. El precio es que ese estado es compartido: la función no es reentrante, y un único estado estático no puede seguir varias fuentes independientes a la vez."

[[questions.choices]]
correct = true
text = { en = "It keeps its value between calls and is initialised once, to zero by default; the state is shared by every caller, so the function is no longer reentrant", fr = "Elle garde sa valeur entre les appels et n'est initialisée qu'une fois, à zéro par défaut ; l'état est partagé par tous les appelants, donc la fonction n'est plus réentrante", es = "Conserva su valor entre llamadas y se inicializa una sola vez, a cero por defecto; el estado lo comparten todos los que llaman, así que la función ya no es reentrante" }

[[questions.choices]]
text = { en = "It becomes visible from the whole program, like a global variable", fr = "Elle devient visible depuis tout le programme, comme une variable globale", es = "Se vuelve visible desde todo el programa, como una variable global" }

[[questions.choices]]
text = { en = "It is reinitialised at each call, but its address stays the same", fr = "Elle est réinitialisée à chaque appel, mais son adresse reste la même", es = "Se reinicializa en cada llamada, pero su dirección sigue siendo la misma" }

[[questions.choices]]
text = { en = "Each caller gets its own copy, so the function stays reentrant", fr = "Chaque appelant obtient sa propre copie, donc la fonction reste réentrante", es = "Cada llamante obtiene su propia copia, así que la función sigue siendo reentrante" }

[[questions]]
slug = "rank03-l0-reading-lines-with-a-buffer"
topic = "exam-rank-03-level-0"
kind = "free_text"
difficulty = 1400
tags = ["file-io", "static-storage"]
key_points = [
  "read returns fixed-size chunks that ignore line boundaries: one line may span several reads, and one read may contain several lines.",
  "Bytes read after the end of the returned line must be kept (for instance in a static buffer) and used first on the next call.",
  "On each call: look for '\\n' in what is kept; if there is none, read more and append, until a newline is found or read returns 0.",
  "The returned line is a new allocation that includes the '\\n' when there is one, and the kept part is shifted or reallocated so nothing is lost.",
]

[questions.translations.en]
title = "Returning one line at a time from read"
stem = "A function returns the next line of a file descriptor each time it is called, using only `read` with a fixed buffer size. Why can't it simply read until a newline and return? What must it keep from one call to the next, and what does one call do?"
explanation = "`read` hands over chunks of a fixed size that ignore line boundaries: a long line spans several reads, and one read may bring several short lines at once. So the bytes that follow the end of the returned line cannot be thrown away; they are kept, for instance in a static buffer, and used first on the next call. Each call looks for a `'\\n'` in what is kept; if there is none, it reads more and appends it, until a newline appears or `read` returns 0. It then returns a newly allocated line, `'\\n'` included, and keeps the rest for next time."

[questions.translations.fr]
title = "Rendre une ligne à la fois à partir de read"
stem = "Une fonction renvoie la ligne suivante d'un descripteur de fichier à chaque appel, en n'utilisant que `read` avec une taille de tampon fixe. Pourquoi ne peut-elle pas simplement lire jusqu'à un retour à la ligne et renvoyer ? Que doit-elle garder d'un appel à l'autre, et que fait un appel ?"
explanation = "`read` livre des morceaux de taille fixe qui ignorent les limites de ligne : une longue ligne s'étale sur plusieurs lectures, et une seule lecture peut apporter plusieurs lignes courtes. Les octets qui suivent la fin de la ligne renvoyée ne peuvent donc pas être jetés ; on les garde, par exemple dans un tampon statique, et on les utilise en premier à l'appel suivant. Chaque appel cherche un `'\\n'` dans ce qui est gardé ; s'il n'y en a pas, il lit la suite et l'ajoute, jusqu'à ce qu'un retour à la ligne apparaisse ou que `read` renvoie 0. Il renvoie alors une ligne nouvellement allouée, `'\\n'` compris, et garde le reste pour la fois suivante."

[questions.translations.es]
title = "Devolver una línea cada vez a partir de read"
stem = "Una función devuelve la siguiente línea de un descriptor de fichero en cada llamada, usando solo `read` con un tamaño de búfer fijo. ¿Por qué no puede simplemente leer hasta un salto de línea y devolverla? ¿Qué debe guardar de una llamada a otra y qué hace una llamada?"
explanation = "`read` entrega trozos de tamaño fijo que ignoran los límites de línea: una línea larga ocupa varias lecturas, y una sola lectura puede traer varias líneas cortas. Por eso los bytes que siguen al final de la línea devuelta no pueden tirarse; se guardan, por ejemplo en un búfer estático, y se usan primero en la llamada siguiente. Cada llamada busca un `'\\n'` en lo guardado; si no lo hay, lee más y lo añade, hasta que aparece un salto de línea o `read` devuelve 0. Devuelve entonces una línea recién reservada, `'\\n'` incluido, y guarda el resto para la próxima vez."

[[questions.choices]]
correct = true
text = { en = "`read` returns fixed-size chunks that ignore line boundaries, so the bytes read past the line must be kept for the next call", fr = "`read` renvoie des morceaux de taille fixe qui ignorent les fins de ligne, donc les octets lus au-delà de la ligne doivent être gardés pour l'appel suivant", es = "`read` devuelve trozos de tamaño fijo que ignoran los fines de línea, así que los bytes leídos más allá de la línea hay que guardarlos para la siguiente llamada" }

[[questions.choices]]
text = { en = "`read` stops on its own at the first newline, so one call is enough per line", fr = "`read` s'arrête tout seul au premier saut de ligne, donc un appel suffit par ligne", es = "`read` se detiene solo en el primer salto de línea, así que basta una llamada por línea" }

[[questions.choices]]
text = { en = "The extra bytes can be dropped: the next call reads the file again from where the line ended", fr = "Les octets en trop peuvent être jetés : l'appel suivant relit le fichier là où la ligne s'est terminée", es = "Los bytes de más se pueden tirar: la siguiente llamada vuelve a leer el fichero donde terminó la línea" }

[[questions.choices]]
text = { en = "The descriptor can be rewound with `lseek` after each line, which removes the need to keep anything", fr = "Le descripteur peut être rembobiné avec `lseek` après chaque ligne, ce qui dispense de garder quoi que ce soit", es = "El descriptor se puede rebobinar con `lseek` tras cada línea, lo que evita guardar nada" }

[[questions]]
slug = "rank03-l0-end-of-file-in-a-line-reader"
topic = "exam-rank-03-level-0"
kind = "free_text"
difficulty = 1200
tags = ["file-io", "memory", "error-handling"]
key_points = [
  "When read returns 0 and bytes are still kept, they form the last line, returned without '\\n'.",
  "When read returns 0 and nothing is kept, the function returns NULL: there is no more line.",
  "At end of file every internal allocation must be freed, so that only the returned lines remain for the caller to free.",
  "When read returns -1, the function frees what it keeps and returns NULL.",
]

[questions.translations.en]
title = "End of file and errors in a line reader"
stem = "A function returns one line of a file per call, keeping the bytes it has read ahead between calls. What must it return when the file ends in the middle of a line, and when nothing is left? What must happen to its internal memory at the end, and when `read` fails?"
explanation = "When `read` returns 0 while bytes are still kept, they form the last line of the file, returned without a `'\\n'` because the file does not end with one. On the next call, `read` returns 0 again and nothing is kept: the function returns `NULL`, which tells the caller there are no more lines. At that point every internal allocation must already be freed, otherwise each file read leaves a leak behind; only the returned lines remain, and the caller frees them. When `read` returns -1, the function frees what it keeps and returns `NULL` as well."

[questions.translations.fr]
title = "Fin de fichier et erreurs dans un lecteur de lignes"
stem = "Une fonction renvoie une ligne d'un fichier à chaque appel, en gardant entre les appels les octets lus en avance. Que doit-elle renvoyer quand le fichier se termine au milieu d'une ligne, et quand il ne reste plus rien ? Que doit devenir sa mémoire interne à la fin, et quand `read` échoue ?"
explanation = "Quand `read` renvoie 0 alors que des octets sont encore gardés, ils forment la dernière ligne du fichier, renvoyée sans `'\\n'` puisque le fichier ne se termine pas par un. À l'appel suivant, `read` renvoie encore 0 et plus rien n'est gardé : la fonction renvoie `NULL`, qui dit à l'appelant qu'il n'y a plus de ligne. À ce moment, toute allocation interne doit déjà être libérée, sans quoi chaque fichier lu laisse une fuite derrière lui ; il ne reste que les lignes renvoyées, que l'appelant libère. Quand `read` renvoie -1, la fonction libère ce qu'elle garde et renvoie `NULL` elle aussi."

[questions.translations.es]
title = "Fin de fichero y errores en un lector de líneas"
stem = "Una función devuelve una línea de un fichero en cada llamada, guardando entre llamadas los bytes leídos por adelantado. ¿Qué debe devolver cuando el fichero termina en mitad de una línea, y cuando ya no queda nada? ¿Qué debe pasar con su memoria interna al final, y cuando `read` falla?"
explanation = "Cuando `read` devuelve 0 y todavía quedan bytes guardados, forman la última línea del fichero, devuelta sin `'\\n'` porque el fichero no termina con uno. En la llamada siguiente, `read` vuelve a devolver 0 y no queda nada guardado: la función devuelve `NULL`, que indica a quien llama que no hay más líneas. En ese momento toda reserva interna debe estar ya liberada, o cada fichero leído dejará una fuga; solo quedan las líneas devueltas, que libera quien llama. Cuando `read` devuelve -1, la función libera lo que guarda y devuelve también `NULL`."

[[questions.choices]]
correct = true
text = { en = "The kept bytes form a last line without `\\n`; then `NULL`, and every internal allocation is freed, `read` failing included", fr = "Les octets gardés forment une dernière ligne sans `\\n` ; ensuite `NULL`, et toute allocation interne est libérée, échec de `read` compris", es = "Los bytes guardados forman una última línea sin `\\n`; después `NULL`, y toda reserva interna se libera, fallo de `read` incluido" }

[[questions.choices]]
text = { en = "A last line without `\\n` is incomplete, so it is dropped and `NULL` is returned at once", fr = "Une dernière ligne sans `\\n` est incomplète, donc elle est abandonnée et `NULL` est renvoyé tout de suite", es = "Una última línea sin `\\n` está incompleta, así que se descarta y se devuelve `NULL` en seguida" }

[[questions.choices]]
text = { en = "A `\\n` is added to the last line so that every returned line has the same shape", fr = "Un `\\n` est ajouté à la dernière ligne pour que toutes les lignes renvoyées aient la même forme", es = "Se añade un `\\n` a la última línea para que todas las devueltas tengan la misma forma" }

[[questions.choices]]
text = { en = "The internal buffer is freed by the caller, along with the lines it received", fr = "Le tampon interne est libéré par l'appelant, en même temps que les lignes reçues", es = "El búfer interno lo libera quien llama, junto con las líneas recibidas" }

[[questions]]
slug = "rank03-l0-buffer-size-at-compile-time"
topic = "exam-rank-03-level-0"
kind = "free_text"
difficulty = 1000
tags = ["file-io"]
key_points = [
  "The -D option of the compiler defines a macro from the command line, so the same code can be built with different buffer sizes; the code should provide a default with #ifndef when it is not given.",
  "The logic must not depend on the size: the same lines come out with a buffer of 1 byte or of several thousand.",
  "A small buffer makes many read system calls (one per byte with a size of 1), which is slow; a larger buffer makes far fewer.",
]

[questions.translations.en]
title = "A buffer size chosen at compile time"
stem = "A reading function uses a buffer size given at compile time, for instance `cc -D SIZE=42`. How does that value reach the code, what should the code do if it is not given, and how does the chosen size affect correctness and speed?"
explanation = "The `-D` option defines a macro from the command line, as if the file started with `#define SIZE 42`; the same code can thus be built with any size. The code should provide a default with `#ifndef SIZE`, so that it still compiles without the option. Correctness must not depend on it: the same lines must come out with a 1-byte buffer or a 4096-byte one. Speed does depend on it, because each `read` is a system call: reading three short lines took 12 calls with a size of 1, against 3 with 4096."

[questions.translations.fr]
title = "Une taille de tampon choisie à la compilation"
stem = "Une fonction de lecture utilise une taille de tampon donnée à la compilation, par exemple `cc -D SIZE=42`. Comment cette valeur arrive-t-elle dans le code, que doit faire le code si elle n'est pas donnée, et comment la taille choisie joue-t-elle sur la justesse et la vitesse ?"
explanation = "L'option `-D` définit une macro depuis la ligne de commande, comme si le fichier commençait par `#define SIZE 42` ; le même code peut ainsi être compilé avec n'importe quelle taille. Le code doit prévoir une valeur par défaut avec `#ifndef SIZE`, pour compiler encore sans l'option. La justesse ne doit pas en dépendre : les mêmes lignes doivent sortir avec un tampon d'un octet ou de 4096. La vitesse, elle, en dépend, car chaque `read` est un appel système : lire trois lignes courtes a pris 12 appels avec une taille de 1, contre 3 avec 4096."

[questions.translations.es]
title = "Un tamaño de búfer elegido al compilar"
stem = "Una función de lectura usa un tamaño de búfer dado al compilar, por ejemplo `cc -D SIZE=42`. ¿Cómo llega ese valor al código, qué debe hacer el código si no se da, y cómo afecta el tamaño elegido a la corrección y a la velocidad?"
explanation = "La opción `-D` define una macro desde la línea de comandos, como si el fichero empezara con `#define SIZE 42`; así, el mismo código puede compilarse con cualquier tamaño. El código debe prever un valor por defecto con `#ifndef SIZE`, para seguir compilando sin la opción. La corrección no debe depender de él: deben salir las mismas líneas con un búfer de un byte o de 4096. La velocidad sí depende, porque cada `read` es una llamada al sistema: leer tres líneas cortas costó 12 llamadas con un tamaño de 1, frente a 3 con 4096."

[[questions.choices]]
correct = true
text = { en = "`-D` defines a macro from the command line, `#ifndef` gives a default, and the same lines must come out whatever the size, which only changes the number of `read` calls", fr = "`-D` définit une macro depuis la ligne de commande, `#ifndef` fournit une valeur par défaut, et les mêmes lignes doivent sortir quelle que soit la taille, qui ne change que le nombre d'appels à `read`", es = "`-D` define una macro desde la línea de órdenes, `#ifndef` da un valor por defecto, y deben salir las mismas líneas sea cual sea el tamaño, que solo cambia el número de llamadas a `read`" }

[[questions.choices]]
text = { en = "A size of 1 breaks the reader: a line cannot be rebuilt one byte at a time", fr = "Une taille de 1 casse le lecteur : une ligne ne peut pas être reconstruite octet par octet", es = "Un tamaño de 1 rompe el lector: una línea no se puede reconstruir byte a byte" }

[[questions.choices]]
text = { en = "The value is read at run time from the environment, so the program must be given it again at each launch", fr = "La valeur est lue à l'exécution depuis l'environnement, donc il faut la redonner au programme à chaque lancement", es = "El valor se lee en ejecución desde el entorno, así que hay que dárselo al programa en cada arranque" }

[[questions.choices]]
text = { en = "A larger buffer makes more system calls, since more bytes have to be moved", fr = "Un tampon plus grand fait plus d'appels système, puisqu'il y a plus d'octets à déplacer", es = "Un búfer más grande hace más llamadas al sistema, ya que hay más bytes que mover" }

[[questions]]
slug = "rank03-l0-pattern-across-chunks"
topic = "exam-rank-03-level-0"
kind = "free_text"
difficulty = 1400
tags = ["file-io", "strings"]
key_points = [
  "Data read in chunks can split an occurrence of the pattern across two reads, so searching each chunk separately misses it.",
  "One fix is to accumulate the whole input in a growing buffer (realloc) before searching.",
  "Another keeps the last (pattern length - 1) bytes of each chunk and searches them again together with the next chunk.",
  "The result must not depend on how the reads happen to be split.",
]

[questions.translations.en]
title = "A pattern split between two reads"
stem = "A program reads its standard input in chunks and must find every occurrence of a pattern in it. The size of each chunk is not under its control. Why does searching each chunk separately fail, and what are two ways to make the result independent of how the input is split?"
explanation = "The reads are cut wherever they happen to be cut: an occurrence of `abc` can arrive as `xxab` then `cyy`. Searched chunk by chunk, it is found in neither, whereas the complete input clearly contains it. The simplest fix is to accumulate the whole input in a buffer grown with `realloc`, then search it once. Without keeping everything, it is enough to carry over the last `length of the pattern - 1` bytes of each chunk and search them again together with the next one. Either way, the result no longer depends on the sizes the reads return."

[questions.translations.fr]
title = "Un motif coupé entre deux lectures"
stem = "Un programme lit son entrée standard par morceaux et doit y trouver toutes les occurrences d'un motif. La taille de chaque morceau ne dépend pas de lui. Pourquoi chercher dans chaque morceau séparément échoue-t-il, et quelles sont deux façons de rendre le résultat indépendant du découpage de l'entrée ?"
explanation = "Les lectures sont coupées là où elles le sont : une occurrence de `abc` peut arriver sous la forme `xxab` puis `cyy`. Cherchée morceau par morceau, elle n'est trouvée dans aucun, alors que l'entrée complète la contient bien. La correction la plus simple consiste à accumuler toute l'entrée dans un tampon agrandi avec `realloc`, puis à y chercher une seule fois. Sans tout garder, il suffit de reporter les `longueur du motif - 1` derniers octets de chaque morceau et de les chercher à nouveau avec le suivant. Dans les deux cas, le résultat ne dépend plus des tailles que renvoient les lectures."

[questions.translations.es]
title = "Un patrón partido entre dos lecturas"
stem = "Un programa lee su entrada estándar por trozos y debe encontrar en ella todas las apariciones de un patrón. El tamaño de cada trozo no depende de él. ¿Por qué falla buscar en cada trozo por separado, y cuáles son dos formas de hacer que el resultado no dependa de cómo se divide la entrada?"
explanation = "Las lecturas se cortan donde se cortan: una aparición de `abc` puede llegar como `xxab` y luego `cyy`. Buscada trozo a trozo, no se encuentra en ninguno, aunque la entrada completa sí la contiene. La solución más sencilla es acumular toda la entrada en un búfer que crece con `realloc` y buscar después una sola vez. Sin guardarlo todo, basta con arrastrar los últimos `longitud del patrón - 1` bytes de cada trozo y buscarlos de nuevo junto con el siguiente. En ambos casos, el resultado ya no depende de los tamaños que devuelvan las lecturas."

[[questions.choices]]
correct = true
text = { en = "An occurrence can straddle two reads, so either the whole input is accumulated, or the last `pattern length - 1` bytes are searched again with the next chunk", fr = "Une occurrence peut être à cheval sur deux lectures, donc soit toute l'entrée est accumulée, soit les `longueur du motif - 1` derniers octets sont recherchés à nouveau avec le morceau suivant", es = "Una aparición puede quedar a caballo entre dos lecturas, así que o se acumula toda la entrada, o se vuelven a buscar los últimos `longitud del patrón - 1` bytes junto al siguiente trozo" }

[[questions.choices]]
text = { en = "Keeping the last byte of each chunk is enough, whatever the length of the pattern", fr = "Garder le dernier octet de chaque morceau suffit, quelle que soit la longueur du motif", es = "Guardar el último byte de cada trozo basta, sea cual sea la longitud del patrón" }

[[questions.choices]]
text = { en = "Searching each chunk separately works as long as the chunk is larger than the pattern", fr = "Chercher dans chaque morceau séparément marche tant que le morceau est plus grand que le motif", es = "Buscar en cada trozo por separado funciona mientras el trozo sea mayor que el patrón" }

[[questions.choices]]
text = { en = "The reads can be forced to land on the boundaries of the occurrences by choosing the right size", fr = "Les lectures peuvent être forcées à tomber sur les bornes des occurrences en choisissant la bonne taille", es = "Se puede forzar a que las lecturas caigan en los límites de las apariciones eligiendo el tamaño adecuado" }

[[questions]]
slug = "rank03-l0-non-overlapping-matches"
topic = "exam-rank-03-level-0"
kind = "free_text"
difficulty = 1200
tags = ["strings", "algorithms"]
key_points = [
  "The usual rule replaces the leftmost occurrence first, then continues searching right after the end of that occurrence.",
  "Occurrences therefore never overlap: replacing aa in aaa changes only the first two characters, giving **a.",
  "Restarting the search one character after the start of a match instead would count overlapping occurrences and give a different result.",
]

[questions.translations.en]
title = "Replacing occurrences without overlap"
stem = "A program replaces every occurrence of a pattern in a text by as many `*` as the pattern has characters. What should happen when occurrences overlap, as `aa` inside `aaa`? Where must the search resume after a match, and what would change if it resumed one character further?"
explanation = "The usual rule, the one of text tools, takes the leftmost occurrence first, then resumes the search right after the end of that occurrence. Occurrences therefore never overlap: in `aaa`, only the first two characters form a match, and the result is `**a`. Resuming the search one character after the start of the match instead would also find the occurrence that begins at the second `a`, which overlaps the first, and would produce `***`. The rule must be chosen deliberately, because the two give different outputs."

[questions.translations.fr]
title = "Remplacer des occurrences sans chevauchement"
stem = "Un programme remplace chaque occurrence d'un motif dans un texte par autant de `*` que le motif compte de caractères. Que doit-il se passer quand des occurrences se chevauchent, comme `aa` dans `aaa` ? Où la recherche doit-elle reprendre après une correspondance, et que changerait une reprise un caractère plus loin ?"
explanation = "La règle habituelle, celle des outils de texte, prend d'abord l'occurrence la plus à gauche, puis reprend la recherche juste après la fin de cette occurrence. Les occurrences ne se chevauchent donc jamais : dans `aaa`, seuls les deux premiers caractères forment une correspondance, et le résultat est `**a`. Reprendre plutôt la recherche un caractère après le début de la correspondance trouverait aussi l'occurrence qui commence au deuxième `a`, qui chevauche la première, et produirait `***`. La règle doit être choisie en connaissance de cause, car les deux donnent des sorties différentes."

[questions.translations.es]
title = "Sustituir apariciones sin solapamiento"
