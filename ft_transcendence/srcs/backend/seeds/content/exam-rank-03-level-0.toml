]

[questions.translations.en]
title = "How scanf reads its input"
stem = "What does `scanf` return? With the input `12 abc`, what does `scanf(\"%d %d\", &a, &b)` return and store? Why does `%c` read a space where `%d` would skip it, and what does a space in the format do?"
explanation = "`scanf` returns the number of values it has stored, or `EOF` if the input ended before the first conversion. On `12 abc`, the first `%d` stores 12; the second meets `a`, which cannot start a number, so `scanf` stops, returns 1, leaves `b` untouched and leaves `abc` unread for the next call. `%d` and `%s` skip leading whitespace, but `%c` stores the next character, whatever it is, a space included. A space in the format matches any amount of whitespace, even none, so `\" %c\"` reads the next non-blank character. Every value is stored through the address passed as argument, which is why one writes `&a`."

[questions.translations.fr]
title = "Comment scanf lit son entrée"
stem = "Que renvoie `scanf` ? Avec l'entrée `12 abc`, que renvoie et que range `scanf(\"%d %d\", &a, &b)` ? Pourquoi `%c` lit-il un espace là où `%d` le sauterait, et que fait un espace dans le format ?"
explanation = "`scanf` renvoie le nombre de valeurs qu'il a rangées, ou `EOF` si l'entrée s'est terminée avant la première conversion. Sur `12 abc`, le premier `%d` range 12 ; le second tombe sur `a`, qui ne peut pas commencer un nombre, donc `scanf` s'arrête, renvoie 1, laisse `b` intact et laisse `abc` non lu pour l'appel suivant. `%d` et `%s` sautent les blancs du début, mais `%c` range le caractère suivant, quel qu'il soit, espace compris. Un espace dans le format correspond à n'importe quelle quantité de blancs, même nulle, donc `\" %c\"` lit le prochain caractère qui n'est pas un blanc. Chaque valeur est rangée à travers l'adresse passée en argument, d'où l'écriture `&a`."

[questions.translations.es]
title = "Cómo lee scanf su entrada"
stem = "¿Qué devuelve `scanf`? Con la entrada `12 abc`, ¿qué devuelve y qué guarda `scanf(\"%d %d\", &a, &b)`? ¿Por qué `%c` lee un espacio donde `%d` lo saltaría, y qué hace un espacio en el formato?"
explanation = "`scanf` devuelve el número de valores que ha guardado, o `EOF` si la entrada terminó antes de la primera conversión. Con `12 abc`, el primer `%d` guarda 12; el segundo se encuentra con `a`, que no puede empezar un número, así que `scanf` se detiene, devuelve 1, deja `b` intacta y deja `abc` sin leer para la siguiente llamada. `%d` y `%s` se saltan los blancos iniciales, pero `%c` guarda el carácter siguiente, sea cual sea, espacio incluido. Un espacio en el formato coincide con cualquier cantidad de blancos, incluso ninguno, así que `\" %c\"` lee el siguiente carácter que no sea un blanco. Cada valor se guarda a través de la dirección pasada como argumento, de ahí que se escriba `&a`."

[[questions.choices]]
correct = true
text = { en = "It returns 1 and stores only 12: `abc` matches no `%d`, so the reading stops there and leaves it unread", fr = "Elle renvoie 1 et ne range que 12 : `abc` ne correspond à aucun `%d`, donc la lecture s'arrête là et le laisse non lu", es = "Devuelve 1 y solo guarda 12: `abc` no encaja con ningún `%d`, así que la lectura se para ahí y lo deja sin leer" }

[[questions.choices]]
text = { en = "It returns 2 and stores 12 and 0, the failed conversion giving zero", fr = "Elle renvoie 2 et range 12 et 0, la conversion ratée donnant zéro", es = "Devuelve 2 y guarda 12 y 0, con la conversión fallida dando cero" }

[[questions.choices]]
text = { en = "It returns `EOF`, since one of the conversions could not be done", fr = "Elle renvoie `EOF`, puisqu'une des conversions n'a pas pu être faite", es = "Devuelve `EOF`, ya que una de las conversiones no se pudo hacer" }

[[questions.choices]]
text = { en = "It returns 1, and `abc` is consumed so that the next call starts after it", fr = "Elle renvoie 1, et `abc` est consommé pour que l'appel suivant reprenne après", es = "Devuelve 1, y `abc` se consume para que la siguiente llamada empiece después" }

