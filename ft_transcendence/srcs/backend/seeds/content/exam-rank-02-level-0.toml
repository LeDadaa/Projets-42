[[questions]]
slug = "rank02-l0-string-terminator"
topic = "exam-rank-02-level-0"
kind = "free_text"
difficulty = 1000
tags = ["strings"]
key_points = [
  "A C string is a sequence of characters ended by the null character '\\0'; nothing stores its length.",
  "The length is found by walking the characters until '\\0', which costs time proportional to the length.",
  "The terminator is not counted in the length: \"abc\" has length 3 but occupies 4 bytes.",
  "Without the terminator, code that walks the string reads past its end, which is undefined behaviour.",
]

[questions.translations.en]
title = "The end of a C string"
stem = "How does C know where a string ends? How is its length computed, what does that cost, and why do `strlen(\"abc\")` and `sizeof(\"abc\")` give different results?"
explanation = "A C string is only a sequence of characters followed by the null character `'\\0'`: no field stores its length. To know the length, you walk the characters one by one until the terminator, which costs time proportional to the length. The terminator itself is not counted: `strlen(\"abc\")` is 3, whereas the literal occupies 4 bytes, which `sizeof(\"abc\")` shows. A character array without its terminator is not a string: any code that walks it keeps reading past its end, which is undefined behaviour."

[questions.translations.fr]
title = "La fin d'une chaîne en C"
stem = "Comment le C sait-il où se termine une chaîne ? Comment calcule-t-on sa longueur, que cela coûte-t-il, et pourquoi `strlen(\"abc\")` et `sizeof(\"abc\")` donnent-ils des résultats différents ?"
explanation = "Une chaîne en C n'est qu'une suite de caractères suivie du caractère nul `'\\0'` : aucun champ ne stocke sa longueur. Pour la connaître, on parcourt les caractères un à un jusqu'au terminateur, ce qui coûte un temps proportionnel à la longueur. Le terminateur lui-même n'est pas compté : `strlen(\"abc\")` vaut 3, alors que le littéral occupe 4 octets, ce que montre `sizeof(\"abc\")`. Un tableau de caractères sans terminateur n'est pas une chaîne : tout code qui le parcourt continue de lire au-delà de sa fin, ce qui est un comportement indéfini."

[questions.translations.es]
title = "El final de una cadena en C"
stem = "¿Cómo sabe C dónde termina una cadena? ¿Cómo se calcula su longitud, cuánto cuesta y por qué `strlen(\"abc\")` y `sizeof(\"abc\")` dan resultados distintos?"
explanation = "Una cadena en C no es más que una secuencia de caracteres seguida del carácter nulo `'\\0'`: ningún campo guarda su longitud. Para conocerla, se recorren los caracteres uno a uno hasta el terminador, lo que cuesta un tiempo proporcional a la longitud. El terminador no se cuenta: `strlen(\"abc\")` vale 3, mientras que el literal ocupa 4 bytes, como muestra `sizeof(\"abc\")`. Un array de caracteres sin terminador no es una cadena: cualquier código que lo recorra sigue leyendo más allá de su final, lo que es comportamiento indefinido."

[[questions.choices]]
correct = true
text = { en = "A byte worth zero marks the end; the length is found by walking the characters", fr = "Un octet valant zéro marque la fin ; la longueur se compte en parcourant les caractères", es = "Un byte con valor cero marca el final; la longitud se cuenta recorriendo los caracteres" }

[[questions.choices]]
text = { en = "The length is stored in the first byte of the string", fr = "La longueur est rangée dans le premier octet de la chaîne", es = "La longitud se guarda en el primer byte de la cadena" }

[[questions.choices]]
text = { en = "The compiler keeps the length next to the pointer", fr = "Le compilateur garde la longueur à côté du pointeur", es = "El compilador guarda la longitud junto al puntero" }

[[questions.choices]]
text = { en = "The end is marked by the character zero, the digit you can print", fr = "La fin est marquée par le caractère zéro, le chiffre que l'on peut afficher", es = "El final se marca con el carácter cero, la cifra que se puede mostrar" }

[[questions]]
slug = "rank02-l0-copying-a-string"
topic = "exam-rank-02-level-0"
kind = "free_text"
difficulty = 1000
tags = ["strings", "memory"]
key_points = [
  "The destination must already have room for every character plus the terminator: length + 1 bytes.",
  "The copy goes character by character and must copy the '\\0' too, otherwise the destination is not a valid string.",
  "The copy function cannot check the size of the destination; too small a destination is overwritten past its end, a buffer overflow.",
  "strcpy returns the address of the destination, which allows chaining calls.",
]

[questions.translations.en]
title = "Copying a string"
stem = "What must be true of the destination before copying a C string into it with a `strcpy`-like function? What exactly must the copy write, and what does `strcpy` return?"
explanation = "The destination must already exist and hold every character of the source plus the terminator, that is length + 1 bytes: the copy function has no way to know how large it is. The copy goes character by character and must also write the final `'\\0'`, without which the destination is not a valid string. A destination that is too small gets written past its end: a buffer overflow, one of the most classic security bugs. `strcpy` returns the address of the destination, which is why calls can be chained."

[questions.translations.fr]
title = "Copier une chaîne"
stem = "Que faut-il garantir sur la destination avant d'y copier une chaîne C avec une fonction du type de `strcpy` ? Que doit écrire exactement la copie, et que renvoie `strcpy` ?"
explanation = "La destination doit déjà exister et contenir tous les caractères de la source plus le terminateur, soit longueur + 1 octets : la fonction de copie n'a aucun moyen de connaître sa taille. La copie se fait caractère par caractère et doit aussi écrire le `'\\0'` final, sans lequel la destination n'est pas une chaîne valide. Une destination trop petite est écrite au-delà de sa fin : c'est un dépassement de tampon, l'un des bogues de sécurité les plus classiques. `strcpy` renvoie l'adresse de la destination, ce qui permet d'enchaîner les appels."

[questions.translations.es]
title = "Copiar una cadena"
stem = "¿Qué hay que garantizar sobre el destino antes de copiar en él una cadena C con una función como `strcpy`? ¿Qué debe escribir exactamente la copia y qué devuelve `strcpy`?"
explanation = "El destino debe existir ya y tener sitio para todos los caracteres del origen más el terminador, es decir, longitud + 1 bytes: la función de copia no tiene forma de saber su tamaño. La copia se hace carácter a carácter y también debe escribir el `'\\0'` final, sin el cual el destino no es una cadena válida. Un destino demasiado pequeño se escribe más allá de su final: un desbordamiento de búfer, uno de los errores de seguridad más clásicos. `strcpy` devuelve la dirección del destino, lo que permite encadenar llamadas."

[[questions.choices]]
correct = true
text = { en = "The destination needs room for every character plus the terminator: length + 1 bytes", fr = "La destination doit avoir la place de tous les caractères plus le terminateur, soit longueur + 1 octets", es = "El destino necesita sitio para todos los caracteres más el terminador: longitud + 1 bytes" }

[[questions.choices]]
text = { en = "Room for the characters is enough: the system adds the terminator", fr = "La place des caractères suffit : le système ajoute le terminateur", es = "Basta con el sitio de los caracteres: el sistema añade el terminador" }

[[questions.choices]]
text = { en = "The copy enlarges the destination when it is too small", fr = "La copie agrandit la destination quand elle est trop petite", es = "La copia agranda el destino cuando es demasiado pequeño" }

[[questions.choices]]
text = { en = "The copy checks the size of the destination and stops before overflowing it", fr = "La copie vérifie la taille de la destination et s'arrête avant de la déborder", es = "La copia comprueba el tamaño del destino y se detiene antes de desbordarlo" }

[[questions]]
slug = "rank02-l0-changing-the-callers-variables"
topic = "exam-rank-02-level-0"
kind = "free_text"
difficulty = 1000
tags = ["pointers"]
key_points = [
  "C passes arguments by value: the function receives copies, so changing its parameters does not change the caller's variables.",
  "To modify the caller's variables, the function must receive their addresses (pointers) and write through them with *.",
  "Exchanging two values needs a temporary variable: save *a, copy *b into *a, then the saved value into *b.",
]

[questions.translations.en]
title = "Changing the caller's variables"
stem = "A function `void f(int a, int b)` exchanges `a` and `b`, yet after `f(x, y)` the variables `x` and `y` of the caller are unchanged. Why? How must the function be written so that the exchange is visible to the caller?"
explanation = "C passes arguments by value: `a` and `b` are copies of `x` and `y`, local to the function, and exchanging them changes nothing for the caller. For a function to change the caller's variables, it must receive their addresses, `f(&x, &y)`, and write through those pointers with `*`. The exchange itself needs a temporary variable: save `*a`, copy `*b` into `*a`, then copy the saved value into `*b`."

[questions.translations.fr]
title = "Modifier les variables de l'appelant"
stem = "Une fonction `void f(int a, int b)` échange `a` et `b`, et pourtant, après `f(x, y)`, les variables `x` et `y` de l'appelant n'ont pas changé. Pourquoi ? Comment écrire la fonction pour que l'échange soit visible de l'appelant ?"
explanation = "Le C passe les arguments par valeur : `a` et `b` sont des copies de `x` et `y`, locales à la fonction, et les échanger ne change rien pour l'appelant. Pour qu'une fonction modifie les variables de l'appelant, elle doit recevoir leurs adresses, `f(&x, &y)`, et écrire à travers ces pointeurs avec `*`. L'échange lui-même demande une variable temporaire : on sauvegarde `*a`, on copie `*b` dans `*a`, puis la valeur sauvegardée dans `*b`."

[questions.translations.es]
title = "Modificar las variables de quien llama"
stem = "Una función `void f(int a, int b)` intercambia `a` y `b` y, sin embargo, después de `f(x, y)` las variables `x` e `y` de quien llama no han cambiado. ¿Por qué? ¿Cómo hay que escribir la función para que el intercambio sea visible para quien llama?"
explanation = "C pasa los argumentos por valor: `a` y `b` son copias de `x` e `y`, locales a la función, e intercambiarlas no cambia nada para quien llama. Para que una función modifique las variables de quien llama, debe recibir sus direcciones, `f(&x, &y)`, y escribir a través de esos punteros con `*`. El intercambio necesita una variable temporal: se guarda `*a`, se copia `*b` en `*a` y después el valor guardado en `*b`."

[[questions.choices]]
correct = true
text = { en = "C passes arguments by value: the function must receive the addresses and write through them", fr = "Le C passe les arguments par valeur : la fonction doit recevoir les adresses et écrire à travers elles", es = "C pasa los argumentos por valor: la función debe recibir las direcciones y escribir a través de ellas" }

[[questions.choices]]
text = { en = "The parameters must be declared const for the exchange to be visible", fr = "Il faut déclarer les paramètres const pour que l'échange soit visible", es = "Hay que declarar los parámetros const para que el intercambio se vea" }

[[questions.choices]]
text = { en = "A function can never change the caller's variables: it has to return them", fr = "Une fonction ne peut jamais modifier les variables de l'appelant : elle doit les renvoyer", es = "Una función nunca puede cambiar las variables de quien la llama: tiene que devolverlas" }

[[questions.choices]]
text = { en = "C passes arguments by reference, so the exchange should work: the bug is elsewhere", fr = "Le C passe les arguments par référence, l'échange devrait marcher : le bogue est ailleurs", es = "C pasa los argumentos por referencia, el intercambio debería funcionar: el fallo está en otro sitio" }

