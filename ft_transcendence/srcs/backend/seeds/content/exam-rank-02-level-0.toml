[[questions]]
slug = "rank02-l0-rotating-letters"
topic = "exam-rank-02-level-0"
kind = "free_text"
difficulty = 1200
tags = ["characters", "number-theory"]
key_points = [
  "Convert the letter to its position in the alphabet (c - 'a'), add the shift, take the result modulo 26, then convert back by adding 'a' (the same with 'A' for capitals).",
  "The modulo makes the alphabet wrap around, so shifting 'z' by one gives 'a'.",
  "Capitals and lowercase letters are handled separately so the case is kept, and non-letters are left unchanged.",
  "A shift of 13 is its own inverse: applying it twice gives 26, a full turn, so the same function encodes and decodes.",
]

[questions.translations.en]
title = "Shifting letters around the alphabet"
stem = "You want to replace each letter by the one `k` places further in the alphabet, wrapping around from `z` back to `a` and keeping the case. What computation does that for one character? And why does a shift of 13, applied twice, give back the original text?"
explanation = "Turn the letter into its position, `c - 'a'`, add `k`, take the result modulo 26 and turn it back into a letter by adding `'a'`: `(c - 'a' + k) % 26 + 'a'`. The modulo is what makes the alphabet wrap around, so that `'z'` shifted by one gives `'a'`. Capitals get the same formula with `'A'`, which keeps the case, and anything that is not a letter is copied unchanged. With `k = 13`, two shifts add up to 26, a full turn of the alphabet: the same function both encodes and decodes."

[questions.translations.fr]
title = "Décaler des lettres dans l'alphabet"
stem = "On veut remplacer chaque lettre par celle qui se trouve `k` rangs plus loin dans l'alphabet, en repartant de `a` après `z` et en gardant la casse. Quel calcul le fait pour un caractère ? Et pourquoi un décalage de 13, appliqué deux fois, redonne-t-il le texte d'origine ?"
explanation = "On transforme la lettre en position, `c - 'a'`, on ajoute `k`, on prend le résultat modulo 26 et on revient à une lettre en ajoutant `'a'` : `(c - 'a' + k) % 26 + 'a'`. C'est le modulo qui fait boucler l'alphabet, de sorte que `'z'` décalée d'un rang donne `'a'`. Les majuscules suivent la même formule avec `'A'`, ce qui conserve la casse, et tout ce qui n'est pas une lettre est recopié tel quel. Avec `k = 13`, deux décalages font 26, un tour complet de l'alphabet : la même fonction sert à coder et à décoder."

