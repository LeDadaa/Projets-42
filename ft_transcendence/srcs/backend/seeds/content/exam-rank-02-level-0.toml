[questions.translations.en]
title = "argc and argv"
stem = "In `int main(int argc, char **argv)`, what do `argc` and `argv` contain? If a program expects exactly one argument, what should it check before using it, and where is that argument?"
explanation = "`argc` counts the words of the command line, the program name included: a program run with two arguments receives `argc == 3`. `argv[0]` is the program name, the arguments are `argv[1]` to `argv[argc - 1]`, and `argv[argc]` is always a null pointer. A program that expects exactly one argument therefore checks `argc == 2` before reading `argv[1]`; reading an argument that was not given is an access past the end of the arguments."

[questions.translations.fr]
title = "argc et argv"
stem = "Dans `int main(int argc, char **argv)`, que contiennent `argc` et `argv` ? Si un programme attend exactement un argument, que doit-il vérifier avant de l'utiliser, et où se trouve cet argument ?"
explanation = "`argc` compte les mots de la ligne de commande, nom du programme compris : un programme lancé avec deux arguments reçoit `argc == 3`. `argv[0]` est le nom du programme, les arguments vont de `argv[1]` à `argv[argc - 1]`, et `argv[argc]` est toujours un pointeur nul. Un programme qui attend exactement un argument vérifie donc `argc == 2` avant de lire `argv[1]` ; lire un argument qui n'a pas été donné, c'est accéder au-delà de la fin des arguments."

[questions.translations.es]
title = "argc y argv"
stem = "En `int main(int argc, char **argv)`, ¿qué contienen `argc` y `argv`? Si un programa espera exactamente un argumento, ¿qué debe comprobar antes de usarlo y dónde está ese argumento?"
explanation = "`argc` cuenta las palabras de la línea de comandos, incluido el nombre del programa: un programa lanzado con dos argumentos recibe `argc == 3`. `argv[0]` es el nombre del programa, los argumentos van de `argv[1]` a `argv[argc - 1]` y `argv[argc]` es siempre un puntero nulo. Un programa que espera exactamente un argumento comprueba por tanto `argc == 2` antes de leer `argv[1]`; leer un argumento que no se ha pasado es acceder más allá del final de los argumentos."

[[questions.choices]]
correct = true
text = { en = "argc counts the program name too, so one expected argument means checking argc == 2", fr = "argc compte aussi le nom du programme : pour un seul argument attendu, on vérifie argc == 2", es = "argc cuenta también el nombre del programa: para un solo argumento se comprueba argc == 2" }

[[questions.choices]]
text = { en = "argc counts only the arguments, so one expected argument means checking argc == 1", fr = "argc ne compte que les arguments : pour un seul argument attendu, on vérifie argc == 1", es = "argc solo cuenta los argumentos: para un solo argumento se comprueba argc == 1" }

[[questions.choices]]
