[questions.translations.en]
title = "Printing a number character by character"
stem = "With only `write` available, how do you print an `int`? How do you get its digits in the right order, turn a digit into a character, and handle negative numbers, including the most negative `int`?"
explanation = "`n % 10` gives the last digit and `n / 10` removes it, so the digits come out least significant first; they must be printed the other way round, either by recursing on `n / 10` before printing `n % 10`, or by filling a small buffer from the end. A digit `d` becomes a character with `'0' + d`. For a negative number, you print `'-'` and then its absolute value. The trap is `INT_MIN`, -2147483648: its opposite does not fit in an `int`, and negating it overflows. Working in a `long`, or handling that value separately, avoids it."

[questions.translations.fr]
title = "Afficher un nombre caractère par caractère"
stem = "Avec seulement `write`, comment afficher un `int` ? Comment obtenir ses chiffres dans le bon ordre, transformer un chiffre en caractère, et traiter les nombres négatifs, y compris le plus petit `int` ?"
explanation = "`n % 10` donne le dernier chiffre et `n / 10` le retire : les chiffres sortent donc du moins significatif au plus significatif, et il faut les afficher dans l'autre sens, soit par récursion sur `n / 10` avant d'afficher `n % 10`, soit en remplissant un petit tampon par la fin. Un chiffre `d` devient un caractère avec `'0' + d`. Pour un nombre négatif, on affiche `'-'` puis sa valeur absolue. Le piège est `INT_MIN`, -2147483648 : son opposé ne tient pas dans un `int`, et le calculer provoque un dépassement. Travailler dans un `long`, ou traiter cette valeur à part, l'évite."

[questions.translations.es]
title = "Mostrar un número carácter a carácter"
stem = "Con solo `write` disponible, ¿cómo muestras un `int`? ¿Cómo obtienes sus cifras en el orden correcto, conviertes una cifra en carácter y tratas los números negativos, incluido el `int` más negativo?"
explanation = "`n % 10` da la última cifra y `n / 10` la quita, así que las cifras salen de la menos significativa a la más significativa; hay que mostrarlas al revés, con una recursión sobre `n / 10` antes de mostrar `n % 10`, o llenando un pequeño búfer desde el final. Una cifra `d` se convierte en carácter con `'0' + d`. Para un número negativo se muestra `'-'` y después su valor absoluto. La trampa es `INT_MIN`, -2147483648: su opuesto no cabe en un `int` y calcularlo desborda. Trabajar en un `long`, o tratar ese valor aparte, lo evita."

[[questions.choices]]
