text = { en = "A literal may sit in read-only memory; an array initialised from it holds a copy that can be modified", fr = "Un littéral peut être en mémoire seulement lisible ; un tableau initialisé avec lui en contient une copie modifiable", es = "Un literal puede estar en memoria de solo lectura; un array inicializado con él contiene una copia modificable" }

