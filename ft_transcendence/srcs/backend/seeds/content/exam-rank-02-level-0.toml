stem = "Quieres sustituir cada letra por la que está `k` posiciones más adelante en el alfabeto, volviendo a `a` después de `z` y conservando la caja. ¿Qué cálculo lo hace para un carácter? ¿Y por qué un desplazamiento de 13, aplicado dos veces, devuelve el texto original?"
explanation = "Se convierte la letra en su posición, `c - 'a'`, se suma `k`, se toma el resultado módulo 26 y se vuelve a una letra sumando `'a'`: `(c - 'a' + k) % 26 + 'a'`. El módulo es lo que hace que el alfabeto dé la vuelta, de modo que `'z'` desplazada una posición da `'a'`. Las mayúsculas siguen la misma fórmula con `'A'`, lo que conserva la caja, y todo lo que no es una letra se copia sin cambios. Con `k = 13`, dos desplazamientos suman 26, una vuelta completa del alfabeto: la misma función sirve para codificar y para decodificar."

