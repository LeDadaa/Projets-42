[questions.translations.en]
title = "Words and separators"
stem = "Many string exercises work on words separated by spaces or tabs. How do you recognise where a word starts and where it ends while walking the string, and which inputs must you think of so that the code does not break?"
explanation = "A word starts at a character that is not a separator and that is either at the start of the string or right after a separator; it ends just before the next separator, or at the final `'\\0'`. A robust loop therefore skips separators, notes where the word starts, then advances while it is not on a separator. The inputs that break naive code are repeated separators, separators at the start or at the end, tabs as well as spaces, and strings with no word at all, empty or made only of separators, which must be handled explicitly."

[questions.translations.fr]
title = "Mots et séparateurs"
stem = "Beaucoup d'exercices sur les chaînes travaillent sur des mots séparés par des espaces ou des tabulations. En parcourant la chaîne, comment reconnaître où un mot commence et où il se termine, et à quelles entrées faut-il penser pour que le code ne casse pas ?"
explanation = "Un mot commence sur un caractère qui n'est pas un séparateur et qui se trouve soit en début de chaîne, soit juste après un séparateur ; il se termine juste avant le séparateur suivant, ou sur le `'\\0'` final. Une boucle robuste saute donc les séparateurs, note où commence le mot, puis avance tant qu'elle n'est pas sur un séparateur. Les entrées qui cassent un code naïf sont les séparateurs répétés, les séparateurs en début ou en fin de chaîne, les tabulations autant que les espaces, et les chaînes sans aucun mot, vides ou faites uniquement de séparateurs, qu'il faut traiter explicitement."

