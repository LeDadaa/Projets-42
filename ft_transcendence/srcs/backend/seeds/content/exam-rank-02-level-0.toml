explanation = "Una palabra empieza en un carácter que no es un separador y que está al principio de la cadena o justo después de un separador; termina justo antes del separador siguiente, o en el `'\\0'` final. Un bucle robusto se salta los separadores, anota dónde empieza la palabra y luego avanza mientras no esté sobre un separador. Las entradas que rompen un código ingenuo son los separadores repetidos, los separadores al principio o al final, las tabulaciones tanto como los espacios, y las cadenas sin ninguna palabra, vacías o formadas solo por separadores, que hay que tratar explícitamente."

