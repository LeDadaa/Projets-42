]

[questions.translations.en]
title = "Walking a string backwards"
stem = "To go through a string from its last character to its first, where does the loop start and stop? Why is `for (size_t i = len - 1; i >= 0; i--)` a bug, and how do you write the loop correctly, including for an empty string?"
explanation = "You first find the length, then go from index `len - 1` down to 0: the `'\\0'` is not part of the text. With a `size_t`, which is unsigned, the condition `i >= 0` is always true, and compilers warn about it: after 0, `i--` wraps around to a huge value and the loop reads far out of bounds. The same wrap-around hits the empty string, where `len - 1` is already a huge number. Either use a signed index, or test before decrementing: `size_t i = len; while (i > 0) { i--; ... }`, which also does nothing on an empty string."

[questions.translations.fr]
title = "Parcourir une chaîne à l'envers"
stem = "Pour parcourir une chaîne de son dernier caractère au premier, où la boucle commence-t-elle et s'arrête-t-elle ? Pourquoi `for (size_t i = len - 1; i >= 0; i--)` est-il un bogue, et comment écrire la boucle correctement, y compris pour une chaîne vide ?"
explanation = "On cherche d'abord la longueur, puis on va de l'indice `len - 1` jusqu'à 0 : le `'\\0'` ne fait pas partie du texte. Avec un `size_t`, qui est non signé, la condition `i >= 0` est toujours vraie, et les compilateurs le signalent : après 0, `i--` repart à une valeur énorme et la boucle lit très loin hors du tableau. Le même rebouclage frappe la chaîne vide, où `len - 1` est déjà un nombre énorme. On utilise soit un indice signé, soit un test avant la décrémentation : `size_t i = len; while (i > 0) { i--; ... }`, qui ne fait rien sur une chaîne vide."

[questions.translations.es]
title = "Recorrer una cadena al revés"
stem = "Para recorrer una cadena desde su último carácter hasta el primero, ¿dónde empieza y dónde termina el bucle? ¿Por qué `for (size_t i = len - 1; i >= 0; i--)` es un error, y cómo escribes el bucle correctamente, también para una cadena vacía?"
explanation = "Primero se busca la longitud y después se va del índice `len - 1` hasta 0: el `'\\0'` no forma parte del texto. Con un `size_t`, que no tiene signo, la condición `i >= 0` siempre es verdadera, y los compiladores lo avisan: después de 0, `i--` da la vuelta a un valor enorme y el bucle lee muy fuera de los límites. La misma vuelta afecta a la cadena vacía, donde `len - 1` ya es un número enorme. Se usa un índice con signo, o se comprueba antes de decrementar: `size_t i = len; while (i > 0) { i--; ... }`, que no hace nada con una cadena vacía."

