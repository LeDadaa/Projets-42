[[questions]]
slug = "rank02-l0-letter-case-in-ascii"
topic = "exam-rank-02-level-0"
kind = "free_text"
difficulty = 1000
tags = ["characters"]
key_points = [
  "In ASCII the letters 'a' to 'z' and 'A' to 'Z' are two contiguous ranges, so a letter is tested with c >= 'a' && c <= 'z' (and the same for capitals).",
  "Each lowercase letter is its capital plus 32, the value of 'a' - 'A'.",
  "Changing the case adds or subtracts 32 ('a' - 'A'), which amounts to flipping one bit (c ^ 32), and only letters may be changed.",
]

[questions.translations.en]
title = "Letter case in ASCII"
stem = "Without any library function, how do you tell whether a `char` is a lowercase or a capital letter, and how do you switch its case? Why must the other characters be left alone?"
explanation = "In ASCII, `'a'` to `'z'` and `'A'` to `'Z'` form two contiguous ranges, so `c >= 'a' && c <= 'z'` tests for a lowercase letter, and likewise for capitals. Each lowercase letter equals its capital plus 32, the value of `'a' - 'A'`: you subtract it to go to capitals and add it to go back. Since 32 is a single bit, switching the case is also `c ^ 32`. That arithmetic only makes sense for letters: applied to `'['` or to a digit, it would produce an unrelated character, so everything else is left untouched."

[questions.translations.fr]
title = "La casse des lettres en ASCII"
stem = "Sans fonction de bibliothèque, comment savoir si un `char` est une lettre minuscule ou majuscule, et comment changer sa casse ? Pourquoi faut-il laisser les autres caractères tranquilles ?"
explanation = "En ASCII, `'a'` à `'z'` et `'A'` à `'Z'` forment deux plages contiguës : `c >= 'a' && c <= 'z'` teste une minuscule, et de même pour les majuscules. Chaque minuscule vaut sa majuscule plus 32, la valeur de `'a' - 'A'` : on la retranche pour passer en majuscule et on l'ajoute pour revenir. Comme 32 est un seul bit, changer la casse s'écrit aussi `c ^ 32`. Ce calcul n'a de sens que pour les lettres : appliqué à `'['` ou à un chiffre, il donnerait un caractère sans rapport, donc tout le reste est laissé intact."

[questions.translations.es]
title = "Mayúsculas y minúsculas en ASCII"
stem = "Sin ninguna función de biblioteca, ¿cómo sabes si un `char` es una letra minúscula o mayúscula, y cómo le cambias la caja? ¿Por qué hay que dejar en paz los demás caracteres?"
explanation = "En ASCII, `'a'` a `'z'` y `'A'` a `'Z'` forman dos rangos contiguos, así que `c >= 'a' && c <= 'z'` comprueba una minúscula, y lo mismo con las mayúsculas. Cada minúscula vale su mayúscula más 32, el valor de `'a' - 'A'`: se resta para pasar a mayúscula y se suma para volver. Como 32 es un solo bit, cambiar la caja también se escribe `c ^ 32`. Ese cálculo solo tiene sentido para las letras: aplicado a `'['` o a una cifra, daría un carácter sin relación, así que todo lo demás se deja intacto."

[[questions.choices]]
correct = true
text = { en = "A lowercase letter is its capital plus 32; the case changes by adding or subtracting 32, on letters only", fr = "Une minuscule vaut sa majuscule plus 32 ; on change la casse en ajoutant ou retranchant 32, et seulement sur des lettres", es = "Una minúscula es su mayúscula más 32; se cambia sumando o restando 32, y solo en letras" }

[[questions.choices]]
text = { en = "The case changes by adding or subtracting 26, the size of the alphabet", fr = "On change la casse en ajoutant ou retranchant 26, la taille de l'alphabet", es = "Se cambia sumando o restando 26, el tamaño del alfabeto" }

[[questions.choices]]
text = { en = "Adding 32 to any character is safe: the ones that are not letters stay as they are", fr = "Ajouter 32 à n'importe quel caractère est sans risque : ceux qui ne sont pas des lettres ne changent pas", es = "Sumar 32 a cualquier carácter no tiene riesgo: los que no son letras no cambian" }

[[questions.choices]]
