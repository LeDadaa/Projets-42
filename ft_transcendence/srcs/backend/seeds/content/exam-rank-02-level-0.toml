slug = "rank02-l0-write-system-call"
topic = "exam-rank-02-level-0"
kind = "free_text"
difficulty = 1000
tags = ["file-descriptors"]
key_points = [
  "write takes a file descriptor, the address of the bytes to send and their count; it writes raw bytes, with no formatting and no terminator added.",
  "File descriptor 1 is the standard output (0 is the standard input, 2 the standard error).",
  "To print one character c, pass its address and a count of 1: write(1, &c, 1).",
  "write returns the number of bytes written, or -1 on error.",
]

[questions.translations.en]
title = "Printing with write"
stem = "The system call `write(fd, buf, n)` is often the only output function allowed. What do its three parameters mean, which descriptor is the standard output, and how do you print a single character stored in a `char c`?"
explanation = "`write` sends `n` raw bytes, read from the address `buf`, to the file descriptor `fd`: nothing is formatted and no terminator is added. Descriptor 1 is the standard output, 0 the standard input and 2 the standard error. To print one character, you pass its address and a count of one: `write(1, &c, 1)`. The call returns the number of bytes actually written, or `-1` on error, for instance on a closed descriptor."

[questions.translations.fr]
title = "Afficher avec write"
stem = "L'appel système `write(fd, buf, n)` est souvent la seule fonction d'affichage autorisée. Que signifient ses trois paramètres, quel descripteur correspond à la sortie standard, et comment afficher un seul caractère rangé dans un `char c` ?"
explanation = "`write` envoie `n` octets bruts, lus à l'adresse `buf`, vers le descripteur de fichier `fd` : rien n'est mis en forme et aucun terminateur n'est ajouté. Le descripteur 1 est la sortie standard, 0 l'entrée standard et 2 la sortie d'erreur. Pour afficher un caractère, on passe son adresse et un nombre d'octets égal à un : `write(1, &c, 1)`. L'appel renvoie le nombre d'octets réellement écrits, ou `-1` en cas d'erreur, par exemple sur un descripteur fermé."

[questions.translations.es]
title = "Mostrar con write"
stem = "La llamada al sistema `write(fd, buf, n)` suele ser la única función de salida permitida. ¿Qué significan sus tres parámetros, qué descriptor corresponde a la salida estándar y cómo muestras un solo carácter guardado en un `char c`?"
explanation = "`write` envía `n` bytes en bruto, leídos en la dirección `buf`, al descriptor de fichero `fd`: no se formatea nada ni se añade ningún terminador. El descriptor 1 es la salida estándar, el 0 la entrada estándar y el 2 la salida de error. Para mostrar un carácter se pasa su dirección y una cantidad de uno: `write(1, &c, 1)`. La llamada devuelve el número de bytes escritos de verdad, o `-1` si hay un error, por ejemplo con un descriptor cerrado."

