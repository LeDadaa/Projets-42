[questions.translations.en]
title = "Which strings can be modified"
stem = "A function changes the characters of the string it receives in place. Why does it crash when called with `char *s = \"hello\";`, but work with `char s[] = \"hello\";` or with `argv[1]`?"
explanation = "A string literal may be stored in read-only memory: `char *s = \"hello\"` only points at it, and writing through `s` is undefined behaviour, which in practice usually ends in a segmentation fault. `char s[] = \"hello\"` is something else: an array, on the stack for a local variable, initialised with a copy of the literal, which you can modify freely. The strings of `argv` belong to the program as well, and the C standard allows modifying them. Declaring `const char *s = \"hello\"` makes the compiler reject accidental writes to a literal."

[questions.translations.fr]
title = "Quelles chaînes peut-on modifier"
stem = "Une fonction modifie sur place les caractères de la chaîne qu'elle reçoit. Pourquoi plante-t-elle quand on l'appelle avec `char *s = \"hello\";`, mais fonctionne-t-elle avec `char s[] = \"hello\";` ou avec `argv[1]` ?"
explanation = "Un littéral de chaîne peut être rangé en mémoire en lecture seule : `char *s = \"hello\"` ne fait que pointer dessus, et écrire à travers `s` est un comportement indéfini, qui se termine en pratique le plus souvent par une erreur de segmentation. `char s[] = \"hello\"` est autre chose : un tableau, sur la pile pour une variable locale, initialisé avec une copie du littéral, qu'on peut modifier librement. Les chaînes de `argv` appartiennent elles aussi au programme, et la norme C autorise à les modifier. Déclarer `const char *s = \"hello\"` fait refuser par le compilateur toute écriture accidentelle dans un littéral."

[questions.translations.es]
title = "Qué cadenas se pueden modificar"
stem = "Una función modifica en el sitio los caracteres de la cadena que recibe. ¿Por qué falla cuando se llama con `char *s = \"hello\";`, pero funciona con `char s[] = \"hello\";` o con `argv[1]`?"
explanation = "Un literal de cadena puede guardarse en memoria de solo lectura: `char *s = \"hello\"` solo apunta a él, y escribir a través de `s` es comportamiento indefinido, que en la práctica suele acabar en un fallo de segmentación. `char s[] = \"hello\"` es otra cosa: un array, en la pila si es una variable local, inicializado con una copia del literal, que se puede modificar libremente. Las cadenas de `argv` también pertenecen al programa, y el estándar de C permite modificarlas. Declarar `const char *s = \"hello\"` hace que el compilador rechace cualquier escritura accidental en un literal."

