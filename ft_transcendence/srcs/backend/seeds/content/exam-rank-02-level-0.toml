[questions.translations.en]
title = "Testing multiples"
stem = "A program must treat numbers differently depending on whether they are multiples of 3, of 5, or of both. How do you test that a number is a multiple of another, and in which order must the tests of an `if / else if` chain come? Why?"
explanation = "`n` is a multiple of `d` exactly when the remainder of the division is zero: `n % d == 0`. A number divisible by both 3 and 5 is divisible by 15, since 3 and 5 share no factor, so `n % 15 == 0` tests both at once. In an `if / else if` chain the first true condition wins, so the most specific case must come first: tested first, `n % 3 == 0` would also catch 15, 30, 45 and the other multiples of 15, which is six wrong answers between 1 and 100."

[questions.translations.fr]
title = "Tester des multiples"
stem = "Un programme doit traiter des nombres différemment selon qu'ils sont multiples de 3, de 5, ou des deux. Comment tester qu'un nombre est multiple d'un autre, et dans quel ordre placer les tests d'une chaîne `if / else if` ? Pourquoi ?"
explanation = "`n` est un multiple de `d` exactement quand le reste de la division est nul : `n % d == 0`. Un nombre divisible par 3 et par 5 est divisible par 15, puisque 3 et 5 n'ont aucun facteur commun : `n % 15 == 0` teste donc les deux à la fois. Dans une chaîne `if / else if`, la première condition vraie l'emporte, donc le cas le plus précis doit venir en premier : testé d'abord, `n % 3 == 0` attraperait aussi 15, 30, 45 et les autres multiples de 15, soit six mauvaises réponses entre 1 et 100."

[questions.translations.es]
title = "Comprobar múltiplos"
stem = "Un programa debe tratar los números de forma distinta según sean múltiplos de 3, de 5 o de ambos. ¿Cómo compruebas que un número es múltiplo de otro, y en qué orden deben ir las condiciones de una cadena `if / else if`? ¿Por qué?"
explanation = "`n` es múltiplo de `d` exactamente cuando el resto de la división es cero: `n % d == 0`. Un número divisible por 3 y por 5 es divisible por 15, ya que 3 y 5 no tienen ningún factor común, así que `n % 15 == 0` comprueba ambas cosas a la vez. En una cadena `if / else if` gana la primera condición verdadera, así que el caso más específico debe ir primero: comprobada antes, `n % 3 == 0` atraparía también 15, 30, 45 y los demás múltiplos de 15, seis respuestas erróneas entre 1 y 100."

