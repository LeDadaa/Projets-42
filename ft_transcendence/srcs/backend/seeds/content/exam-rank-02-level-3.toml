[[questions]]
slug = "rank02-l3-generic-void-pointers"
topic = "exam-rank-02-level-3"
kind = "free_text"
difficulty = 1200
tags = ["pointers"]
key_points = [
  "A void * can hold the address of any object, which lets a list node or a function carry data of any type.",
  "A void * cannot be dereferenced: it must first be converted to a pointer to the real type, such as *(int *)p.",
  "Pointer arithmetic on void * is not allowed in standard C, because the size of the pointed object is unknown.",
  "Nothing checks the conversion: the code must know the real type, or the read is wrong.",
]

[questions.translations.en]
title = "Generic data with void *"
stem = "A linked list stores its data as `void *`. What can such a pointer hold, why can't you write `*p` or `p + 1` with it, and how do you read the integer it points to?"
explanation = "A `void *` can hold the address of any object, which is what lets one list type carry integers, strings or structures. In exchange it has no pointed type: `*p` is refused, because the compiler does not know what to read, and `p + 1` is not standard C either, because the size of the pointed object is unknown; GCC only allows it as an extension, and rejects it in strict mode. To use the data, you convert the pointer to the real type first: `*(int *)p` reads the integer. Nothing checks that conversion, so the code must know what type was stored."

[questions.translations.fr]
title = "Des données génériques avec void *"
stem = "Une liste chaînée range ses données sous forme de `void *`. Que peut contenir un tel pointeur, pourquoi ne peut-on pas écrire `*p` ni `p + 1` avec lui, et comment lire l'entier vers lequel il pointe ?"
explanation = "Un `void *` peut contenir l'adresse de n'importe quel objet : c'est ce qui permet à un même type de liste de porter des entiers, des chaînes ou des structures. En échange, il n'a pas de type pointé : `*p` est refusé, parce que le compilateur ne sait pas quoi lire, et `p + 1` n'est pas du C standard non plus, parce que la taille de l'objet pointé est inconnue ; GCC ne l'accepte que comme extension, et le refuse en mode strict. Pour utiliser la donnée, on convertit d'abord le pointeur vers le vrai type : `*(int *)p` lit l'entier. Rien ne vérifie cette conversion, donc le code doit savoir quel type a été rangé."

[questions.translations.es]
title = "Datos genéricos con void *"
stem = "Una lista enlazada guarda sus datos como `void *`. ¿Qué puede contener un puntero así, por qué no puedes escribir `*p` ni `p + 1` con él, y cómo lees el entero al que apunta?"
explanation = "Un `void *` puede contener la dirección de cualquier objeto: es lo que permite que un mismo tipo de lista lleve enteros, cadenas o estructuras. A cambio, no tiene tipo apuntado: `*p` se rechaza, porque el compilador no sabe qué leer, y `p + 1` tampoco es C estándar, porque se desconoce el tamaño del objeto apuntado; GCC solo lo acepta como extensión y lo rechaza en modo estricto. Para usar el dato, primero se convierte el puntero al tipo real: `*(int *)p` lee el entero. Nada comprueba esa conversión, así que el código debe saber qué tipo se guardó."

[[questions.choices]]
correct = true
text = { en = "It holds the address of any object, but must be converted before being read: `*(int *)p`, and arithmetic on it is not allowed", fr = "Il contient l'adresse de n'importe quel objet, mais doit être converti avant d'être lu : `*(int *)p`, et l'arithmétique dessus est interdite", es = "Contiene la dirección de cualquier objeto, pero hay que convertirlo antes de leerlo: `*(int *)p`, y la aritmética sobre él no está permitida" }

[[questions.choices]]
text = { en = "`*p` works: the compiler deduces the type from what the pointer was assigned", fr = "`*p` fonctionne : le compilateur déduit le type de ce qui a été affecté au pointeur", es = "`*p` funciona: el compilador deduce el tipo de lo que se asignó al puntero" }

[[questions.choices]]
text = { en = "`p + 1` moves forward by one byte, since `void` has a size of 1", fr = "`p + 1` avance d'un octet, puisque `void` a une taille de 1", es = "`p + 1` avanza un byte, ya que `void` tiene tamaño 1" }

[[questions.choices]]
text = { en = "The conversion is checked at run time and fails when the real type is not the one given", fr = "La conversion est vérifiée à l'exécution et échoue quand le vrai type n'est pas celui annoncé", es = "La conversión se comprueba en ejecución y falla cuando el tipo real no es el indicado" }

[[questions]]
slug = "rank02-l3-removing-list-nodes"
topic = "exam-rank-02-level-3"
kind = "free_text"
difficulty = 1400
tags = ["linked-lists", "memory"]
key_points = [
  "The function receives a pointer to the head pointer (t_list **), because removing the first node changes the head, which the caller must see.",
  "To remove a node: save it, make the pointer that pointed to it point to its next node, then free the saved node; reading next after free would be a use after free.",
  "After a removal the position must not advance, since the new node at that place still has to be tested; this handles several matching nodes in a row.",
  "Walking with a pointer to the current link (&node->next) handles the head and the middle of the list with the same code.",
]

[questions.translations.en]
title = "Removing nodes from a linked list"
stem = "A function removes from a singly linked list every node whose data matches a reference, and frees them. Why must it receive a `t_list **` rather than a `t_list *`? In what order must a node be unlinked and freed, and what happens with several matching nodes in a row?"
explanation = "Removing the first node changes the head of the list, and the caller must see that change, so the function receives the address of the head pointer. To remove a node, save it, make the link that pointed to it point to its `next`, then free the saved node; freeing first and reading `next` afterwards would read freed memory. After a removal, the position does not advance: the node now sitting there has not been tested yet, which is what makes several matching nodes in a row disappear. Walking with a pointer to the current link, starting at the head and then `&node->next`, treats the head and the rest of the list with the same code."

[questions.translations.fr]
title = "Retirer des maillons d'une liste chaînée"
stem = "Une fonction retire d'une liste simplement chaînée tous les maillons dont la donnée correspond à une référence, et les libère. Pourquoi doit-elle recevoir un `t_list **` plutôt qu'un `t_list *` ? Dans quel ordre faut-il décrocher puis libérer un maillon, et que se passe-t-il avec plusieurs maillons correspondants à la suite ?"
explanation = "Retirer le premier maillon change la tête de la liste, et l'appelant doit voir ce changement : la fonction reçoit donc l'adresse du pointeur de tête. Pour retirer un maillon, on le sauvegarde, on fait pointer le lien qui menait à lui vers son `next`, puis on libère le maillon sauvegardé ; libérer d'abord et lire `next` ensuite reviendrait à lire une mémoire déjà libérée. Après un retrait, la position n'avance pas : le maillon qui occupe maintenant cette place n'a pas encore été testé, et c'est ce qui fait disparaître plusieurs maillons correspondants à la suite. Parcourir avec un pointeur vers le lien courant, en partant de la tête puis `&node->next`, traite la tête et le reste de la liste avec le même code."

[questions.translations.es]
title = "Quitar nodos de una lista enlazada"
stem = "Una función quita de una lista simplemente enlazada todos los nodos cuyo dato coincide con una referencia, y los libera. ¿Por qué debe recibir un `t_list **` en lugar de un `t_list *`? ¿En qué orden hay que desenganchar y liberar un nodo, y qué pasa con varios nodos coincidentes seguidos?"
explanation = "Quitar el primer nodo cambia la cabeza de la lista, y quien llama debe ver ese cambio, así que la función recibe la dirección del puntero de cabeza. Para quitar un nodo, se guarda, se hace que el enlace que llevaba a él apunte a su `next` y después se libera el nodo guardado; liberar primero y leer `next` después sería leer memoria ya liberada. Tras una eliminación, la posición no avanza: el nodo que ahora ocupa ese lugar todavía no se ha comprobado, y eso es lo que hace desaparecer varios nodos coincidentes seguidos. Recorrer con un puntero al enlace actual, empezando por la cabeza y luego `&node->next`, trata la cabeza y el resto de la lista con el mismo código."

[[questions.choices]]
correct = true
text = { en = "A `t_list **`, because removing the first node changes the head the caller holds; unlink, then free, and do not advance after a removal", fr = "Un `t_list **`, parce que retirer le premier nœud change la tête que détient l'appelant ; détacher, puis libérer, et ne pas avancer après un retrait", es = "Un `t_list **`, porque quitar el primer nodo cambia la cabeza que tiene quien llama; desenlazar, después liberar, y no avanzar tras una eliminación" }

[[questions.choices]]
text = { en = "A `t_list *` is enough, since the nodes themselves are reached through it", fr = "Un `t_list *` suffit, puisque les nœuds eux-mêmes sont atteints par lui", es = "Un `t_list *` basta, ya que por él se alcanzan los propios nodos" }

[[questions.choices]]
text = { en = "Free the node first, then read its `next` to carry on down the list", fr = "Libérer le nœud d'abord, puis lire son `next` pour continuer la liste", es = "Liberar el nodo primero y luego leer su `next` para seguir la lista" }

[[questions.choices]]
text = { en = "Advance at every step, removal included: two matching nodes cannot follow each other", fr = "Avancer à chaque pas, retrait compris : deux nœuds correspondants ne peuvent pas se suivre", es = "Avanzar en cada paso, eliminación incluida: dos nodos coincidentes no pueden seguirse" }

