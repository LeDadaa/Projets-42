  "The in-place method needs no extra memory and runs in linear time: every character is moved twice.",
]

[questions.translations.en]
title = "Reversing the order of the words"
stem = "You want the words of a sentence in reverse order, each word keeping its own spelling: `\"one two three\"` becomes `\"three two one\"`. Describe two ways to do it, one of them working in place in the string's memory. What does the in-place method cost?"
explanation = "The first way walks the string from its end: it finds where each word ends and starts, and prints the words from the last to the first. The second works in place, in two steps. Reversing the whole string gives `\"eerht owt eno\"`: the words are in the right order but spelled backwards. Reversing each word once more restores its letters, and the result is `\"three two one\"`. That method needs no extra memory and runs in linear time, since every character is moved twice."

[questions.translations.fr]
title = "Inverser l'ordre des mots"
stem = "On veut les mots d'une phrase dans l'ordre inverse, chaque mot gardant son orthographe : `\"one two three\"` devient `\"three two one\"`. Décrivez deux façons de faire, dont une qui travaille sur place, dans la mémoire de la chaîne. Que coûte la méthode sur place ?"
explanation = "La première façon parcourt la chaîne depuis la fin : elle repère où chaque mot se termine et commence, et affiche les mots du dernier au premier. La seconde travaille sur place, en deux temps. Inverser toute la chaîne donne `\"eerht owt eno\"` : les mots sont dans le bon ordre mais écrits à l'envers. Inverser chaque mot une seconde fois rétablit ses lettres, et le résultat est `\"three two one\"`. Cette méthode n'a besoin d'aucune mémoire supplémentaire et tourne en temps linéaire, puisque chaque caractère est déplacé deux fois."

[questions.translations.es]
title = "Invertir el orden de las palabras"
stem = "Quieres las palabras de una frase en orden inverso, conservando cada palabra su escritura: `\"one two three\"` se convierte en `\"three two one\"`. Describe dos formas de hacerlo, una de ellas trabajando en el sitio, en la memoria de la cadena. ¿Cuánto cuesta el método en el sitio?"
explanation = "La primera forma recorre la cadena desde el final: localiza dónde termina y empieza cada palabra, y muestra las palabras de la última a la primera. La segunda trabaja en el sitio, en dos pasos. Invertir toda la cadena da `\"eerht owt eno\"`: las palabras están en el orden correcto pero escritas al revés. Invertir cada palabra una segunda vez restaura sus letras, y el resultado es `\"three two one\"`. Ese método no necesita memoria adicional y funciona en tiempo lineal, ya que cada carácter se mueve dos veces."

[[questions.choices]]
correct = true
text = { en = "Reverse the whole string, then reverse each word again: linear, no extra memory, every character moved twice", fr = "Inverser toute la chaîne, puis réinverser chaque mot : linéaire, sans mémoire supplémentaire, chaque caractère déplacé deux fois", es = "Invertir toda la cadena y después volver a invertir cada palabra: lineal, sin memoria extra, cada carácter movido dos veces" }

[[questions.choices]]
text = { en = "Reversing the whole string is enough: the words then read in the right order", fr = "Inverser toute la chaîne suffit : les mots se lisent alors dans le bon ordre", es = "Invertir toda la cadena basta: las palabras se leen entonces en el orden correcto" }

[[questions.choices]]
text = { en = "In place it still needs a buffer the size of the longest word", fr = "Sur place, il faut quand même un tampon de la taille du mot le plus long", es = "En el sitio hace falta igualmente un búfer del tamaño de la palabra más larga" }

[[questions.choices]]
text = { en = "Only a second array of pointers can do it: the string's own memory cannot be reused", fr = "Seul un second tableau de pointeurs peut y arriver : la mémoire de la chaîne ne peut pas être réutilisée", es = "Solo un segundo array de punteros puede lograrlo: la memoria de la cadena no se puede reutilizar" }

[[questions]]
slug = "rank02-l3-sorting-an-array-in-place"
topic = "exam-rank-02-level-3"
kind = "free_text"
difficulty = 1000
tags = ["sorting", "complexity"]
key_points = [
  "A simple in-place sort such as bubble sort compares neighbours and swaps them when out of order, repeating passes until a pass makes no swap.",
  "Insertion sort instead takes each element in turn and shifts it left into its place among the already sorted ones.",
  "Both only swap or shift elements, so duplicate values are kept, and both cost O(n²) comparisons in the worst case.",
  "Faster sorts such as merge sort or quicksort run in O(n log n), which matters for large arrays.",
]

[questions.translations.en]
title = "Sorting an array in place"
stem = "Describe a simple way to sort an array of `int` in ascending order in its own memory, keeping duplicate values. How does it work, what does it cost, and when does that cost start to matter?"
explanation = "Bubble sort walks the array comparing neighbours and swaps them when they are out of order; each pass pushes the largest remaining value to the end, and it stops after a pass with no swap. Insertion sort takes each element in turn and shifts it left until it sits among the already sorted ones, which is very fast on a nearly sorted array. Both only exchange or shift elements, so duplicates are kept, and both cost `O(n²)` comparisons in the worst case. That is fine for a few hundred values; for large arrays, merge sort or quicksort, in `O(n log n)`, make the difference."

[questions.translations.fr]
title = "Trier un tableau sur place"
stem = "Décrivez une façon simple de trier par ordre croissant un tableau d'`int` dans sa propre mémoire, en gardant les valeurs en double. Comment fonctionne-t-elle, que coûte-t-elle, et à partir de quand ce coût compte-t-il ?"
explanation = "Le tri à bulles parcourt le tableau en comparant les voisins et les échange quand ils sont dans le désordre ; chaque passage pousse la plus grande valeur restante vers la fin, et il s'arrête après un passage sans échange. Le tri par insertion prend chaque élément à son tour et le décale vers la gauche jusqu'à sa place parmi ceux déjà triés, ce qui est très rapide sur un tableau presque trié. Les deux ne font qu'échanger ou décaler des éléments, donc les doublons sont conservés, et les deux coûtent `O(n²)` comparaisons dans le pire cas. C'est très bien pour quelques centaines de valeurs ; pour de grands tableaux, le tri fusion ou le tri rapide, en `O(n log n)`, font la différence."

[questions.translations.es]
title = "Ordenar un array en el sitio"
stem = "Describe una forma sencilla de ordenar de menor a mayor un array de `int` en su propia memoria, conservando los valores repetidos. ¿Cómo funciona, cuánto cuesta y a partir de cuándo importa ese coste?"
explanation = "La ordenación de burbuja recorre el array comparando vecinos y los intercambia cuando están desordenados; cada pasada empuja el mayor valor restante hacia el final, y se detiene tras una pasada sin intercambios. La ordenación por inserción toma cada elemento por turno y lo desplaza a la izquierda hasta su lugar entre los ya ordenados, lo que es muy rápido con un array casi ordenado. Ambas solo intercambian o desplazan elementos, así que los repetidos se conservan, y ambas cuestan `O(n²)` comparaciones en el peor caso. Está muy bien para unos cientos de valores; para arrays grandes, la ordenación por mezcla o la rápida, en `O(n log n)`, marcan la diferencia."

[[questions.choices]]
correct = true
text = { en = "Bubble sort swaps neighbours out of order, insertion sort shifts each element into place; both keep duplicates and cost O(n²) in the worst case", fr = "Le tri à bulles échange les voisins mal ordonnés, le tri par insertion décale chaque élément à sa place ; les deux gardent les doublons et coûtent O(n²) au pire", es = "La ordenación de burbuja intercambia vecinos desordenados, la de inserción desplaza cada elemento a su sitio; ambas conservan duplicados y cuestan O(n²) en el peor caso" }

[[questions.choices]]
text = { en = "Duplicate values must be removed first, otherwise the sort never ends", fr = "Les valeurs en double doivent être retirées d'abord, sinon le tri ne se termine jamais", es = "Hay que quitar primero los valores repetidos, si no la ordenación no termina nunca" }

[[questions.choices]]
text = { en = "Bubble sort costs O(n log n), like merge sort", fr = "Le tri à bulles coûte O(n log n), comme le tri fusion", es = "La ordenación de burbuja cuesta O(n log n), como la ordenación por mezcla" }

[[questions.choices]]
text = { en = "Sorting in place still requires a second array of the same size", fr = "Trier sur place demande quand même un second tableau de la même taille", es = "Ordenar en el sitio exige igualmente un segundo array del mismo tamaño" }

[[questions]]
slug = "rank02-l3-sorting-a-linked-list"
topic = "exam-rank-02-level-3"
kind = "free_text"
difficulty = 1400
tags = ["sorting", "linked-lists"]
key_points = [
  "The simplest method keeps the nodes in place and swaps their data, for instance with bubble passes, restarting from the head after each swap or until a pass makes no swap.",
  "The ordering is given by a comparison function passed as a pointer, which tells whether two values are in the right order.",
  "Relinking nodes instead of swapping data avoids copying large data but needs careful pointer updates, and may change which node is the head, so the new head is returned.",
  "A list has no random access, so merge sort (split, sort each half, merge) suits it best, in O(n log n).",
]

[questions.translations.en]
title = "Sorting a linked list"
stem = "How can a singly linked list of integers be sorted according to a comparison function passed as a pointer? Compare swapping the data of the nodes with relinking the nodes themselves, and say which sorting algorithm suits a list best."
explanation = "The simplest method leaves the nodes where they are and swaps their data: passes of bubble sort compare each node with the next one, ask the comparison function whether they are in order, and swap the two values when they are not, until a pass changes nothing. Relinking the nodes instead avoids copying large data, but every swap updates several pointers, and the head may change, so the function returns the new head. A list offers no access by index, which rules out many array sorts; merge sort fits it well: split the list in two, sort each half, merge them by relinking, in `O(n log n)`."

[questions.translations.fr]
title = "Trier une liste chaînée"
stem = "Comment trier une liste simplement chaînée d'entiers selon une fonction de comparaison passée en pointeur ? Comparez l'échange des données des maillons et le réagencement des maillons eux-mêmes, et dites quel algorithme de tri convient le mieux à une liste."
explanation = "La méthode la plus simple laisse les maillons à leur place et échange leurs données : des passages de tri à bulles comparent chaque maillon au suivant, demandent à la fonction de comparaison s'ils sont dans l'ordre, et échangent les deux valeurs sinon, jusqu'à un passage qui ne change rien. Réagencer les maillons évite de copier des données volumineuses, mais chaque échange met à jour plusieurs pointeurs, et la tête peut changer : la fonction renvoie donc la nouvelle tête. Une liste n'offre pas d'accès par indice, ce qui écarte beaucoup de tris de tableaux ; le tri fusion lui convient bien : couper la liste en deux, trier chaque moitié, les fusionner en réagençant les maillons, en `O(n log n)`."

[questions.translations.es]
title = "Ordenar una lista enlazada"
stem = "¿Cómo se ordena una lista simplemente enlazada de enteros según una función de comparación pasada como puntero? Compara intercambiar los datos de los nodos con reenlazar los propios nodos, y di qué algoritmo de ordenación conviene más a una lista."
explanation = "El método más sencillo deja los nodos en su sitio e intercambia sus datos: pasadas de ordenación de burbuja comparan cada nodo con el siguiente, preguntan a la función de comparación si están en orden e intercambian los dos valores si no lo están, hasta una pasada que no cambia nada. Reenlazar los nodos evita copiar datos grandes, pero cada intercambio actualiza varios punteros y la cabeza puede cambiar, así que la función devuelve la nueva cabeza. Una lista no ofrece acceso por índice, lo que descarta muchas ordenaciones de arrays; la ordenación por mezcla le va bien: dividir la lista en dos, ordenar cada mitad y fusionarlas reenlazando los nodos, en `O(n log n)`."

[[questions.choices]]
correct = true
text = { en = "Swapping the data is simplest and leaves the head alone; relinking avoids copying but may change the head, which must then be returned, and merge sort suits a list best", fr = "Échanger les données est le plus simple et laisse la tête tranquille ; relier les nœuds évite la copie mais peut changer la tête, qu'il faut alors renvoyer, et le tri fusion convient le mieux à une liste", es = "Intercambiar los datos es lo más simple y no toca la cabeza; reenlazar evita copiar pero puede cambiar la cabeza, que hay que devolver, y la ordenación por mezcla es la que mejor le va a una lista" }

[[questions.choices]]
text = { en = "Quicksort suits a list best, since it works in place", fr = "Le tri rapide convient le mieux à une liste, puisqu'il travaille sur place", es = "La ordenación rápida es la que mejor le va a una lista, ya que trabaja en el sitio" }

[[questions.choices]]
text = { en = "Relinking never changes the head, which is fixed once the list is built", fr = "Relier les nœuds ne change jamais la tête, fixée une fois la liste construite", es = "Reenlazar nunca cambia la cabeza, fijada una vez construida la lista" }

[[questions.choices]]
text = { en = "A list can be sorted by index like an array, since reaching element `i` costs the same", fr = "Une liste peut être triée par indice comme un tableau, puisque atteindre l'élément `i` coûte pareil", es = "Una lista puede ordenarse por índice como un array, ya que llegar al elemento `i` cuesta lo mismo" }
