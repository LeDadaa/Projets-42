# repository, not even rephrased: no statement, no exercise name, no file name.
# Key points are in English, one grid for every language. Slugs are public, so
# they name the topic of a question, never its answer.

[[questions]]
slug = "rank02-l3-filling-a-region"
topic = "exam-rank-02-level-3"
kind = "free_text"
difficulty = 1200
tags = ["recursion", "algorithms"]
key_points = [
  "From the starting cell, a recursive function stops if the cell is outside the grid or does not hold the character being replaced; otherwise it changes the cell and calls itself on the four neighbours (up, down, left, right).",
  "The cell must be changed before the recursive calls; otherwise two neighbours keep calling each other forever.",
  "Every recursive call uses stack space, and the depth can reach the number of cells of the region, so a very large region overflows the stack and crashes.",
  "An explicit stack or queue of cells to visit does the same work without deep recursion.",
]

[questions.translations.en]
title = "Filling a region of a grid"
stem = "Starting from one cell of a character grid, you want to replace a whole region of identical characters connected horizontally and vertically. How does a recursive function do it, why must a cell be changed before the recursive calls, and why can it crash on a very large region?"
explanation = "The function receives a cell. It stops if the cell is outside the grid or does not hold the character being replaced; otherwise it changes the cell, then calls itself on the four neighbours, up, down, left and right. The cell is changed before the calls: otherwise two neighbours would call each other forever, each seeing the other as still to fill. Each call uses a little stack, and the depth can reach the number of cells of the region: on an open 3000 × 3000 grid, the recursive version exhausts the stack and dies with a segmentation fault. An explicit stack or queue of cells to visit does the same work without that limit."

[questions.translations.fr]
title = "Remplir une zone d'une grille"
stem = "À partir d'une case d'une grille de caractères, on veut remplacer toute une zone de caractères identiques reliés horizontalement et verticalement. Comment une fonction récursive s'y prend-elle, pourquoi faut-il modifier une case avant les appels récursifs, et pourquoi peut-elle planter sur une très grande zone ?"
explanation = "La fonction reçoit une case. Elle s'arrête si la case est hors de la grille ou ne contient pas le caractère à remplacer ; sinon elle modifie la case, puis s'appelle sur les quatre voisines, en haut, en bas, à gauche et à droite. La case est modifiée avant les appels : sans cela, deux voisines s'appelleraient l'une l'autre indéfiniment, chacune voyant l'autre comme encore à remplir. Chaque appel consomme un peu de pile, et la profondeur peut atteindre le nombre de cases de la zone : sur une grille ouverte de 3000 × 3000, la version récursive épuise la pile et meurt sur une erreur de segmentation. Une pile ou une file explicite de cases à visiter fait le même travail sans cette limite."

[questions.translations.es]
title = "Rellenar una zona de una cuadrícula"
stem = "A partir de una casilla de una cuadrícula de caracteres, quieres sustituir toda una zona de caracteres idénticos conectados horizontal y verticalmente. ¿Cómo lo hace una función recursiva, por qué hay que modificar una casilla antes de las llamadas recursivas y por qué puede fallar con una zona muy grande?"
explanation = "La función recibe una casilla. Se detiene si la casilla está fuera de la cuadrícula o no contiene el carácter que se sustituye; si no, modifica la casilla y se llama a sí misma sobre las cuatro vecinas, arriba, abajo, izquierda y derecha. La casilla se modifica antes de las llamadas: si no, dos vecinas se llamarían una a otra sin fin, cada una viendo a la otra como pendiente de rellenar. Cada llamada consume algo de pila, y la profundidad puede llegar al número de casillas de la zona: en una cuadrícula abierta de 3000 × 3000, la versión recursiva agota la pila y muere con un fallo de segmentación. Una pila o una cola explícita de casillas por visitar hace el mismo trabajo sin ese límite."

[[questions.choices]]
correct = true
text = { en = "Change the cell **before** the four recursive calls; the depth can reach the size of the region, so a very large one overflows the stack", fr = "Changer la case **avant** les quatre appels récursifs ; la profondeur peut atteindre la taille de la région, donc une très grande déborde la pile", es = "Cambiar la casilla **antes** de las cuatro llamadas recursivas; la profundidad puede llegar al tamaño de la región, así que una muy grande desborda la pila" }

[[questions.choices]]
text = { en = "Change the cell after the four calls, so that the neighbours still see the original character", fr = "Changer la case après les quatre appels, pour que les voisines voient encore le caractère d'origine", es = "Cambiar la casilla tras las cuatro llamadas, para que las vecinas vean aún el carácter original" }

[[questions.choices]]
text = { en = "Recursion cannot overflow here: each call only holds a few variables", fr = "La récursion ne peut pas déborder ici : chaque appel ne garde que quelques variables", es = "La recursión no puede desbordar aquí: cada llamada solo guarda unas pocas variables" }

[[questions.choices]]
text = { en = "The eight neighbours have to be visited, diagonals included", fr = "Les huit voisines doivent être visitées, diagonales comprises", es = "Hay que visitar las ocho vecinas, diagonales incluidas" }

[[questions]]
slug = "rank02-l3-prime-factorization"
topic = "exam-rank-02-level-3"
kind = "free_text"
difficulty = 1200
tags = ["number-theory"]
key_points = [
  "Try divisors d from 2 upward; while d divides n, record d and divide n by it, so a factor appearing several times is recorded each time.",
  "Only primes are recorded: by the time d is tried, its own prime factors have already been divided out of n.",
  "Stop when d exceeds the square root of what remains of n; if more than 1 is left, it is itself a prime factor.",
  "Factors come out in ascending order, since d only grows.",
]

[questions.translations.en]
title = "Breaking a number into prime factors"
stem = "How do you break a positive integer into prime factors, listed in ascending order with repetitions, such as 360 = 2 × 2 × 2 × 3 × 3 × 5? Why does the method never record a number that is not prime, and when can the loop stop?"
explanation = "Try the divisors `d` from 2 upward, and while `d` divides `n`, record it and divide `n` by it: a factor that appears several times is recorded each time. A composite `d` is never recorded, because by the time it is tried, its own prime factors have already been divided out of `n`, so it cannot divide what is left. The loop can stop once `d` exceeds the square root of what remains; if more than 1 is left, that rest is itself prime and is the last factor. Since `d` only grows, the factors come out in ascending order."

[questions.translations.fr]
title = "Décomposer un nombre en facteurs premiers"
stem = "Comment décomposer un entier positif en facteurs premiers, listés par ordre croissant avec leurs répétitions, comme 360 = 2 × 2 × 2 × 3 × 3 × 5 ? Pourquoi la méthode ne retient-elle jamais un nombre qui n'est pas premier, et quand la boucle peut-elle s'arrêter ?"
explanation = "On essaie les diviseurs `d` à partir de 2, et tant que `d` divise `n`, on le retient et on divise `n` par lui : un facteur qui apparaît plusieurs fois est retenu à chaque fois. Un `d` composé n'est jamais retenu, car au moment où il est essayé, ses propres facteurs premiers ont déjà été retirés de `n`, donc il ne peut pas diviser ce qui reste. La boucle peut s'arrêter dès que `d` dépasse la racine carrée de ce qui reste ; s'il reste plus que 1, ce reste est lui-même premier et c'est le dernier facteur. Comme `d` ne fait que croître, les facteurs sortent par ordre croissant."

[questions.translations.es]
title = "Descomponer un número en factores primos"
stem = "¿Cómo descompones un entero positivo en factores primos, en orden creciente y con repeticiones, como 360 = 2 × 2 × 2 × 3 × 3 × 5? ¿Por qué el método nunca anota un número que no es primo, y cuándo puede parar el bucle?"
explanation = "Se prueban los divisores `d` desde 2 hacia arriba y, mientras `d` divida a `n`, se anota y se divide `n` entre él: un factor que aparece varias veces se anota cada vez. Un `d` compuesto nunca se anota, porque cuando se prueba, sus propios factores primos ya se han quitado de `n`, así que no puede dividir lo que queda. El bucle puede parar en cuanto `d` supera la raíz cuadrada de lo que queda; si queda más de 1, ese resto es primo y es el último factor. Como `d` solo crece, los factores salen en orden creciente."

[[questions.choices]]
correct = true
text = { en = "Divide by `d` from 2 upward while it divides; only primes are recorded because their own factors are already gone, and what is left above 1 at the end is prime", fr = "Diviser par `d` à partir de 2 tant qu'il divise ; seuls des premiers sont retenus car leurs propres facteurs ont déjà été retirés, et ce qui reste au-dessus de 1 à la fin est premier", es = "Dividir por `d` desde 2 mientras divida; solo se registran primos porque sus propios factores ya se han quitado, y lo que queda por encima de 1 al final es primo" }

[[questions.choices]]
text = { en = "`d` must be tested for primality first, otherwise composite factors are recorded", fr = "`d` doit d'abord être testé comme premier, sinon des facteurs composés sont retenus", es = "Hay que comprobar primero que `d` es primo, si no se registran factores compuestos" }

[[questions.choices]]
text = { en = "Stop as soon as `d` passes the square root and drop whatever is left of `n`", fr = "S'arrêter dès que `d` dépasse la racine carrée et abandonner ce qui reste de `n`", es = "Parar en cuanto `d` supere la raíz cuadrada y descartar lo que quede de `n`" }

[[questions.choices]]
text = { en = "Each factor is recorded once, whatever the number of times it divides", fr = "Chaque facteur n'est retenu qu'une fois, quel que soit le nombre de fois où il divise", es = "Cada factor se registra una vez, sin importar cuántas veces divida" }

[[questions]]
slug = "rank02-l3-integer-to-string"
topic = "exam-rank-02-level-3"
kind = "free_text"
difficulty = 1200
tags = ["conversions", "memory"]
key_points = [
  "Count the characters first: one per digit, plus one for a minus sign, and 0 counts as one digit; then allocate that count plus 1 for the terminator.",
  "Fill the digits from the end of the buffer with n % 10 and n / 10, and put '-' at index 0 for a negative number.",
  "INT_MIN cannot be negated in an int, so the conversion works in a wider type (long) or handles that value separately.",
  "Return NULL if malloc fails; the caller frees the returned string.",
]

[questions.translations.en]
title = "Turning an int into an allocated string"
stem = "A function converts an `int` into a newly allocated string, as `\"-7\"` for -7. How many bytes must it allocate, in which order does it fill them, and which values need special care?"
explanation = "The size is counted first: one character per digit, one more for a minus sign, and 0 still counts as one digit; the function allocates that count plus one for the terminator, and returns `NULL` if `malloc` fails. The digits are then written from the end of the buffer, with `n % 10` and `n / 10`, since they come out least significant first, and `'-'` goes at index 0 for a negative number. Two values are traps: 0, for which a loop `while (n != 0)` writes no digit, and `INT_MIN`, whose opposite does not fit in an `int`; working in a `long` handles it. The caller owns the result and frees it."

[questions.translations.fr]
title = "Transformer un int en chaîne allouée"
stem = "Une fonction convertit un `int` en une chaîne nouvellement allouée, comme `\"-7\"` pour -7. Combien d'octets doit-elle allouer, dans quel ordre les remplit-elle, et quelles valeurs demandent une attention particulière ?"
explanation = "On compte d'abord la taille : un caractère par chiffre, un de plus pour un signe moins, et 0 compte tout de même pour un chiffre ; la fonction alloue ce nombre plus un pour le terminateur, et renvoie `NULL` si `malloc` échoue. Les chiffres s'écrivent ensuite depuis la fin du tampon, avec `n % 10` et `n / 10`, puisqu'ils sortent du moins significatif au plus significatif, et `'-'` va à l'indice 0 pour un nombre négatif. Deux valeurs sont des pièges : 0, pour lequel une boucle `while (n != 0)` n'écrit aucun chiffre, et `INT_MIN`, dont l'opposé ne tient pas dans un `int` ; travailler dans un `long` le règle. L'appelant possède le résultat et le libère."

[questions.translations.es]
title = "Convertir un int en una cadena reservada"
stem = "Una función convierte un `int` en una cadena recién reservada, como `\"-7\"` para -7. ¿Cuántos bytes debe reservar, en qué orden los rellena y qué valores requieren un cuidado especial?"
explanation = "Primero se cuenta el tamaño: un carácter por cifra, uno más para el signo menos, y 0 cuenta igualmente como una cifra; la función reserva esa cantidad más uno para el terminador, y devuelve `NULL` si `malloc` falla. Después las cifras se escriben desde el final del búfer, con `n % 10` y `n / 10`, ya que salen de la menos significativa a la más significativa, y `'-'` va en el índice 0 para un número negativo. Dos valores son trampas: 0, para el que un bucle `while (n != 0)` no escribe ninguna cifra, e `INT_MIN`, cuyo opuesto no cabe en un `int`; trabajar con un `long` lo resuelve. Quien llama es dueño del resultado y lo libera."

[[questions.choices]]
correct = true
text = { en = "Count the digits, plus one for a minus sign, plus one for the terminator; fill from the end, and work in a wider type since `INT_MIN` cannot be negated", fr = "Compter les chiffres, plus un pour le signe moins, plus un pour le terminateur ; remplir depuis la fin, et travailler dans un type plus large car `INT_MIN` ne peut pas être nié", es = "Contar las cifras, más uno para el signo menos, más uno para el terminador; rellenar desde el final y trabajar en un tipo más ancho porque `INT_MIN` no se puede negar" }

[[questions.choices]]
text = { en = "Negate a negative number first, then every case is handled the same way", fr = "Rendre d'abord positif un nombre négatif, ensuite tous les cas se traitent pareil", es = "Volver positivo primero un número negativo, después todos los casos se tratan igual" }

[[questions.choices]]
text = { en = "A fixed buffer of 11 bytes always fits an `int`, terminator included, so counting is useless", fr = "Un tampon fixe de 11 octets contient toujours un `int`, terminateur compris, donc compter est inutile", es = "Un búfer fijo de 11 bytes siempre cabe un `int`, terminador incluido, así que contar es inútil" }

[[questions.choices]]
text = { en = "Fill the digits from the start of the buffer, in the order `n % 10` produces them", fr = "Remplir les chiffres depuis le début du tampon, dans l'ordre où `n % 10` les produit", es = "Rellenar las cifras desde el principio del búfer, en el orden en que `n % 10` las produce" }

