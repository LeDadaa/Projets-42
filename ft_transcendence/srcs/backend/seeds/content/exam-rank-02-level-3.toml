difficulty = 1200
tags = ["pointers"]
key_points = [
  "A function pointer stores the address of a function; its type spells the return type and the parameters, as in void (*f)(void *).",
  "The parentheses around *f are required: void *f(void *) declares a function returning void *, not a pointer.",
  "A function's name alone, without parentheses, gives its address, and the pointer is called like the function: f(x), or (*f)(x), which is the same.",
  "Passing a function pointer lets generic code, such as a loop over a list, apply behaviour chosen by the caller (a callback).",
]

[questions.translations.en]
title = "Function pointers"
stem = "A function takes a parameter declared as `void (*f)(void *)`. What does that declaration mean, why are the parentheses around `*f` required, how do you pass a function to it and how is `f` called? What is it useful for?"
explanation = "`f` is a pointer to a function that takes a `void *` and returns nothing. The parentheses matter: without them, `void *f(void *)` declares a function returning a `void *`. The name of a function, without parentheses, gives its address, so the caller simply passes `print_item` or any other function of the right type. Inside, the pointer is called like a function: `f(x)`, or `(*f)(x)`, which is exactly the same. This is how generic code, for instance a loop over a list, applies a behaviour chosen by its caller: the function passed in is a callback."

[questions.translations.fr]
title = "Les pointeurs de fonction"
stem = "Une fonction prend un paramètre déclaré `void (*f)(void *)`. Que signifie cette déclaration, pourquoi les parenthèses autour de `*f` sont-elles obligatoires, comment lui passer une fonction et comment `f` est-il appelé ? À quoi cela sert-il ?"
explanation = "`f` est un pointeur vers une fonction qui prend un `void *` et ne renvoie rien. Les parenthèses comptent : sans elles, `void *f(void *)` déclare une fonction qui renvoie un `void *`. Le nom d'une fonction, sans parenthèses, donne son adresse : l'appelant passe simplement `print_item` ou toute autre fonction du bon type. À l'intérieur, le pointeur s'appelle comme une fonction : `f(x)`, ou `(*f)(x)`, ce qui revient exactement au même. C'est ainsi qu'un code générique, par exemple une boucle sur une liste, applique un comportement choisi par son appelant : la fonction passée est une fonction de rappel."

[questions.translations.es]
title = "Los punteros a función"
stem = "Una función recibe un parámetro declarado como `void (*f)(void *)`. ¿Qué significa esa declaración, por qué son obligatorios los paréntesis alrededor de `*f`, cómo le pasas una función y cómo se llama a `f`? ¿Para qué sirve?"
explanation = "`f` es un puntero a una función que recibe un `void *` y no devuelve nada. Los paréntesis importan: sin ellos, `void *f(void *)` declara una función que devuelve un `void *`. El nombre de una función, sin paréntesis, da su dirección, así que quien llama simplemente pasa `print_item` o cualquier otra función del tipo adecuado. Dentro, el puntero se llama como una función: `f(x)`, o `(*f)(x)`, que es exactamente lo mismo. Así es como un código genérico, por ejemplo un bucle sobre una lista, aplica un comportamiento elegido por quien lo llama: la función pasada es una función de retrollamada."

[[questions.choices]]
correct = true
text = { en = "A pointer to a function taking a `void *` and returning nothing; the parentheses around `*f` are required, the name alone gives the address, and `f(x)` calls it", fr = "Un pointeur vers une fonction prenant un `void *` et ne renvoyant rien ; les parenthèses autour de `*f` sont obligatoires, le nom seul donne l'adresse, et `f(x)` l'appelle", es = "Un puntero a una función que toma un `void *` y no devuelve nada; los paréntesis alrededor de `*f` son obligatorios, el nombre solo da la dirección y `f(x)` la llama" }

[[questions.choices]]
text = { en = "`void *f(void *)` declares exactly the same thing: the parentheses only help reading", fr = "`void *f(void *)` déclare exactement la même chose : les parenthèses aident seulement à lire", es = "`void *f(void *)` declara exactamente lo mismo: los paréntesis solo ayudan a leer" }

[[questions.choices]]
text = { en = "The function must be passed as `&f()`, which evaluates it to get its address", fr = "La fonction doit être passée sous la forme `&f()`, qui l'évalue pour obtenir son adresse", es = "La función debe pasarse como `&f()`, que la evalúa para obtener su dirección" }

[[questions.choices]]
