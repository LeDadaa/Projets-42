key_points = [
  "A first pass counts the words, so that the array of pointers can be allocated at the right size: number of words + 1.",
  "The extra slot holds NULL, which marks the end of the array for the caller, who has no other way to know its length.",
  "Each word is then copied into its own allocation of length + 1 bytes, terminator included.",
  "If any allocation fails, every string already allocated and the array itself must be freed before returning NULL.",
]

[questions.translations.en]
title = "Splitting a string into an array of words"
stem = "A function splits a string into words separated by spaces, tabs or newlines, and returns a `NULL`-terminated array of newly allocated strings. How do you size the array, why does it need one slot more than there are words, and what must happen if an allocation fails halfway?"
explanation = "A first pass counts the words, so that the array of pointers is allocated once, at the right size: the number of words plus one. That extra slot holds `NULL`, the only way for the caller to find the end of the array; three words therefore take four pointers. Each word is then copied into its own allocation of its length plus one byte, terminator included. If an allocation fails halfway, returning `NULL` straight away would leak the words already copied: they must all be freed, then the array itself, before returning `NULL`."

[questions.translations.fr]
title = "Découper une chaîne en tableau de mots"
stem = "Une fonction découpe une chaîne en mots séparés par des espaces, des tabulations ou des retours à la ligne, et renvoie un tableau de chaînes nouvellement allouées terminé par `NULL`. Comment dimensionner le tableau, pourquoi lui faut-il une case de plus qu'il n'y a de mots, et que doit-il se passer si une allocation échoue en cours de route ?"
explanation = "Un premier passage compte les mots, pour que le tableau de pointeurs soit alloué une seule fois, à la bonne taille : le nombre de mots plus un. Cette case en plus contient `NULL`, seul moyen pour l'appelant de trouver la fin du tableau ; trois mots occupent donc quatre pointeurs. Chaque mot est ensuite copié dans sa propre allocation de sa longueur plus un octet, terminateur compris. Si une allocation échoue en cours de route, renvoyer `NULL` aussitôt laisserait fuir les mots déjà copiés : il faut tous les libérer, puis le tableau lui-même, avant de renvoyer `NULL`."

[questions.translations.es]
title = "Dividir una cadena en un array de palabras"
stem = "Una función divide una cadena en palabras separadas por espacios, tabulaciones o saltos de línea, y devuelve un array de cadenas recién reservadas terminado en `NULL`. ¿Cómo dimensionas el array, por qué necesita una casilla más que palabras hay y qué debe pasar si una reserva falla a medio camino?"
explanation = "Una primera pasada cuenta las palabras, para que el array de punteros se reserve una sola vez y con el tamaño adecuado: el número de palabras más uno. Esa casilla extra contiene `NULL`, la única forma que tiene quien llama de encontrar el final del array; tres palabras ocupan por tanto cuatro punteros. Después, cada palabra se copia en su propia reserva de su longitud más un byte, terminador incluido. Si una reserva falla a medio camino, devolver `NULL` sin más dejaría perdidas las palabras ya copiadas: hay que liberarlas todas, y después el propio array, antes de devolver `NULL`."

[[questions.choices]]
correct = true
text = { en = "Words + 1 pointers, the extra slot holding `NULL` to mark the end; on a failure, free every string already allocated and the array, then return `NULL`", fr = "Nombre de mots + 1 pointeurs, la case en trop contenant `NULL` pour marquer la fin ; en cas d'échec, libérer chaque chaîne déjà allouée et le tableau, puis renvoyer `NULL`", es = "Palabras + 1 punteros, la casilla de más con `NULL` para marcar el final; si algo falla, liberar cada cadena ya reservada y el array, y devolver `NULL`" }

[[questions.choices]]
text = { en = "As many pointers as words: the caller gets the length with `sizeof`", fr = "Autant de pointeurs que de mots : l'appelant obtient la longueur avec `sizeof`", es = "Tantos punteros como palabras: quien llama obtiene la longitud con `sizeof`" }

[[questions.choices]]
text = { en = "The extra slot holds the number of words, which the caller reads first", fr = "La case en trop contient le nombre de mots, que l'appelant lit en premier", es = "La casilla de más contiene el número de palabras, que quien llama lee primero" }

[[questions.choices]]
text = { en = "Returning `NULL` is enough on a failure: the allocations already made are freed when the program ends", fr = "Renvoyer `NULL` suffit en cas d'échec : les allocations déjà faites sont libérées à la fin du programme", es = "Devolver `NULL` basta si falla: las reservas ya hechas se liberan al terminar el programa" }

