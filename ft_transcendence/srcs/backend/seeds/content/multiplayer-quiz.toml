stem = "Un enfant s'est terminé, mais son parent, toujours en vie, n'a jamais appelé `wait`. Qu'est devenu l'enfant ?"

[questions.translations.es]
title = "Un hijo al que nadie espera"
stem = "Un hijo ha terminado, pero su padre, que sigue vivo, nunca llamó a `wait`. ¿Qué es ahora el hijo?"

[[questions.choices]]
text = { en = "An orphan, adopted by process 1", fr = "Un orphelin, adopté par le processus 1", es = "Un huérfano, adoptado por el proceso 1" }

[[questions.choices]]
correct = true
text = { en = "A zombie: its entry and exit status stay in the process table", fr = "Un zombie : son entrée et son statut restent dans la table des processus", es = "Un zombi: su entrada y su estado siguen en la tabla de procesos" }

[[questions.choices]]
text = { en = "Nothing: it disappeared as soon as it ended", fr = "Rien : il a disparu dès sa fin", es = "Nada: desapareció en cuanto terminó" }

[[questions.choices]]
text = { en = "Still running, blocked on its output", fr = "Il tourne encore, bloqué sur sa sortie", es = "Sigue ejecutándose, bloqueado en su salida" }

