[[questions]]
slug = "rank05-l0-increment-operator-forms"
topic = "exam-rank-05-level-0"
kind = "free_text"
difficulty = 1000
tags = ["operator-overloading"]
key_points = [
  "The postfix overload takes an extra, unused int parameter; that parameter is what tells the two overloads apart.",
  "The prefix form increments the object and returns a reference to *this.",
  "The postfix form must yield the value from before the increment, so it saves a copy and returns that copy by value.",
]

[questions.translations.en]
title = "Prefix and postfix increment"
stem = "In C++, a class can overload both `++x` and `x++`. How does the compiler tell the two overloads apart, and why does the postfix form usually return a copy while the prefix form returns a reference?"
explanation = "For a class `T`, the postfix form is declared with an extra `int` parameter that is never used: `T operator++(int)`, while the prefix form is `T& operator++()`. The prefix form increments the object and returns `*this` by reference, so the result is the object itself. The postfix form must evaluate to the value the object had before the increment: it copies `*this`, increments the object, then returns the saved copy by value. That copy is why `++x` is preferred when the old value is not needed."

[questions.translations.fr]
title = "Incrémentation préfixée et postfixée"
stem = "En C++, une classe peut surcharger `++x` et `x++`. Comment le compilateur distingue-t-il les deux surcharges, et pourquoi la forme postfixée renvoie-t-elle en général une copie alors que la forme préfixée renvoie une référence ?"
explanation = "Pour une classe `T`, la forme postfixée se déclare avec un paramètre `int` supplémentaire, jamais utilisé : `T operator++(int)`, alors que la forme préfixée s'écrit `T& operator++()`. La forme préfixée incrémente l'objet et renvoie `*this` par référence : le résultat est l'objet lui-même. La forme postfixée doit valoir l'ancienne valeur de l'objet : elle copie `*this`, incrémente l'objet, puis renvoie la copie sauvegardée par valeur. Cette copie explique pourquoi on préfère `++x` quand l'ancienne valeur ne sert pas."

[questions.translations.es]
title = "Incremento prefijo y postfijo"
stem = "En C++, una clase puede sobrecargar `++x` y `x++`. ¿Cómo distingue el compilador las dos sobrecargas, y por qué la forma postfija suele devolver una copia mientras que la prefija devuelve una referencia?"
explanation = "Para una clase `T`, la forma postfija se declara con un parámetro `int` adicional que nunca se usa: `T operator++(int)`, mientras que la prefija es `T& operator++()`. La forma prefija incrementa el objeto y devuelve `*this` por referencia, así que el resultado es el propio objeto. La forma postfija debe valer lo que valía el objeto antes del incremento: copia `*this`, incrementa el objeto y devuelve la copia guardada por valor. Esa copia es la razón por la que se prefiere `++x` cuando el valor anterior no se necesita."

[[questions.choices]]
correct = true
text = { en = "The postfix form takes an extra unused `int` parameter; it must yield the value from before, so it returns a copy, while the prefix form returns a reference to `*this`", fr = "La forme postfixée prend un paramètre `int` supplémentaire inutilisé ; elle doit rendre la valeur d'avant, donc elle renvoie une copie, tandis que la forme préfixée renvoie une référence sur `*this`", es = "La forma postfija toma un parámetro `int` extra sin usar; debe dar el valor anterior, así que devuelve una copia, mientras que la prefija devuelve una referencia a `*this`" }

[[questions.choices]]
text = { en = "The prefix form is the one taking the extra `int`, which marks it as coming first", fr = "C'est la forme préfixée qui prend l'`int` supplémentaire, ce qui marque qu'elle vient d'abord", es = "Es la forma prefija la que toma el `int` extra, lo que marca que va primero" }

[[questions.choices]]
text = { en = "The two overloads differ by their return type, which is enough for the compiler to tell them apart", fr = "Les deux surcharges diffèrent par leur type de retour, ce qui suffit au compilateur pour les distinguer", es = "Las dos sobrecargas difieren en el tipo de retorno, lo que basta al compilador para distinguirlas" }

[[questions.choices]]
