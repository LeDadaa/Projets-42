tags = ["arbitrary-precision", "algorithms"]
key_points = [
  "Add digits of the same weight, starting from the least significant, together with the carry from the previous position.",
  "Keep sum % 10 as the result digit and sum / 10 as the carry for the next position.",
  "Continue while either number still has digits or a carry remains, treating missing digits as 0.",
  "The time is linear in the number of digits of the longer number.",
]

[questions.translations.en]
title = "Adding very large numbers"
stem = "A non-negative integer too large for any built-in type is stored as a sequence of decimal digits. Describe how to add two such numbers, and give the time complexity of your method."
explanation = "It is the addition taught at school. Start from the least significant digits and move towards the most significant: at each position, add the two digits and the carry from the previous position. The result digit is `sum % 10` and the new carry is `sum / 10`, which is 0 or 1. When one number is shorter, its missing digits count as 0, and a carry left after the last position becomes a new leading digit. Each position is visited once, so the time is O(max(n, m)) for numbers of n and m digits."

[questions.translations.fr]
title = "Additionner de très grands nombres"
stem = "Un entier positif ou nul, trop grand pour tout type natif, est stocké sous forme de suite de chiffres décimaux. Décrivez comment additionner deux tels nombres, et donnez la complexité en temps de votre méthode."
explanation = "C'est l'addition apprise à l'école. On part des chiffres de poids faible pour remonter vers les poids forts : à chaque position, on additionne les deux chiffres et la retenue de la position précédente. Le chiffre du résultat vaut `somme % 10` et la nouvelle retenue `somme / 10`, soit 0 ou 1. Quand un nombre est plus court, ses chiffres manquants comptent pour 0, et une retenue restante après la dernière position devient un nouveau chiffre de tête. Chaque position est traitée une fois : le temps est en O(max(n, m)) pour des nombres de n et m chiffres."

[questions.translations.es]
title = "Sumar números muy grandes"
stem = "Un entero no negativo, demasiado grande para cualquier tipo nativo, se guarda como una secuencia de dígitos decimales. Describe cómo sumar dos números así e indica la complejidad temporal de tu método."
explanation = "Es la suma que se aprende en la escuela. Se empieza por los dígitos menos significativos y se avanza hacia los más significativos: en cada posición se suman los dos dígitos y el acarreo de la posición anterior. El dígito del resultado es `suma % 10` y el nuevo acarreo es `suma / 10`, que vale 0 o 1. Si un número es más corto, los dígitos que le faltan cuentan como 0, y un acarreo que queda tras la última posición se convierte en un nuevo dígito inicial. Cada posición se recorre una vez, así que el tiempo es O(max(n, m)) para números de n y m dígitos."

[[questions.choices]]
correct = true
text = { en = "Add the digits of the same weight from the least significant, with the carry; keep `sum % 10` and carry `sum / 10`, going on while digits or a carry remain: linear in the longer number", fr = "Additionner les chiffres de même poids en partant du moins significatif, avec la retenue ; garder `somme % 10` et reporter `somme / 10`, tant qu'il reste des chiffres ou une retenue : linéaire dans le plus long", es = "Sumar las cifras del mismo peso desde la menos significativa, con el acarreo; guardar `suma % 10` y llevar `suma / 10`, mientras queden cifras o acarreo: lineal en el más largo" }

[[questions.choices]]
text = { en = "Add from the most significant digit, which avoids having to carry anything", fr = "Additionner à partir du chiffre le plus significatif, ce qui évite d'avoir à reporter quoi que ce soit", es = "Sumar desde la cifra más significativa, lo que evita tener que llevar nada" }

[[questions.choices]]
text = { en = "Stop as soon as the shorter number runs out of digits", fr = "S'arrêter dès que le plus court n'a plus de chiffres", es = "Parar en cuanto al más corto se le acaban las cifras" }

[[questions.choices]]
text = { en = "The cost is quadratic, since each digit is compared with every digit of the other number", fr = "Le coût est quadratique, puisque chaque chiffre est comparé à tous ceux de l'autre nombre", es = "El coste es cuadrático, ya que cada cifra se compara con todas las del otro número" }

[[questions]]
slug = "rank05-l0-digit-sequence-comparison"
topic = "exam-rank-05-level-0"
kind = "free_text"
difficulty = 1200
tags = ["arbitrary-precision", "algorithms"]
key_points = [
  "When neither number has leading zeros, the one with more digits is the larger.",
  "With the same number of digits, compare from the most significant digit down; the first difference decides.",
  "Leading zeros break the length rule: a number written with extra zeros in front has more digits without being larger.",
  "Every operation must therefore keep its result normalized: no leading zeros, and zero written as a single 0.",
]

[questions.translations.en]
title = "Comparing very large numbers"
stem = "Two non-negative integers are stored as sequences of decimal digits. How can you compare them without converting them to a built-in type, and why does it matter that neither representation contains leading zeros?"
explanation = "Without leading zeros, a number with more digits is always larger, so comparing lengths settles most cases at once. When the lengths are equal, compare the digits from the most significant one down: the first position where they differ decides, and if none differs the numbers are equal. Leading zeros break the length rule: `0042` has four digits but is smaller than `123`, and `042` would not be equal to `42` digit by digit. That is why every operation should normalize its result: remove leading zeros and represent zero as a single `0`."

[questions.translations.fr]
title = "Comparer de très grands nombres"
stem = "Deux entiers positifs ou nuls sont stockés sous forme de suites de chiffres décimaux. Comment les comparer sans les convertir en type natif, et pourquoi importe-t-il qu'aucune représentation ne contienne de zéros en tête ?"
explanation = "Sans zéros en tête, un nombre qui a plus de chiffres est toujours le plus grand : comparer les longueurs règle d'emblée la plupart des cas. À longueur égale, on compare les chiffres en partant du poids fort : la première position où ils diffèrent décide, et si aucune ne diffère, les nombres sont égaux. Les zéros en tête cassent la règle des longueurs : `0042` a quatre chiffres mais est plus petit que `123`, et `042` ne serait pas égal à `42` chiffre à chiffre. C'est pourquoi chaque opération doit normaliser son résultat : retirer les zéros en tête et représenter zéro par un seul `0`."

[questions.translations.es]
title = "Comparar números muy grandes"
stem = "Dos enteros no negativos se guardan como secuencias de dígitos decimales. ¿Cómo se pueden comparar sin convertirlos a un tipo nativo, y por qué importa que ninguna representación tenga ceros a la izquierda?"
explanation = "Sin ceros a la izquierda, un número con más dígitos siempre es mayor, así que comparar las longitudes resuelve la mayoría de los casos de inmediato. Si las longitudes son iguales, se comparan los dígitos empezando por el más significativo: la primera posición en la que difieren decide, y si ninguna difiere los números son iguales. Los ceros a la izquierda rompen la regla de la longitud: `0042` tiene cuatro dígitos pero es menor que `123`, y `042` no sería igual a `42` dígito a dígito. Por eso cada operación debe normalizar su resultado: quitar los ceros a la izquierda y representar el cero con un solo `0`."

[[questions.choices]]
correct = true
text = { en = "With no leading zeros, more digits means larger; at equal length, the first differing digit from the left decides — which is why every result must stay normalized", fr = "Sans zéros de tête, plus de chiffres signifie plus grand ; à longueur égale, le premier chiffre qui diffère depuis la gauche décide — d'où l'obligation de garder tout résultat normalisé", es = "Sin ceros a la izquierda, más cifras significa mayor; a igual longitud, la primera cifra distinta desde la izquierda decide — por eso todo resultado debe quedar normalizado" }

[[questions.choices]]
