[questions.translations.en]
title = "Copying a class that owns memory"
stem = "Which four member functions make up the orthodox canonical form of a class? When a class owns memory allocated with `new`, why must its copy constructor and copy assignment operator perform a deep copy?"
explanation = "The orthodox canonical form declares a default constructor, a copy constructor, a copy assignment operator and a destructor. When the copy operations are not written, the compiler generates versions that copy each member as is: for a pointer, only the address is copied, not the memory it points to. The original and the copy then share the same block, so modifying one changes the other, and each destructor calls `delete` on the same address: a double free. A deep copy allocates a new block for the copy and copies the contents into it. The copy assignment operator must also release the memory the object already owned, and handle `a = a` without freeing the data it is about to copy."

[questions.translations.fr]
title = "Copier une classe qui alloue"
stem = "Quelles sont les quatre fonctions membres de la forme canonique orthodoxe d'une classe ? Quand une classe possède de la mémoire allouée avec `new`, pourquoi son constructeur de copie et son opérateur d'affectation doivent-ils faire une copie profonde ?"
explanation = "La forme canonique orthodoxe déclare un constructeur par défaut, un constructeur de copie, un opérateur d'affectation par copie et un destructeur. Quand on n'écrit pas les opérations de copie, le compilateur en génère qui recopient chaque membre tel quel : pour un pointeur, seule l'adresse est copiée, pas la mémoire pointée. L'original et la copie partagent alors le même bloc : modifier l'un modifie l'autre, et chaque destructeur appelle `delete` sur la même adresse, soit une double libération. Une copie profonde alloue un nouveau bloc pour la copie et y recopie le contenu. L'opérateur d'affectation doit en plus libérer la mémoire que l'objet possédait déjà, et gérer `a = a` sans libérer les données qu'il s'apprête à copier."

[questions.translations.es]
title = "Copiar una clase que posee memoria"
stem = "¿Cuáles son las cuatro funciones miembro de la forma canónica ortodoxa de una clase? Cuando una clase posee memoria reservada con `new`, ¿por qué su constructor de copia y su operador de asignación deben hacer una copia profunda?"
explanation = "La forma canónica ortodoxa declara un constructor por defecto, un constructor de copia, un operador de asignación por copia y un destructor. Si no se escriben las operaciones de copia, el compilador genera versiones que copian cada miembro tal cual: para un puntero solo se copia la dirección, no la memoria a la que apunta. El original y la copia comparten entonces el mismo bloque: modificar uno cambia el otro, y cada destructor llama a `delete` sobre la misma dirección, lo que provoca una doble liberación. Una copia profunda reserva un bloque nuevo para la copia y copia en él el contenido. El operador de asignación debe además liberar la memoria que el objeto ya poseía y gestionar `a = a` sin liberar los datos que va a copiar."

[[questions.choices]]
correct = true
text = { en = "Default constructor, copy constructor, copy assignment, destructor; the generated copy duplicates the pointer, so both objects free the same memory — a double free", fr = "Constructeur par défaut, constructeur de copie, affectation par copie, destructeur ; la copie générée duplique le pointeur, donc les deux objets libèrent la même mémoire — double libération", es = "Constructor por defecto, constructor de copia, asignación por copia, destructor; la copia generada duplica el puntero, así que ambos objetos liberan la misma memoria — doble liberación" }

[[questions.choices]]
text = { en = "The compiler-generated copy already duplicates the pointed memory, so nothing needs writing", fr = "La copie générée par le compilateur duplique déjà la mémoire pointée, il n'y a donc rien à écrire", es = "La copia generada por el compilador ya duplica la memoria apuntada, así que no hay nada que escribir" }

[[questions.choices]]
text = { en = "A deep copy is only needed in the copy constructor; assignment reuses it", fr = "Une copie profonde n'est nécessaire que dans le constructeur de copie ; l'affectation le réutilise", es = "La copia profunda solo hace falta en el constructor de copia; la asignación lo reutiliza" }

[[questions.choices]]
