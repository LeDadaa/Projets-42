[questions.translations.en]
title = "Const and non-const subscript"
stem = "Why does a class often provide two versions of `operator[]`, one `const` and one non-`const`? What does each one return?"
explanation = "The non-`const` version returns a reference to the element, such as `int&`, so that `x[1] = 12` modifies the object. On a `const` object, only `const` member functions can be called: with the non-`const` version alone, reading `x[1]` would not compile. The `const` version, declared with `const` after its parameter list, returns a value or a `const` reference, so the element can be read but not modified. The compiler chooses between the two from the constness of the object."

[questions.translations.fr]
title = "Indexation const et non const"
stem = "Pourquoi une classe fournit-elle souvent deux versions de `operator[]`, l'une `const` et l'autre non ? Que renvoie chacune ?"
explanation = "La version non `const` renvoie une référence sur l'élément, par exemple `int&`, pour que `x[1] = 12` modifie l'objet. Sur un objet `const`, seules les fonctions membres `const` peuvent être appelées : avec la seule version non `const`, lire `x[1]` ne compilerait pas. La version `const`, déclarée avec `const` après sa liste de paramètres, renvoie une valeur ou une référence `const` : l'élément se lit mais ne se modifie pas. Le compilateur choisit entre les deux selon que l'objet est `const` ou non."

[questions.translations.es]
title = "Índice const y no const"
stem = "¿Por qué una clase suele ofrecer dos versiones de `operator[]`, una `const` y otra no? ¿Qué devuelve cada una?"
explanation = "La versión no `const` devuelve una referencia al elemento, por ejemplo `int&`, para que `x[1] = 12` modifique el objeto. Sobre un objeto `const` solo se pueden llamar funciones miembro `const`: con la versión no `const` sola, leer `x[1]` no compilaría. La versión `const`, declarada con `const` después de su lista de parámetros, devuelve un valor o una referencia `const`, de modo que el elemento se puede leer pero no modificar. El compilador elige entre las dos según si el objeto es `const` o no."

[[questions.choices]]
correct = true
text = { en = "The non-`const` one returns a reference, so an element can be changed; a `const` object can only call `const` members, and that overload returns a value or a `const` reference", fr = "La non-`const` renvoie une référence, donc un élément peut être modifié ; un objet `const` ne peut appeler que des membres `const`, et cette surcharge renvoie une valeur ou une référence `const`", es = "La no `const` devuelve una referencia, así que un elemento puede cambiarse; un objeto `const` solo puede llamar a miembros `const`, y esa sobrecarga devuelve un valor o una referencia `const`" }

[[questions.choices]]
text = { en = "The compiler picks the overload from what is done with the result: reading or writing", fr = "Le compilateur choisit la surcharge d'après ce qu'on fait du résultat : lire ou écrire", es = "El compilador elige la sobrecarga según lo que se haga con el resultado: leer o escribir" }

[[questions.choices]]
text = { en = "One single non-`const` overload is enough: a `const` object may call it to read", fr = "Une seule surcharge non `const` suffit : un objet `const` peut l'appeler pour lire", es = "Basta una sola sobrecarga no `const`: un objeto `const` puede llamarla para leer" }

[[questions.choices]]
text = { en = "The two overloads differ only by their return type, which is what makes them two overloads", fr = "Les deux surcharges ne diffèrent que par leur type de retour, c'est ce qui en fait deux surcharges", es = "Las dos sobrecargas solo difieren en el tipo de retorno, eso es lo que las hace dos sobrecargas" }

