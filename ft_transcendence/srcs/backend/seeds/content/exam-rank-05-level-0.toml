[[questions]]
slug = "rank05-l0-searching-array-vs-tree"
topic = "exam-rank-05-level-0"
kind = "free_text"
difficulty = 1200
tags = ["data-structures", "complexity"]
key_points = [
  "In an unsorted array, a search may have to check every element: O(n).",
  "In a binary search tree, each comparison rules out one subtree, so a search follows a single path from the root: O(h), with h the height.",
  "A balanced tree has a height close to log2(n), which makes the search far faster than in the array.",
  "Inserting values in sorted order builds a degenerate tree shaped like a list: h becomes n and the search is O(n) again.",
]

[questions.translations.en]
title = "Searching an array or a tree"
stem = "Compare the cost of searching for a value in an unsorted array and in a binary search tree holding the same n values. In which situation does the tree lose its advantage?"
explanation = "In an unsorted array nothing tells you where a value is, so a search may have to check every element: O(n). In a binary search tree, each node's left subtree holds smaller values and its right subtree larger ones, so each comparison lets you continue in a single subtree: a search follows one path from the root, which costs O(h) for a tree of height h. When the tree is balanced, h is about log2(n), around 20 steps for a million values. But the shape depends on the insertion order: inserting values in increasing order makes each new node the right child of the previous one, the tree degenerates into a list, h equals n, and searching is O(n) again. Self-balancing trees exist precisely to prevent this."

[questions.translations.fr]
title = "Chercher dans un tableau ou un arbre"
stem = "Comparez le coût de la recherche d'une valeur dans un tableau non trié et dans un arbre binaire de recherche contenant les mêmes n valeurs. Dans quelle situation l'arbre perd-il son avantage ?"
explanation = "Dans un tableau non trié, rien n'indique où se trouve une valeur : une recherche peut devoir examiner tous les éléments, soit O(n). Dans un arbre binaire de recherche, le sous-arbre gauche de chaque nœud contient les valeurs plus petites et le droit les plus grandes : chaque comparaison permet de poursuivre dans un seul sous-arbre. Une recherche suit donc un seul chemin depuis la racine, en O(h) pour un arbre de hauteur h. Quand l'arbre est équilibré, h vaut environ log2(n), soit une vingtaine d'étapes pour un million de valeurs. Mais la forme dépend de l'ordre d'insertion : insérer des valeurs croissantes fait de chaque nouveau nœud le fils droit du précédent, l'arbre dégénère en liste, h vaut n et la recherche redevient O(n). Les arbres auto-équilibrés existent précisément pour l'éviter."

[questions.translations.es]
title = "Buscar en un array o en un árbol"
stem = "Compara el coste de buscar un valor en un array no ordenado y en un árbol binario de búsqueda que contienen los mismos n valores. ¿En qué situación pierde el árbol su ventaja?"
explanation = "En un array no ordenado nada indica dónde está un valor, así que una búsqueda puede tener que revisar todos los elementos: O(n). En un árbol binario de búsqueda, el subárbol izquierdo de cada nodo contiene los valores menores y el derecho los mayores, así que cada comparación permite seguir por un solo subárbol. Una búsqueda sigue entonces un único camino desde la raíz, con un coste O(h) para un árbol de altura h. Si el árbol está equilibrado, h es aproximadamente log2(n), unos 20 pasos para un millón de valores. Pero la forma depende del orden de inserción: insertar valores crecientes convierte cada nodo nuevo en el hijo derecho del anterior, el árbol degenera en una lista, h vale n y la búsqueda vuelve a ser O(n). Los árboles autoequilibrados existen precisamente para evitarlo."

[[questions.choices]]
correct = true
text = { en = "O(n) in the array, O(h) in the tree, with `h` close to log₂(n) when it is balanced; inserting sorted values builds a tree shaped like a list and brings the search back to O(n)", fr = "O(n) dans le tableau, O(h) dans l'arbre, avec `h` proche de log₂(n) s'il est équilibré ; insérer des valeurs triées construit un arbre en forme de liste et ramène la recherche à O(n)", es = "O(n) en el array, O(h) en el árbol, con `h` cercana a log₂(n) si está equilibrado; insertar valores ordenados construye un árbol con forma de lista y devuelve la búsqueda a O(n)" }

[[questions.choices]]
text = { en = "The tree is always O(log n), whatever the order the values were inserted in", fr = "L'arbre est toujours en O(log n), quel que soit l'ordre d'insertion des valeurs", es = "El árbol siempre es O(log n), sea cual sea el orden de inserción de los valores" }

[[questions.choices]]
text = { en = "The array is faster, since its cells are contiguous and no comparison is needed", fr = "Le tableau est plus rapide, puisque ses cases sont contiguës et qu'aucune comparaison n'est nécessaire", es = "El array es más rápido, ya que sus celdas son contiguas y no hace falta comparar" }

[[questions.choices]]
text = { en = "The tree loses its advantage when the values are inserted in a random order", fr = "L'arbre perd son avantage quand les valeurs sont insérées dans un ordre aléatoire", es = "El árbol pierde su ventaja cuando los valores se insertan en orden aleatorio" }
