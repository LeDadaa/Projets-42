  "operator+ must not return a reference: its result is a local object, destroyed when the function returns.",
  "operator+ can copy its left operand, apply += to the copy and return it, so the arithmetic is written only once.",
]

[questions.translations.en]
title = "Compound and binary operators"
stem = "Why does `operator+=` usually return a reference to `*this`, while `operator+` returns a new object by value? How can one of them be written in terms of the other?"
explanation = "`a += b` changes `a` itself, so the operator can return `*this` by reference: no copy is made, and an expression like `(a += b) += c` keeps working on `a`. `a + b` must leave both operands untouched, so its result is a new object; returning it by reference would hand back a reference to a local variable that is destroyed when the function returns. The usual way to avoid writing the arithmetic twice is to implement `+` with `+=`: copy the left operand, apply `+=` to the copy, and return the copy by value."

[questions.translations.fr]
title = "Opérateurs composés et binaires"
stem = "Pourquoi `operator+=` renvoie-t-il en général une référence sur `*this`, alors que `operator+` renvoie un nouvel objet par valeur ? Comment écrire l'un à partir de l'autre ?"
explanation = "`a += b` modifie `a` lui-même : l'opérateur peut donc renvoyer `*this` par référence, sans copie, et une expression comme `(a += b) += c` continue d'agir sur `a`. `a + b` ne doit modifier aucun des deux opérandes : son résultat est un nouvel objet. Le renvoyer par référence reviendrait à renvoyer une référence sur une variable locale, détruite à la sortie de la fonction. Pour ne pas écrire le calcul deux fois, on écrit `+` avec `+=` : on copie l'opérande de gauche, on applique `+=` à la copie, et on renvoie la copie par valeur."

[questions.translations.es]
title = "Operadores compuestos y binarios"
stem = "¿Por qué `operator+=` suele devolver una referencia a `*this`, mientras que `operator+` devuelve un objeto nuevo por valor? ¿Cómo se puede escribir uno a partir del otro?"
explanation = "`a += b` modifica el propio `a`, así que el operador puede devolver `*this` por referencia: no se hace ninguna copia y una expresión como `(a += b) += c` sigue actuando sobre `a`. `a + b` no debe modificar ninguno de los operandos, así que su resultado es un objeto nuevo; devolverlo por referencia sería devolver una referencia a una variable local que se destruye al salir de la función. Para no escribir el cálculo dos veces, se implementa `+` con `+=`: se copia el operando izquierdo, se aplica `+=` a la copia y se devuelve la copia por valor."

[[questions.choices]]
correct = true
text = { en = "`+=` changes its left operand and returns `*this` by reference; `+` must leave both alone, so it returns a new object by value — a reference would point at a destroyed local", fr = "`+=` modifie son opérande gauche et renvoie `*this` par référence ; `+` doit les laisser intacts, donc il renvoie un nouvel objet par valeur — une référence pointerait sur une locale détruite", es = "`+=` cambia su operando izquierdo y devuelve `*this` por referencia; `+` debe dejarlos intactos, así que devuelve un objeto nuevo por valor — una referencia apuntaría a una local destruida" }

[[questions.choices]]
text = { en = "`+` can return a reference to its result, which avoids a copy", fr = "`+` peut renvoyer une référence sur son résultat, ce qui évite une copie", es = "`+` puede devolver una referencia a su resultado, lo que evita una copia" }

[[questions.choices]]
text = { en = "`+=` returns by value, since it produces a new value just like `+`", fr = "`+=` renvoie par valeur, puisqu'il produit une nouvelle valeur comme `+`", es = "`+=` devuelve por valor, ya que produce un valor nuevo igual que `+`" }

[[questions.choices]]
text = { en = "The two cannot be written in terms of each other: the arithmetic has to appear twice", fr = "Les deux ne peuvent pas s'écrire l'un à partir de l'autre : l'arithmétique doit figurer deux fois", es = "Los dos no pueden escribirse uno a partir del otro: la aritmética debe aparecer dos veces" }

[[questions]]
slug = "rank05-l0-operator-with-builtin-left-operand"
topic = "exam-rank-05-level-0"
kind = "free_text"
difficulty = 1200
tags = ["operator-overloading"]
key_points = [
  "A member operator is called on its left operand, so the left operand must be an object of the class.",
  "In 3 * x the left operand is an int, which has no member functions, so the member operator cannot be used.",
  "The fix is a non-member function taking the int first and the object second; for a commutative operation it can reuse the member version.",
]

[questions.translations.en]
title = "A built-in type left of an operator"
stem = "Your class overloads `operator*` as a member function, so `x * 3` compiles. Why doesn't `3 * x` compile, and how do you make it work?"
explanation = "A member operator is called on its left operand: `x * 3` means `x.operator*(3)`. In `3 * x` the left operand is an `int`, which has no member functions, so the compiler cannot use your member operator. The fix is a non-member function, declared outside the class, that takes the `int` first and the object second; for a commutative operation it can simply return `x * 3`. This is also why `operator<<` for printing is always a non-member: in `std::cout << x`, the left operand is the stream, not your object."

[questions.translations.fr]
title = "Un type natif à gauche d'un opérateur"
stem = "Votre classe surcharge `operator*` comme fonction membre, donc `x * 3` compile. Pourquoi `3 * x` ne compile-t-il pas, et comment le faire fonctionner ?"
explanation = "Un opérateur membre est appelé sur son opérande de gauche : `x * 3` signifie `x.operator*(3)`. Dans `3 * x`, l'opérande de gauche est un `int`, qui n'a pas de fonctions membres : le compilateur ne peut pas utiliser votre opérateur membre. La solution est une fonction non membre, déclarée hors de la classe, qui prend d'abord l'`int` puis l'objet ; pour une opération commutative, elle peut simplement renvoyer `x * 3`. C'est aussi pour cela que `operator<<` d'affichage est toujours non membre : dans `std::cout << x`, l'opérande de gauche est le flux, pas votre objet."

[questions.translations.es]
title = "Tipo nativo antes de un operador"
stem = "Tu clase sobrecarga `operator*` como función miembro, así que `x * 3` compila. ¿Por qué no compila `3 * x`, y cómo se consigue que funcione?"
explanation = "Un operador miembro se llama sobre su operando izquierdo: `x * 3` equivale a `x.operator*(3)`. En `3 * x` el operando izquierdo es un `int`, que no tiene funciones miembro, así que el compilador no puede usar tu operador miembro. La solución es una función no miembro, declarada fuera de la clase, que recibe primero el `int` y después el objeto; si la operación es conmutativa, puede limitarse a devolver `x * 3`. Por la misma razón `operator<<` para imprimir es siempre no miembro: en `std::cout << x` el operando izquierdo es el flujo, no tu objeto."

[[questions.choices]]
correct = true
text = { en = "A member operator is called on its left operand, and an `int` has no members; the fix is a non-member function taking the `int` first", fr = "Un opérateur membre est appelé sur son opérande gauche, et un `int` n'a pas de membres ; la solution est une fonction non membre prenant l'`int` en premier", es = "Un operador miembro se llama sobre su operando izquierdo, y un `int` no tiene miembros; la solución es una función no miembro que tome el `int` primero" }

[[questions.choices]]
text = { en = "The compiler swaps the operands on its own when the operation is commutative", fr = "Le compilateur échange les opérandes tout seul quand l'opération est commutative", es = "El compilador intercambia los operandos por sí solo cuando la operación es conmutativa" }

[[questions.choices]]
text = { en = "It is enough to add a second member overload taking an `int` on the left", fr = "Il suffit d'ajouter une seconde surcharge membre prenant un `int` à gauche", es = "Basta con añadir una segunda sobrecarga miembro que tome un `int` a la izquierda" }

[[questions.choices]]
text = { en = "`3 * x` never compiles in C++, whatever is written: a built-in type cannot take part in an overload", fr = "`3 * x` ne compile jamais en C++, quoi qu'on écrive : un type de base ne peut pas participer à une surcharge", es = "`3 * x` nunca compila en C++, se escriba lo que se escriba: un tipo básico no puede participar en una sobrecarga" }

