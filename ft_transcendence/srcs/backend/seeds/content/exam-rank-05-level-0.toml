[questions.translations.en]
title = "Single-argument constructors"
stem = "A class has a constructor taking an `unsigned int`, and a member `operator+` whose parameter is a `const` reference to the class. Why does `x + 42` compile? What would change if the constructor were declared `explicit`?"
explanation = "A constructor callable with one argument is also a conversion: the compiler may use it silently to turn an `unsigned int` into an object of the class. In `x + 42` it builds a temporary object from `42` and passes it to `operator+`. That works because the parameter is a `const` reference: a temporary cannot bind to a non-`const` reference. With `explicit`, the constructor can only be called explicitly, so you must write `x + T(42)`, where `T` is the class. Note that `42 + x` still would not compile with a member `operator+`: the compiler never converts the left operand into an object of the class in order to call one of its member functions."

[questions.translations.fr]
title = "Constructeurs à un argument"
stem = "Une classe a un constructeur qui prend un `unsigned int`, et un `operator+` membre dont le paramètre est une référence `const` sur la classe. Pourquoi `x + 42` compile-t-il ? Qu'est-ce qui changerait si le constructeur était déclaré `explicit` ?"
explanation = "Un constructeur appelable avec un seul argument est aussi une conversion : le compilateur peut s'en servir en silence pour transformer un `unsigned int` en objet de la classe. Dans `x + 42`, il construit un objet temporaire à partir de `42` et le passe à `operator+`. Cela fonctionne parce que le paramètre est une référence `const` : un temporaire ne peut pas se lier à une référence non `const`. Avec `explicit`, le constructeur ne peut être appelé qu'explicitement : il faut écrire `x + T(42)`, où `T` est la classe. À noter : `42 + x` ne compilerait toujours pas avec un `operator+` membre, car le compilateur ne convertit jamais l'opérande de gauche en objet de la classe pour appeler l'une de ses fonctions membres."

[questions.translations.es]
title = "Constructores de un argumento"
stem = "Una clase tiene un constructor que recibe un `unsigned int` y un `operator+` miembro cuyo parámetro es una referencia `const` a la clase. ¿Por qué compila `x + 42`? ¿Qué cambiaría si el constructor se declarase `explicit`?"
explanation = "Un constructor que se puede llamar con un solo argumento es también una conversión: el compilador puede usarlo en silencio para convertir un `unsigned int` en un objeto de la clase. En `x + 42` construye un objeto temporal a partir de `42` y lo pasa a `operator+`. Funciona porque el parámetro es una referencia `const`: un temporal no puede enlazarse a una referencia no `const`. Con `explicit`, el constructor solo puede llamarse explícitamente, así que hay que escribir `x + T(42)`, donde `T` es la clase. Ojo: `42 + x` seguiría sin compilar con un `operator+` miembro, porque el compilador nunca convierte el operando izquierdo en un objeto de la clase para llamar a una de sus funciones miembro."

