key_points = [
  "Deleting a derived object through a pointer to its base runs the destructor chosen from the pointer's type unless that destructor is virtual.",
  "The derived destructor is then skipped, so whatever the derived part owns is never released; the standard calls this undefined behavior.",
  "A virtual destructor dispatches to the destructor of the actual object, which then runs the base destructors in turn.",
]

[questions.translations.en]
title = "Destructor of a polymorphic base"
stem = "Why must a base class have a virtual destructor as soon as objects of derived classes may be deleted through a pointer to the base?"
explanation = "When the base destructor is not virtual, `delete basePtr` calls the destructor chosen from the static type of the pointer. For a derived object, the derived destructor is then skipped: whatever the derived part owns, such as memory or open files, is never released, and the standard classifies the whole operation as undefined behavior. Declaring the base destructor `virtual` makes `delete` go through dynamic dispatch: the destructor of the actual object runs first, then the base destructors are called automatically, from the most derived class down to the base."

[questions.translations.fr]
title = "Destructeur d'une base polymorphe"
stem = "Pourquoi une classe de base doit-elle avoir un destructeur virtuel dès que des objets de classes dérivées peuvent être détruits à travers un pointeur sur la base ?"
explanation = "Quand le destructeur de base n'est pas virtuel, `delete basePtr` appelle le destructeur choisi d'après le type statique du pointeur. Pour un objet dérivé, le destructeur de la classe dérivée est alors sauté : ce que possède la partie dérivée, mémoire ou fichiers ouverts, n'est jamais libéré, et la norme qualifie toute l'opération de comportement indéfini. Déclarer le destructeur de base `virtual` fait passer `delete` par la résolution dynamique : le destructeur de l'objet réel s'exécute d'abord, puis les destructeurs des classes de base sont appelés automatiquement, de la plus dérivée jusqu'à la base."

[questions.translations.es]
title = "Destructor de una base polimórfica"
stem = "¿Por qué una clase base debe tener un destructor virtual en cuanto los objetos de sus clases derivadas puedan destruirse a través de un puntero a la base?"
explanation = "Cuando el destructor de la base no es virtual, `delete basePtr` llama al destructor elegido según el tipo estático del puntero. Para un objeto derivado, el destructor de la clase derivada se omite: lo que posee la parte derivada, como memoria o archivos abiertos, nunca se libera, y el estándar considera toda la operación comportamiento indefinido. Declarar `virtual` el destructor de la base hace que `delete` use el despacho dinámico: primero se ejecuta el destructor del objeto real y después se llaman automáticamente los destructores de las clases base, de la más derivada a la base."

[[questions.choices]]
correct = true
text = { en = "Without `virtual`, the destructor is chosen from the pointer's type, so the derived one is skipped and what it owns is never released — undefined behaviour", fr = "Sans `virtual`, le destructeur est choisi d'après le type du pointeur, donc celui de la classe dérivée est sauté et ce qu'il possède n'est jamais libéré — comportement indéfini", es = "Sin `virtual`, el destructor se elige según el tipo del puntero, así que el de la derivada se salta y lo que posee nunca se libera — comportamiento indefinido" }

[[questions.choices]]
text = { en = "Both destructors run anyway; `virtual` only changes the order in which they do", fr = "Les deux destructeurs s'exécutent quand même ; `virtual` ne change que leur ordre", es = "Los dos destructores se ejecutan igualmente; `virtual` solo cambia su orden" }

[[questions.choices]]
text = { en = "A virtual destructor is only needed when the base class has other virtual functions", fr = "Un destructeur virtuel n'est nécessaire que si la classe de base a d'autres fonctions virtuelles", es = "Un destructor virtual solo hace falta si la clase base tiene otras funciones virtuales" }

[[questions.choices]]
text = { en = "The derived destructor runs and then calls the base one only if it is virtual", fr = "Le destructeur dérivé s'exécute puis appelle celui de la base seulement s'il est virtuel", es = "El destructor derivado se ejecuta y luego llama al de la base solo si es virtual" }

