[questions.translations.en]
title = "Pure virtual functions"
stem = "What is a pure virtual function? Why can't you create an object of a class that declares one, and what is such a class useful for?"
explanation = "A pure virtual function is declared with `= 0`, as in `virtual void draw() const = 0;`. It states that every concrete class must provide this function, without the declaring class having to implement it. A class with at least one pure virtual function is abstract: creating an object of it does not compile, because the class is deliberately incomplete and leaves that function to its derived classes. A derived class can be instantiated once it overrides every pure virtual function. Abstract classes describe an interface: a function taking a reference or a pointer to the abstract class works with every implementation, chosen at runtime through virtual dispatch."

[questions.translations.fr]
title = "Fonctions virtuelles pures"
stem = "Qu'est-ce qu'une fonction virtuelle pure ? Pourquoi ne peut-on pas créer d'objet d'une classe qui en déclare une, et à quoi sert une telle classe ?"
explanation = "Une fonction virtuelle pure se déclare avec `= 0`, comme `virtual void draw() const = 0;`. Elle impose que toute classe concrète fournisse cette fonction, sans que la classe qui la déclare ait à l'implémenter. Une classe qui a au moins une fonction virtuelle pure est abstraite : créer un objet de cette classe ne compile pas, car elle est volontairement incomplète et laisse cette fonction à ses classes dérivées. Une classe dérivée devient instanciable une fois qu'elle redéfinit toutes les fonctions virtuelles pures. Les classes abstraites décrivent une interface : une fonction qui prend une référence ou un pointeur sur la classe abstraite fonctionne avec toutes les implémentations, choisies à l'exécution par la résolution dynamique."

[questions.translations.es]
title = "Funciones virtuales puras"
stem = "¿Qué es una función virtual pura? ¿Por qué no se puede crear un objeto de una clase que declara una, y para qué sirve una clase así?"
explanation = "Una función virtual pura se declara con `= 0`, como en `virtual void draw() const = 0;`. Indica que toda clase concreta debe proporcionar esa función, sin que la clase que la declara tenga que implementarla. Una clase con al menos una función virtual pura es abstracta: crear un objeto de ella no compila, porque la clase está incompleta a propósito y deja esa función a sus clases derivadas. Una clase derivada se puede instanciar cuando redefine todas las funciones virtuales puras. Las clases abstractas describen una interfaz: una función que recibe una referencia o un puntero a la clase abstracta funciona con todas las implementaciones, elegidas en tiempo de ejecución mediante el despacho dinámico."

