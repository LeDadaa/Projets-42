[[questions]]
slug = "rank05-l0-two-paths-to-one-base"
topic = "exam-rank-05-level-0"
kind = "free_text"
difficulty = 1400
tags = ["inheritance"]
key_points = [
  "Without virtual inheritance, the most derived object contains two separate copies of the common base.",
  "Using a member of the common base, or converting to it, is then ambiguous, and the two copies can hold different states.",
  "Declaring the intermediate inheritance as virtual, as in class B : virtual public A, makes the whole hierarchy share a single base subobject.",
  "With a virtual base, the most derived class is the one that constructs it; the initializers written in the intermediate classes are ignored.",
]

[questions.translations.en]
title = "Two paths to the same base"
stem = "Class `D` inherits from `B` and `C`, and both `B` and `C` inherit from `A`. What problem does this create for `D`, and how does virtual inheritance solve it?"
explanation = "With ordinary inheritance, a `D` object contains a `B` part and a `C` part, and each of them contains its own `A`: there are two copies of `A`. Accessing a member of `A` from `D`, or converting a `D*` to an `A*`, is ambiguous because the compiler cannot tell which copy you mean, and the two copies can drift apart. Writing `class B : virtual public A` and `class C : virtual public A` makes the whole hierarchy share a single `A` subobject. Since `B` and `C` no longer own that part, the constructor of the most derived class, `D`, is the one that initializes `A`: the initializers for `A` written in `B` and `C` are ignored when a `D` is built."

[questions.translations.fr]
title = "Deux chemins vers une même base"
stem = "La classe `D` hérite de `B` et de `C`, et `B` comme `C` héritent de `A`. Quel problème cela pose-t-il pour `D`, et comment l'héritage virtuel le résout-il ?"
explanation = "Avec un héritage ordinaire, un objet `D` contient une partie `B` et une partie `C`, qui contiennent chacune leur propre `A` : il y a deux copies de `A`. Accéder à un membre de `A` depuis `D`, ou convertir un `D*` en `A*`, est ambigu, car le compilateur ne sait pas de quelle copie il s'agit, et les deux copies peuvent diverger. Écrire `class B : virtual public A` et `class C : virtual public A` fait partager un unique sous-objet `A` à toute la hiérarchie. Comme `B` et `C` ne possèdent plus cette partie, c'est le constructeur de la classe la plus dérivée, `D`, qui initialise `A` : les initialisations de `A` écrites dans `B` et `C` sont ignorées quand on construit un `D`."

[questions.translations.es]
title = "Dos caminos hacia la misma base"
stem = "La clase `D` hereda de `B` y de `C`, y tanto `B` como `C` heredan de `A`. ¿Qué problema crea esto para `D`, y cómo lo resuelve la herencia virtual?"
explanation = "Con herencia normal, un objeto `D` contiene una parte `B` y una parte `C`, y cada una contiene su propio `A`: hay dos copias de `A`. Acceder a un miembro de `A` desde `D`, o convertir un `D*` en `A*`, es ambiguo, porque el compilador no sabe a qué copia te refieres, y las dos copias pueden divergir. Escribir `class B : virtual public A` y `class C : virtual public A` hace que toda la jerarquía comparta un único subobjeto `A`. Como `B` y `C` ya no poseen esa parte, es el constructor de la clase más derivada, `D`, el que inicializa `A`: las inicializaciones de `A` escritas en `B` y `C` se ignoran al construir un `D`."

[[questions.choices]]
correct = true
text = { en = "`D` holds two copies of `A`, which makes its members ambiguous; `class B : virtual public A` shares a single subobject, and the most derived class is then the one constructing it", fr = "`D` contient deux copies de `A`, ce qui rend ses membres ambigus ; `class B : virtual public A` partage un seul sous-objet, et c'est alors la classe la plus dérivée qui le construit", es = "`D` contiene dos copias de `A`, lo que hace ambiguos sus miembros; `class B : virtual public A` comparte un único subobjeto, y entonces la clase más derivada es la que lo construye" }

[[questions.choices]]
text = { en = "`D` holds a single copy already: the compiler merges the identical bases on its own", fr = "`D` ne contient déjà qu'une copie : le compilateur fusionne tout seul les bases identiques", es = "`D` ya contiene una sola copia: el compilador fusiona por sí solo las bases idénticas" }

[[questions.choices]]
text = { en = "With a virtual base, the intermediate classes are the ones constructing it, each in turn", fr = "Avec une base virtuelle, ce sont les classes intermédiaires qui la construisent, chacune à son tour", es = "Con una base virtual, son las clases intermedias las que la construyen, cada una a su vez" }

[[questions.choices]]
