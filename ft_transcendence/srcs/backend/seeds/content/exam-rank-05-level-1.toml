[[questions]]
slug = "rank05-l1-square-recurrence"
topic = "exam-rank-05-level-1"
kind = "free_text"
difficulty = 1400
tags = ["dynamic-programming", "algorithms"]
key_points = [
  "A blocked cell ends no square: s[i][j] is 0.",
  "A free cell on the first row or the first column can only end a square of side 1.",
  "Otherwise s[i][j] = 1 + min(s[i-1][j], s[i][j-1], s[i-1][j-1]), taken over the cell above, the cell to the left and the diagonal cell.",
  "A square of side k ending at (i, j) contains squares of side k - 1 ending at those three neighbours, and those three squares plus (i, j) cover it, so the smallest of the three sets the limit; the answer is the largest s[i][j] in the grid.",
]

[questions.translations.en]
title = "The largest free square"
stem = "In a grid where every cell is either free or blocked, you look for the largest square made only of free cells. Let `s[i][j]` be the side of the largest free square whose bottom-right corner is the cell `(i, j)`. Give the recurrence that computes `s[i][j]` and explain why it is correct."
explanation = "A blocked cell ends no square, so `s[i][j] = 0`. On the first row or the first column, a free cell can only end a square of side 1. Everywhere else, `s[i][j] = 1 + min(s[i-1][j], s[i][j-1], s[i-1][j-1])`. A square of side `k` ending at `(i, j)` contains three squares of side `k - 1`, ending at the cell above, the cell to the left and the diagonal cell. Conversely, when those three squares exist, together with `(i, j)` they cover the whole square of side `k`. The smallest of the three values is therefore what limits the square, and the largest `s[i][j]` in the grid is the side of the answer."

[questions.translations.fr]
title = "Le plus grand carré libre"
stem = "Dans une grille dont chaque case est libre ou bloquée, on cherche le plus grand carré formé uniquement de cases libres. On note `s[i][j]` le côté du plus grand carré libre dont le coin inférieur droit est la case `(i, j)`. Donnez la relation de récurrence qui calcule `s[i][j]` et expliquez pourquoi elle est juste."
explanation = "Une case bloquée ne termine aucun carré : `s[i][j] = 0`. Sur la première ligne ou la première colonne, une case libre ne peut terminer qu'un carré de côté 1. Partout ailleurs, `s[i][j] = 1 + min(s[i-1][j], s[i][j-1], s[i-1][j-1])`. Un carré de côté `k` qui se termine en `(i, j)` contient trois carrés de côté `k - 1`, qui se terminent sur la case du dessus, celle de gauche et celle de la diagonale. Inversement, quand ces trois carrés existent, ils couvrent avec `(i, j)` tout le carré de côté `k`. La plus petite des trois valeurs est donc ce qui limite le carré, et la plus grande valeur de `s` dans la grille donne le côté de la réponse."

[questions.translations.es]
title = "El mayor cuadrado libre"
stem = "En una cuadrícula donde cada casilla está libre o bloqueada, se busca el mayor cuadrado formado solo por casillas libres. Sea `s[i][j]` el lado del mayor cuadrado libre cuya esquina inferior derecha es la casilla `(i, j)`. Da la relación de recurrencia que calcula `s[i][j]` y explica por qué es correcta."
explanation = "Una casilla bloqueada no termina ningún cuadrado: `s[i][j] = 0`. En la primera fila o la primera columna, una casilla libre solo puede terminar un cuadrado de lado 1. En el resto, `s[i][j] = 1 + min(s[i-1][j], s[i][j-1], s[i-1][j-1])`. Un cuadrado de lado `k` que termina en `(i, j)` contiene tres cuadrados de lado `k - 1`, que terminan en la casilla de arriba, la de la izquierda y la de la diagonal. A la inversa, cuando esos tres cuadrados existen, junto con `(i, j)` cubren todo el cuadrado de lado `k`. El menor de los tres valores es por tanto lo que limita el cuadrado, y el mayor valor de `s` en la cuadrícula es el lado de la respuesta."

[[questions.choices]]
correct = true
text = { en = "0 on a blocked cell, 1 on the first row or column, otherwise `1 + min(s[i-1][j], s[i][j-1], s[i-1][j-1])`: the smallest of the three neighbours sets the limit", fr = "0 sur une case bloquée, 1 sur la première ligne ou colonne, sinon `1 + min(s[i-1][j], s[i][j-1], s[i-1][j-1])` : le plus petit des trois voisins fixe la limite", es = "0 en una casilla bloqueada, 1 en la primera fila o columna, si no `1 + min(s[i-1][j], s[i][j-1], s[i-1][j-1])`: el menor de los tres vecinos fija el límite" }

[[questions.choices]]
text = { en = "`1 + max(s[i-1][j], s[i][j-1], s[i-1][j-1])`: the largest neighbour gives the square that can be extended", fr = "`1 + max(s[i-1][j], s[i][j-1], s[i-1][j-1])` : le plus grand voisin donne le carré qu'on peut étendre", es = "`1 + max(s[i-1][j], s[i][j-1], s[i-1][j-1])`: el mayor vecino da el cuadrado que se puede ampliar" }

[[questions.choices]]
text = { en = "`1 + min(s[i-1][j], s[i][j-1])`: the diagonal cell is covered by the other two", fr = "`1 + min(s[i-1][j], s[i][j-1])` : la case diagonale est couverte par les deux autres", es = "`1 + min(s[i-1][j], s[i][j-1])`: la casilla diagonal la cubren las otras dos" }

[[questions.choices]]
text = { en = "The answer is `s[R-1][C-1]`, the value of the last cell of the grid", fr = "La réponse est `s[R-1][C-1]`, la valeur de la dernière case de la grille", es = "La respuesta es `s[R-1][C-1]`, el valor de la última casilla de la rejilla" }

[[questions]]
slug = "rank05-l1-square-complexity"
topic = "exam-rank-05-level-1"
kind = "free_text"
difficulty = 1200
tags = ["complexity", "dynamic-programming"]
key_points = [
  "The naive search tries every corner and every size and rereads the cells of each candidate square, so it repeats the same checks many times and costs far more than R·C (about R·C·m³ with m = min(R, C)).",
  "A table giving, for each cell, the side of the largest square ending there is filled with one constant-time step per cell, from three values already computed.",
  "The whole grid is therefore processed in O(R·C) time, each cell once.",
  "The gain comes from reusing the results of neighbouring cells instead of recomputing them, which is what dynamic programming is.",
]

[questions.translations.en]
title = "Cost of searching for a square"
stem = "To find the largest free square in a grid of `R` rows and `C` columns, a naive program tries every top-left corner and every size, and checks every cell of each candidate square. Roughly what does it cost? What does a table storing, for each cell, the side of the largest square ending there bring that cost down to, and why?"
explanation = "The naive program tries `R·C` corners and up to `m = min(R, C)` sizes, and checking a square of side `k` reads `k²` cells: on a free grid that adds up to about `R·C·m³` reads, most of them rereading cells already checked for a smaller size. With the table, each cell's value comes from three values already computed (above, left and diagonal) in a constant number of operations, so the grid is processed in a single pass, in `O(R·C)`. The whole gain comes from reusing the answers to smaller subproblems instead of recomputing them: that is dynamic programming."

[questions.translations.fr]
title = "Coût de la recherche d'un carré"
stem = "Pour chercher le carré libre de côté maximal dans une grille de `R` lignes et `C` colonnes, un programme naïf essaie chaque coin supérieur gauche et chaque taille, et vérifie chaque case de chaque carré candidat. Que coûte-t-il, à peu près ? À combien descend ce coût avec un tableau qui donne, pour chaque case, le côté du plus grand carré qui s'y termine, et pourquoi ?"
explanation = "Le programme naïf essaie `R·C` coins et jusqu'à `m = min(R, C)` tailles, et vérifier un carré de côté `k` lit `k²` cases : sur une grille libre, cela fait environ `R·C·m³` lectures, dont la plupart relisent des cases déjà vérifiées pour une taille plus petite. Avec le tableau, la valeur de chaque case se calcule à partir de trois valeurs déjà connues (au-dessus, à gauche et en diagonale), en un nombre constant d'opérations : la grille se traite en un seul passage, en `O(R·C)`. Tout le gain vient de la réutilisation des réponses à des sous-problèmes plus petits au lieu de les recalculer : c'est la programmation dynamique."

[questions.translations.es]
title = "Coste de buscar un cuadrado"
stem = "Para encontrar el mayor cuadrado libre en una cuadrícula de `R` filas y `C` columnas, un programa ingenuo prueba cada esquina superior izquierda y cada tamaño, y comprueba cada casilla de cada cuadrado candidato. ¿Cuánto cuesta, más o menos? ¿A cuánto baja ese coste con una tabla que guarda, para cada casilla, el lado del mayor cuadrado que termina en ella, y por qué?"
explanation = "El programa ingenuo prueba `R·C` esquinas y hasta `m = min(R, C)` tamaños, y comprobar un cuadrado de lado `k` lee `k²` casillas: en una cuadrícula libre eso suma unas `R·C·m³` lecturas, la mayoría releyendo casillas ya comprobadas para un tamaño menor. Con la tabla, el valor de cada casilla se calcula a partir de tres valores ya conocidos (arriba, izquierda y diagonal) en un número constante de operaciones, así que la cuadrícula se recorre una sola vez, en `O(R·C)`. Toda la ganancia viene de reutilizar las respuestas a subproblemas más pequeños en lugar de recalcularlas: eso es la programación dinámica."

[[questions.choices]]
correct = true
text = { en = "The naive search rereads the cells of every candidate and costs far more than `R·C`; the table fills each cell in constant time from three already computed values, so O(R·C)", fr = "La recherche naïve relit les cases de chaque candidat et coûte bien plus que `R·C` ; la table remplit chaque case en temps constant depuis trois valeurs déjà calculées, donc O(R·C)", es = "La búsqueda ingenua relee las casillas de cada candidato y cuesta mucho más que `R·C`; la tabla rellena cada casilla en tiempo constante a partir de tres valores ya calculados, así que O(R·C)" }

[[questions.choices]]
text = { en = "Both cost the same: the table only moves the work elsewhere", fr = "Les deux coûtent pareil : la table ne fait que déplacer le travail ailleurs", es = "Las dos cuestan lo mismo: la tabla solo mueve el trabajo a otro sitio" }

[[questions.choices]]
text = { en = "The table brings it down to O(R + C), one step per row and per column", fr = "La table ramène le coût à O(R + C), une étape par ligne et par colonne", es = "La tabla lo baja a O(R + C), un paso por fila y por columna" }

[[questions.choices]]
text = { en = "The gain comes from stopping the search early, not from reusing neighbouring results", fr = "Le gain vient d'un arrêt anticipé de la recherche, pas de la réutilisation des résultats voisins", es = "La ganancia viene de parar pronto la búsqueda, no de reutilizar los resultados vecinos" }

[[questions]]
slug = "rank05-l1-dp-memory"
topic = "exam-rank-05-level-1"
kind = "free_text"
difficulty = 1200
tags = ["dynamic-programming", "memory"]
key_points = [
  "Each value only depends on the previous row (above and diagonal) and on the current row (left), so older rows are never read again.",
  "Two rows of C values, swapped after each row, are enough: O(C) memory instead of O(R·C); one row plus a variable keeping the old diagonal value also works.",
  "To locate the answer at the end, it is enough to remember the best side found and the cell where that square ends; its top-left corner is that cell minus (side - 1) on both axes.",
]

[questions.translations.en]
title = "Memory of a row-by-row table"
stem = "A table `s[i][j]` is filled row by row, and each value depends on the cell above, the cell to the left and the diagonal cell. Must the whole table stay in memory? What is the minimum, and what must you remember to still know where the best result is at the end?"
explanation = "Row `i` only reads row `i - 1` (above and diagonal) and itself (left): once a row is finished, the rows before the previous one are never read again. Two rows of `C` values are enough, swapped after each row, which lowers memory from `O(R·C)` to `O(C)`; a single row plus one variable saving the old diagonal value also works. The table no longer exists at the end, so you keep the best value found and the cell where it was found as you go. For a square, that cell is the bottom-right corner, and the top-left corner is found by subtracting `side - 1` from the row and the column."

[questions.translations.fr]
title = "Mémoire d'un tableau rempli ligne par ligne"
stem = "Un tableau `s[i][j]` est rempli ligne par ligne, et chaque valeur dépend de la case au-dessus, de celle de gauche et de celle de la diagonale. Faut-il garder tout le tableau en mémoire ? Quel est le minimum, et que faut-il retenir pour savoir encore, à la fin, où se trouve le meilleur résultat ?"
explanation = "La ligne `i` ne lit que la ligne `i - 1` (au-dessus et en diagonale) et elle-même (à gauche) : une fois une ligne terminée, les lignes antérieures à la précédente ne sont plus jamais lues. Deux lignes de `C` valeurs suffisent, échangées après chaque ligne, ce qui fait passer la mémoire de `O(R·C)` à `O(C)` ; une seule ligne plus une variable qui garde l'ancienne valeur de la diagonale convient aussi. Le tableau n'existe plus à la fin : on retient donc au fil du calcul la meilleure valeur trouvée et la case où elle l'a été. Pour un carré, cette case est le coin inférieur droit, et le coin supérieur gauche s'obtient en retirant `côté - 1` à la ligne et à la colonne."

[questions.translations.es]
title = "Memoria de una tabla fila a fila"
stem = "Una tabla `s[i][j]` se rellena fila a fila, y cada valor depende de la casilla de arriba, la de la izquierda y la de la diagonal. ¿Hay que mantener toda la tabla en memoria? ¿Cuál es el mínimo, y qué hay que recordar para saber todavía, al final, dónde está el mejor resultado?"
explanation = "La fila `i` solo lee la fila `i - 1` (arriba y diagonal) y a sí misma (izquierda): una vez terminada una fila, las anteriores a la previa no se vuelven a leer. Bastan dos filas de `C` valores, intercambiadas después de cada fila, lo que baja la memoria de `O(R·C)` a `O(C)`; también sirve una sola fila más una variable que guarda el valor antiguo de la diagonal. La tabla ya no existe al final, así que se guarda sobre la marcha el mejor valor encontrado y la casilla donde apareció. Para un cuadrado, esa casilla es la esquina inferior derecha, y la esquina superior izquierda se obtiene restando `lado - 1` a la fila y a la columna."

[[questions.choices]]
correct = true
text = { en = "Two rows are enough, swapped after each one: O(C) instead of O(R·C); keeping the best side and the cell where that square ends locates its top-left corner", fr = "Deux lignes suffisent, échangées après chacune : O(C) au lieu de O(R·C) ; garder le meilleur côté et la case où ce carré se termine localise son coin en haut à gauche", es = "Bastan dos filas, intercambiadas tras cada una: O(C) en vez de O(R·C); guardar el mejor lado y la casilla donde termina ese cuadrado localiza su esquina superior izquierda" }

[[questions.choices]]
text = { en = "The whole table must stay: the answer is rebuilt by walking it backwards at the end", fr = "Toute la table doit rester : la réponse se reconstruit en la parcourant à l'envers à la fin", es = "Toda la tabla debe quedarse: la respuesta se reconstruye recorriéndola al revés al final" }

[[questions.choices]]
text = { en = "One single row is enough with no extra variable, since the left value is the only one needed", fr = "Une seule ligne suffit sans variable supplémentaire, puisque la valeur de gauche est la seule nécessaire", es = "Basta una sola fila sin variable extra, ya que el valor de la izquierda es el único necesario" }

[[questions.choices]]
text = { en = "Keeping the best side alone is enough: the position is deduced from the size", fr = "Garder le meilleur côté seul suffit : la position se déduit de la taille", es = "Basta con guardar el mejor lado: la posición se deduce del tamaño" }

[[questions]]
slug = "rank05-l1-breaking-ties"
topic = "exam-rank-05-level-1"
kind = "free_text"
difficulty = 1200
tags = ["algorithms"]
key_points = [
  "Visit the cells in reading order (row by row, left to right) and replace the best result only when a strictly larger side is found: > rather than >=.",
  "With a strict comparison, the first square of the maximum size met in reading order is the one kept; with >= the last one would be kept instead.",
  "All tied squares have the same side k, and a square's top row is its bottom row minus (k - 1), same for columns, so ordering them by bottom-right corner gives the same order as by top-left corner.",
]

[questions.translations.en]
title = "Breaking ties between equal squares"
stem = "Several free squares of a grid can share the maximum size. You must keep the one whose top-left corner is on the highest row, and among those the leftmost one. The table `s[i][j]` gives the side of the largest square ending at `(i, j)`, its bottom-right corner, and is filled row by row, left to right. How do you keep the right square, and why does it work although the table indexes squares by their bottom-right corner?"
explanation = "Walk the cells in reading order and replace the best result only when `s[i][j]` is strictly greater than the best side so far. With `>`, the first square of maximum size met in that order is kept; `>=` would keep the last one. It is the right one because all tied squares have the same side `k`: a square's top row is its bottom row minus `k - 1`, and the same goes for columns. For squares of equal size, ordering by bottom-right corner is therefore the same as ordering by top-left corner, and the first one met in reading order is the highest, then the leftmost."

[questions.translations.fr]
title = "Départager des carrés égaux"
stem = "Plusieurs carrés libres d'une grille peuvent avoir la taille maximale. Il faut garder celui dont le coin supérieur gauche est sur la ligne la plus haute, et parmi ceux-là le plus à gauche. Le tableau `s[i][j]` donne le côté du plus grand carré qui se termine en `(i, j)`, son coin inférieur droit, et il est rempli ligne par ligne, de gauche à droite. Comment garder le bon carré, et pourquoi cela marche-t-il alors que le tableau repère les carrés par leur coin inférieur droit ?"
explanation = "On parcourt les cases dans l'ordre de lecture et on ne remplace le meilleur résultat que si `s[i][j]` est strictement plus grand que le meilleur côté trouvé. Avec `>`, c'est le premier carré de taille maximale rencontré dans cet ordre qui est gardé ; `>=` garderait le dernier. C'est bien le bon, parce que tous les carrés à égalité ont le même côté `k` : la ligne du haut d'un carré est sa ligne du bas moins `k - 1`, et de même pour les colonnes. Pour des carrés de même taille, trier par coin inférieur droit revient donc à trier par coin supérieur gauche, et le premier rencontré dans l'ordre de lecture a le coin supérieur gauche situé sur la ligne la plus haute, et à égalité dans la colonne la plus à gauche."

[questions.translations.es]
title = "Desempatar cuadrados iguales"
stem = "Varios cuadrados libres de una cuadrícula pueden tener el tamaño máximo. Hay que quedarse con aquel cuya esquina superior izquierda está en la fila más alta y, entre esos, el que está más a la izquierda. La tabla `s[i][j]` da el lado del mayor cuadrado que termina en `(i, j)`, su esquina inferior derecha, y se rellena fila a fila, de izquierda a derecha. ¿Cómo te quedas con el cuadrado correcto, y por qué funciona aunque la tabla identifique los cuadrados por su esquina inferior derecha?"
explanation = "Se recorren las casillas en orden de lectura y solo se reemplaza el mejor resultado si `s[i][j]` es estrictamente mayor que el mejor lado encontrado. Con `>`, se conserva el primer cuadrado de tamaño máximo encontrado en ese orden; con `>=` se conservaría el último. Es el correcto porque todos los cuadrados empatados tienen el mismo lado `k`: la fila superior de un cuadrado es su fila inferior menos `k - 1`, y lo mismo con las columnas. Para cuadrados del mismo tamaño, ordenar por esquina inferior derecha equivale a ordenar por esquina superior izquierda, y el primero encontrado en orden de lectura es el más alto y, luego, el más a la izquierda."

