[[questions]]
slug = "rank05-l1-grid-layout-in-c"
topic = "exam-rank-05-level-1"
kind = "free_text"
difficulty = 1200
tags = ["data-structures", "memory"]
key_points = [
  "An array of row pointers takes R + 1 allocations and R + 1 frees, and if an allocation fails midway the rows already allocated must be freed.",
  "It allows grid[i][j] and rows of different lengths, but the rows may be scattered in memory and each access goes through an extra pointer.",
  "A single block takes one allocation and one free, and its cells are contiguous, which is friendlier to the processor cache.",
  "The single block is indexed with i * C + j, so the width C must be known.",
]

[questions.translations.en]
title = "Laying out a grid in C"
stem = "In C, a grid of `R` rows and `C` columns can be stored as an array of `R` row pointers (`char **`), each row allocated on its own, or as a single block of `R * C` bytes indexed with `i * C + j`. Compare the two: allocations and frees, handling an allocation failure, and speed of access."
explanation = "The array of row pointers costs `R + 1` calls to `malloc` and as many to `free`; if one allocation fails halfway, every row already allocated must be freed before giving up. In return it reads naturally as `grid[i][j]` and lets rows have different lengths, but the rows can end up anywhere in memory and each access first reads the row pointer. The single block costs one `malloc` and one `free`, so failure handling is trivial, and its cells are contiguous, which the processor cache rewards when the grid is walked row by row. Its price is the index computation `i * C + j`, which requires knowing the width."

[questions.translations.fr]
title = "Ranger une grille en C"
stem = "En C, une grille de `R` lignes et `C` colonnes peut être rangée dans un tableau de `R` pointeurs de ligne (`char **`), chaque ligne étant allouée à part, ou dans un seul bloc de `R * C` octets indexé par `i * C + j`. Comparez les deux : allocations et libérations, gestion d'un échec d'allocation, et vitesse d'accès."
explanation = "Le tableau de pointeurs de ligne coûte `R + 1` appels à `malloc` et autant à `free` ; si une allocation échoue en cours de route, il faut libérer toutes les lignes déjà allouées avant d'abandonner. En échange, il s'écrit naturellement `grille[i][j]` et permet des lignes de longueurs différentes, mais les lignes peuvent être dispersées en mémoire, et chaque accès lit d'abord le pointeur de ligne. Le bloc unique coûte un seul `malloc` et un seul `free`, donc un échec se gère trivialement, et ses cases sont contiguës, ce que le cache du processeur récompense quand la grille est parcourue ligne par ligne. Son prix est le calcul d'indice `i * C + j`, qui exige de connaître la largeur."

[questions.translations.es]
title = "Organizar una cuadrícula en C"
stem = "En C, una cuadrícula de `R` filas y `C` columnas puede guardarse en un array de `R` punteros a fila (`char **`), reservando cada fila por separado, o en un único bloque de `R * C` bytes indexado con `i * C + j`. Compara las dos opciones: reservas y liberaciones, manejo de un fallo de reserva y velocidad de acceso."
explanation = "El array de punteros a fila cuesta `R + 1` llamadas a `malloc` y otras tantas a `free`; si una reserva falla a medio camino, hay que liberar todas las filas ya reservadas antes de rendirse. A cambio, se escribe con naturalidad como `grid[i][j]` y admite filas de longitudes distintas, pero las filas pueden quedar dispersas en memoria y cada acceso lee primero el puntero de la fila. El bloque único cuesta un solo `malloc` y un solo `free`, así que un fallo se maneja trivialmente, y sus casillas son contiguas, algo que la caché del procesador premia cuando la cuadrícula se recorre fila a fila. Su precio es el cálculo del índice `i * C + j`, que exige conocer el ancho."

[[questions.choices]]
correct = true
text = { en = "Row pointers mean `R + 1` allocations and a partial cleanup on failure; a single block takes one allocation, is contiguous and cache-friendly, and is indexed `i * C + j`", fr = "Des pointeurs de lignes, c'est `R + 1` allocations et un nettoyage partiel en cas d'échec ; un bloc unique demande une allocation, est contigu et favorable au cache, et s'indexe `i * C + j`", es = "Punteros de filas significa `R + 1` reservas y una limpieza parcial si falla; un bloque único necesita una reserva, es contiguo y amable con la caché, y se indexa `i * C + j`" }

[[questions.choices]]
text = { en = "A single block needs `R` allocations too, one per row of the block", fr = "Un bloc unique demande aussi `R` allocations, une par ligne du bloc", es = "Un bloque único necesita también `R` reservas, una por fila del bloque" }

[[questions.choices]]
text = { en = "Row pointers give contiguous cells, which is what makes `grid[i][j]` possible", fr = "Les pointeurs de lignes donnent des cases contiguës, c'est ce qui rend `grid[i][j]` possible", es = "Los punteros de filas dan celdas contiguas, eso es lo que hace posible `grid[i][j]`" }

[[questions.choices]]
