[[questions]]
slug = "rank03-l1-pruning-a-sum-search"
topic = "exam-rank-03-level-1"
kind = "free_text"
difficulty = 1400
tags = ["backtracking", "algorithms"]
key_points = [
  "Pruning a branch as soon as the partial sum exceeds the target is only correct when every number is non-negative, because then the sum can only grow.",
  "With negative numbers a later element can bring the sum back down, so that cut loses solutions: with {5, -1} and a target of 4, it discards {5, -1}.",
  "A safe cut must rely on a bound that holds whatever the remaining elements are, for instance the partial sum plus every remaining positive number still being below the target.",
]

[questions.translations.en]
title = "When can a sum search be pruned?"
stem = "A backtracking search looks for every subset of a set of integers whose sum equals a target. A tempting pruning abandons a branch as soon as the partial sum exceeds the target. When is that cut correct, and when does it lose solutions? Give an example."
explanation = "The cut is correct only when every number is non-negative: adding elements can then only increase the sum, so a partial sum already above the target can never come back down to it. As soon as negative numbers are allowed, a later element can lower the sum again, and the same cut throws valid solutions away: with the set `{5, -1}` and a target of 4, the branch that takes 5 is abandoned at once, and `{5, -1}`, whose sum is 4, is never found. A safe pruning must rest on a bound that holds whatever the remaining elements are, for instance: even adding every remaining positive number, the sum cannot reach the target."

[questions.translations.fr]
title = "Quand peut-on élaguer une recherche de somme ?"
stem = "Une recherche par retour sur trace cherche tous les sous-ensembles d'un ensemble d'entiers dont la somme vaut une cible. Un élagage tentant abandonne une branche dès que la somme partielle dépasse la cible. Quand cette coupe est-elle correcte, et quand fait-elle perdre des solutions ? Donnez un exemple."
explanation = "La coupe n'est correcte que si tous les nombres sont positifs ou nuls : ajouter des éléments ne peut alors qu'augmenter la somme, donc une somme partielle déjà au-dessus de la cible ne pourra jamais y redescendre. Dès que des nombres négatifs sont permis, un élément suivant peut faire baisser la somme, et la même coupe jette des solutions valides : avec l'ensemble `{5, -1}` et une cible de 4, la branche qui prend 5 est abandonnée aussitôt, et `{5, -1}`, dont la somme vaut 4, n'est jamais trouvé. Un élagage sûr doit reposer sur une borne qui tient quels que soient les éléments restants, par exemple : même en ajoutant tous les nombres positifs restants, la somme ne peut pas atteindre la cible."

[questions.translations.es]
title = "¿Cuándo se puede podar una búsqueda de suma?"
stem = "Una búsqueda con vuelta atrás recorre las combinaciones de elementos de una colección de enteros y retiene las que alcanzan exactamente un valor objetivo. Una poda tentadora abandona una rama en cuanto la suma parcial supera el objetivo. ¿Cuándo es correcto ese corte y cuándo hace perder soluciones? Da un ejemplo."
explanation = "El corte solo es correcto si todos los números son no negativos: añadir elementos solo puede aumentar la suma, así que una suma parcial que ya supera el objetivo nunca podrá volver a bajar hasta él. En cuanto se permiten números negativos, un elemento posterior puede reducir la suma, y el mismo corte descarta soluciones válidas: con el conjunto `{5, -1}` y un objetivo de 4, la rama que toma el 5 se abandona en el acto y `{5, -1}`, cuya suma es 4, nunca se encuentra. Una poda segura debe basarse en una cota que se cumpla sean cuales sean los elementos restantes, por ejemplo: aunque se sumen todos los números positivos restantes, la suma no puede alcanzar el objetivo."

[[questions.choices]]
correct = true
text = { en = "Only when every number is non-negative: with `{5, -1}` and a target of 4 the cut throws away `{5, -1}`, whose sum does reach the target", fr = "Seulement si tous les nombres sont positifs ou nuls : avec `{5, -1}` et une cible de 4, la coupe jette `{5, -1}`, dont la somme atteint pourtant la cible", es = "Solo si todos los números son no negativos: con `{5, -1}` y un objetivo de 4, el corte tira `{5, -1}`, cuya suma sí llega al objetivo" }

[[questions.choices]]
text = { en = "Always: a sum that has passed the target can never come back to it", fr = "Toujours : une somme qui a dépassé la cible ne peut jamais y revenir", es = "Siempre: una suma que ha pasado el objetivo nunca puede volver a él" }

[[questions.choices]]
text = { en = "Only when the numbers are sorted, whatever their signs", fr = "Seulement si les nombres sont triés, quels que soient leurs signes", es = "Solo si los números están ordenados, sean cuales sean sus signos" }

[[questions.choices]]
text = { en = "Never: any pruning at all makes an exhaustive search incomplete", fr = "Jamais : tout élagage rend une recherche exhaustive incomplète", es = "Nunca: cualquier poda vuelve incompleta una búsqueda exhaustiva" }

[[questions]]
slug = "rank03-l1-balanced-parentheses"
topic = "exam-rank-03-level-1"
kind = "free_text"
difficulty = 1000
tags = ["strings", "algorithms"]
key_points = [
  "Walk the string keeping a counter of open parentheses: + 1 for '(' and - 1 for ')'.",
  "If the counter would go below 0, a ')' has no matching '(' and the string is unbalanced.",
  "At the end, the string is balanced only if the counter is back to 0; otherwise some '(' were never closed.",
  "One pass, O(n) time and constant memory.",
]

[questions.translations.en]
title = "Checking that parentheses are balanced"
stem = "How do you check in a single pass that a string made of `(` and `)` is balanced? What are the two ways a string can fail the check?"
explanation = "Walk the string with a counter of parentheses still open: add 1 for `(` and subtract 1 for `)`. A string can fail in two ways. If the counter would drop below 0, a `)` arrives with no `(` left to close, as in `())`. If the counter is not back to 0 at the end, some `(` were never closed, as in `(()`. A string that avoids both is balanced. The check takes one pass, in linear time, and needs nothing but the counter."

[questions.translations.fr]
title = "Vérifier que des parenthèses sont équilibrées"
stem = "Comment vérifier en un seul passage qu'une chaîne formée de `(` et de `)` est équilibrée ? De quelles deux façons une chaîne peut-elle échouer à cette vérification ?"
explanation = "On parcourt la chaîne avec un compteur des parenthèses encore ouvertes : on ajoute 1 pour `(` et on retire 1 pour `)`. Une chaîne peut échouer de deux façons. Si le compteur devait passer sous 0, une `)` arrive alors qu'aucune `(` ne reste à fermer, comme dans `())`. Si le compteur n'est pas revenu à 0 à la fin, des `(` n'ont jamais été fermées, comme dans `(()`. Une chaîne qui évite ces deux cas est équilibrée. La vérification tient en un passage, en temps linéaire, et n'a besoin de rien d'autre que le compteur."

[questions.translations.es]
title = "Comprobar que los paréntesis están equilibrados"
stem = "¿Cómo compruebas en una sola pasada que una cadena formada por `(` y `)` está equilibrada? ¿De qué dos formas puede una cadena fallar esa comprobación?"
explanation = "Se recorre la cadena con un contador de paréntesis todavía abiertos: se suma 1 por cada `(` y se resta 1 por cada `)`. Una cadena puede fallar de dos formas. Si el contador fuera a bajar de 0, llega un `)` sin ningún `(` que cerrar, como en `())`. Si el contador no ha vuelto a 0 al final, algunos `(` nunca se cerraron, como en `(()`. Una cadena que evita ambos casos está equilibrada. La comprobación se hace en una pasada, en tiempo lineal, y no necesita nada más que el contador."

[[questions.choices]]
correct = true
text = { en = "A counter, +1 and -1: the string fails if the counter ever goes below 0, or if it is not back to 0 at the end", fr = "Un compteur, +1 et -1 : la chaîne échoue si le compteur passe sous 0, ou s'il n'est pas revenu à 0 à la fin", es = "Un contador, +1 y -1: la cadena falla si el contador baja de 0, o si no ha vuelto a 0 al final" }

[[questions.choices]]
text = { en = "Counting the `(` and the `)` and comparing the two totals is enough", fr = "Compter les `(` et les `)` et comparer les deux totaux suffit", es = "Basta con contar los `(` y los `)` y comparar los dos totales" }

[[questions.choices]]
text = { en = "A stack holding each `(` is needed: a simple counter cannot do it", fr = "Une pile contenant chaque `(` est nécessaire : un simple compteur n'y suffit pas", es = "Hace falta una pila con cada `(`: un simple contador no basta" }

[[questions.choices]]
text = { en = "Ending with the counter back at 0 is enough, whatever happened along the way", fr = "Terminer avec le compteur revenu à 0 suffit, quoi qu'il se soit passé en chemin", es = "Terminar con el contador de vuelta a 0 basta, pase lo que pase por el camino" }

[[questions]]
slug = "rank03-l1-minimum-removals"
topic = "exam-rank-03-level-1"
kind = "free_text"
difficulty = 1400
tags = ["strings", "backtracking"]
key_points = [
  "One pass with a counter finds how many of each parenthesis must go: every ')' that arrives when the counter is 0 is an unmatched ')', and the counter's value at the end is the number of unmatched '('.",
  "Those two counts give the minimum number of removals; removing fewer cannot balance the string.",
  "Backtracking then tries removing parentheses of each kind until both counts reach 0, and keeps the results that are balanced.",
  "Knowing the counts in advance prunes the search: a branch that removes more than needed is abandoned.",
]

[questions.translations.en]
title = "The fewest parentheses to remove"
stem = "A string of parentheses is unbalanced, and you must remove as few parentheses as possible to balance it, listing every way of doing so. How do you know in advance how many `(` and how many `)` must go? How does that number guide the search?"
explanation = "One pass with the usual counter gives both numbers. Each `)` that arrives while the counter is 0 has no partner and must be removed; the value the counter still holds at the end is the number of `(` that were never closed. For `))((`, that means two of each. These counts are a minimum: removing fewer parentheses of either kind leaves one unmatched. A backtracking search then tries removing `(` and `)` until both counts drop to 0, and keeps the balanced results; any branch that would remove more than the counts allow is abandoned at once, which keeps the search small."

[questions.translations.fr]
title = "Le moins de parenthèses possible à retirer"
stem = "Une chaîne de parenthèses est déséquilibrée, et il faut retirer le moins de parenthèses possible pour l'équilibrer, en énumérant toutes les façons de le faire. Comment savoir à l'avance combien de `(` et combien de `)` doivent disparaître ? Comment ce nombre guide-t-il la recherche ?"
explanation = "Un seul passage avec le compteur habituel donne les deux nombres. Chaque `)` qui arrive alors que le compteur vaut 0 n'a pas de partenaire et doit être retirée ; la valeur que garde encore le compteur à la fin est le nombre de `(` jamais fermées. Pour `))((`, cela fait deux de chaque. Ces nombres sont un minimum : retirer moins de parenthèses de l'une ou l'autre sorte en laisse une sans partenaire. Une recherche par retour sur trace essaie ensuite de retirer des `(` et des `)` jusqu'à ce que les deux compteurs tombent à 0, et garde les résultats équilibrés ; toute branche qui retirerait plus que ne le permettent ces nombres est abandonnée aussitôt, ce qui garde la recherche petite."

[questions.translations.es]
title = "Quitar el menor número posible de paréntesis"
stem = "Una cadena de paréntesis está desequilibrada, y hay que quitar el menor número posible de paréntesis para equilibrarla, enumerando todas las formas de hacerlo. ¿Cómo sabes de antemano cuántos `(` y cuántos `)` deben desaparecer? ¿Cómo guía ese número la búsqueda?"
explanation = "Una sola pasada con el contador de siempre da los dos números. Cada `)` que llega cuando el contador vale 0 no tiene pareja y debe quitarse; el valor que aún tiene el contador al final es el número de `(` que nunca se cerraron. Para `))((`, son dos de cada. Esos números son un mínimo: quitar menos paréntesis de cualquiera de los dos tipos deja uno sin pareja. Después, una búsqueda con vuelta atrás prueba a quitar `(` y `)` hasta que los dos contadores llegan a 0, y conserva los resultados equilibrados; cualquier rama que quitaría más de lo que permiten esos números se abandona en el acto, lo que mantiene pequeña la búsqueda."

[[questions.choices]]
correct = true
text = { en = "One pass counts the unmatched `)` and, at the end, the unmatched `(`; those two counts are the minimum, and they prune the search", fr = "Un passage compte les `)` non appariées et, à la fin, les `(` non appariées ; ces deux comptes sont le minimum, et ils élaguent la recherche", es = "Una pasada cuenta los `)` sin pareja y, al final, los `(` sin pareja; esas dos cuentas son el mínimo y podan la búsqueda" }

[[questions.choices]]
text = { en = "The minimum cannot be known in advance: every number of removals has to be tried from 1 upward", fr = "Le minimum ne peut pas être connu à l'avance : il faut essayer chaque nombre de retraits à partir de 1", es = "El mínimo no se puede saber de antemano: hay que probar cada número de eliminaciones desde 1" }

[[questions.choices]]
text = { en = "Removing all the parentheses in excess of the rarer kind is always the minimum", fr = "Retirer toutes les parenthèses en excès par rapport au type le plus rare est toujours le minimum", es = "Quitar todos los paréntesis que sobran respecto al tipo menos frecuente es siempre el mínimo" }

[[questions.choices]]
text = { en = "Only `)` ever need removing, since a `(` can always be closed at the end", fr = "Seules des `)` ont besoin d'être retirées, puisqu'une `(` peut toujours être fermée à la fin", es = "Solo hay que quitar `)`, ya que un `(` siempre puede cerrarse al final" }

[[questions]]
slug = "rank03-l1-duplicate-solutions"
topic = "exam-rank-03-level-1"
kind = "free_text"
difficulty = 1200
tags = ["backtracking"]
key_points = [
  "Different sequences of choices can produce the same result: deleting either of two identical neighbouring characters gives the same string.",
  "One fix skips, at a given step, a choice identical to the previous one tried at that step, such as a character equal to the one just before it.",
  "Another fix records the results already produced and prints only new ones, at the cost of memory and lookups.",
]

[questions.translations.en]
title = "Avoiding duplicate solutions"
stem = "A backtracking search deletes characters from a string and prints every result it reaches. Why can the same result come out several times, as when one `)` is deleted from `())`? Give two ways to print each result only once."
explanation = "Different sequences of choices can lead to the same result: in `())`, deleting the first `)` or the second both give `()`, so two branches print the same string. The first fix works at the source: at a given step, a choice identical to the one just tried at that step is skipped, for instance a character equal to the one right before it, since it would lead to the same results. The second fix records the results already printed and only prints new ones; it is simpler to get right, but costs memory and a lookup for each result."

[questions.translations.fr]
title = "Éviter les solutions en double"
stem = "Une recherche par retour sur trace supprime des caractères d'une chaîne et affiche chaque résultat qu'elle atteint. Pourquoi un même résultat peut-il sortir plusieurs fois, comme quand on supprime une `)` de `())` ? Donnez deux façons de n'afficher chaque résultat qu'une fois."
explanation = "Des suites de choix différentes peuvent mener au même résultat : dans `())`, supprimer la première `)` ou la seconde donne `()` dans les deux cas, donc deux branches affichent la même chaîne. La première correction agit à la source : à une étape donnée, on saute un choix identique à celui qu'on vient d'essayer à cette même étape, par exemple un caractère égal à celui qui le précède, puisqu'il mènerait aux mêmes résultats. La seconde correction garde les résultats déjà affichés et n'affiche que les nouveaux ; elle est plus simple à réussir, mais coûte de la mémoire et une recherche pour chaque résultat."

[questions.translations.es]
title = "Evitar soluciones repetidas"
stem = "Una búsqueda con vuelta atrás borra caracteres de una cadena y muestra cada resultado al que llega. ¿Por qué un mismo resultado puede salir varias veces, como al borrar un `)` de `())`? Da dos formas de mostrar cada resultado una sola vez."
explanation = "Series de elecciones distintas pueden llevar al mismo resultado: en `())`, borrar el primer `)` o el segundo da `()` en ambos casos, así que dos ramas muestran la misma cadena. La primera corrección actúa en el origen: en un paso dado, se salta una elección idéntica a la que se acaba de probar en ese mismo paso, por ejemplo un carácter igual al que lo precede, ya que llevaría a los mismos resultados. La segunda corrección guarda los resultados ya mostrados y solo muestra los nuevos; es más fácil de hacer bien, pero cuesta memoria y una búsqueda por cada resultado."

[[questions.choices]]
correct = true
text = { en = "Different sequences of choices reach the same string; either skip a choice identical to the one just tried at that step, or record the results already produced", fr = "Des suites de choix différentes aboutissent à la même chaîne ; soit on saute un choix identique à celui qu'on vient d'essayer à cette étape, soit on retient les résultats déjà produits", es = "Secuencias de opciones distintas llegan a la misma cadena; o se salta una opción idéntica a la recién probada en ese paso, o se registran los resultados ya producidos" }

[[questions.choices]]
text = { en = "Duplicates come from a bug: a correct backtracking search never reaches the same result twice", fr = "Les doublons viennent d'un bug : une recherche par retour arrière correcte n'atteint jamais deux fois le même résultat", es = "Los duplicados vienen de un fallo: una búsqueda con retroceso correcta nunca llega dos veces al mismo resultado" }

[[questions.choices]]
text = { en = "Sorting the results and printing them in order removes the duplicates on its own", fr = "Trier les résultats et les afficher dans l'ordre supprime les doublons tout seul", es = "Ordenar los resultados y mostrarlos en orden quita los duplicados por sí solo" }

[[questions.choices]]
text = { en = "Deleting only the first of two identical characters loses solutions, so it must not be done", fr = "Ne supprimer que le premier de deux caractères identiques fait perdre des solutions, donc c'est à éviter", es = "Borrar solo el primero de dos caracteres idénticos pierde soluciones, así que no debe hacerse" }

[[questions]]
slug = "rank03-l1-shortest-closed-tour"
topic = "exam-rank-03-level-1"
kind = "free_text"
difficulty = 1200
tags = ["complexity", "algorithms"]
key_points = [
  "The exhaustive method tries every order of visiting the points, computes each closed tour's length as a sum of distances sqrt(dx² + dy²) including the return to the start, and keeps the smallest.",
  "A closed tour has no real starting point, so the first point can be fixed, leaving (n - 1)! orders to try; each tour is also found in both directions, which halves the distinct ones.",
  "That count grows factorially: 24 orders for 5 points, 362 880 for 10, nearly 40 million for 12, so the method only works for a handful of points.",
]

[questions.translations.en]
title = "The shortest closed tour through every point"
stem = "Given `n` points in the plane, you want the shortest closed path that visits each point once and returns to its start. How does an exhaustive search find it, why can the first point be fixed, and how many orders does that leave to try?"
explanation = "The exhaustive search tries every order of visiting the points; for each, it adds up the distances `sqrt(dx² + dy²)` between consecutive points, including the way back to the start, and keeps the smallest total. Since the tour is closed, it has no real starting point: fixing the first point loses nothing and leaves `(n - 1)!` orders; each tour is also met in both directions, which halves the distinct ones. That count grows factorially: 24 orders for 5 points, 362 880 for 10, almost 40 million for 12. Exhaustive search is therefore only usable for a handful of points."

[questions.translations.fr]
title = "Le plus court circuit passant par tous les points"
stem = "Étant donnés `n` points du plan, on cherche le plus court chemin fermé qui passe une fois par chaque point et revient à son départ. Comment une recherche exhaustive le trouve-t-elle, pourquoi peut-on fixer le premier point, et combien d'ordres reste-t-il alors à essayer ?"
explanation = "La recherche exhaustive essaie tous les ordres de visite des points ; pour chacun, elle additionne les distances `sqrt(dx² + dy²)` entre points consécutifs, retour au départ compris, et garde le plus petit total. Comme le circuit est fermé, il n'a pas de vrai point de départ : fixer le premier point ne fait rien perdre et laisse `(n - 1)!` ordres ; chaque circuit est aussi rencontré dans les deux sens, ce qui divise par deux ceux qui sont distincts. Ce nombre croît de façon factorielle : 24 ordres pour 5 points, 362 880 pour 10, près de 40 millions pour 12. La recherche exhaustive n'est donc utilisable que pour une poignée de points."

[questions.translations.es]
title = "El circuito cerrado más corto por todos los puntos"
stem = "Dados `n` puntos del plano, se busca el camino cerrado más corto que pasa una vez por cada punto y vuelve a su inicio. ¿Cómo lo encuentra una búsqueda exhaustiva, por qué se puede fijar el primer punto y cuántos órdenes quedan entonces por probar?"
explanation = "La búsqueda exhaustiva prueba todos los órdenes de visita de los puntos; para cada uno, suma las distancias `sqrt(dx² + dy²)` entre puntos consecutivos, incluida la vuelta al inicio, y se queda con el menor total. Como el circuito es cerrado, no tiene un verdadero punto de partida: fijar el primer punto no hace perder nada y deja `(n - 1)!` órdenes; además, cada circuito aparece en los dos sentidos, lo que divide por dos los distintos. Ese número crece de forma factorial: 24 órdenes para 5 puntos, 362 880 para 10, casi 40 millones para 12. La búsqueda exhaustiva solo sirve, por tanto, para unos pocos puntos."

[[questions.choices]]
correct = true
text = { en = "Try every order, sum the distances including the return; a closed tour has no start, so the first point is fixed, leaving `(n - 1)!` orders", fr = "Essayer tous les ordres, sommer les distances retour compris ; un tour fermé n'a pas de départ, donc le premier point est fixé, ce qui laisse `(n - 1)!` ordres", es = "Probar todos los órdenes, sumar las distancias incluido el regreso; un recorrido cerrado no tiene inicio, así que el primer punto se fija, dejando `(n - 1)!` órdenes" }

[[questions.choices]]
text = { en = "`n!` orders have to be tried: fixing the first point would leave tours out", fr = "Il faut essayer `n!` ordres : fixer le premier point laisserait des tours de côté", es = "Hay que probar `n!` órdenes: fijar el primer punto dejaría fuera recorridos" }

[[questions.choices]]
text = { en = "Visiting the nearest point each time gives the shortest tour, so no search is needed", fr = "Visiter le point le plus proche à chaque fois donne le tour le plus court, aucune recherche n'est donc nécessaire", es = "Visitar cada vez el punto más cercano da el recorrido más corto, así que no hace falta buscar" }

[[questions.choices]]
text = { en = "The count grows as `2^n`, which stays workable up to about thirty points", fr = "Le compte croît en `2^n`, ce qui reste praticable jusqu'à une trentaine de points", es = "La cuenta crece como `2^n`, lo que sigue siendo viable hasta unos treinta puntos" }

[[questions]]
slug = "rank03-l1-best-so-far-pruning"
topic = "exam-rank-03-level-1"
kind = "free_text"
difficulty = 1400
tags = ["backtracking", "complexity"]
key_points = [
  "While searching for a minimum, keep the cost of the best complete solution found so far.",
  "If a partial solution already costs at least that much, abandon it: with non-negative costs, extending it can only make it longer.",
  "Finding a good solution early (for instance by trying the nearest points first) makes this cut much more effective.",
  "The result is still exact, because only branches that cannot beat the best are cut, but the worst case stays exponential.",
]

[questions.translations.en]
title = "Pruning with the best solution found so far"
stem = "An exhaustive search looks for the order of visits with the smallest total distance. How can the best complete solution found so far be used to abandon partial solutions early? Why does this never lose the optimum, and what makes it more effective?"
explanation = "The search keeps the length of the best complete tour found so far. When a partial tour already costs as much as that length or more, it is abandoned: distances are never negative, so extending it can only make it longer, and it cannot win. Only branches that cannot beat the best are cut, so the answer stays exact. The cut works better when a good tour is found early, for instance by trying the nearest points first: the bound is tight sooner and more branches fall. In the worst case, though, the search remains exponential."

[questions.translations.fr]
title = "Élaguer avec la meilleure solution trouvée"
stem = "Une recherche exhaustive cherche l'ordre de visite dont la distance totale est la plus petite. Comment la meilleure solution complète trouvée jusqu'ici permet-elle d'abandonner tôt des solutions partielles ? Pourquoi cela ne fait-il jamais perdre l'optimum, et qu'est-ce qui rend la coupe plus efficace ?"
explanation = "La recherche garde la longueur du meilleur circuit complet trouvé jusqu'ici. Quand un circuit partiel coûte déjà autant que cette longueur ou plus, on l'abandonne : les distances ne sont jamais négatives, donc le prolonger ne peut que l'allonger, et il ne peut pas gagner. Seules les branches incapables de battre le meilleur sont coupées, donc la réponse reste exacte. La coupe fonctionne mieux quand un bon circuit est trouvé tôt, par exemple en essayant d'abord les points les plus proches : la borne se resserre plus vite et davantage de branches tombent. Dans le pire cas, la recherche reste pourtant exponentielle."

[questions.translations.es]
title = "Podar con la mejor solución encontrada"
stem = "Una búsqueda exhaustiva busca el orden de visita cuya distancia total es la menor. ¿Cómo permite la mejor solución completa encontrada hasta ahora abandonar pronto soluciones parciales? ¿Por qué nunca hace perder el óptimo, y qué hace más eficaz el corte?"
explanation = "La búsqueda guarda la longitud del mejor circuito completo encontrado hasta ahora. Cuando un circuito parcial ya cuesta tanto como esa longitud o más, se abandona: las distancias nunca son negativas, así que prolongarlo solo puede alargarlo, y no puede ganar. Solo se cortan las ramas incapaces de superar la mejor, así que la respuesta sigue siendo exacta. El corte funciona mejor cuando se encuentra pronto un buen circuito, por ejemplo probando primero los puntos más cercanos: la cota se ajusta antes y caen más ramas. En el peor caso, sin embargo, la búsqueda sigue siendo exponencial."

[[questions.choices]]
correct = true
text = { en = "Abandon a partial solution that already costs as much as the best complete one found: with non-negative costs it can only grow, so the optimum is never lost", fr = "Abandonner une solution partielle qui coûte déjà autant que la meilleure complète trouvée : avec des coûts positifs ou nuls, elle ne peut que croître, donc l'optimum n'est jamais perdu", es = "Abandonar una solución parcial que ya cuesta tanto como la mejor completa hallada: con costes no negativos solo puede crecer, así que el óptimo nunca se pierde" }

[[questions.choices]]
text = { en = "The cut is an approximation: it trades the guaranteed optimum for speed", fr = "La coupe est une approximation : elle échange l'optimum garanti contre de la vitesse", es = "El corte es una aproximación: cambia el óptimo garantizado por velocidad" }

[[questions.choices]]
text = { en = "It is more effective when the first solutions found are bad, since the bound then moves more often", fr = "Elle est plus efficace quand les premières solutions trouvées sont mauvaises, puisque la borne bouge alors plus souvent", es = "Es más eficaz cuando las primeras soluciones halladas son malas, ya que la cota se mueve más a menudo" }

[[questions.choices]]
text = { en = "With the cut in place the worst case becomes polynomial", fr = "Avec la coupe, le pire des cas devient polynomial", es = "Con el corte, el peor caso se vuelve polinómico" }
