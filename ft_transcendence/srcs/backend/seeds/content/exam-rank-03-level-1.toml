# Exam Rank 03, level 1: questions on the notions this level tests.
# Written from scratch. Exam subjects are confidential to 42 and never enter this
# repository, not even rephrased: no statement, no exercise name, no file name.
# Key points are in English, one grid for every language. Slugs are public, so
# they name the topic of a question, never its answer.

[[questions]]
slug = "rank03-l1-backtracking-pattern"
topic = "exam-rank-03-level-1"
kind = "free_text"
difficulty = 1200
tags = ["backtracking", "recursion"]
key_points = [
  "Backtracking builds a solution one choice at a time: at each step it tries every possible choice, recurses to make the next ones, then undoes the choice before trying the next.",
  "Undoing the choice restores the shared state exactly, so the next branch starts from the same situation.",
  "When the partial solution is complete it is recorded or printed; when it can no longer lead to a solution, the branch is abandoned early (pruning).",
  "The calls explore a tree of partial solutions, whose depth is the number of choices to make.",
]

[questions.translations.en]
title = "Choose, explore, undo"
stem = "Many search problems are solved by backtracking. Describe the pattern a backtracking function follows at each step. Why must each choice be undone after the recursive call, and when is a branch abandoned early?"
explanation = "Backtracking builds a solution one choice at a time. At each step, the function tries every possible choice in turn: it applies it to the shared state, calls itself to make the following choices, then undoes it before trying the next one. Undoing matters because the state is shared by every branch: without it, the next attempt would start from a situation polluted by the previous one. When the partial solution is complete, it is recorded or printed; when it already breaks a rule and can no longer lead anywhere, the branch is abandoned at once, which is called pruning. The calls thereby walk a tree of partial solutions whose depth is the number of choices."

[questions.translations.fr]
title = "Choisir, explorer, annuler"
stem = "Beaucoup de problèmes de recherche se résolvent par retour sur trace. Décrivez le schéma que suit une fonction de retour sur trace à chaque étape. Pourquoi faut-il annuler chaque choix après l'appel récursif, et quand abandonne-t-on une branche avant la fin ?"
explanation = "Le retour sur trace construit une solution un choix à la fois. À chaque étape, la fonction essaie tour à tour chaque choix possible : elle l'applique à l'état partagé, s'appelle elle-même pour faire les choix suivants, puis l'annule avant d'essayer le suivant. L'annulation compte parce que l'état est partagé par toutes les branches : sans elle, l'essai suivant partirait d'une situation polluée par le précédent. Quand la solution partielle est complète, on l'enregistre ou on l'affiche ; quand elle enfreint déjà une règle et ne peut plus mener nulle part, on abandonne la branche aussitôt, ce qu'on appelle l'élagage. Les appels parcourent ainsi un arbre de solutions partielles dont la profondeur est le nombre de choix."

[questions.translations.es]
title = "Elegir, explorar, deshacer"
stem = "Muchos problemas de búsqueda se resuelven con vuelta atrás. Describe el esquema que sigue en cada paso una función de vuelta atrás. ¿Por qué hay que deshacer cada elección después de la llamada recursiva, y cuándo se abandona una rama antes de terminar?"
explanation = "La vuelta atrás construye una solución una elección cada vez. En cada paso, la función prueba por turnos cada elección posible: la aplica al estado compartido, se llama a sí misma para hacer las elecciones siguientes y después la deshace antes de probar la siguiente. Deshacer importa porque el estado lo comparten todas las ramas: sin ello, el intento siguiente partiría de una situación contaminada por el anterior. Cuando la solución parcial está completa, se registra o se muestra; cuando ya incumple una regla y no puede llevar a ninguna parte, la rama se abandona en el acto, lo que se llama poda. Así, las llamadas recorren un árbol de soluciones parciales cuya profundidad es el número de elecciones."

[[questions.choices]]
correct = true
text = { en = "Try each choice, recurse, then **undo** it so the next branch starts from the same state; a branch that can no longer lead anywhere is abandoned early", fr = "Essayer chaque choix, récursiver, puis le **défaire** pour que la branche suivante reparte du même état ; une branche qui ne peut plus aboutir est abandonnée tôt", es = "Probar cada opción, recursionar y después **deshacerla** para que la siguiente rama parta del mismo estado; una rama que ya no puede llevar a nada se abandona pronto" }

[[questions.choices]]
text = { en = "The choice is undone before the recursive call, so that the deeper levels see a clean state", fr = "Le choix est défait avant l'appel récursif, pour que les niveaux plus profonds voient un état propre", es = "La opción se deshace antes de la llamada recursiva, para que los niveles más profundos vean un estado limpio" }

[[questions.choices]]
text = { en = "Nothing needs undoing when each branch works on its own copy of the state, which is always the case", fr = "Rien n'a besoin d'être défait puisque chaque branche travaille sur sa propre copie de l'état, ce qui est toujours le cas", es = "No hace falta deshacer nada, ya que cada rama trabaja sobre su propia copia del estado, lo que siempre ocurre" }

[[questions.choices]]
text = { en = "Pruning a branch early makes the search approximate: solutions may be lost", fr = "Élaguer une branche tôt rend la recherche approximative : des solutions peuvent être perdues", es = "Podar una rama pronto vuelve aproximada la búsqueda: se pueden perder soluciones" }

[[questions]]
slug = "rank03-l1-non-attacking-placements"
topic = "exam-rank-03-level-1"
kind = "free_text"
difficulty = 1400
tags = ["backtracking", "algorithms"]
key_points = [
  "Place one piece per column, column by column, so two pieces can never share a column; for each column, try every row.",
  "Two pieces at (r1, c1) and (r2, c2) share a diagonal exactly when |r1 - r2| == |c1 - c2|.",
  "Keeping flags for used rows and for both diagonal directions, indexed by r + c and r - c + n - 1, makes each check constant time.",
  "Remove the piece and clear its flags after the recursive call, before trying the next row.",
]

[questions.translations.en]
title = "Placing pieces that must not attack each other"
stem = "On an `n × n` board you must place `n` pieces so that no two share a row, a column or a diagonal, and print every placement. How does backtracking organise the search so that columns never clash? How do you detect a shared diagonal, and how can each check take constant time?"
explanation = "Placing exactly one piece per column, column after column, rules out column clashes by construction; for each column, every row is tried. Two pieces at `(r1, c1)` and `(r2, c2)` are on the same diagonal exactly when `|r1 - r2| == |c1 - c2|`. Instead of comparing with every piece already placed, three arrays of flags record the rows in use and the two diagonal directions, indexed by `r + c` and `r - c + n - 1`, which makes each check a few reads. After the recursive call, the piece is removed and its flags cleared before the next row is tried. The number of solutions is irregular: none for sizes 2 and 3, 2 for 4, 92 for 8."

[questions.translations.fr]
title = "Placer des pièces qui ne doivent pas s'attaquer"
stem = "Sur un plateau `n × n`, il faut placer `n` pièces de sorte qu'aucune paire ne partage une ligne, une colonne ou une diagonale, et afficher tous les placements. Comment le retour sur trace organise-t-il la recherche pour que les colonnes ne se gênent jamais ? Comment détecter une diagonale partagée, et comment chaque vérification peut-elle prendre un temps constant ?"
explanation = "Placer exactement une pièce par colonne, colonne après colonne, écarte par construction tout conflit de colonne ; pour chaque colonne, on essaie chaque ligne. Deux pièces en `(r1, c1)` et `(r2, c2)` sont sur la même diagonale exactement quand `|r1 - r2| == |c1 - c2|`. Plutôt que de comparer avec chaque pièce déjà posée, trois tableaux d'indicateurs notent les lignes occupées et les deux directions de diagonales, indexées par `r + c` et `r - c + n - 1`, ce qui ramène chaque vérification à quelques lectures. Après l'appel récursif, on retire la pièce et on efface ses indicateurs avant d'essayer la ligne suivante. Le nombre de solutions est irrégulier : aucune pour les tailles 2 et 3, 2 pour 4, 92 pour 8."

[questions.translations.es]
title = "Colocar piezas que no deben atacarse"
stem = "En un tablero `n × n` hay que colocar `n` piezas de forma que ningún par comparta fila, columna o diagonal, y mostrar todas las colocaciones. ¿Cómo organiza la vuelta atrás la búsqueda para que las columnas nunca choquen? ¿Cómo detectas una diagonal compartida, y cómo puede cada comprobación tardar un tiempo constante?"
explanation = "Colocar exactamente una pieza por columna, columna tras columna, descarta por construcción cualquier conflicto de columna; para cada columna se prueba cada fila. Dos piezas en `(r1, c1)` y `(r2, c2)` están en la misma diagonal exactamente cuando `|r1 - r2| == |c1 - c2|`. En lugar de comparar con cada pieza ya colocada, tres arrays de indicadores registran las filas ocupadas y las dos direcciones de diagonales, indexadas por `r + c` y `r - c + n - 1`, lo que reduce cada comprobación a unas pocas lecturas. Tras la llamada recursiva, se quita la pieza y se borran sus indicadores antes de probar la fila siguiente. El número de soluciones es irregular: ninguna para los tamaños 2 y 3, 2 para 4, 92 para 8."

[[questions.choices]]
correct = true
text = { en = "One piece per column, trying every row; a shared diagonal is `|r1 - r2| == |c1 - c2|`, and flags indexed by `r + c` and `r - c + n - 1` make each check constant", fr = "Une pièce par colonne, en essayant chaque ligne ; une diagonale commune est `|l1 - l2| == |c1 - c2|`, et des drapeaux indexés par `l + c` et `l - c + n - 1` rendent chaque test constant", es = "Una pieza por columna, probando cada fila; una diagonal común es `|f1 - f2| == |c1 - c2|`, y marcas indexadas por `f + c` y `f - c + n - 1` hacen constante cada comprobación" }

[[questions.choices]]
text = { en = "Every free square of the board is tried at each step, which is what makes the search exhaustive", fr = "Chaque case libre du plateau est essayée à chaque étape, c'est ce qui rend la recherche exhaustive", es = "Se prueba cada casilla libre del tablero en cada paso, eso es lo que hace exhaustiva la búsqueda" }

[[questions.choices]]
text = { en = "Two pieces share a diagonal when `r1 + c1 == r2 + c2`, and that single test covers both directions", fr = "Deux pièces partagent une diagonale quand `l1 + c1 == l2 + c2`, et ce seul test couvre les deux directions", es = "Dos piezas comparten diagonal cuando `f1 + c1 == f2 + c2`, y esa única prueba cubre las dos direcciones" }

[[questions.choices]]
text = { en = "Checking the diagonals means walking the pieces already placed, so it cannot be constant", fr = "Vérifier les diagonales suppose de parcourir les pièces déjà posées, donc cela ne peut pas être constant", es = "Comprobar las diagonales obliga a recorrer las piezas ya puestas, así que no puede ser constante" }

[[questions]]
slug = "rank03-l1-size-of-exhaustive-searches"
topic = "exam-rank-03-level-1"
kind = "free_text"
difficulty = 1200
tags = ["complexity"]
key_points = [
  "A set of n distinct elements has n! orderings: 24 for 4 elements, over 3.6 million for 10.",
  "It has 2^n subsets, since each element is either in a subset or not: 32 for 5 elements, over a million for 20.",
  "An exhaustive search is therefore only feasible for small n; pruning reduces the work but does not change its exponential nature in the worst case.",
]

[questions.translations.en]
title = "How fast exhaustive searches grow"
stem = "How many orderings do `n` distinct elements have, and how many subsets? Give a few values, and explain what they mean for a program that lists or explores all of them."
explanation = "`n` distinct elements can be ordered in `n!` ways: 24 for 4 elements, more than 3.6 million for 10. They have `2^n` subsets, since each element is independently in a subset or out of it: 32 for 5 elements, more than a million for 20. A program that lists or explores every case therefore stays fast only for small inputs, and each extra element multiplies the work. Pruning cuts branches that cannot succeed and often helps a lot, but in the worst case the search remains exponential."

[questions.translations.fr]
title = "La croissance des recherches exhaustives"
stem = "Combien d'ordres différents possèdent `n` éléments distincts, et combien de sous-ensembles ? Donnez quelques valeurs, et expliquez ce qu'elles impliquent pour un programme qui les énumère ou les explore tous."
explanation = "`n` éléments distincts peuvent être rangés de `n!` façons : 24 pour 4 éléments, plus de 3,6 millions pour 10. Ils ont `2^n` sous-ensembles, puisque chaque élément est, indépendamment des autres, dans le sous-ensemble ou en dehors : 32 pour 5 éléments, plus d'un million pour 20. Un programme qui énumère ou explore tous les cas ne reste donc rapide que sur de petites entrées, et chaque élément de plus multiplie le travail. L'élagage coupe les branches qui ne peuvent pas aboutir et aide souvent beaucoup, mais dans le pire cas la recherche reste exponentielle."

[questions.translations.es]
title = "Cómo crecen las búsquedas exhaustivas"
stem = "¿Cuántas ordenaciones distintas tienen `n` elementos distintos, y cuántos subconjuntos? Da algunos valores y explica qué implican para un programa que los enumera o los explora todos."
explanation = "`n` elementos distintos pueden ordenarse de `n!` maneras: 24 para 4 elementos, más de 3,6 millones para 10. Tienen `2^n` subconjuntos, ya que cada elemento está, independientemente de los demás, dentro o fuera del subconjunto: 32 para 5 elementos, más de un millón para 20. Un programa que enumera o explora todos los casos solo es rápido con entradas pequeñas, y cada elemento más multiplica el trabajo. La poda corta las ramas que no pueden tener éxito y a menudo ayuda mucho, pero en el peor caso la búsqueda sigue siendo exponencial."

[[questions.choices]]
correct = true
text = { en = "`n!` orderings (24 for 4, over 3.6 million for 10) and `2^n` subsets (32 for 5, over a million for 20): exhaustive search only holds for small `n`", fr = "`n!` ordres (24 pour 4, plus de 3,6 millions pour 10) et `2^n` sous-ensembles (32 pour 5, plus d'un million pour 20) : l'exploration exhaustive ne tient que pour de petits `n`", es = "`n!` ordenaciones (24 para 4, más de 3,6 millones para 10) y `2^n` subconjuntos (32 para 5, más de un millón para 20): la búsqueda exhaustiva solo sirve con `n` pequeños" }

[[questions.choices]]
