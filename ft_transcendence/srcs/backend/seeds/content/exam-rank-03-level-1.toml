[[questions.choices]]
text = { en = "`n²` orderings and `2n` subsets, which stays reasonable up to a few hundred elements", fr = "`n²` ordres et `2n` sous-ensembles, ce qui reste raisonnable jusqu'à quelques centaines d'éléments", es = "`n²` ordenaciones y `2n` subconjuntos, lo que sigue siendo razonable hasta unos cientos de elementos" }

[[questions.choices]]
text = { en = "`n!` orderings and `2^n` subsets, but good pruning turns the search polynomial", fr = "`n!` ordres et `2^n` sous-ensembles, mais un bon élagage rend la recherche polynomiale", es = "`n!` ordenaciones y `2^n` subconjuntos, pero una buena poda vuelve polinómica la búsqueda" }

