key_points = [
  "Decide the elements one by one, in their original order: for each, one branch includes it and the other leaves it out.",
  "A leaf of this binary tree of decisions, reached after the last element, is one subset; there are 2^n leaves.",
  "Because the elements are decided in their original order, each subset keeps that order, and each subset is produced exactly once, with no duplicate such as 3 7 and 7 3.",
]

[questions.translations.en]
title = "Listing every subset once"
stem = "How does a recursive function list every subset of a set of `n` distinct numbers, each subset exactly once and with its elements in their original order? Why can it never produce both `3 7` and `7 3`?"
explanation = "The function decides the elements one by one, in their original order. For the current element there are two branches: one includes it in the subset being built, the other leaves it out; then the next element is decided. After the last element, the choices made describe one subset, so the binary tree of decisions has `2^n` leaves, one per subset. Since the elements are always decided in their original order, each subset is built in that order, and each set of choices leads to a single leaf: the same subset can never come out twice, in whatever order."

[questions.translations.fr]
title = "Énumérer chaque sous-ensemble une seule fois"
stem = "Comment une fonction récursive énumère-t-elle tous les sous-ensembles d'un ensemble de `n` nombres distincts, chacun exactement une fois et avec ses éléments dans leur ordre d'origine ? Pourquoi ne peut-elle jamais produire à la fois `3 7` et `7 3` ?"
explanation = "La fonction décide des éléments un par un, dans leur ordre d'origine. Pour l'élément courant, il y a deux branches : l'une l'inclut dans le sous-ensemble en construction, l'autre le laisse de côté ; puis on décide de l'élément suivant. Après le dernier élément, les choix faits décrivent un sous-ensemble : l'arbre binaire des décisions a donc `2^n` feuilles, une par sous-ensemble. Comme les éléments sont toujours décidés dans leur ordre d'origine, chaque sous-ensemble est construit dans cet ordre, et chaque suite de choix mène à une seule feuille : un même sous-ensemble ne peut jamais sortir deux fois, dans quelque ordre que ce soit."

[questions.translations.es]
title = "Enumerar cada subconjunto una sola vez"
stem = "¿Cómo recorre una función recursiva cada subconjunto posible de `n` números distintos, cada uno exactamente una vez y con sus elementos en su orden original? ¿Por qué nunca puede producir a la vez `3 7` y `7 3`?"
explanation = "La función decide los elementos uno a uno, en su orden original. Para el elemento actual hay dos ramas: una lo incluye en el subconjunto que se está construyendo y la otra lo deja fuera; después se decide el elemento siguiente. Tras el último elemento, las elecciones hechas describen un subconjunto, así que el árbol binario de decisiones tiene `2^n` hojas, una por subconjunto. Como los elementos siempre se deciden en su orden original, cada subconjunto se construye en ese orden, y cada serie de elecciones lleva a una sola hoja: un mismo subconjunto nunca puede salir dos veces, en ningún orden."

