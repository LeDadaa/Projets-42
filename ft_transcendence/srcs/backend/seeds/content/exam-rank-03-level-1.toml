]

[questions.translations.en]
title = "Every ordering of the letters, in alphabetical order"
stem = "A program prints every ordering of the distinct letters of a word, in alphabetical order. How does backtracking build them, and how can they come out already sorted, without storing and sorting them afterwards?"
explanation = "The ordering is built position by position. At each position, the function tries every letter not used yet, which a table of flags records, places it, recurses for the next position, then frees the letter again. If the letters are sorted first and each position tries them from the smallest to the largest, the results come out in alphabetical order by themselves: the first position is decided first, so every ordering that starts with a smaller letter is printed before any ordering that starts with a larger one, and the same reasoning holds at every level. For `abcd`, the 24 orderings come out sorted."

[questions.translations.fr]
title = "Tous les ordres des lettres, dans l'ordre alphabétique"
stem = "Un programme affiche tous les ordres possibles des lettres distinctes d'un mot, dans l'ordre alphabétique. Comment le retour sur trace les construit-il, et comment peuvent-ils sortir déjà triés, sans les stocker puis les trier ?"
explanation = "L'ordre se construit position par position. À chaque position, la fonction essaie chaque lettre pas encore utilisée, ce que note un tableau d'indicateurs, la place, s'appelle pour la position suivante, puis libère de nouveau la lettre. Si les lettres sont d'abord triées et que chaque position les essaie de la plus petite à la plus grande, les résultats sortent d'eux-mêmes dans l'ordre alphabétique : la première position est décidée en premier, donc tous les ordres qui commencent par une lettre plus petite sont affichés avant ceux qui commencent par une plus grande, et le même raisonnement vaut à chaque niveau. Pour `abcd`, les 24 ordres sortent triés."

[questions.translations.es]
title = "Todas las ordenaciones de las letras, en orden alfabético"
stem = "Un programa muestra todas las ordenaciones posibles de las letras distintas de una palabra, en orden alfabético. ¿Cómo las construye la vuelta atrás, y cómo pueden salir ya ordenadas, sin guardarlas y ordenarlas después?"
explanation = "La ordenación se construye posición a posición. En cada posición, la función prueba cada letra aún no usada, algo que registra una tabla de indicadores, la coloca, se llama para la posición siguiente y después vuelve a liberar la letra. Si las letras se ordenan antes y cada posición las prueba de la menor a la mayor, los resultados salen solos en orden alfabético: la primera posición se decide primero, así que todas las ordenaciones que empiezan por una letra menor se muestran antes que las que empiezan por una mayor, y el mismo razonamiento vale en cada nivel. Para `abcd`, las 24 ordenaciones salen ordenadas."

[[questions.choices]]
