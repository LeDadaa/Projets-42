# --- dev: same origin as prod, SPA proxied to the Nuxt dev server instead of disk ---

# --- websocket ---
map $http_upgrade $connection_upgrade {
	default	upgrade;
	''		close;
}

upstream api {
	server api:8000;
	keepalive 32;
}

upstream web_dev {
	server web-dev:3000;
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name localhost;

	ssl_certificate		/etc/nginx/certs/server.crt;
	ssl_certificate_key /etc/nginx/certs/server.key;
	ssl_protocols		TLSv1.2 TLSv1.3;
	ssl_ciphers			HIGH:!aNULL:!MD5;
	ssl_session_cache	shared:SSL:10m;
	ssl_session_timeout 1d;

	# no CSP here: prod policy blocks Vite's inline bootstrap and eval
	add_header X-Content-Type-Options	"nosniff" always;
	add_header Referrer-Policy			"strict-origin-when-cross-origin" always;
	add_header Permissions-Policy		"geolocation=(), camera=(), microphone=()" always;

	client_max_body_size 2m; # MAX_AVATAR_BYTES API side

	# no gzip: dev responses are not cached

	# --- websocket ---
	location /api/ws {
		proxy_pass http://api;
		proxy_http_version 1.1;
		proxy_set_header Upgrade	$http_upgrade;
		proxy_set_header Connection $connection_upgrade;
		proxy_set_header Host		$host;
		proxy_set_header X-Real-IP	$remote_addr;
		proxy_set_header X-Forwarded-For	$proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto	$scheme;

		proxy_read_timeout	3600s;
		proxy_send_timeout	3600s;
		proxy_buffering		off;
	}

	# --- API REST ---
	location /api/ {
		proxy_pass http://api;
		proxy_http_version 1.1;
		proxy_set_header Connection "";			# keepalive
		proxy_set_header Host		$host;
		proxy_set_header X-Real-IP	$remote_addr;
		proxy_set_header X-Forwarded-For	$proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto	$scheme;
	}

	# --- avatars ---
	location /media/ {
		alias /srv/media/;
		expires 7d;
	}

	# --- Nuxt dev server, HMR included ---
	# Vite's HMR client connects over wss:// on /_nuxt/, covered by the upgrade headers
	location / {
		proxy_pass http://web_dev;
		proxy_http_version 1.1;
		proxy_set_header Upgrade	$http_upgrade;
		proxy_set_header Connection $connection_upgrade;
		proxy_set_header Host		$host;
		proxy_set_header X-Real-IP	$remote_addr;
		proxy_set_header X-Forwarded-For	$proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto	$scheme;

		proxy_read_timeout	3600s;
		proxy_send_timeout	3600s;
		proxy_buffering		off;
	}
}
