# --- websocket ---
map $http_upgrade $connection_upgrade {
	default	upgrade;
	''		close;
}

upstream api {
	server api:8000;
	keepalive 32;
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name localhost;

	ssl_certificate		/etc/nginx/certs/server.crt;
	ssl_certificate_key /etc/nginx/certs/server.key;
	ssl_protocols		TLSv1.2 TLSv1.3;
	ssl_ciphers			HIGH:!aNULL:!MD5;
	ssl_session_cache	shared:SSL:10m;
	ssl_session_timeout 1d;

	# activate if SERVER_NAME != localhost
	# add_header Strict-Transport-Security "max-age=31536000" always;
	add_header X-Content-Type-Options	"nosniff" always;
	add_header Referrer-Policy			"strict-origin-when-cross-origin" always;
	add_header Permissions-Policy		"geolocation=(), camera=(), microphone=()" always;
	# wss://$host:8443 code en dur : $host de nginx n'inclut jamais le port, et
	# la publication externe n'est pas le 443 par defaut (voir docker-compose.yml).
	add_header Content-Security-Policy	"default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self' wss://$host:8443; frame-ancestors 'none'; base-uri 'self'" always;

	client_max_body_size 2m; # MAX_AVATAR_BYTES API side

	gzip on;
	gzip_types text/css application/javascript application/json image/svg+xml;
	gzip_min_length 1024;

	# --- websocket ---
	location /api/ws {
		proxy_pass http://api;
		proxy_http_version 1.1;
		proxy_set_header Upgrade	$http_upgrade;
		proxy_set_header Connection $connection_upgrade;
		proxy_set_header Host		$host;
		proxy_set_header X-Real-IP	$remote_addr;
		proxy_set_header X-Forwarded-For	$proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto	$scheme;

		proxy_read_timeout	3600s;
		proxy_send_timeout	3600s;
		proxy_buffering		off;
	}

	# --- API REST ---
	location /api/ {
		proxy_pass http://api;
		proxy_http_version 1.1;
		proxy_set_header Connection "";			# keepalive
		proxy_set_header Host		$host;
		proxy_set_header X-Real-IP	$remote_addr;
		proxy_set_header X-Forwarded-For	$proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto	$scheme;
	}

	# --- avatars ---
	location /media/ {
		alias /srv/media/;
		expires 7d;
	}

	# --- build files ? ---
	location /_nuxt/ {
		root /usr/share/nginx/html;
		expires 1y;
	}

	# --- SPA ---
	# Nuxt generates one folder per route (terms/index.html): serving that file
	# directly avoids the /terms -> /terms/ 301. Should nginx still redirect, the
	# Location stays relative, since an absolute one would name port 443 and not
	# the 8443 the browser actually uses (see docker-compose.yml).
	absolute_redirect off;
	root /usr/share/nginx/html;
	index index.html;
	location / {
		try_files $uri $uri/index.html /index.html;
	}
}
